<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1a1814" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Portfolio" />
<title>Portfolio Advisor</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --bg:           #f5f1e8;
  --bg-elev:     #ede7d6;
  --bg-card:     #fbf8f0;
  --ink:          #1a1814;
  --ink-soft:    #4a4639;
  --ink-muted:   #8a8473;
  --rule:        #d8d2bf;
  --rule-soft:   #e8e2cf;
  --accent:      #a13d2d;
  --accent-soft: #c46b54;
  --green:       #4a7a4a;
  --green-soft:  #6b9b6b;
  --red:         #a13d2d;
  --red-soft:    #c46b54;
  --gold:        #b08d3c;
  --shadow:      0 1px 0 rgba(26,24,20,.04), 0 6px 18px -10px rgba(26,24,20,.18);
  --shadow-deep: 0 24px 60px -24px rgba(26,24,20,.28);
  --radius:      14px;
  --radius-sm:    8px;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:    'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  --mono:    'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}
[data-theme="night"] {
  --bg:           #14110d;
  --bg-elev:     #1d1914;
  --bg-card:     #1a1612;
  --ink:          #f0e9d6;
  --ink-soft:    #c4bca6;
  --ink-muted:   #8a8270;
  --rule:        #2d2820;
  --rule-soft:   #221d17;
  --accent:      #d97a5a;
  --accent-soft: #b85a3d;
  --green:       #7ab37a;
  --green-soft:  #5a8e5a;
  --red:         #d97a5a;
  --red-soft:    #b85a3d;
  --gold:        #d4a85c;
  --shadow:      0 1px 0 rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.5);
  --shadow-deep: 0 24px 60px -24px rgba(0,0,0,.7);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11', 'tnum';
  overscroll-behavior-y: none;
}
body {
  display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100dvh;
  padding-top: env(safe-area-inset-top);
}
.display { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; }
.mono    { font-family: var(--mono); font-feature-settings: 'tnum', 'zero'; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }
.label   { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }

.app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.view {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: 96px;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  position: sticky; top: 0; z-index: 30;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.topbar-title { font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.topbar-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.04em; }
.topbar-icons { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center;
  border: none; background: transparent; color: var(--ink-soft);
  cursor: pointer; border-radius: 50%;
  transition: background .15s, color .15s;
}
.icon-btn:hover, .icon-btn:active { background: var(--bg-elev); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }

.tabs {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: var(--bg);
  border-top: 1px solid var(--rule);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 2px; border: none; background: transparent;
  color: var(--ink-muted);
  font-family: var(--sans); font-size: 9.5px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; transition: color .15s; border-radius: 10px;
}
.tab.active { color: var(--ink); }
.tab svg { width: 22px; height: 22px; stroke-width: 1.5; pointer-events: none; }
.tab.active svg { stroke-width: 2; }

.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.section-head h2 { font-family: var(--display); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }

.hero {
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 22px 20px 20px;
  margin: 16px 20px 8px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--gold) 50%, var(--accent) 100%);
}
.hero .eyebrow { margin-bottom: 8px; }
.hero-value { font-family: var(--display); font-size: 44px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.hero-value .currency-prefix {
  font-size: 22px; color: var(--ink-muted);
  margin-right: 4px; vertical-align: top; position: relative; top: 8px;
}
.hero-meta {
  display: flex; gap: 24px;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--rule-soft);
}
.hero-stat { flex: 1; }
.hero-stat-value { font-family: var(--mono); font-size: 15px; font-weight: 500; margin-top: 2px; }
.hero-stat-value.pos { color: var(--green); }
.hero-stat-value.neg { color: var(--red); }

.alloc-strip {
  display: flex; height: 6px; border-radius: 3px;
  overflow: hidden; margin-top: 14px; background: var(--rule);
}
.alloc-seg { height: 100%; transition: flex .3s; }
.alloc-legend {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 6px 16px; margin-top: 10px; font-size: 12px;
}
.alloc-legend-item { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
.alloc-dot { width: 8px; height: 8px; border-radius: 50%; }

.holdings { margin: 8px 0 20px; }
.holding {
  display: flex; align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer; transition: background .15s; position: relative;
}
.holding:hover, .holding:active { background: var(--bg-elev); }
.holding * { pointer-events: none; }
.holding-icon {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--bg-elev);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 600; font-size: 14px;
  color: var(--ink-soft);
  margin-right: 14px; flex-shrink: 0;
  border: 1px solid var(--rule);
}
.holding-icon[data-class="crypto"] { background: var(--bg); border-color: var(--gold); color: var(--gold); }
.holding-icon[data-class="metal"]  { background: var(--bg); border-color: var(--gold); color: var(--gold); }
.holding-icon[data-class="etf"]    { background: var(--bg); border-color: var(--ink-soft); color: var(--ink-soft); }
.holding-icon[data-class="cash"]   { background: var(--bg); border-color: var(--ink-muted); color: var(--ink-muted); }
.holding-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.holding-symbol { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.holding-name {
  font-size: 11.5px; color: var(--ink-muted); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
}
.holding-right { text-align: right; font-family: var(--mono); }
.holding-value { font-size: 14px; font-weight: 500; color: var(--ink); }
.holding-pnl { font-size: 11.5px; margin-top: 1px; letter-spacing: 0.02em; }
.holding-pnl.pos { color: var(--green); }
.holding-pnl.neg { color: var(--red); }
.holding-pnl.flat { color: var(--ink-muted); }
.holding-stance {
  position: static !important;
  top: auto !important; right: auto !important; left: auto !important; bottom: auto !important;
  font-family: var(--mono); font-size: 8.5px; font-weight: 600;
  padding: 1px 5px; border-radius: 3px; letter-spacing: 0.10em;
  display: none;
  margin-top: 4px;
  align-self: flex-start;
  text-transform: uppercase;
  white-space: nowrap;
  line-height: 1.4;
}
.holding-stance.show { display: inline-block; }
.holding-stance.ACCUMULATE,
.holding-stance.BUY,
.holding-stance.ADD       { background: rgba(74,122,74,0.15); color: var(--green); }
.holding-stance.HOLD,
.holding-stance.NEUTRAL,
.holding-stance.WAIT      { background: var(--bg-elev); color: var(--ink-soft); }
.holding-stance.TRIM      { background: rgba(176,141,60,0.15); color: var(--gold); }
.holding-stance.SELL,
.holding-stance.EXIT      { background: rgba(161,61,45,0.15); color: var(--red); }
.holding-stance.AVOID     { background: rgba(161,61,45,0.10); color: var(--red-soft); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  border-radius: var(--radius-sm);
  font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; transition: opacity .15s, transform .1s;
  text-transform: uppercase;
}
.btn:active { transform: scale(0.98); }
.btn:hover  { opacity: 0.92; }
.btn-secondary { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn-ghost { background: transparent; color: var(--ink-soft); border: none; padding: 10px 14px; }
.btn-block { display: flex; width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 11.5px; }
.btn-danger { background: transparent; color: var(--red); border-color: var(--red-soft); }

.btn-portfolio-analyze {
  display: flex; align-items: center; justify-content: space-between;
  margin: 14px 20px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius);
  cursor: pointer; transition: background .15s;
  position: relative; overflow: hidden;
}
.btn-portfolio-analyze::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent);
}
.btn-portfolio-analyze:hover { background: var(--bg-elev); }
.btn-portfolio-analyze .lbl { font-family: var(--display); font-size: 16px; font-weight: 500; }
.btn-portfolio-analyze .sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
.btn-portfolio-analyze .arrow { color: var(--accent); font-size: 18px; }

/* Opportunity pulse card */
.opp-pulse {
  margin: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.opp-pulse::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; background: var(--gold);
}
.opp-pulse-head {
  padding: 14px 18px 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.opp-pulse-head .ttl { font-family: var(--display); font-size: 17px; font-weight: 500; }
.opp-pulse-head .count {
  font-family: var(--mono); font-size: 11px;
  background: rgba(176,141,60,0.15); color: var(--gold);
  padding: 3px 9px; border-radius: 3px; letter-spacing: 0.08em; font-weight: 600;
}
.opp-pulse-eyebrow {
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--gold); font-weight: 600; margin-bottom: 4px;
}
.opp-row {
  display: flex; align-items: center;
  padding: 12px 18px;
  border-top: 1px solid var(--rule-soft);
  cursor: pointer; transition: background .15s;
}
.opp-row * { pointer-events: none; }
.opp-row:hover { background: var(--bg-elev); }
.opp-row .opp-main { flex: 1; min-width: 0; }
.opp-row .opp-sym { font-family: var(--display); font-size: 15px; font-weight: 600; }
.opp-row .opp-cond {
  font-family: var(--mono); font-size: 11px;
  color: var(--gold); margin-top: 2px; letter-spacing: 0.02em;
}
.opp-row .opp-meta {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  margin-top: 2px;
}
.opp-row .opp-arrow { color: var(--gold); font-size: 18px; margin-left: 12px; }

/* Watchlist */
.watch-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer; transition: background .15s;
  position: relative;
}
.watch-row * { pointer-events: none; }
/* Re-enable pointer events on the suggest-strip buttons so they can receive taps */
.watch-row .watch-suggest-strip .wss-log,
.watch-row .watch-suggest-strip .wss-del { pointer-events: auto; }
.watch-row:hover { background: var(--bg-elev); }
.watch-row.has-trigger { background: rgba(176,141,60,0.05); }
.watch-row.has-trigger::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--gold);
}
.watch-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.watch-sym { font-family: var(--display); font-size: 16px; font-weight: 600; }
.watch-name { font-size: 11px; color: var(--ink-muted); }
.watch-cls {
  font-family: var(--mono); font-size: 8.5px;
  padding: 1px 6px; border-radius: 3px;
  background: var(--bg-elev); color: var(--ink-muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.watch-price { font-family: var(--mono); font-size: 14px; font-weight: 500; text-align: right; }
.watch-day { font-family: var(--mono); font-size: 11px; text-align: right; }
.watch-day.pos { color: var(--green); }
.watch-day.neg { color: var(--red); }
.watch-stats {
  grid-column: 1 / -1;
  display: flex; flex-wrap: wrap; gap: 14px;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft);
  margin-top: 2px; letter-spacing: 0.02em;
}
.watch-stat-rsi.warn { color: var(--accent); }
.watch-stat-rsi.over { color: var(--gold); }
.watch-trend.above { color: var(--green); }
.watch-trend.below { color: var(--red); }
.watch-cond-pills {
  grid-column: 1 / -1;
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 6px;
}
.watch-cond-pill {
  font-family: var(--mono); font-size: 9px; font-weight: 500;
  padding: 2px 7px; border-radius: 3px;
  background: var(--bg-elev); color: var(--ink-muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.watch-cond-pill.fired {
  background: rgba(176,141,60,0.18); color: var(--gold);
  border: 1px solid var(--gold);
}

/* Suggested entry strip — shown at bottom of watch row when conditions fire */
.watch-suggest-strip {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 10px;
  margin-top: 8px;
  padding: 8px 11px;
  background: rgba(74,122,74,0.10);
  border: 1px solid var(--green);
  border-radius: 5px;
  font-family: var(--mono); font-size: 11px;
}
.watch-suggest-strip.contradicts {
  background: rgba(176,141,60,0.10);
  border-color: var(--gold);
}
.watch-suggest-strip.contradicts .wss-action {
  color: var(--gold);
}
.watch-suggest-strip.pointer {
  background: var(--bg-elev);
  border-color: var(--rule-soft);
  border-style: dashed;
}
.watch-suggest-strip.pointer .wss-action {
  color: var(--ink-muted);
  font-style: italic;
}
.wss-action {
  font-family: var(--display); font-weight: 500; font-size: 12.5px;
  color: var(--green); flex: 1; min-width: 0;
}
.wss-price {
  color: var(--ink-soft); font-size: 10.5px; white-space: nowrap;
}
.wss-log {
  background: var(--green); color: var(--bg); border: none;
  padding: 4px 10px; border-radius: 4px;
  font-family: var(--sans); font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.04em; cursor: pointer;
  flex-shrink: 0;
}
.wss-log:hover { opacity: 0.85; }

.watch-detail-actions {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 14px 20px;
  border-top: 1px solid var(--rule-soft);
  background: var(--bg-card);
}

.cond-list { margin: 6px 0 14px; }
.cond-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px;
  background: var(--bg-elev);
  border-radius: 6px;
  margin-bottom: 6px;
  font-family: var(--mono); font-size: 11.5px;
}
.cond-item .cond-text { color: var(--ink); }
.cond-item button {
  background: transparent; border: none; color: var(--ink-muted);
  cursor: pointer; font-size: 16px; padding: 0 6px;
}

.scan-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  letter-spacing: 0.02em;
}
.scan-bar button {
  margin-left: auto;
  padding: 5px 12px;
  background: var(--ink); color: var(--bg); border: none;
  border-radius: 4px; font-family: var(--sans); font-size: 11px;
  font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer;
}

.pin-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; padding: 40px 30px;
}
.pin-logo { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 6px; }
.pin-tag { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 50px; }
.pin-prompt { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; letter-spacing: 0.04em; }
.pin-dots { display: flex; gap: 14px; margin-bottom: 36px; }
.pin-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--ink-soft); background: transparent;
  transition: background .15s, border-color .15s, transform .15s;
}
.pin-dot.filled { background: var(--ink); border-color: var(--ink); transform: scale(1.1); }
.pin-dot.error { background: var(--red); border-color: var(--red); animation: shake .4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
.pin-key {
  width: 72px; height: 72px;
  border: 1px solid var(--rule); background: var(--bg-card); color: var(--ink);
  font-family: var(--display); font-size: 26px; font-weight: 500;
  border-radius: 50%; cursor: pointer;
  transition: background .12s, transform .1s;
}
.pin-key:active { background: var(--bg-elev); transform: scale(0.95); }
.pin-key.empty { visibility: hidden; }
.pin-key.del { font-size: 22px; }
.pin-error { color: var(--red); font-size: 12px; margin-top: 14px; letter-spacing: 0.04em; height: 16px; }

/* ===== AUTH SCREEN ===== */
.auth-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 99; padding: 40px 22px;
  overflow-y: auto;
}
.auth-card {
  width: 100%; max-width: 380px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 30px 24px 22px;
}
.auth-logo { font-family: var(--display); font-size: 28px; font-weight: 500; letter-spacing: -0.02em; text-align: center; margin-bottom: 4px; }
.auth-tag { font-size: 11.5px; color: var(--ink-muted); letter-spacing: 0.12em; text-transform: uppercase; text-align: center; margin-bottom: 24px; }
.auth-tabs {
  display: flex; gap: 0;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--rule-soft);
}
.auth-tab {
  flex: 1; padding: 10px 0; background: transparent; border: none;
  font-family: var(--sans); font-size: 13px; color: var(--ink-muted);
  cursor: pointer; border-bottom: 2px solid transparent;
  letter-spacing: 0.04em;
}
.auth-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
.auth-fields .field { margin-bottom: 14px; }
.auth-fields .field label { display: block; font-size: 11px; color: var(--ink-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.auth-fields .field input {
  width: 100%; padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--rule); border-radius: 6px;
  font-family: var(--sans); font-size: 14px; color: var(--ink);
  -webkit-appearance: none;
}
.auth-fields .field input:focus { outline: none; border-color: var(--ink); }
.auth-error {
  color: var(--red); font-size: 12px; min-height: 16px;
  margin-bottom: 10px; line-height: 1.4;
}
.auth-secondary { text-align: center; margin-top: 14px; }
.link-btn {
  background: transparent; border: none; color: var(--ink-muted);
  font-family: var(--sans); font-size: 12px; cursor: pointer;
  text-decoration: underline; padding: 4px 8px;
}
.auth-migrate {
  margin-top: 18px; padding: 14px;
  background: rgba(176,141,60,0.10);
  border: 1px solid var(--gold);
  border-radius: 8px;
}
.auth-migrate-head { font-family: var(--display); font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.auth-migrate p { font-size: 12px; color: var(--ink-soft); line-height: 1.4; margin-bottom: 12px; }
.auth-migrate-actions { display: flex; gap: 8px; }
.auth-migrate-actions button { flex: 1; }

.loader-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 95;
}
.loader-logo { font-family: var(--display); font-size: 28px; margin-bottom: 18px; letter-spacing: -0.01em; }
.loader-bar { width: 120px; height: 1.5px; background: var(--rule); position: relative; overflow: hidden; }
.loader-bar::after {
  content: ""; position: absolute; inset: 0; width: 40%;
  background: var(--ink); animation: loader 1.2s infinite ease-in-out;
}
@keyframes loader {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

.detail-head { padding: 18px 20px 12px; }
.detail-back {
  font-family: var(--sans); font-size: 13px; color: var(--ink-soft);
  background: none; border: none; padding: 4px 0; margin-bottom: 14px;
  cursor: pointer; letter-spacing: 0.04em;
  display: inline-flex; align-items: center; gap: 4px;
}
.detail-symbol { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.025em; line-height: 1; }
.detail-name { font-size: 12px; color: var(--ink-muted); margin-top: 4px; letter-spacing: 0.02em; }
.detail-price { font-family: var(--mono); font-size: 28px; font-weight: 500; margin-top: 14px; letter-spacing: -0.01em; }
.detail-change { font-family: var(--mono); font-size: 13px; margin-top: 4px; }
.detail-change.pos { color: var(--green); }
.detail-change.neg { color: var(--red); }
.detail-change.flat { color: var(--ink-muted); }

.chart-wrap {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); overflow: hidden;
}
.chart-controls { display: flex; border-bottom: 1px solid var(--rule-soft); }
.range-btn {
  flex: 1; padding: 10px 0; border: none; background: transparent;
  color: var(--ink-muted);
  font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.06em;
  cursor: pointer; transition: color .15s, background .15s;
}
.range-btn.active { color: var(--ink); background: var(--bg-elev); }
#chart { height: 280px; padding: 8px 4px; }

.ind-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--rule-soft);
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  overflow: hidden;
}
.ind-cell { background: var(--bg-card); padding: 12px 10px; text-align: center; }
.ind-cell .label { font-size: 9.5px; letter-spacing: 0.1em; }
.ind-cell .val { font-family: var(--mono); font-size: 14px; font-weight: 500; margin-top: 4px; color: var(--ink); }
.ind-cell .val.pos { color: var(--green); }
.ind-cell .val.neg { color: var(--red); }
.ind-cell .val.warn { color: var(--accent); }

.pos-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 16px 18px;
}
.pos-card h3 { font-family: var(--display); font-size: 16px; font-weight: 500; margin-bottom: 12px; letter-spacing: -0.01em; }
.pos-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.pos-row .lbl { color: var(--ink-muted); letter-spacing: 0.02em; }
.pos-row .val { font-family: var(--mono); font-weight: 500; }
.pos-row .val.pos { color: var(--green); }
.pos-row .val.neg { color: var(--red); }
.pos-row .val.flat { color: var(--ink-muted); }

.pos-actions {
  display: flex; gap: 8px; margin-top: 14px;
  padding-top: 14px; border-top: 1px solid var(--rule-soft);
}

/* AI card */
.ai-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 0;
  position: relative; overflow: hidden;
}
.ai-card::before {
  content: ""; position: absolute; top: 0; left: 0;
  width: 4px; height: 100%; background: var(--accent);
}
.stance-hero { padding: 22px 20px 18px; border-bottom: 1px solid var(--rule-soft); }
.stance-eyebrow {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 8px;
}
.stance-verb {
  font-family: var(--display); font-weight: 700;
  font-size: 38px; letter-spacing: -0.025em; line-height: 1;
}
.stance-verb.ACCUMULATE { color: var(--green); }
.stance-verb.HOLD       { color: var(--ink); }
.stance-verb.TRIM       { color: var(--gold); }
.stance-verb.EXIT       { color: var(--red); }
.stance-verb.AVOID      { color: var(--red-soft); }
.stance-headline { font-size: 14px; color: var(--ink-soft); margin-top: 8px; line-height: 1.45; }
.stance-pills { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center;
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  padding: 4px 9px; border-radius: 4px;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.pill-conf { background: var(--bg-elev); color: var(--ink-soft); border: 1px solid var(--rule); }
.pill-conv { background: transparent; color: var(--ink-muted); border: 1px dashed var(--rule); }
.pill-conv.high, .pill-conf.high { color: var(--ink); border-color: var(--ink-soft); }
.pill-conv.medium, .pill-conf.medium { color: var(--ink-soft); }
.pill-conv.low, .pill-conf.low { color: var(--ink-muted); opacity: 0.85; }

.action-block {
  padding: 16px 20px;
  background: linear-gradient(180deg, transparent 0%, rgba(161,61,45,0.04) 100%);
  border-bottom: 1px solid var(--rule-soft);
}
.action-block h4 {
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 10px;
}
.action-what {
  font-family: var(--display); font-size: 18px; font-weight: 500;
  letter-spacing: -0.01em; color: var(--ink); line-height: 1.3;
}
.action-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.action-meta-cell {
  background: var(--bg); border: 1px solid var(--rule-soft);
  border-radius: var(--radius-sm); padding: 8px 10px;
}
.action-meta-cell .lbl {
  font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500;
}
.action-meta-cell .val {
  font-family: var(--mono); font-size: 12.5px; font-weight: 500;
  color: var(--ink); margin-top: 3px;
}
.invalidation-row {
  margin-top: 12px;
  padding: 10px 12px;
  background: rgba(161,61,45,0.06);
  border: 1px solid var(--red-soft);
  border-radius: var(--radius-sm);
  font-size: 12px; color: var(--ink); line-height: 1.45;
}
.invalidation-row strong {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--red); font-weight: 600;
  display: block; margin-bottom: 3px;
}

.horizon-strip { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--rule-soft); }
.horizon-cell { padding: 12px 10px; text-align: center; border-right: 1px solid var(--rule-soft); }
.horizon-cell:last-child { border-right: none; }
.horizon-cell .lbl { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }
.horizon-cell .signal-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-top: 6px; }
.signal-dot.bullish        { background: var(--green); }
.signal-dot.neutralbullish { background: var(--green-soft); opacity: 0.7; }
.signal-dot.neutral        { background: var(--ink-muted); }
.signal-dot.neutralbearish { background: var(--red-soft); opacity: 0.7; }
.signal-dot.bearish        { background: var(--red); }
.horizon-cell .signal-text { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.04em; color: var(--ink-soft); margin-top: 5px; }
.horizon-cell .note { font-size: 10.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.35; min-height: 28px; }

.ai-body { padding: 16px 20px; }
.ai-section { margin-bottom: 16px; }
.ai-section:last-child { margin-bottom: 0; }
.ai-section h4 { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; margin-bottom: 6px; }
.ai-section p { font-size: 13.5px; color: var(--ink); line-height: 1.55; }

.confluence-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.confluence-score { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }

.scenarios-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 6px; }
.scenario { padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--rule-soft); background: var(--bg); }
.scenario.bull { border-left: 3px solid var(--green); }
.scenario.bear { border-left: 3px solid var(--red); }
.scenario.base { border-left: 3px solid var(--ink-muted); }
.scenario .scn-lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
.scenario.bull .scn-lbl { color: var(--green); }
.scenario.bear .scn-lbl { color: var(--red); }
.scenario.base .scn-lbl { color: var(--ink-muted); }
.scenario .scn-cond { font-size: 12.5px; color: var(--ink); line-height: 1.45; }
.scenario .scn-impl { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; line-height: 1.4; font-style: italic; }

.risks ul { list-style: none; margin-top: 4px; }
.risks li { font-size: 13px; padding: 5px 0 5px 18px; position: relative; color: var(--ink); line-height: 1.45; }
.risks li::before { content: ""; position: absolute; left: 4px; top: 12px; width: 4px; height: 1px; background: var(--accent); }

.what-changed {
  padding: 10px 12px;
  background: var(--bg-elev);
  border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--ink-soft);
  line-height: 1.5; font-family: var(--sans);
}
.what-changed::before {
  content: "WHAT CHANGED"; display: block;
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.14em; color: var(--ink-muted); margin-bottom: 4px;
}

.counter-arg {
  margin-top: 10px; padding: 12px 14px;
  background: rgba(176,141,60,0.06);
  border: 1px dashed var(--gold);
  border-radius: var(--radius-sm);
}
.counter-arg .ca-lbl {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 5px;
}
.counter-arg .ca-text { font-size: 12.5px; color: var(--ink); line-height: 1.55; font-style: italic; }

.position-context-block {
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--ink); line-height: 1.5;
}

.ai-actions { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--rule-soft); }
.ai-stamp {
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-muted);
  letter-spacing: 0.04em; padding: 0 20px 14px; line-height: 1.5;
}
.ai-sanity-note {
  margin: 0 20px 14px;
  padding: 8px 12px;
  background: rgba(176,141,60,0.10);
  border: 1px solid var(--gold);
  border-radius: 5px;
  font-family: var(--mono); font-size: 10.5px;
  color: var(--gold);
  line-height: 1.5;
}

.empty-ai { text-align: center; padding: 30px 20px; color: var(--ink-muted); font-size: 13px; }
.empty-ai .display { font-size: 16px; color: var(--ink-soft); margin-bottom: 14px; display: block; }

.port-analysis-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 0;
  position: relative; overflow: hidden;
}
.port-analysis-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--gold); }
.port-stance-hero { padding: 22px 20px 18px; border-bottom: 1px solid var(--rule-soft); }
.port-stance-verb {
  font-family: var(--display); font-weight: 700;
  font-size: 32px; letter-spacing: -0.02em; line-height: 1;
}
.port-stance-verb.DEFENSIVE { color: var(--ink-soft); }
.port-stance-verb.BALANCED  { color: var(--ink); }
.port-stance-verb.AGGRESSIVE { color: var(--accent); }
.port-stance-verb.MISALIGNED, .port-stance-verb.MIS-ALIGNED { color: var(--red); }

.list-block {
  background: var(--bg);
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius-sm);
  padding: 4px 0; margin-top: 6px;
}
.list-block .li { padding: 8px 12px; border-bottom: 1px solid var(--rule-soft); font-size: 12.5px; color: var(--ink); line-height: 1.5; }
.list-block .li:last-child { border-bottom: none; }

.rec-block {
  background: var(--bg);
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius-sm);
  padding: 12px; margin-top: 8px;
}
.rec-block.high { border-left: 3px solid var(--accent); }
.rec-block.medium { border-left: 3px solid var(--gold); }
.rec-block.low { border-left: 3px solid var(--ink-muted); }
.rec-action { font-family: var(--display); font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.4; }
.rec-rationale { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-top: 5px; }
.rec-priority {
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-top: 6px; display: inline-block;
  padding: 2px 6px; border-radius: 3px;
}
.rec-priority.high { background: rgba(161,61,45,0.12); color: var(--accent); }
.rec-priority.medium { background: rgba(176,141,60,0.15); color: var(--gold); }
.rec-priority.low { background: var(--bg-elev); color: var(--ink-muted); }

.sent-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 18px 20px;
}
.sent-card h3 { font-family: var(--display); font-size: 16px; font-weight: 500; margin-bottom: 12px; }
.sent-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; font-size: 13px;
  border-bottom: 1px solid var(--rule-soft);
}
.sent-row:last-child { border: none; }
.sent-row .lbl { color: var(--ink-muted); }
.sent-row .val { font-family: var(--mono); font-weight: 500; }
.news-list { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule-soft); }
.news-item { padding: 8px 0; border-bottom: 1px solid var(--rule-soft); }
.news-item:last-child { border: none; }
.news-item a { color: var(--ink); text-decoration: none; font-size: 13px; line-height: 1.4; display: block; }
.news-item a:hover { color: var(--accent); }
.news-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted); margin-top: 3px; letter-spacing: 0.02em; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(20,17,13,0.5);
  z-index: 90; opacity: 0; pointer-events: none;
  transition: opacity .2s;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal-bg.show { opacity: 1; pointer-events: all; }
.modal {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-card);
  border-radius: 18px 18px 0 0;
  padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
  z-index: 91; transform: translateY(100%);
  transition: transform .25s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow-deep);
}
.modal.show { transform: translateY(0); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-head h3 { font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
.modal-handle { width: 36px; height: 4px; background: var(--rule); border-radius: 2px; margin: 0 auto 18px; }

.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--rule);
  background: var(--bg); color: var(--ink);
  font-family: var(--mono); font-size: 15px;
  border-radius: var(--radius-sm);
  -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ink); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-hint { font-size: 11px; color: var(--ink-muted); margin-top: 4px; letter-spacing: 0.02em; line-height: 1.4; }

.search-results {
  position: absolute; left: 0; right: 0; top: 100%;
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius-sm);
  margin-top: 4px; max-height: 240px; overflow-y: auto;
  box-shadow: var(--shadow-deep); z-index: 5;
}
.search-result { padding: 10px 14px; border-bottom: 1px solid var(--rule-soft); cursor: pointer; transition: background .12s; }
.search-result:last-child { border: none; }
.search-result:hover { background: var(--bg-elev); }
.search-result .sym { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.search-result .nm { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
.search-result .ex { font-family: var(--mono); font-size: 10px; color: var(--ink-muted); float: right; }

.empty-state { text-align: center; padding: 60px 30px; color: var(--ink-muted); }
.empty-state .display { font-size: 22px; font-weight: 500; color: var(--ink-soft); margin-bottom: 8px; display: block; }
.empty-state p { font-size: 13px; margin-bottom: 22px; }

.settings-group {
  margin: 0 20px 24px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); overflow: hidden;
}
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--rule-soft); }
.setting-row:last-child { border-bottom: none; }
.setting-row .lbl { font-size: 14px; }
.setting-row .sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }

.toggle {
  position: relative; width: 44px; height: 26px;
  background: var(--rule); border-radius: 13px;
  cursor: pointer; transition: background .2s; flex-shrink: 0;
}
.toggle::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; background: var(--bg-card);
  border-radius: 50%; transition: transform .2s; box-shadow: var(--shadow);
}
.toggle.on { background: var(--ink); }
.toggle.on::after { transform: translateX(18px); }

.journal-entry { padding: 14px 20px; border-bottom: 1px solid var(--rule-soft); }
.journal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.journal-symbol { font-family: var(--display); font-size: 16px; font-weight: 600; }
.journal-action {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 3px; margin-left: 8px;
}
.journal-action.buy  { background: rgba(74,122,74,0.12); color: var(--green); }
.journal-action.sell { background: rgba(161,61,45,0.12); color: var(--red); }
.journal-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.02em; }
.journal-reason { font-size: 13px; margin-top: 8px; color: var(--ink-soft); line-height: 1.45; }
.journal-snapshot {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  margin-top: 6px; padding: 6px 8px; background: var(--bg-elev);
  border-radius: 4px; letter-spacing: 0.02em;
}
.journal-del {
  background: transparent; border: 1px solid var(--rule); border-radius: 4px;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-muted); cursor: pointer;
  transition: all .12s;
  padding: 0;
}
.journal-del:hover { color: var(--red); border-color: var(--red); }
.journal-del:active { transform: scale(0.92); }

/* ===== RAW SIGNALS SECTION (collapsible — old cards demoted under Verdict) ===== */
.raw-signals-section {
  margin: 16px 20px 0;
}
.raw-signals-toggle {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  background: var(--bg-elev);
  border: 1px dashed var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  text-align: left;
  transition: background .15s;
}
.raw-signals-toggle:hover { background: var(--bg-card); }
.rst-arrow {
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-muted); flex-shrink: 0;
}
.rst-label {
  font-family: var(--display); font-size: 13px; font-weight: 500;
  color: var(--ink);
}
.rst-sub {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-muted);
  margin-left: auto;
  text-align: right;
  letter-spacing: 0.02em;
}
@media (max-width: 600px) {
  .rst-sub { display: none; }
}
.raw-signals-section .scan-card,
.raw-signals-section .watchout-card,
.raw-signals-section .opp-card,
.raw-signals-section .ai-card,
.raw-signals-section .presurge-card {
  margin-left: 0;
  margin-right: 0;
  margin-top: 12px;
}

/* ===== TODAY'S VERDICT CARD ===== */
.verdict-card {
  margin: 12px 20px 0;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.verdict-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--ink);
}
.verdict-head {
  display: flex; justify-content: space-between; align-items: start;
  gap: 12px; padding: 14px 18px 8px;
}
.verdict-head h3 {
  font-family: var(--display); font-size: 16px; font-weight: 500;
  letter-spacing: -0.005em; margin-bottom: 2px;
}
.verdict-sub {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-muted); letter-spacing: 0.04em;
}
.verdict-list {
  display: flex; flex-direction: column;
  border-top: 1px solid var(--rule-soft);
}
.verdict-item {
  padding: 12px 18px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer;
  transition: background .12s;
}
.verdict-item:last-child { border-bottom: none; }
.verdict-item:hover { background: var(--bg-elev); }
.verdict-item.add::before    { /* uses ::before only on card */ }
.verdict-item-head {
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; margin-bottom: 8px;
}
.vih-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.vih-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.verdict-action-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  padding: 4px 8px; border-radius: 4px;
  letter-spacing: 0.08em;
}
.verdict-action-badge.add   { background: var(--green); color: var(--bg); }
.verdict-action-badge.trim  { background: var(--gold); color: var(--bg); }
.verdict-action-badge.exit  { background: var(--red); color: var(--bg); }
.verdict-action-badge.prime { background: var(--bg-elev); color: var(--gold); border: 1px solid var(--gold); }
.verdict-action-badge.hold  { background: var(--bg-elev); color: var(--ink-muted); border: 1px solid var(--rule); }
.verdict-sym {
  font-family: var(--display); font-size: 15px; font-weight: 600;
}
.verdict-dollars {
  font-family: var(--mono); font-size: 12px;
  color: var(--ink-soft);
}
.verdict-net {
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-muted);
}
.verdict-del {
  background: transparent; border: none;
  color: var(--ink-muted); cursor: pointer;
  width: 26px; height: 26px; border-radius: 50%;
  font-size: 18px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.verdict-del:hover, .verdict-del:active {
  background: rgba(161,61,45,0.12); color: var(--red);
}
.verdict-votes {
  display: flex; flex-wrap: wrap; gap: 4px;
}
.vote-chip {
  font-family: var(--mono); font-size: 10.5px;
  padding: 3px 7px; border-radius: 3px;
  letter-spacing: 0.02em;
}
.vote-chip.buy  { background: rgba(74,122,74,0.12);  color: var(--green); border: 1px solid rgba(74,122,74,0.3); }
.vote-chip.sell { background: rgba(161,61,45,0.12);  color: var(--red);   border: 1px solid rgba(161,61,45,0.3); }
.vote-chip.tilt { background: var(--bg-elev);         color: var(--ink-soft); border: 1px solid var(--rule-soft); }
.vote-chip.decayed {
  background: transparent;
  color: var(--ink-muted);
  border: 1px dashed var(--rule-soft);
  font-style: italic;
}
.verdict-blocker {
  margin-top: 8px; padding: 6px 10px;
  background: rgba(176,141,60,0.08);
  border-left: 2px solid var(--gold);
  border-radius: 4px;
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-soft);
  line-height: 1.4;
}
.verdict-conflict-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 6px;
  background: rgba(176,141,60,0.15);
  color: var(--gold);
  border: 1px solid rgba(176,141,60,0.4);
  border-radius: 3px;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.verdict-conflict-note {
  margin-top: 8px; padding: 6px 10px;
  background: rgba(176,141,60,0.05);
  border-left: 2px dashed var(--gold);
  border-radius: 4px;
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-soft);
  line-height: 1.4;
  font-style: italic;
}
.verdict-item.conflicted {
  border-left-width: 3px;
  border-left-color: var(--gold);
}
.trade-plan {
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--bg-elev);
  border-radius: 4px;
  border-left: 2px solid var(--rule-soft);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.trade-plan-wrap {
  margin-top: 8px;
}
.trade-plan-wrap.expanded .trade-plan {
  margin-top: 4px;
}
.tp-toggle {
  background: transparent;
  border: none;
  cursor: pointer;
  width: 100%;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
  transition: background 120ms;
}
.tp-toggle:hover {
  background: var(--bg-elev);
}
.tp-toggle-chevron {
  color: var(--ink-muted);
  font-size: 9px;
  width: 10px;
  display: inline-block;
}
.tp-summary {
  color: var(--ink-muted);
  font-style: italic;
  margin-left: 4px;
}
.tp-empty {
  margin-top: 8px;
  padding: 6px 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-muted);
  font-style: italic;
  border-left: 2px dashed var(--rule-soft);
}
.tp-row {
  display: flex;
  gap: 10px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  align-items: flex-start;
}
.tp-label {
  flex-shrink: 0;
  width: 75px;
  color: var(--ink-muted);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-size: 10px;
  padding-top: 1px;
}
.tp-text {
  flex: 1;
  color: var(--ink-soft);
}
.verdict-holds {
  padding: 10px 18px;
  border-top: 1px solid var(--rule-soft);
  background: var(--bg-elev);
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-muted);
  line-height: 1.4;
}
.verdict-empty {
  padding: 14px 18px;
  border-top: 1px solid var(--rule-soft);
}
.verdict-empty-headline {
  font-family: var(--display); font-size: 14px;
  margin-bottom: 6px;
  color: var(--ink);
}
.verdict-empty-closest {
  font-family: var(--mono); font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 4px;
}
.verdict-empty-hint {
  font-size: 12px; color: var(--ink-muted);
  font-style: italic;
}
.verdict-footer {
  padding: 8px 18px;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--mono); font-size: 9.5px;
  color: var(--ink-muted); text-align: center;
  letter-spacing: 0.04em;
}

/* ===== TODAY'S OPPORTUNITIES CARD ===== */
.opps-card {
  margin: 12px 20px 0;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.opps-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--green);
}
.opps-card.empty::before { background: var(--ink-muted); }
.opps-head {
  display: flex; justify-content: space-between; align-items: start;
  gap: 12px; padding: 14px 18px 8px;
}
.opps-head h3 {
  font-family: var(--display); font-size: 16px; font-weight: 500;
  letter-spacing: -0.005em; margin-bottom: 2px;
}
.opps-sub {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-muted); letter-spacing: 0.04em;
}
.opps-empty-body {
  padding: 8px 20px 14px;
  font-size: 12.5px; color: var(--ink-soft);
  line-height: 1.55;
}
.opps-list {
  display: flex; flex-direction: column;
  border-top: 1px solid var(--rule-soft);
}
.opp-item {
  padding: 12px 18px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer;
  transition: background .12s;
}
.opp-item:last-child { border-bottom: none; }
.opp-item:hover { background: var(--bg-elev); }
.opp-item-head {
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; margin-bottom: 6px;
}
.oih-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.oih-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.opp-action-badge {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  padding: 4px 8px; border-radius: 4px;
  letter-spacing: 0.08em;
}
.opp-action-badge.starter   { background: var(--green); color: var(--bg); }
.opp-action-badge.consider  { background: var(--gold); color: var(--bg); }
.opp-action-badge.watch     { background: var(--bg-elev); color: var(--ink-soft); border: 1px solid var(--rule); }
.opp-sym {
  font-family: var(--display); font-size: 15px; font-weight: 600;
}
.opp-price {
  font-family: var(--mono); font-size: 11.5px;
  color: var(--ink-soft);
}
.opp-tag.onlist {
  font-family: var(--mono); font-size: 9.5px;
  padding: 2px 6px; border-radius: 3px;
  background: rgba(74,122,74,0.12); color: var(--green);
  border: 1px solid var(--green);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.opp-net {
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-muted);
}
.opp-del {
  background: transparent; border: none;
  color: var(--ink-muted); cursor: pointer;
  width: 26px; height: 26px; border-radius: 50%;
  font-size: 18px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.opp-del:hover, .opp-del:active {
  background: rgba(161,61,45,0.12); color: var(--red);
}
.opp-action-line {
  font-family: var(--mono); font-size: 12px;
  color: var(--ink-soft); margin-bottom: 6px;
}
.opp-votes {
  display: flex; flex-wrap: wrap; gap: 4px;
}
.opp-quick-actions {
  margin-top: 8px;
  display: flex; gap: 6px;
}
.opps-footer {
  padding: 8px 18px;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--mono); font-size: 9.5px;
  color: var(--ink-muted); text-align: center;
  letter-spacing: 0.04em;
}

/* ===== MACRO REGIME CARD ===== */
.macro-card {
  margin: 12px 20px 0;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.macro-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--ink-muted);
}
.macro-card.tailwind::before { background: var(--green); }
.macro-card.headwind::before { background: var(--red); }
.macro-card.empty,
.macro-card.loading { padding-bottom: 12px; }
.macro-head {
  display: flex; justify-content: space-between; align-items: start;
  gap: 12px; padding: 14px 18px 6px;
}
.macro-head h3 {
  font-family: var(--display); font-size: 15px; font-weight: 500;
  letter-spacing: -0.005em; margin-bottom: 2px;
}
.macro-sub {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-muted); letter-spacing: 0.04em;
}
.macro-empty-body {
  padding: 8px 20px 4px;
  font-size: 12.5px; color: var(--ink-soft);
  line-height: 1.55;
}
.macro-regime-label {
  padding: 8px 18px 12px;
}
.mrl-cur {
  font-family: var(--display); font-size: 18px; font-weight: 600;
  letter-spacing: -0.01em; margin-bottom: 4px;
}
.macro-card.tailwind .mrl-cur { color: var(--green); }
.macro-card.headwind .mrl-cur { color: var(--red); }
.mrl-blurb {
  font-size: 12.5px; color: var(--ink-soft);
  line-height: 1.5;
}
.macro-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; background: var(--rule-soft);
  border-top: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
}
.macro-stat {
  padding: 12px 18px;
  background: var(--bg-card);
}
.macro-stat-lbl {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-muted); margin-bottom: 4px;
}
.macro-stat-val {
  font-family: var(--mono); font-size: 18px; font-weight: 600;
  color: var(--ink);
}
.macro-stat-sub {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-soft); margin-top: 3px;
}
.macro-stat-sub .pos { color: var(--green); }
.macro-stat-sub .neg { color: var(--red); }
.macro-stat-sub .muted { color: var(--ink-muted); }
.macro-verdict {
  padding: 10px 18px;
  display: flex; flex-direction: column; gap: 10px;
  border-bottom: 1px solid var(--rule-soft);
}
.mv-block { display: flex; flex-direction: column; gap: 5px; }
.mv-lbl {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-muted);
}
.mv-block.favored .mv-lbl { color: var(--green); }
.mv-block.headwind .mv-lbl { color: var(--red); }
.mv-syms { display: flex; flex-wrap: wrap; gap: 4px; }
.mv-chip {
  font-family: var(--display); font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 4px;
}
.mv-chip.favored { background: rgba(74,122,74,0.15); color: var(--green); border: 1px solid var(--green); }
.mv-chip.headwind { background: rgba(161,61,45,0.12); color: var(--red); border: 1px solid var(--red); }
.macro-favors-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; background: var(--rule-soft);
}
@media (max-width: 480px) {
  .macro-favors-grid { grid-template-columns: 1fr; }
}
.macro-fg-col {
  padding: 10px 14px;
  background: var(--bg-card);
}
.mfg-lbl {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 6px;
}
.macro-fg-col.favors .mfg-lbl { color: var(--green); }
.macro-fg-col.against .mfg-lbl { color: var(--red); }
.macro-fg-col ul { list-style: none; padding: 0; margin: 0; }
.macro-fg-col li {
  font-size: 12px; color: var(--ink-soft);
  padding: 2px 0; line-height: 1.35;
}
.macro-fg-col li::before { content: "·  "; color: var(--ink-muted); }
.macro-footer {
  padding: 8px 18px;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--mono); font-size: 9.5px;
  color: var(--ink-muted); text-align: center;
  letter-spacing: 0.04em;
}

/* DTC / short-interest badges on Pre-Surge rows */
.presurge-tag.short-high-short {
  background: rgba(176,141,60,0.15);
  color: var(--gold);
  border: 1px solid var(--gold);
}
.presurge-tag.short-squeeze-prone {
  background: rgba(161,61,45,0.15);
  color: var(--red);
  border: 1px solid var(--red);
  animation: pulse-squeeze 2s ease-in-out infinite;
}
@keyframes pulse-squeeze {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ===== PRE-SURGE SCANNER CARD ===== */
.presurge-card {
  margin: 12px 20px 0;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.presurge-card.empty,
.presurge-card.loading { padding-bottom: 12px; }
.presurge-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: linear-gradient(180deg, var(--gold), var(--green));
}
.presurge-head {
  display: flex; justify-content: space-between; align-items: start;
  gap: 12px; padding: 14px 18px 8px;
}
.presurge-head h3 {
  font-family: var(--display); font-size: 15px; font-weight: 500;
  letter-spacing: -0.005em; margin-bottom: 2px;
}
.presurge-sub {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-muted); letter-spacing: 0.04em;
}
.presurge-empty-body {
  padding: 12px 20px 4px;
  font-size: 12.5px; color: var(--ink-soft);
  line-height: 1.55;
}
.presurge-progress {
  height: 3px; background: var(--bg-elev);
  margin: 4px 18px 6px; border-radius: 2px; overflow: hidden;
}
.presurge-progress-bar {
  height: 100%; background: var(--gold);
  transition: width .25s ease-out;
}
.presurge-list {
  display: flex; flex-direction: column;
  border-top: 1px solid var(--rule-soft);
}
.presurge-row {
  display: grid; grid-template-columns: 44px 1fr auto;
  gap: 12px; align-items: start;
  padding: 12px 18px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer;
  transition: background .12s;
}
.presurge-row:hover { background: var(--bg-elev); }
.presurge-row.rec-done { opacity: 0.55; }
.presurge-row.rec-done .presurge-sym { text-decoration: line-through; }
.presurge-rank {
  font-family: var(--display); font-size: 22px; font-weight: 600;
  line-height: 1; padding-top: 4px;
  color: var(--ink);
  background: var(--bg-elev);
  border-radius: 6px;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--rule-soft);
}
.presurge-mid { min-width: 0; }
.presurge-sym-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.presurge-sym {
  font-family: var(--display); font-size: 15px; font-weight: 600;
}
.presurge-tag {
  font-family: var(--mono); font-size: 9px;
  padding: 2px 5px; border-radius: 3px;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.presurge-tag.held    { background: rgba(176,141,60,0.15); color: var(--gold); border: 1px solid var(--gold); }
.presurge-tag.watched { background: rgba(74,122,74,0.12); color: var(--green); border: 1px solid var(--green); }
.presurge-price {
  font-family: var(--mono); font-size: 11.5px;
  color: var(--ink-soft); margin-left: auto;
}
.presurge-bars {
  display: flex; flex-direction: column; gap: 4px;
  margin-bottom: 8px;
}
.presurge-bar-row {
  display: grid; grid-template-columns: 56px 1fr 42px;
  gap: 8px; align-items: center;
}
.presurge-bar-lbl {
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-muted); letter-spacing: 0.04em;
  text-transform: uppercase;
}
.presurge-bar-track {
  height: 6px; background: var(--bg-elev);
  border-radius: 3px; overflow: hidden;
}
.presurge-bar-fill {
  height: 100%; border-radius: 3px;
  transition: width .25s;
}
.presurge-bar-val {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-soft); text-align: right;
}
.presurge-details {
  display: flex; flex-wrap: wrap; gap: 4px;
}
.presurge-detail-chip {
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-muted);
  padding: 2px 6px;
  background: var(--bg-elev);
  border-radius: 3px;
  border: 1px solid var(--rule-soft);
}
.presurge-actions {
  display: flex; flex-direction: column; gap: 6px;
  align-items: center; justify-content: center;
}
.presurge-del {
  background: transparent; border: none;
  color: var(--ink-muted); cursor: pointer;
  width: 26px; height: 26px; border-radius: 50%;
  font-size: 18px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.presurge-del:hover, .presurge-del:active {
  background: rgba(161,61,45,0.12); color: var(--red);
}
.presurge-track {
  border-top: 1px solid var(--rule-soft);
  padding: 12px 18px;
  background: var(--bg-elev);
}
.presurge-track-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px;
}
.presurge-track-head > span:first-child {
  font-family: var(--display); font-size: 12px; font-weight: 500;
  letter-spacing: 0.02em;
}
.presurge-track-stats {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-muted);
}
.presurge-track-stats .pos { color: var(--green); }
.presurge-track-stats .neg { color: var(--red); }
.presurge-track-list {
  display: flex; flex-direction: column; gap: 4px;
}
.presurge-track-row {
  display: grid; grid-template-columns: 52px 1fr auto auto;
  gap: 8px; align-items: center;
  font-family: var(--mono); font-size: 11px;
  padding: 6px 8px;
  background: var(--bg);
  border-radius: 4px;
  cursor: pointer;
}
.presurge-track-row:hover { background: var(--bg-card); }
.ptr-sym { font-family: var(--display); font-weight: 600; font-size: 12px; }
.ptr-age { color: var(--ink-muted); font-size: 10.5px; }
.ptr-score { color: var(--ink-soft); font-size: 10.5px; }
.ptr-pnl { font-weight: 600; text-align: right; }
.ptr-pnl.pos { color: var(--green); }
.ptr-pnl.neg { color: var(--red); }
.presurge-footer {
  padding: 8px 18px;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--mono); font-size: 9.5px;
  color: var(--ink-muted); text-align: center;
  letter-spacing: 0.04em;
}

/* Debug mode — diagnostic view when zero flags shows up */
.presurge-card.debug::before {
  background: var(--ink-muted);
}
.presurge-debug-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 6px; padding: 10px 18px;
  background: var(--bg-elev);
  border-top: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
}
.pds-cell {
  display: flex; flex-direction: column; gap: 1px;
  padding: 6px 8px;
  background: var(--bg-card);
  border-radius: 4px;
  border: 1px solid var(--rule-soft);
}
.pds-lbl {
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-muted);
}
.pds-val {
  font-family: var(--mono); font-size: 14px; font-weight: 600;
  color: var(--ink);
}
.presurge-debug-hint {
  padding: 10px 18px;
  font-size: 11.5px; line-height: 1.5;
  color: var(--ink-soft);
  background: var(--bg);
}
/* In debug view, rows above threshold get a subtle gold glow so you can spot them */
.presurge-row.over-thresh .presurge-rank {
  background: rgba(176,141,60,0.15);
  border-color: var(--gold);
  color: var(--gold);
}

/* ===== JOURNAL STRATEGY ROWS (TP + Exit on logged trades) ===== */
.journal-strategy {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 8px; padding: 8px 10px;
  background: var(--bg-elev); border-radius: 6px;
  font-family: var(--mono); font-size: 11px;
  align-items: center;
}
.journal-strategy.tp   { border-left: 2px solid var(--green); }
.journal-strategy.exit { border-left: 2px solid var(--red); }
.journal-strategy .js-lbl {
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-muted); margin-right: 6px;
}
.journal-strategy .js-cell { color: var(--ink-soft); }
.journal-strategy .js-cell b { color: var(--ink); margin-right: 4px; }
.journal-strategy .js-cell-wide { flex-basis: 100%; }

/* ===== LOG TRADE STRATEGY BLOCKS ===== */
.lt-strategy-block {
  margin: 14px 0;
  padding: 12px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--rule-soft);
  border-radius: 8px;
}
.lt-strategy-head {
  font-family: var(--display); font-size: 13px; font-weight: 500;
  margin-bottom: 4px; letter-spacing: -0.005em;
}
.lt-strategy-hint {
  font-size: 11px; color: var(--ink-muted);
  margin-bottom: 10px;
}

/* ===== TP + EXIT GRID (analysis card) ===== */
.tp-exit-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; padding: 12px 18px 6px;
}
@media (max-width: 480px) {
  .tp-exit-grid { grid-template-columns: 1fr; }
}
.tp-block, .exit-block {
  padding: 10px 12px;
  background: var(--bg-elev); border-radius: 8px;
  border: 1px solid var(--rule-soft);
}
.tp-block  { border-left: 3px solid var(--green); }
.exit-block { border-left: 3px solid var(--red); }
.tpe-lbl {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-muted); margin-bottom: 8px;
}
.tpe-row {
  font-family: var(--mono); font-size: 12px;
  margin-bottom: 4px; color: var(--ink-soft);
  line-height: 1.4;
}
.tpe-row b {
  color: var(--ink); font-weight: 600;
  margin-right: 6px; display: inline-block; min-width: 38px;
}
.tpe-row-wrap { display: block; }
.tpe-note {
  font-size: 11px; color: var(--ink-muted);
  margin-top: 6px; padding-top: 6px;
  border-top: 1px dashed var(--rule-soft);
  font-family: var(--mono);
}

/* ===== SCAN CARD: done state, dismiss button ===== */
.scan-actions-col {
  display: flex; flex-direction: column; gap: 4px;
  align-items: center; justify-content: center;
  margin-left: 4px;
}
.scan-del {
  background: transparent; border: none;
  color: var(--ink-muted); cursor: pointer;
  width: 26px; height: 26px; border-radius: 50%;
  font-size: 18px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.scan-del:hover, .scan-del:active {
  background: rgba(161,61,45,0.12); color: var(--red);
}
.scan-log.done {
  background: rgba(74,122,74,0.18);
  color: var(--green);
  border: 1px solid var(--green);
  cursor: default; opacity: 1;
}
.scan-item.rec-done { opacity: 0.65; }
.scan-item.rec-done .scan-action { text-decoration: line-through; text-decoration-color: var(--ink-muted); text-decoration-thickness: 1px; }
.scan-recency.done {
  background: var(--green); color: var(--bg);
}

/* ===== WATCHLIST SUGGEST-STRIP: done + delete ===== */
.watch-suggest-strip .wss-del {
  background: transparent; border: none;
  color: var(--ink-muted); cursor: pointer;
  width: 24px; height: 24px; border-radius: 50%;
  font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  margin-left: 4px; padding: 0;
}
.watch-suggest-strip .wss-del:active { background: rgba(161,61,45,0.12); color: var(--red); }
.watch-suggest-strip.done {
  opacity: 0.75;
  background: rgba(74,122,74,0.08);
}
.watch-suggest-strip.done .wss-action { color: var(--green); }
.wss-log.done {
  background: rgba(74,122,74,0.18);
  color: var(--green); border: 1px solid var(--green);
  cursor: default;
}

/* ===== INLINE CHART PREVIEW (Ideas + ETF Leaderboard) ===== */
.preview-chart-wrap {
  margin: 8px 0 4px;
  padding: 10px 12px 12px;
  background: var(--bg-elev);
  border-radius: 8px;
  border: 1px solid var(--rule-soft);
}
.preview-chart-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.preview-chart-head .pc-sym {
  font-family: var(--display); font-weight: 600; font-size: 14px;
  margin-right: 8px;
}
.preview-chart-head .pc-price {
  font-family: var(--mono); font-size: 13px; color: var(--ink-soft);
  margin-right: 6px;
}
.preview-chart-head .pc-day {
  font-family: var(--mono); font-size: 11px;
  padding: 2px 6px; border-radius: 3px;
}
.preview-chart-head .pc-day.pos { background: rgba(74,122,74,0.15); color: var(--green); }
.preview-chart-head .pc-day.neg { background: rgba(161,61,45,0.15); color: var(--red); }
.preview-chart-head .pc-close {
  background: transparent; border: none;
  color: var(--ink-muted); font-size: 20px; line-height: 1;
  cursor: pointer; padding: 2px 6px;
}
.preview-chart-head .pc-close:hover { color: var(--red); }
.preview-chart-controls {
  display: flex; gap: 4px; margin-bottom: 8px;
}
.preview-chart-controls .pc-range {
  background: transparent; border: 1px solid var(--rule-soft);
  color: var(--ink-muted); font-family: var(--mono);
  font-size: 10.5px; padding: 4px 9px; border-radius: 4px;
  cursor: pointer; letter-spacing: 0.04em;
}
.preview-chart-controls .pc-range.active {
  background: var(--ink); color: var(--bg); border-color: var(--ink);
}
.preview-chart-el {
  width: 100%; height: 220px; min-height: 220px;
}

/* ETF Leaderboard row wrap (to include inline chart) */
.lb-row-wrap { display: block; }
.lb-row-wrap .preview-chart-wrap { margin: 0 20px 12px; }

/* ===== NEWS TAB (Big Opportunities) ===== */
.news-intro {
  padding: 8px 20px 14px;
  font-family: var(--mono); font-size: 11.5px;
  color: var(--ink-muted); line-height: 1.5;
  border-bottom: 1px solid var(--rule-soft);
}
.news-card {
  margin: 12px 20px;
  padding: 14px 16px 12px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  position: relative;
}
.news-card.high   { border-left: 3px solid var(--red); }
.news-card.medium { border-left: 3px solid var(--gold); }
.news-card.low    { border-left: 3px solid var(--ink-muted); }
.news-card-head {
  display: flex; justify-content: space-between; align-items: start;
  gap: 10px; margin-bottom: 6px;
}
.news-headline {
  font-family: var(--display); font-size: 15px; font-weight: 500;
  line-height: 1.35; letter-spacing: -0.005em; flex: 1;
}
.news-urgency {
  font-family: var(--mono); font-size: 9.5px;
  padding: 2px 6px; border-radius: 3px;
  letter-spacing: 0.1em; flex-shrink: 0;
}
.news-urgency.high   { background: var(--red); color: var(--bg); }
.news-urgency.medium { background: var(--gold); color: var(--bg); }
.news-urgency.low    { background: var(--bg-elev); color: var(--ink-muted); border: 1px solid var(--rule-soft); }
.news-sym-row {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin-bottom: 8px;
}
.news-sym {
  font-family: var(--display); font-weight: 600; font-size: 13px;
  padding: 3px 8px; background: var(--bg-elev); border-radius: 4px;
}
.news-live-price {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft);
  padding: 3px 6px; background: var(--bg-elev); border-radius: 3px;
  border: 1px solid var(--rule-soft);
}
.news-live-price .news-day {
  font-size: 10px; margin-left: 4px; padding: 1px 4px; border-radius: 2px;
}
.news-live-price .news-day.pos { background: rgba(74,122,74,0.18); color: var(--green); }
.news-live-price .news-day.neg { background: rgba(161,61,45,0.18); color: var(--red); }
.news-dir {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  padding: 3px 7px; border-radius: 3px; text-transform: uppercase;
}
.news-dir.long  { background: rgba(74,122,74,0.15); color: var(--green); border: 1px solid var(--green); }
.news-dir.short { background: rgba(161,61,45,0.15); color: var(--red);   border: 1px solid var(--red); }
.news-dir.neutral { background: var(--bg-elev); color: var(--ink-muted); border: 1px solid var(--rule-soft); }
.news-tag {
  font-family: var(--mono); font-size: 9.5px;
  padding: 2px 6px; border-radius: 3px;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.news-tag.held    { background: rgba(176,141,60,0.15); color: var(--gold); border: 1px solid var(--gold); }
.news-tag.onlist  { background: rgba(74,122,74,0.12); color: var(--green); border: 1px solid var(--green); }
.news-thesis {
  font-size: 13px; line-height: 1.5; color: var(--ink-soft);
  margin-bottom: 10px;
}
.news-strat-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 8px; margin-bottom: 10px;
}
.news-strat-cell {
  padding: 8px 10px; background: var(--bg-elev); border-radius: 6px;
}
.news-strat-cell .lbl {
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-muted); margin-bottom: 3px;
}
.news-strat-cell .val {
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  line-height: 1.3;
}
.news-risk {
  font-size: 11.5px; color: var(--ink-soft);
  padding: 8px 10px; margin-bottom: 10px;
  background: rgba(161,61,45,0.06); border-left: 2px solid var(--red);
  border-radius: 4px; line-height: 1.45;
}
.news-risk-lbl {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--red); margin-right: 4px;
}
.news-source {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  margin-bottom: 8px;
}
.news-actions {
  display: flex; gap: 6px; flex-wrap: wrap;
}

.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg);
  padding: 12px 18px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
  box-shadow: var(--shadow-deep);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: all; }
.toast.error { background: var(--red); }

.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--rule); border-top-color: var(--ink);
  border-radius: 50%; animation: spin .8s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-banner {
  margin: 12px 20px; padding: 12px 14px;
  background: rgba(161,61,45,0.08); border: 1px solid var(--red-soft);
  border-radius: var(--radius-sm);
  font-family: var(--mono); font-size: 11.5px; color: var(--red);
  line-height: 1.5; word-break: break-word;
}

.hidden { display: none !important; }
::-webkit-scrollbar { width: 0; }

/* ===== BOT SIMULATOR ===== */
.bot-hero {
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 22px 20px;
  margin: 16px 20px 12px;
  position: relative; overflow: hidden;
}
.bot-hero::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green) 0%, var(--gold) 50%, var(--accent) 100%);
}
.bot-hero h3 { font-family: var(--display); font-size: 18px; font-weight: 500; margin-bottom: 4px; }
.bot-hero .sub { font-size: 12px; color: var(--ink-muted); margin-bottom: 16px; }
.bot-stats {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 12px 18px;
}
.bot-stat-block {
  padding: 12px 14px;
  background: var(--bg-elev);
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule-soft);
}
.bot-stat-block .label { display: block; margin-bottom: 4px; }
.bot-stat-block .val { font-family: var(--mono); font-size: 16px; font-weight: 500; }
.bot-stat-block .val.pos { color: var(--green); }
.bot-stat-block .val.neg { color: var(--red); }
.bot-stat-block .sub { font-size: 10.5px; color: var(--ink-muted); margin-top: 2px; font-family: var(--mono); }

.strategy-card {
  margin: 12px 20px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.strategy-card .strat-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.strategy-card .strat-name {
  font-family: var(--display); font-size: 17px; font-weight: 500;
}
.strategy-card .strat-tag {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
}
.strat-tag.app { background: rgba(176,141,60,0.15); color: var(--gold); border: 1px solid var(--gold); }
.strat-tag.classic { background: rgba(74,122,74,0.12); color: var(--green); border: 1px solid var(--green); }

.strat-metrics {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.strat-metric {
  text-align: left;
  padding: 8px 10px;
  background: var(--bg-elev);
  border-radius: 6px;
}
.strat-metric .label { font-size: 9.5px; }
.strat-metric .val { font-family: var(--mono); font-size: 14px; font-weight: 500; margin-top: 2px; }
.strat-metric .val.pos { color: var(--green); }
.strat-metric .val.neg { color: var(--red); }

.bot-trade-list { margin: 0; padding: 0; }
.bot-trade {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 13px;
}
.bot-trade:last-child { border-bottom: none; }
.bot-trade-l { display: flex; flex-direction: column; gap: 2px; }
.bot-trade-sym { font-family: var(--display); font-weight: 600; font-size: 14px; }
.bot-trade-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted); }
.bot-trade-r { text-align: right; }
.bot-trade-pnl { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.bot-trade-pnl.pos { color: var(--green); }
.bot-trade-pnl.neg { color: var(--red); }
.bot-trade-pnl.open { color: var(--ink-muted); }
.bot-trade-act {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
  display: inline-block; margin-right: 6px;
}
.bot-trade-act.buy { background: rgba(74,122,74,0.15); color: var(--green); }
.bot-trade-act.sell { background: rgba(161,61,45,0.15); color: var(--red); }
.bot-trade-act.open-pos { background: var(--bg-elev); color: var(--ink-muted); }

.bot-bar {
  display: flex; gap: 8px;
  padding: 12px 20px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--rule);
  font-size: 11px; color: var(--ink-muted);
  font-family: var(--mono);
  align-items: center;
}
.bot-bar button {
  background: var(--ink); color: var(--bg); border: none;
  padding: 6px 12px; border-radius: 6px;
  font-family: var(--sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.04em; cursor: pointer;
}
.bot-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
.bot-bar .grow { flex: 1; }

.equity-chart {
  margin: 12px 20px; padding: 14px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
}
.equity-chart h4 {
  font-family: var(--display); font-size: 14px; font-weight: 500;
  margin-bottom: 10px;
}
.equity-chart svg { width: 100%; height: 160px; display: block; }

.head-to-head {
  margin: 12px 20px; padding: 16px 18px;
  background: var(--bg-card); border: 1px solid var(--rule);
  border-radius: var(--radius);
}
.head-to-head h4 { font-family: var(--display); font-size: 15px; margin-bottom: 12px; font-weight: 500; }
.h2h-row {
  display: grid; grid-template-columns: 1fr 60px 1fr;
  align-items: center; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--rule-soft);
}
.h2h-row:last-child { border-bottom: none; }
.h2h-side { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.h2h-side.app { text-align: right; color: var(--gold); }
.h2h-side.classic { text-align: left; color: var(--green); }
.h2h-side.winner { font-weight: 700; }
.h2h-side.winner::after { content: " ★"; }
.h2h-label {
  text-align: center; font-size: 9.5px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-muted);
}

.bot-empty {
  margin: 24px 20px; padding: 32px 22px;
  background: var(--bg-card); border: 1px dashed var(--rule);
  border-radius: var(--radius);
  text-align: center;
}
.bot-empty .display { font-family: var(--display); font-size: 22px; display: block; margin-bottom: 8px; }
.bot-empty p { color: var(--ink-muted); font-size: 13px; line-height: 1.5; margin-bottom: 16px; }

/* ===== ETF LEADERBOARD ===== */
.leaderboard-card {
  margin: 12px 20px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
}
.leaderboard-head {
  padding: 14px 18px 10px;
}
.leaderboard-head h3 {
  font-family: var(--display); font-size: 17px; font-weight: 500;
  letter-spacing: -0.01em; margin: 0;
}
.leaderboard-sub {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-muted);
  margin-top: 4px; letter-spacing: 0.02em;
}
.lb-controls {
