function getThemeColors() {
  const css = getComputedStyle(document.documentElement);
  return {
    bg: css.getPropertyValue("--bg-card").trim(),
    text: css.getPropertyValue("--ink").trim(),
    muted: css.getPropertyValue("--ink-muted").trim(),
    rule: css.getPropertyValue("--rule").trim(),
    green: css.getPropertyValue("--green").trim(),
    red:   css.getPropertyValue("--red").trim(),
    accent: css.getPropertyValue("--accent").trim(),
    gold: css.getPropertyValue("--gold").trim(),
  };
}
function renderChart(symbol, range) {
  const price = state.prices[symbol];
  if (!price || !price.ohlcv) return;
  const c = getThemeColors();
  const el = $("#chart");
  if (!el || !window.LightweightCharts) return;
  el.innerHTML = "";
  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: c.bg }, textColor: c.muted, fontFamily: "'IBM Plex Mono', monospace" },
    grid: { vertLines: { color: c.rule, style: 1 }, horzLines: { color: c.rule, style: 1 } },
    crosshair: { mode: 1, vertLine: { color: c.muted, width: 1, style: 2 }, horzLine: { color: c.muted, width: 1, style: 2 } },
    rightPriceScale: { borderColor: c.rule },
    timeScale: { borderColor: c.rule, timeVisible: false, secondsVisible: false },
    handleScroll: true, handleScale: true, height: 280,
  });
  const candle = chart.addCandlestickSeries({
    upColor: c.green, downColor: c.red,
    borderUpColor: c.green, borderDownColor: c.red,
    wickUpColor: c.green, wickDownColor: c.red,
  });
  const now = Date.now();
  const rangeMs = { "1M": 30*864e5, "3M": 90*864e5, "6M": 180*864e5, "1Y": 365*864e5, "ALL": Infinity }[range];
  const filtered = price.ohlcv.filter(d => (now - d.t) <= rangeMs);
  const data = filtered.map(d => ({ time: Math.floor(d.t / 1000), open: d.o, high: d.h, low: d.l, close: d.c }));
  candle.setData(data);
  const closes = filtered.map(d => d.c);
  const times  = filtered.map(d => Math.floor(d.t / 1000));
  function maSeries(period, color) {
    if (closes.length < period) return null;
    const series = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    const out = [];
    for (let i = period - 1; i < closes.length; i++) {
      const slice = closes.slice(i - period + 1, i + 1);
      const avg = slice.reduce((a,b) => a + b, 0) / period;
      out.push({ time: times[i], value: avg });
    }
    series.setData(out);
    return series;
  }
  maSeries(20, c.gold);
  maSeries(50, c.accent);
  maSeries(200, c.muted);
  chart.timeScale().fitContent();
  state.chart = chart;
}
function setRange(r, symbol) {
  state.selectedRange = r;
  try { renderChart(symbol, r); } catch (e) { console.warn(e); }
  $$(".range-btn").forEach(b => b.classList.toggle("active", b.textContent === r));
}

async function loadIndicators(symbol) {
  try {
    const r = await fetch(`${WORKER_URL}/indicators/${encodeURIComponent(symbol)}`);
    const j = await r.json();
    const ind = j.indicators || {};
    const macdCross = ind.macd?.crossover || "none";
    const rsiClass = ind.rsi14 > 70 ? "warn" : ind.rsi14 < 30 ? "warn" : "";
    const trendClass = ind.trend === "above_200ma" ? "pos" : "neg";
    const macdClass = macdCross.startsWith("bullish") ? "pos" : macdCross.startsWith("bearish") ? "neg" : "";
    const strip = $("#indStrip");
    if (!strip) return;
    strip.innerHTML = `
      <div class="ind-cell"><div class="label">RSI 14</div><div class="val ${rsiClass}">${ind.rsi14 ? ind.rsi14.toFixed(1) : '—'}</div></div>
      <div class="ind-cell"><div class="label">MACD</div><div class="val ${macdClass}">${macdCross.replace(/_/g, ' ')}</div></div>
      <div class="ind-cell"><div class="label">Trend</div><div class="val ${trendClass}">${ind.trend === 'above_200ma' ? 'Above 200' : 'Below 200'}</div></div>
      <div class="ind-cell"><div class="label">52W</div><div class="val">${ind.pct_from_52w_high ? ind.pct_from_52w_high.toFixed(1) + '%' : '—'}</div></div>
    `;
  } catch (e) { console.warn("indicators load failed", e); }
}

async function runAnalysis(symbol) {
  const btn = $(`[data-act="run-analysis"][data-symbol="${symbol}"]`);
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Analyzing…'; btn.disabled = true; }
  try {
    const holding = state.holdings.find(h => h.symbol === symbol);
    const idToken = await auth.currentUser.getIdToken();
    const m = portfolioMetrics();
    const portfolioContext = {
      total_value: m.totalValue,
      total_cost: m.totalCost,
      total_pnl_pct: m.totalPnLPct,
      allocation_by_class: m.alloc,
    };
    const r = await fetch(`${WORKER_URL}/analyze`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        uid: state.uid, symbol,
        holding: holding ? { quantity: holding.quantity, avg_cost: holding.avg_cost_unit } : null,
        portfolio_context: portfolioContext,
        idToken,
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    if (j.analysis) {
      state.analyses[symbol] = {
        ...j.analysis, symbol,
        generated_at: new Date().toISOString(),
        current_price: j.current_price,
      };
      toast("Analysis complete");
      renderAssetDetail(symbol);
    } else throw new Error("No analysis returned");
  } catch (e) {
    toast("Analysis failed: " + (e.message || "unknown error").slice(0, 80), 3000, "error");
    if (btn) { btn.innerHTML = "Try Again"; btn.disabled = false; }
  }
}

async function runPortfolioAnalysis() {
  const btn = $('[data-act="run-portfolio-analysis"]');
  if (btn) {
    btn.style.opacity = "0.6";
    btn.style.pointerEvents = "none";
    const lbl = btn.querySelector(".lbl");
    if (lbl) lbl.innerHTML = '<span class="spinner"></span> Analyzing portfolio…';
  }
  try {
    const idToken = await auth.currentUser.getIdToken();
    const m = portfolioMetrics();
    const r = await fetch(`${WORKER_URL}/analyze-portfolio`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        uid: state.uid,
        idToken,
        holdings: state.holdings,
        portfolio_metrics: m,
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    if (j.analysis) {
      state.portfolioAnalysis = { ...j.analysis, generated_at: new Date().toISOString() };
      toast("Portfolio analysis complete");
      renderPortfolio();
    } else throw new Error("No analysis returned");
  } catch (e) {
    toast("Portfolio analysis failed: " + (e.message || "unknown").slice(0, 80), 3000, "error");
    if (btn) {
      btn.style.opacity = "1"; btn.style.pointerEvents = "all";
      const lbl = btn.querySelector(".lbl");
      if (lbl) lbl.textContent = "Run Portfolio Analysis";
    }
  }
}

// ============================================================================
// TRADING BOT SIMULATOR
// ============================================================================
// One active strategy + one benchmark, both running on the same universe
// (watchlist + non-cash holdings):
//
//   1) "app"  — App's signals: enter on RSI<35 AND drop_from_peak < -7%
//                              exit on RSI>65 OR price >= 1.15× entry OR <= 0.92× entry
//   2) "bh"   — Buy & Hold benchmark: equal-weight buy on day 1, never sell.
//
// Why B&H instead of another active strategy: it's the honest baseline.
// If the app's clever entries can't beat just sitting on the same basket,
// the signals are noise. Each starts with $10,000.

const BOT_STARTING_CAPITAL = 10000;
const BOT_POSITION_PCT     = 0.10;
const BOT_MAX_POSITIONS    = 5;
const BOT_STOP_LOSS_PCT    = 0.92;  // -8%
const BOT_TAKE_PROFIT_PCT  = 1.15;  // +15%
const BOT_TX_COST_PCT      = 0.001; // 0.1% per side (buy + sell), realistic friction

function emptyBotState(label) {
  return {
    label,
    cash: BOT_STARTING_CAPITAL,
    positions: {}, // symbol -> { entryDate, entryPrice, qty, entryReason }
    trades: [],    // closed trades [{ symbol, entryDate, exitDate, entryPrice, exitPrice, qty, pnl, pnlPct, reason }]
    equity: [],    // [{ date, value }]
    started_at: new Date().toISOString(),
    last_run_at: null,
  };
}

async function loadBotState() {
  try {
    const doc = await db.collection("users").doc(state.uid).collection("bot").doc("state").get();
    if (!doc.exists) return;
    const data = doc.data();
    // New-shape fields: dip, trend, golden, meanrev, dca, bh
    for (const strat of BOT_STRATEGIES) {
      if (data[strat.key]) state.bot[strat.key] = data[strat.key];
    }
    // Migration from old shape: { app, classic } where classic = B&H
    if (data.app && !state.bot.dip) {
      state.bot.dip = { ...data.app, label: "Dip Buyer" };
    }
    if (data.classic && !state.bot.bh) {
      state.bot.bh = { ...data.classic, label: "Buy & Hold" };
    }
  } catch (e) { console.warn("bot load failed", e); }
}

async function saveBotState() {
  try {
    const payload = { saved_at: firebase.firestore.FieldValue.serverTimestamp() };
    for (const strat of BOT_STRATEGIES) payload[strat.key] = state.bot[strat.key];
    await db.collection("users").doc(state.uid).collection("bot").doc("state").set(payload);
  } catch (e) { console.warn("bot save failed", e); }
}

// Build the trading universe = watchlist symbols + non-cash holdings
function botUniverse() {
  const set = new Set();
  for (const w of state.watchlist) set.add(w.symbol);
  for (const h of state.holdings) if (h.asset_class !== "cash") set.add(h.symbol);
  return Array.from(set);
}

// Strategies expressed as (priceSeriesUpToDay i) → "buy" | "sell" | null
function appSignal(closes, highs, idx, hasPosition, entryPrice, _position, _times) {
  // Slice to just the data up to idx
  const upToIdx = closes.slice(0, idx + 1);
  const rsi = computeRSI(upToIdx, 14);
  if (rsi == null) return null;
  const slice90 = highs.slice(Math.max(0, idx - 89), idx + 1);
  const peak = Math.max(...slice90);
  const cur  = closes[idx];
  const dropFromPeak = peak > 0 ? ((cur - peak) / peak) * 100 : 0;

  if (hasPosition) {
    if (rsi > 65) return { side: "sell", reason: `RSI ${rsi.toFixed(1)} overbought` };
    if (cur >= entryPrice * BOT_TAKE_PROFIT_PCT) return { side: "sell", reason: `+${((cur/entryPrice - 1)*100).toFixed(1)}% take-profit` };
    if (cur <= entryPrice * BOT_STOP_LOSS_PCT)   return { side: "sell", reason: `${((cur/entryPrice - 1)*100).toFixed(1)}% stop-loss` };
    return null;
  }
  if (rsi < 35 && dropFromPeak <= -7) {
    return { side: "buy", reason: `RSI ${rsi.toFixed(1)} + ${dropFromPeak.toFixed(1)}% off peak` };
  }
  return null;
}

// Buy & Hold benchmark: on the first day we see a symbol with no position,
// buy equal-weight (capped to BOT_POSITION_PCT * 2 to avoid over-concentration).
// Never sells. The honest baseline: "what if I just bought the basket?"
function bhSignal(closes, highs, idx, hasPosition, entryPrice, _position, _times) {
  if (hasPosition) return null;
  // Wait until we have at least 30 bars so positions enter at a reasonable starting point
  if (idx < 30) return null;
  return { side: "buy", reason: "Buy & hold (day 1)" };
}

// ----- Trend Follower: enters on 50-day high breakout -----
// Entry: today closes at the highest level of the last 50 sessions AND price > MA50
// Exit:  close drops below MA50, or trailing stop hits -10% from peak since entry
function trendSignal(closes, highs, idx, hasPosition, entryPrice, position, _times) {
  if (idx < 50) return null;
  const cur = closes[idx];
  const ma50 = computeMA(closes.slice(0, idx + 1), 50);
  if (ma50 == null) return null;

  if (hasPosition) {
    if (cur < ma50) return { side: "sell", reason: "Close < MA50" };
    // Trailing stop: track peak since entry stored on position
    const peakSince = position?.peakSinceEntry || entryPrice;
    if (cur <= peakSince * 0.90) return { side: "sell", reason: `-10% trailing from $${peakSince.toFixed(2)}` };
    return null;
  }
  // 50-day breakout: today's close = max of last 50 closes
  const window = closes.slice(idx - 49, idx + 1);
  const winMax = Math.max(...window);
  if (cur >= winMax && cur > ma50) {
    return { side: "buy", reason: `50-day high breakout @$${cur.toFixed(2)}` };
  }
  return null;
}

// ----- Golden Cross (loosened): MA50 > MA200 AND price near MA50 -----
// Original "cross within 3d" version produced 0 trades over 2 years on the
// test universe — too rare to be useful. This version fires whenever the
// uptrend is intact (MA50 > MA200) AND the price has pulled back to within
// 3% of MA50 (a normal support level during uptrends).
// Exit: MA50 < MA200 (death cross) OR -10% stop loss
function goldenCrossSignal(closes, highs, idx, hasPosition, entryPrice, _position, _times) {
  if (idx < 200) return null;
  const cur = closes[idx];
  const upTo = closes.slice(0, idx + 1);
  const ma50  = computeMA(upTo, 50);
  const ma200 = computeMA(upTo, 200);
  if (ma50 == null || ma200 == null) return null;

  if (hasPosition) {
    if (ma50 < ma200) return { side: "sell", reason: "Death cross (MA50 < MA200)" };
    if (cur <= entryPrice * 0.90) return { side: "sell", reason: `-10% stop` };
    return null;
  }
  // Entry: uptrend established + price near MA50 support
  if (ma50 > ma200) {
    const distFromMa50 = Math.abs((cur - ma50) / ma50);
    if (distFromMa50 <= 0.03) {
      return { side: "buy", reason: `Uptrend + ${(distFromMa50 * 100).toFixed(1)}% from MA50` };
    }
  }
  return null;
}

// Bollinger Bands: returns { mid, upper, lower } based on MA20 ± 2σ
function computeBollinger(closes, period = 20, stdMultiplier = 2) {
  if (!closes || closes.length < period) return null;
  const slice = closes.slice(-period);
  const mid = slice.reduce((a, b) => a + b, 0) / period;
  const variance = slice.reduce((sum, x) => sum + (x - mid) ** 2, 0) / period;
  const std = Math.sqrt(variance);
  return { mid, upper: mid + stdMultiplier * std, lower: mid - stdMultiplier * std };
}

// ----- Mean Reversion: Bollinger Bands -----
// Entry: close at or below lower band (MA20 - 2σ)
// Exit:  close at or above MA20, OR -8% stop, OR 10 sessions held (time stop)
function meanReversionSignal(closes, highs, idx, hasPosition, entryPrice, position, _times) {
  if (idx < 20) return null;
  const cur = closes[idx];
  const upTo = closes.slice(0, idx + 1);
  const bb = computeBollinger(upTo);
  if (!bb) return null;

  if (hasPosition) {
    if (cur >= bb.mid) return { side: "sell", reason: `Reverted to MA20 ($${bb.mid.toFixed(2)})` };
    if (cur <= entryPrice * 0.92) return { side: "sell", reason: `-8% stop` };
    // 10-day time stop
    const heldDays = position?.daysHeld || 0;
    if (heldDays >= 10) return { side: "sell", reason: `10-day time stop` };
    return null;
  }
  if (cur <= bb.lower) {
    return { side: "buy", reason: `Below lower BB ($${bb.lower.toFixed(2)})` };
  }
  return null;
}

// ----- DCA: mechanical fixed-amount buys, never sells -----
// Buys $100 of each universe symbol every 14 sessions. Doesn't use this signal fn
// directly — the backtest engine handles it via mode "dca".
function dcaSignal() { return null; }

// ----- App Composite: Trend OR Dip Buyer (whichever fires) -----
// The reasoning: Trend Follower captures bull-market breakouts, Dip Buyer
// captures corrections. Each is in the market only ~25% of the time alone.
// Combined, they should be in the market more often without sacrificing
// signal quality. Exit rules use whichever rule the entry came from
// (we tag the position with which strategy bought it via entryReason).
function compositeSignal(closes, highs, idx, hasPosition, entryPrice, position, times) {
  if (hasPosition) {
    // Use exit logic matching the entry strategy. The entryReason starts
    // with "TREND:" or "DIP:" so we can route accordingly.
    const tag = (position?.entryReason || "").startsWith("TREND:") ? "trend" : "dip";
    const exitFn = tag === "trend" ? trendSignal : appSignal;
    return exitFn(closes, highs, idx, true, entryPrice, position, times);
  }
  // For buy decisions, prefer Trend Follower (it fires on strength,
  // arguably better entry quality). If Trend doesn't fire, try Dip.
  const trendSig = trendSignal(closes, highs, idx, false, null, null, times);
  if (trendSig?.side === "buy") {
    return { side: "buy", reason: "TREND: " + trendSig.reason };
  }
  const dipSig = appSignal(closes, highs, idx, false, null, null, times);
  if (dipSig?.side === "buy") {
    return { side: "buy", reason: "DIP: " + dipSig.reason };
  }
  return null;
}

// Backtest a single strategy over the provided per-symbol OHLCV.
// `mode` controls position sizing: "active" (10% per trade, max 5 concurrent)
// or "bh" (equal-weight across universe, no max).
function backtestStrategy(strategyFn, symbolOhlcv, mode = "active", startCapital = BOT_STARTING_CAPITAL, lookbackDays = 730) {
  const sim = emptyBotState("backtest");
  sim.cash = startCapital;

  const universeSymbols = Object.keys(symbolOhlcv);
  // For B&H: deploy cash equally across all symbols
  const bhSliceUSD = mode === "bh" ? startCapital / Math.max(1, universeSymbols.length) : null;

  // Build a unified date timeline (union of all symbols' dates), trimmed to lookbackDays
  const allDates = new Set();
  for (const sym of universeSymbols) {
    const ohlcv = symbolOhlcv[sym];
    for (const bar of ohlcv) allDates.add(bar.t);
  }
  const sorted = Array.from(allDates).sort((a, b) => a - b);
  const cutoff = Date.now() - lookbackDays * 86400000;
  const dates  = sorted.filter(t => t >= cutoff);

  // Pre-index per-symbol by timestamp for fast lookup
  const indexed = {};
  for (const sym of universeSymbols) {
    indexed[sym] = { byT: {}, closes: [], highs: [], times: [] };
    const ohlcv = symbolOhlcv[sym];
    for (let i = 0; i < ohlcv.length; i++) {
      indexed[sym].byT[ohlcv[i].t] = i;
      indexed[sym].closes.push(ohlcv[i].c);
      indexed[sym].highs.push(ohlcv[i].h);
      indexed[sym].times.push(ohlcv[i].t);
    }
  }

  // For DCA: how many sessions between buys, and per-symbol slice
  const DCA_INTERVAL = 14;       // sessions
  const DCA_PER_SYMBOL = 100;    // USD per symbol per cycle
  let dcaSessionCounter = 0;

  for (const t of dates) {
    let positionsValue = 0;
    dcaSessionCounter++;
    const isDcaDay = (mode === "dca") && (dcaSessionCounter % DCA_INTERVAL === 1);

    for (const sym of universeSymbols) {
      const idx = indexed[sym].byT[t];
      if (idx == null) continue;
      const closes = indexed[sym].closes;
      const highs  = indexed[sym].highs;
      const times  = indexed[sym].times;
      const cur    = closes[idx];
      const hasPos = !!sim.positions[sym];
      const position = hasPos ? sim.positions[sym] : null;
      const entryPrice = hasPos ? position.entryPrice : null;

      // Update per-position tracking before signal evaluation
      if (hasPos) {
        // Peak since entry (for trailing stops)
        if (cur > (position.peakSinceEntry || position.entryPrice)) {
          position.peakSinceEntry = cur;
        }
        // Days held (for time stops) — count actual sessions for this symbol since entry
        const entryIdx = indexed[sym].byT[new Date(position.entryDate).getTime()] ?? position._entryIdx;
        if (entryIdx != null) {
          position._entryIdx = entryIdx;
          position.daysHeld = idx - entryIdx;
        }
      }

      let sig = null;
      if (mode === "dca") {
        // DCA bypasses strategy fn: buy on cadence, never sell
        if (isDcaDay && sim.cash >= DCA_PER_SYMBOL) {
          sig = { side: "buy", reason: `DCA cycle ${Math.ceil(dcaSessionCounter / DCA_INTERVAL)}` };
        }
      } else {
        sig = strategyFn(closes, highs, idx, hasPos, entryPrice, position, times);
      }

      if (sig?.side === "sell" && hasPos) {
        const pos = sim.positions[sym];
        const grossProceeds = pos.qty * cur;
        const txCost = grossProceeds * BOT_TX_COST_PCT;
        const proceeds = grossProceeds - txCost;
        const pnl = proceeds - (pos.qty * pos.entryPrice);
        const pnlPct = ((cur / pos.entryPrice) - 1) * 100;
        sim.cash += proceeds;
        sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        sim.trades.push({
          symbol: sym,
          entryDate: pos.entryDate, exitDate: new Date(t).toISOString().slice(0,10),
          entryPrice: pos.entryPrice, exitPrice: cur,
          qty: pos.qty, pnl, pnlPct,
          entryReason: pos.entryReason, exitReason: sig.reason,
        });
        delete sim.positions[sym];
      } else if (sig?.side === "buy") {
        let sizeUSD;
        if (mode === "bh") {
          if (hasPos) continue;
          sizeUSD = bhSliceUSD;
          if (sim.cash < sizeUSD || sizeUSD < 100) continue;
          const txCost = sizeUSD * BOT_TX_COST_PCT;
          const investAmount = sizeUSD - txCost;
          const qty = investAmount / cur;
          sim.positions[sym] = {
            entryDate: new Date(t).toISOString().slice(0,10),
            entryPrice: cur, qty, entryReason: sig.reason,
            peakSinceEntry: cur, daysHeld: 0, _entryIdx: idx,
          };
          sim.cash -= sizeUSD;
          sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        } else if (mode === "dca") {
          sizeUSD = DCA_PER_SYMBOL;
          if (sim.cash < sizeUSD) continue;
          const txCost = sizeUSD * BOT_TX_COST_PCT;
          const investAmount = sizeUSD - txCost;
          const addQty = investAmount / cur;
          if (hasPos) {
            const pos = sim.positions[sym];
            const newQty = pos.qty + addQty;
            const newCost = (pos.qty * pos.entryPrice) + investAmount;
            pos.qty = newQty;
            pos.entryPrice = newCost / newQty;
          } else {
            sim.positions[sym] = {
              entryDate: new Date(t).toISOString().slice(0,10),
              entryPrice: cur, qty: addQty, entryReason: sig.reason,
              _entryIdx: idx,
            };
          }
          sim.cash -= sizeUSD;
          sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        } else {
          // Active strategies: 10% per trade, max 5 concurrent
          if (hasPos) continue;
          if (Object.keys(sim.positions).length >= BOT_MAX_POSITIONS) continue;
          const equity = sim.cash + positionsValue;
          sizeUSD = equity * BOT_POSITION_PCT;
          if (sim.cash < sizeUSD || sizeUSD < 100) continue;
          const txCost = sizeUSD * BOT_TX_COST_PCT;
          const investAmount = sizeUSD - txCost;
          const qty = investAmount / cur;
          sim.positions[sym] = {
            entryDate: new Date(t).toISOString().slice(0,10),
            entryPrice: cur, qty, entryReason: sig.reason,
            peakSinceEntry: cur, daysHeld: 0, _entryIdx: idx,
          };
          sim.cash -= sizeUSD;
          sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        }
      }

      if (sim.positions[sym]) positionsValue += sim.positions[sym].qty * cur;
    }

    // Equity curve + deployment + drawdown tracking
    let v = 0;
    for (const sym of Object.keys(sim.positions)) {
      const idx = indexed[sym].byT[t];
      const last = idx != null ? indexed[sym].closes[idx] : sim.positions[sym].entryPrice;
      v += sim.positions[sym].qty * last;
    }
    const equity = sim.cash + v;
    const deploymentPct = equity > 0 ? (v / equity) * 100 : 0;
    sim.equity.push({ date: new Date(t).toISOString().slice(0,10), value: equity });
    sim.deploymentSum = (sim.deploymentSum || 0) + deploymentPct;
    sim.deploymentCount = (sim.deploymentCount || 0) + 1;
    // Max drawdown: track running peak, biggest % drop from any peak
    if (equity > (sim.equityPeak || 0)) sim.equityPeak = equity;
    if (sim.equityPeak > 0) {
      const dd = ((equity - sim.equityPeak) / sim.equityPeak) * 100; // negative
      if (dd < (sim.maxDrawdown || 0)) sim.maxDrawdown = dd;
    }
  }

  return sim;
}

// Strategy registry: all six strategies + how to run them.
// `mode` = "active" | "bh" | "dca" — controls sizing in backtestStrategy.
// The order here drives display order in the bot view.
const BOT_STRATEGIES = [
  { key: "dip",       label: "Dip Buyer",       tag: "DIP",     fn: appSignal,           mode: "active", color: "#b08d3c", desc: "RSI<35 + drop from peak" },
  { key: "trend",     label: "Trend Follower",  tag: "TREND",   fn: trendSignal,         mode: "active", color: "#4a7a4a", desc: "50-day high breakout" },
  { key: "composite", label: "App Composite",   tag: "COMP",    fn: compositeSignal,     mode: "active", color: "#c25a3a", desc: "Trend OR Dip — best of both" },
  { key: "golden",    label: "Golden Cross",    tag: "GOLDEN",  fn: goldenCrossSignal,   mode: "active", color: "#a13d2d", desc: "MA50>MA200 + pullback to MA50" },
  { key: "meanrev",   label: "Mean Reversion",  tag: "MEAN",    fn: meanReversionSignal, mode: "active", color: "#7a5cb0", desc: "Lower Bollinger Band" },
  { key: "dca",       label: "Dollar-Cost Avg", tag: "DCA",     fn: dcaSignal,           mode: "dca",    color: "#5c8aa1", desc: "Buy $100 per symbol every 2 weeks" },
  { key: "bh",        label: "Buy & Hold",      tag: "B&H",     fn: bhSignal,            mode: "bh",     color: "#4a4639", desc: "Equal-weight, never sells" },
];

function getStrategy(key) { return BOT_STRATEGIES.find(s => s.key === key); }

async function runBacktest() {
  const universe = botUniverse();
  if (universe.length === 0) {
    toast("No symbols to test (add holdings or watchlist items)", 3000, "error");
    return;
  }
  state.botRunning = true;
  toast(`Backtesting ${universe.length} symbols × ${BOT_STRATEGIES.length} strategies…`, 3000);
  renderBot();

  // Fetch OHLCV for all symbols once, share across strategies
  const symbolOhlcv = {};
  for (const sym of universe) {
    try {
      const data = await getOhlcv(sym);
      if (data?.ohlcv?.length) symbolOhlcv[sym] = data.ohlcv;
    } catch (e) { console.warn("bot ohlcv fetch failed for", sym, e.message || e); }
  }
  if (Object.keys(symbolOhlcv).length === 0) {
    state.botRunning = false;
    toast("Could not fetch any OHLCV data", 3000, "error");
    renderBot();
    return;
  }

  // Run each strategy
  const now = new Date().toISOString();
  for (const strat of BOT_STRATEGIES) {
    const result = backtestStrategy(strat.fn, symbolOhlcv, strat.mode);
    result.label = strat.label;
    result.last_run_at = now;
    state.bot[strat.key] = result;
  }
  await saveBotState();

  // Build a tiny summary toast based on the leaderboard
  const ranked = BOT_STRATEGIES
    .map(s => ({ key: s.key, label: s.label, eq: botMetrics(state.bot[s.key])?.equity || 0 }))
    .sort((a, b) => b.eq - a.eq);
  state.botRunning = false;
  toast(`Backtest done · winner: ${ranked[0].label} ($${fmtUSD(ranked[0].eq, 0)})`, 3500);
  renderBot();
}

async function runForwardStep() {
  // Initialise any missing strategies
  for (const strat of BOT_STRATEGIES) {
    if (!state.bot[strat.key]) state.bot[strat.key] = emptyBotState(strat.label);
  }

  const universe = botUniverse();
  if (universe.length === 0) { toast("Empty universe", 2400, "error"); return; }

  state.botRunning = true;
  renderBot();

  const today = new Date().toISOString().slice(0, 10);
  const tradesAdded = {};

  // Pre-fetch all symbols once
  const symData = {};
  for (const sym of universe) {
    try {
      const data = await getOhlcv(sym);
      if (data?.ohlcv?.length) symData[sym] = data;
    } catch (e) { /* skip */ }
  }

  // DCA cadence: count sessions since this strategy's start, buy every 14
  // We use equity points as a session counter proxy (one push per step)
  const dcaSim = state.bot.dca;
  const isDcaDay = ((dcaSim.equity?.length || 0) % 14 === 0); // every 14 steps including the very first
  const DCA_PER_SYMBOL = 100;

  // B&H slice
  const bhSliceUSD = BOT_STARTING_CAPITAL / universe.length;

  for (const sym of Object.keys(symData)) {
    const data = symData[sym];
    const closes = data.ohlcv.map(d => d.c);
    const highs  = data.ohlcv.map(d => d.h);
    const times  = data.ohlcv.map(d => d.t);
    const idx    = closes.length - 1;
    const cur    = data.current_price ?? closes[idx];

    for (const strat of BOT_STRATEGIES) {
      const sim = state.bot[strat.key];
      const hasPos = !!sim.positions[sym];
      const position = hasPos ? sim.positions[sym] : null;
      const entryPrice = hasPos ? position.entryPrice : null;

      // Update tracking
      if (hasPos) {
        if (cur > (position.peakSinceEntry || position.entryPrice)) position.peakSinceEntry = cur;
        // For forward mode we count each step as 1 day held
        position.daysHeld = (position.daysHeld || 0) + 1;
      }

      // Determine signal
      let sig = null;
      if (strat.mode === "dca") {
        if (isDcaDay && sim.cash >= DCA_PER_SYMBOL) {
          sig = { side: "buy", reason: `DCA cycle ${Math.ceil((sim.equity?.length || 0) / 14) + 1}` };
        }
      } else if (strat.mode === "bh") {
        if (!hasPos && sim.cash >= bhSliceUSD && bhSliceUSD >= 100) {
          sig = { side: "buy", reason: "Buy & hold (initial buy)" };
        }
      } else {
        sig = strat.fn(closes, highs, idx, hasPos, entryPrice, position, times);
      }

      if (!sig) continue;

      if (sig.side === "sell" && hasPos) {
        const grossProceeds = position.qty * cur;
        const txCost = grossProceeds * BOT_TX_COST_PCT;
        const proceeds = grossProceeds - txCost;
        const pnl = proceeds - (position.qty * position.entryPrice);
        const pnlPct = ((cur / position.entryPrice) - 1) * 100;
        sim.cash += proceeds;
        sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        sim.trades.push({
          symbol: sym, entryDate: position.entryDate, exitDate: today,
          entryPrice: position.entryPrice, exitPrice: cur,
          qty: position.qty, pnl, pnlPct,
          entryReason: position.entryReason, exitReason: sig.reason,
        });
        delete sim.positions[sym];
        tradesAdded[strat.key] = (tradesAdded[strat.key] || 0) + 1;
      } else if (sig.side === "buy") {
        let sizeUSD;
        if (strat.mode === "bh") {
          if (hasPos) continue;
          sizeUSD = bhSliceUSD;
        } else if (strat.mode === "dca") {
          sizeUSD = DCA_PER_SYMBOL;
          if (sim.cash < sizeUSD) continue;
          const txCost = sizeUSD * BOT_TX_COST_PCT;
          const investAmount = sizeUSD - txCost;
          if (hasPos) {
            const addQty = investAmount / cur;
            const newQty = position.qty + addQty;
            const newCost = (position.qty * position.entryPrice) + investAmount;
            position.qty = newQty;
            position.entryPrice = newCost / newQty;
          } else {
            const qty = investAmount / cur;
            sim.positions[sym] = { entryDate: today, entryPrice: cur, qty, entryReason: sig.reason };
          }
          sim.cash -= sizeUSD;
          sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
          tradesAdded[strat.key] = (tradesAdded[strat.key] || 0) + 1;
          continue;
        } else {
          // Active strategy: 10% per trade, max 5 concurrent
          if (hasPos) continue;
          if (Object.keys(sim.positions).length >= BOT_MAX_POSITIONS) continue;
          let positionsValue = 0;
          for (const s of Object.keys(sim.positions)) {
            const p2 = state.prices[s]?.current_price || sim.positions[s].entryPrice;
            positionsValue += sim.positions[s].qty * p2;
          }
          const equity = sim.cash + positionsValue;
          sizeUSD = equity * BOT_POSITION_PCT;
          if (sim.cash < sizeUSD || sizeUSD < 100) continue;
        }
        const txCost = sizeUSD * BOT_TX_COST_PCT;
        const investAmount = sizeUSD - txCost;
        const qty = investAmount / cur;
        sim.positions[sym] = {
          entryDate: today, entryPrice: cur, qty, entryReason: sig.reason,
          peakSinceEntry: cur, daysHeld: 0,
        };
        sim.cash -= sizeUSD;
        sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        tradesAdded[strat.key] = (tradesAdded[strat.key] || 0) + 1;
      }
    }
  }

  // Append equity snapshots for every strategy + track deployment + drawdown
  for (const strat of BOT_STRATEGIES) {
    const sim = state.bot[strat.key];
    let positionsValue = 0;
    for (const s of Object.keys(sim.positions)) {
      const p2 = state.prices[s]?.current_price || sim.positions[s].entryPrice;
      positionsValue += sim.positions[s].qty * p2;
    }
    const equity = sim.cash + positionsValue;
    const deploymentPct = equity > 0 ? (positionsValue / equity) * 100 : 0;
    sim.equity.push({ date: today, value: equity });
    sim.deploymentSum = (sim.deploymentSum || 0) + deploymentPct;
    sim.deploymentCount = (sim.deploymentCount || 0) + 1;
    if (equity > (sim.equityPeak || 0)) sim.equityPeak = equity;
    if (sim.equityPeak > 0) {
      const dd = ((equity - sim.equityPeak) / sim.equityPeak) * 100;
      if (dd < (sim.maxDrawdown || 0)) sim.maxDrawdown = dd;
    }
    sim.last_run_at = new Date().toISOString();
  }

  await saveBotState();
  state.botRunning = false;
  const totalActions = Object.values(tradesAdded).reduce((a, b) => a + b, 0);
  toast(totalActions > 0
    ? `Step complete · ${totalActions} actions across ${Object.keys(tradesAdded).length} strategies`
    : "Step complete · no actions today");
  renderBot();
}

function resetBot() {
  if (!confirm("Reset all bot strategies? This wipes every paper-trade and equity history across all six strategies.")) return;
  for (const strat of BOT_STRATEGIES) state.bot[strat.key] = null;
  saveBotState();
  toast("Bot reset");
  renderBot();
}

function botMetrics(sim) {
  if (!sim) return null;
  const trades = sim.trades || [];
  const wins   = trades.filter(t => t.pnl > 0).length;
  const losses = trades.filter(t => t.pnl <= 0).length;
  const winRate = trades.length > 0 ? (wins / trades.length) * 100 : 0;

  let posValue = 0;
  let openCount = 0;
  for (const sym of Object.keys(sim.positions || {})) {
    openCount++;
    const cur = state.prices[sym]?.current_price || sim.positions[sym].entryPrice;
    posValue += sim.positions[sym].qty * cur;
  }
  const equity = sim.cash + posValue;
  const totalReturn = ((equity / BOT_STARTING_CAPITAL) - 1) * 100;
  const realizedPnL = trades.reduce((sum, t) => sum + t.pnl, 0);
  const avgWin   = wins   > 0 ? trades.filter(t => t.pnl > 0).reduce((s, t) => s + t.pnlPct, 0) / wins : 0;
  const avgLoss  = losses > 0 ? trades.filter(t => t.pnl <= 0).reduce((s, t) => s + t.pnlPct, 0) / losses : 0;

  // New metrics: average deployment, max drawdown, transaction cost drag
  const avgDeployment = sim.deploymentCount > 0
    ? sim.deploymentSum / sim.deploymentCount
    : (equity > 0 ? (posValue / equity) * 100 : 0);
  const maxDrawdown = sim.maxDrawdown || 0;
  const totalTxCost = sim.totalTxCost || 0;
  // Drag = how many percentage points of return were eaten by transaction costs
  const txDragPct = (totalTxCost / BOT_STARTING_CAPITAL) * 100;

  return {
    equity, cashLeft: sim.cash, positionsValue: posValue,
    openCount, tradeCount: trades.length, wins, losses, winRate,
    totalReturn, realizedPnL, avgWin, avgLoss,
    avgDeployment, maxDrawdown, totalTxCost, txDragPct,
  };
}

// Multi-strategy equity chart with toggle chips. `visibleKeys` controls which lines render.
function renderEquityChart(visibleKeys) {
  const series = [];
  for (const strat of BOT_STRATEGIES) {
    if (!visibleKeys[strat.key]) continue;
    const sim = state.bot[strat.key];
    if (!sim?.equity?.length) continue;
    series.push({ data: sim.equity, color: strat.color, label: strat.tag, key: strat.key });
  }
  if (series.length === 0) return `<div style="text-align:center;color:var(--ink-muted);font-size:12px;padding:30px;">Toggle strategies above to show their equity lines.</div>`;

  let minV = Infinity, maxV = -Infinity, minT = Infinity, maxT = -Infinity;
  for (const s of series) {
    for (const p of s.data) {
      if (p.value < minV) minV = p.value;
      if (p.value > maxV) maxV = p.value;
      const t = new Date(p.date).getTime();
      if (t < minT) minT = t;
      if (t > maxT) maxT = t;
    }
  }
  // Always include starting capital in the y range so the baseline is visible
  if (BOT_STARTING_CAPITAL < minV) minV = BOT_STARTING_CAPITAL * 0.98;
  if (BOT_STARTING_CAPITAL > maxV) maxV = BOT_STARTING_CAPITAL * 1.02;

  const w = 320, h = 160, pad = 28;
  const xRange = maxT - minT || 1;
  const yRange = (maxV - minV) || 1;
  function xFor(t) { return pad + ((t - minT) / xRange) * (w - pad - 8); }
  function yFor(v) { return h - pad - ((v - minV) / yRange) * (h - pad - 16); }

  const baseY = yFor(BOT_STARTING_CAPITAL);
  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">`;
  svg += `<line x1="${pad}" y1="${baseY}" x2="${w - 8}" y2="${baseY}" stroke="var(--rule)" stroke-dasharray="3,3" stroke-width="1"/>`;
  svg += `<text x="${pad - 4}" y="${baseY - 3}" font-family="monospace" font-size="9" fill="var(--ink-muted)" text-anchor="end">$${BOT_STARTING_CAPITAL.toLocaleString()}</text>`;
  svg += `<text x="${pad - 4}" y="${pad + 4}" font-family="monospace" font-size="9" fill="var(--ink-muted)" text-anchor="end">$${Math.round(maxV).toLocaleString()}</text>`;
  svg += `<text x="${pad - 4}" y="${h - pad}" font-family="monospace" font-size="9" fill="var(--ink-muted)" text-anchor="end">$${Math.round(minV).toLocaleString()}</text>`;
  for (const s of series) {
    const points = s.data.map(p => `${xFor(new Date(p.date).getTime())},${yFor(p.value)}`).join(" ");
    svg += `<polyline points="${points}" stroke="${s.color}" fill="none" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  svg += `</svg>`;
  return svg;
}

function renderChartToggles(visibleKeys) {

    ${BOT_STRATEGIES.filter(s => state.bot[s.key]).map(s => {

        style="font-family:var(--sans);font-size:10px;letter-spacing:0.04em;padding:5px 10px;border-radius:14px;cursor:pointer;
        border:1px solid ${on ? s.color : 'var(--rule)'};

      </button>`;

// Leaderboard: sortable table of all strategies by equity
function renderLeaderboard() {
  const ranked = BOT_STRATEGIES
    .filter(s => state.bot[s.key])
    .map(s => {
      const sim = state.bot[s.key];
      const m = botMetrics(sim);
      return { strat: s, sim, m };
    })
    .sort((a, b) => b.m.equity - a.m.equity);
  if (ranked.length === 0) return "";

  return `
    <div class="head-to-head" style="padding:12px 14px;">
      <h4 style="margin-bottom:8px;">Leaderboard</h4>
      <div style="display:grid;grid-template-columns:18px 1fr 80px 70px;gap:6px 10px;align-items:center;font-family:var(--mono);font-size:11.5px;">
        <div></div>
        <div style="font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);">Strategy</div>
        <div style="font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);text-align:right;">Equity</div>
        <div style="font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);text-align:right;">Return</div>
        ${ranked.map((r, i) => {
          const cls = r.m.totalReturn >= 0 ? "pos" : "neg";
          const isFirst = i === 0;
          return `
            <div style="text-align:center;">${isFirst ? '★' : (i + 1)}</div>
            <div style="display:flex;align-items:center;gap:8px;${isFirst ? 'font-weight:600;' : ''}">
              <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${r.strat.color};"></span>
              ${escAttr(r.strat.label)}
            </div>
            <div style="text-align:right;${isFirst ? 'font-weight:600;' : ''}">$${fmtUSD(r.m.equity, 0)}</div>
            <div style="text-align:right;font-weight:500;" class="${cls}">
              <span class="${cls === 'pos' ? '' : ''}" style="color:var(--${cls === 'pos' ? 'green' : 'red'});">${r.m.totalReturn >= 0 ? "+" : ""}${r.m.totalReturn.toFixed(2)}%</span>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

function renderStrategyCard(stratKey) {
  const strat = getStrategy(stratKey);
  const sim = state.bot[stratKey];
  if (!strat || !sim) return "";

  const m = botMetrics(sim);
  const noClosedTrades = strat.mode === "bh" || strat.mode === "dca";
  const recent = (sim.trades || []).slice(-5).reverse();
  const openPositions = Object.entries(sim.positions || {});

  let tradesHtml = "";
  if (openPositions.length > 0) {
    tradesHtml += openPositions.map(([sym, pos]) => {
      const cur = state.prices[sym]?.current_price || pos.entryPrice;
      const pnlPct = ((cur / pos.entryPrice) - 1) * 100;
      const pnlAbs = (cur - pos.entryPrice) * pos.qty;
      const cls = pnlAbs >= 0 ? "pos" : "neg";
      return `<div class="bot-trade">
        <div class="bot-trade-l">
          <span class="bot-trade-sym"><span class="bot-trade-act open-pos">OPEN</span>${escAttr(sym)}</span>
          <span class="bot-trade-meta">@$${fmtUSD(pos.entryPrice)} · ${escAttr(pos.entryDate)} · ${escAttr(pos.entryReason || "")}</span>
        </div>
        <div class="bot-trade-r">
          <div class="bot-trade-pnl ${cls}">${pnlAbs >= 0 ? "+" : ""}$${fmtUSD(Math.abs(pnlAbs))}</div>
          <div class="bot-trade-meta">${pnlPct >= 0 ? "+" : ""}${pnlPct.toFixed(2)}%</div>
        </div>
      </div>`;
    }).join("");
  }
  if (recent.length > 0) {
    tradesHtml += recent.map(t => {
      const cls = t.pnl >= 0 ? "pos" : "neg";
      return `<div class="bot-trade">
        <div class="bot-trade-l">
          <span class="bot-trade-sym"><span class="bot-trade-act ${t.pnl >= 0 ? "buy" : "sell"}">CLOSED</span>${escAttr(t.symbol)}</span>
          <span class="bot-trade-meta">${escAttr(t.entryDate)} → ${escAttr(t.exitDate)} · ${escAttr(t.exitReason || "")}</span>
        </div>
        <div class="bot-trade-r">
          <div class="bot-trade-pnl ${cls}">${t.pnl >= 0 ? "+" : ""}$${fmtUSD(Math.abs(t.pnl))}</div>
          <div class="bot-trade-meta">${t.pnlPct >= 0 ? "+" : ""}${t.pnlPct.toFixed(2)}%</div>
        </div>
      </div>`;
    }).join("");
  }
  if (!tradesHtml) tradesHtml = `<div class="bot-trade" style="color:var(--ink-muted);justify-content:center;">No positions yet.</div>`;

  const retClass = m.totalReturn >= 0 ? "pos" : "neg";

  const hasNewMetrics = sim.deploymentCount > 0 || sim.equityPeak > 0;
  const ddDisplay = hasNewMetrics ? `${m.maxDrawdown.toFixed(2)}%` : "—";
  const txDisplay = hasNewMetrics ? `−${m.txDragPct.toFixed(2)}%` : "—";
  const deployDisplay = hasNewMetrics ? `${m.avgDeployment.toFixed(0)}%` : "—";

  const metricsBlock = noClosedTrades ? `
      <div class="strat-metrics">
        <div class="strat-metric"><div class="label">Equity</div><div class="val">$${fmtUSD(m.equity, 0)}</div></div>
        <div class="strat-metric"><div class="label">Return</div><div class="val ${retClass}">${m.totalReturn >= 0 ? "+" : ""}${m.totalReturn.toFixed(2)}%</div></div>
        <div class="strat-metric"><div class="label">Holdings</div><div class="val">${m.openCount} pos</div></div>
        <div class="strat-metric"><div class="label">Cash Idle</div><div class="val">$${fmtUSD(m.cashLeft, 0)}</div></div>
        <div class="strat-metric"><div class="label">Max Drawdown</div><div class="val ${hasNewMetrics ? 'neg' : ''}">${ddDisplay}</div></div>
        <div class="strat-metric"><div class="label">Tx Cost Drag</div><div class="val">${txDisplay}</div></div>
      </div>
  ` : `
      <div class="strat-metrics">
        <div class="strat-metric"><div class="label">Equity</div><div class="val">$${fmtUSD(m.equity, 0)}</div></div>
        <div class="strat-metric"><div class="label">Return</div><div class="val ${retClass}">${m.totalReturn >= 0 ? "+" : ""}${m.totalReturn.toFixed(2)}%</div></div>
        <div class="strat-metric"><div class="label">Win Rate</div><div class="val">${m.winRate.toFixed(0)}%</div></div>
        <div class="strat-metric"><div class="label">Avg Deploy</div><div class="val">${deployDisplay}</div></div>
        <div class="strat-metric"><div class="label">Max Drawdown</div><div class="val ${hasNewMetrics ? 'neg' : ''}">${ddDisplay}</div></div>
        <div class="strat-metric"><div class="label">Tx Cost Drag</div><div class="val">${txDisplay}</div></div>
        <div class="strat-metric"><div class="label">Open / Cash</div><div class="val" style="font-size:11.5px;">${m.openCount} pos / $${fmtUSD(m.cashLeft, 0)}</div></div>
        <div class="strat-metric"><div class="label">Avg Win / Loss</div><div class="val" style="font-size:11.5px;">
            <span class="pos">+${m.avgWin.toFixed(1)}%</span> / <span class="neg">${m.avgLoss.toFixed(1)}%</span>
        </div></div>
      </div>
  `;

  const subline = noClosedTrades
    ? `Started ${escAttr((sim.started_at || "").slice(0,10))} · ${escAttr(strat.desc)}`
    : `Started ${escAttr((sim.started_at || "").slice(0,10))} · ${m.tradeCount} trades closed · ${escAttr(strat.desc)}`;

  return `
    <div class="strategy-card">
      <div class="strat-head">
        <div>
          <div class="strat-name">${escAttr(sim.label || strat.label)}</div>
          <div style="font-size:10.5px;color:var(--ink-muted);font-family:var(--mono);">${subline}</div>
        </div>
        <span class="strat-tag" style="background:${strat.color}22;color:${strat.color};border:1px solid ${strat.color};">${strat.tag}</span>
      </div>
      ${metricsBlock}
      <div class="bot-trade-list">${tradesHtml}</div>
    </div>
  `;
}

async function submitTrade(sig, conf) {
  const symbol = $("#lt_symbol").value.trim().toUpperCase();
  const action = $("#lt_action").value;
  const qty    = parseFloat($("#lt_qty").value);
  const price  = parseFloat($("#lt_price").value);
  const reason = $("#lt_reason").value.trim();
  if (!symbol || !qty || !price) { toast("Fill all fields", 2400, "error"); return; }

  // 1) Save journal entry
  await db.collection("users").doc(state.uid).collection("journal").add({
    symbol, action, quantity: qty, price, reason,
    date: new Date().toISOString().slice(0, 10),
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    signal_at_time: sig || null,
    confidence_at_time: conf || null,
  });

  // 2) Sync to portfolio holdings
  try {
    await syncTradeToHoldings(symbol, action, qty, price);
  } catch (e) {
    toast(`Logged but couldn't sync: ${e.message || e}`, 4000, "error");
    closeModal();
    if (state.currentView === "journal") renderJournal();
    return;
  }

  toast(`Trade logged · Portfolio updated`);
  closeModal();
  // Refresh whichever view is open
  await loadHoldingsFromFirestore();
  await refreshAllPrices();
  renderCurrentView();
}

// Apply a logged trade to the user's actual holdings.
// BUY: add to existing position (weighted-avg cost) or create new.
// SELL: subtract qty (delete if zero); warn if insufficient shares.
async function syncTradeToHoldings(symbol, action, qty, price) {
  const holdingsRef = db.collection("users").doc(state.uid).collection("holdings");
  const docId = symbol; // most apps key holdings by symbol; check if your existing holdings use this convention
  // Find existing holding (by symbol — it might not have docId == symbol)
  const existing = state.holdings.find(h => h.symbol === symbol && h.asset_class !== "cash");

  if (action === "buy") {
    if (existing) {
      const oldQty  = existing.quantity || 0;
      const oldCost = existing.avg_cost ?? existing.cost_basis ?? existing.entry_price ?? price;
      const newQty  = oldQty + qty;
      const newCost = ((oldQty * oldCost) + (qty * price)) / newQty;
      await holdingsRef.doc(existing.id).update({
        quantity: newQty,
        avg_cost: newCost,
        last_updated: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } else {
      // Create new holding. Best-guess asset_class from existing data
      const assetClass = guessAssetClass(symbol);
      await holdingsRef.add({
        symbol, quantity: qty, avg_cost: price, asset_class: assetClass,
        added_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
  } else if (action === "sell") {
    if (!existing) {
      throw new Error(`No ${symbol} position to sell from`);
    }
    const oldQty = existing.quantity || 0;
    if (qty > oldQty + 1e-9) {
      throw new Error(`Trying to sell ${qty} ${symbol} but only have ${oldQty}`);
    }
    const newQty = oldQty - qty;
    if (newQty <= 1e-9) {
      // Closed out — delete the holding
      await holdingsRef.doc(existing.id).delete();
    } else {
      // Partial sell — keep avg_cost (cost basis doesn't change on a sale)
      await holdingsRef.doc(existing.id).update({
        quantity: newQty,
        last_updated: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
  }
}

// Heuristic: is this likely crypto, ETF, or stock? Used when creating new holdings.
function guessAssetClass(sym) {
  const knownCrypto = ["BTC", "ETH", "SOL", "ADA", "DOT", "MATIC", "LINK", "AVAX", "DOGE", "XRP", "MSTR"];
  const knownETF    = ["VOO", "QQQ", "SPY", "IWM", "DIA", "VTI", "GLD", "SLV", "TLT", "EIMI", "ISLN", "IGLN", "SWRD", "VEA", "EFA"];
  if (knownCrypto.includes(sym)) return "crypto";
  if (knownETF.includes(sym)) return "etf";
  return "stock";
}

function openAddAlert() {
  const opts = state.holdings.filter(h => h.asset_class !== "cash").map(h => `<option value="${escAttr(h.symbol)}">${escAttr(h.symbol)}</option>`).join("");
  openModal(`
    <div class="modal-head"><h3>New Alert</h3></div>
    <div class="field"><label>Symbol</label><select id="al_symbol">${opts}</select></div>
    <div class="field"><label>Trigger</label>
      <select id="al_type">
        <option value="price_above">Price above</option>
        <option value="price_below">Price below</option>
      </select>
    </div>
    <div class="field"><label>Threshold (USD)</label><input id="al_threshold" type="number" step="any" /></div>
    <button class="btn btn-block" data-act="submit-alert">Create Alert</button>
  `);
}
async function submitAlert() {
  const symbol = $("#al_symbol").value;
  const type   = $("#al_type").value;
  const threshold = parseFloat($("#al_threshold").value);
  if (!symbol || !threshold) { toast("Fill all fields", 2400, "error"); return; }
  await db.collection("users").doc(state.uid).collection("alerts").add({
    symbol, type, threshold, active: true,
    created_at: firebase.firestore.FieldValue.serverTimestamp(),
  });
  toast("Alert created");
  closeModal();
  if (state.currentView === "alerts") renderAlerts();
}

// Open trigger from opportunity card → mark seen, open asset
async function openTrigger(symbol, triggerId) {
  if (triggerId) await markTriggerSeen(triggerId);
  openAsset(symbol, "portfolio");
}

// ============================================================================
// EVENT DELEGATION
// ============================================================================
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-act], [data-view]");
  if (!target) return;

  if (target.dataset.view) {
    setView(target.dataset.view);
    return;
  }

  const act = target.dataset.act;
  const symbol = target.dataset.symbol;

  try {
    switch (act) {
      case "open-asset":             openAsset(symbol); break;
      case "open-asset-from-watch":  openAsset(symbol, "watchlist"); break;
      case "open-watch":             openWatchItem(symbol); break;
      case "back-watch":             backToWatchlist(); break;
      case "back-markets":           backToMarkets(); break;
      case "set-range":              setRange(target.dataset.range, symbol); break;
      case "run-analysis":           runAnalysis(symbol); break;
      case "run-portfolio-analysis": runPortfolioAnalysis(); break;
      case "rescan":                 rescan(); break;
      case "open-trigger":           openTrigger(symbol, target.dataset.triggerId); break;
      case "log-trade":              openLogTrade(symbol); break;
      case "add-holding":            openAddHolding(); break;
      case "submit-add":             submitAddHolding(); break;
      case "edit-holding":           openEditHolding(symbol); break;
      case "submit-edit":            submitEditHolding(symbol); break;
      case "delete-holding":         confirmDeleteHolding(symbol); break;
      case "submit-trade":           submitTrade(target.dataset.sig, target.dataset.conf); break;
      case "add-watch":              openAddWatch(); break;
      case "submit-add-watch":       submitAddWatch(); break;
      case "rm-watch":               removeFromWatch(symbol); break;
      case "add-cond":               openAddCondition(symbol); break;
      case "submit-cond":            submitCondition(symbol); break;
      case "rm-cond":                removeCondition(symbol, target.dataset.cid); break;
      case "add-alert":              openAddAlert(); break;
      case "submit-alert":           submitAlert(); break;
      case "delete-alert":           deleteAlert(target.dataset.id); break;
      case "pick-symbol":
        $("#ah_symbol").value = target.dataset.symbol;
        $("#ah_name").value = target.dataset.name || "";
        $("#ah_search_results").classList.add("hidden");
        break;
      case "pick-aw-symbol":
        $("#aw_symbol").value = target.dataset.symbol;
        $("#aw_name").value = target.dataset.name || "";
        $("#aw_search_results").classList.add("hidden");
        break;
      case "toggle-theme":           toggleTheme(); break;
      case "reset-pin":              resetPin(); break;
      case "manual-refresh":         manualRefresh(); break;
      case "export-data":            exportData(); break;
      case "bot-backtest":           runBacktest(); break;
      case "bot-step":               runForwardStep(); break;
      case "bot-reset":              resetBot(); break;
      case "bot-toggle-line":        toggleBotLine(target.dataset.key); break;
      case "toggle-analysis":        toggleAnalysis(target.dataset.key); break;
    }
  } catch (err) {
    showError("Action failed: " + err.message);
  }
});

$("#themeBtn").addEventListener("click", toggleTheme);
$("#refreshBtn").addEventListener("click", manualRefresh);
$("#modalBg").addEventListener("click", closeModal);

// Show PIN screen after load, with a fallback in case `load` never fires
let _pinShown = false;
function safeShowPin() {
  if (_pinShown) return;
  _pinShown = true;
  try { showPinScreen(); }
  catch (e) { showBootError("Failed to show PIN screen: " + e.message); }
}
window.addEventListener("load", () => { setTimeout(safeShowPin, 600); });
// Fallback: if for any reason the load event hasn't triggered our handler within 3 seconds, force it
setTimeout(safeShowPin, 3000);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
