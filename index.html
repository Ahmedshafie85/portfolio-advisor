<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1814" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Opportunity Tester" />
<title>Portfolio Advisor - Opportunity Tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#f5f1e8;
  --panel:#fbf8f0;
  --elev:#ede7d6;
  --ink:#1a1814;
  --soft:#4a4639;
  --muted:#8a8473;
  --rule:#d8d2bf;
  --rule-soft:#e8e2cf;
  --green:#4a7a4a;
  --red:#a13d2d;
  --gold:#b08d3c;
  --blue:#4f6f9f;
  --display:"Fraunces", Georgia, serif;
  --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", "SF Mono", Menlo, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; }
body { min-height:100vh; min-height:100dvh; overflow:hidden; }
button, input, select { font:inherit; }
button { cursor:pointer; }
.hidden { display:none !important; }
.loader {
  position:fixed; inset:0; display:grid; place-items:center; z-index:99;
  background:var(--bg); color:var(--ink);
}
.loader-inner { width:min(320px, 82vw); text-align:center; }
.loader-title { font-family:var(--display); font-size:30px; letter-spacing:-.02em; margin-bottom:16px; }
.loader-bar { height:3px; border-radius:999px; background:var(--rule); overflow:hidden; }
.loader-bar:before { content:""; display:block; height:100%; width:46%; background:var(--ink); border-radius:999px; animation:load 1.2s ease-in-out infinite; }
@keyframes load { 0%{ transform:translateX(-110%);} 100%{ transform:translateX(230%);} }
.app { height:100vh; height:100dvh; display:flex; flex-direction:column; }
.topbar {
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px 14px; border-bottom:1px solid var(--rule); background:rgba(245,241,232,.92);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.top-title { font-family:var(--display); font-size:28px; font-weight:500; letter-spacing:-.02em; line-height:1.05; }
.top-meta { margin-top:4px; color:var(--muted); font-family:var(--mono); font-size:11px; letter-spacing:.04em; }
.icon-btn {
  width:38px; height:38px; border:0; border-radius:50%; background:transparent; color:var(--soft);
  display:grid; place-items:center;
}
.icon-btn:hover { background:var(--elev); color:var(--ink); }
.icon-btn svg { width:21px; height:21px; stroke-width:1.8; }
.view { flex:1; overflow:auto; padding:20px 20px 100px; -webkit-overflow-scrolling:touch; }
.tabs {
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(3,1fr);
  background:rgba(245,241,232,.94); border-top:1px solid var(--rule);
  padding:7px 8px calc(8px + env(safe-area-inset-bottom)); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.tab {
  min-height:66px; border:0; border-radius:10px; background:transparent; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  font-size:12px; font-weight:600; letter-spacing:.03em;
}
.tab svg { width:22px; height:22px; stroke-width:1.7; }
.tab.active { color:var(--ink); box-shadow:inset 0 0 0 2px #0b6fdb; }
.section-title { font-family:var(--display); font-size:28px; font-weight:500; letter-spacing:-.02em; margin-bottom:14px; }
.card {
  background:var(--panel); border:1px solid var(--rule); border-radius:12px; box-shadow:0 14px 35px -28px rgba(26,24,20,.35);
  padding:18px; margin-bottom:18px;
}
.card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:12px; }
.card h3 { font-family:var(--display); font-size:22px; font-weight:500; letter-spacing:-.01em; }
.muted { color:var(--muted); }
.mono { font-family:var(--mono); }
.btn, .btn-secondary, .btn-ghost {
  border-radius:999px; border:1px solid var(--ink); padding:8px 13px; min-height:36px;
  font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
}
.btn { background:var(--ink); color:var(--bg); }
.btn-secondary { background:transparent; color:var(--ink); border-color:var(--rule); }
.btn-ghost { background:transparent; color:var(--soft); border-color:var(--rule); padding:6px 10px; min-height:30px; }
.btn:disabled, .btn-secondary:disabled, .btn-ghost:disabled { opacity:.55; cursor:default; }
.pill-row { display:flex; flex-wrap:wrap; gap:7px; margin:12px 0; }
.pill {
  border:1px solid var(--rule); background:transparent; color:var(--soft); border-radius:999px;
  padding:7px 11px; font-size:12px; font-weight:600;
}
.pill.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.toolbar { display:grid; grid-template-columns:minmax(180px,1fr) repeat(3, minmax(110px,150px)); gap:8px; margin:12px 0; }
.toolbar input, .toolbar select, .setting-input {
  min-height:38px; border:1px solid var(--rule); border-radius:10px; background:rgba(255,255,255,.35);
  color:var(--ink); padding:8px 10px; outline:none;
}
.desk-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:12px 0; }
.desk-cell { border:1px solid var(--rule-soft); background:var(--elev); border-radius:10px; padding:10px; }
.desk-k { display:block; color:var(--muted); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; }
.desk-v { display:block; margin-top:5px; font-family:var(--mono); font-size:20px; font-weight:600; }
.radar-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:12px 0; }
.radar-card { border:1px solid var(--rule-soft); border-radius:10px; background:rgba(255,255,255,.28); padding:10px; min-width:0; }
.radar-card.ready { border-color:rgba(74,122,74,.35); background:rgba(74,122,74,.07); }
.radar-card.building, .radar-card.pullback, .radar-card.breakout, .radar-card.armed, .radar-card.data_limited { border-color:rgba(176,141,60,.35); background:rgba(176,141,60,.07); }
.radar-card.avoid, .radar-card.rejected { border-color:rgba(161,61,45,.28); background:rgba(161,61,45,.06); }
.radar-k { display:block; font-family:var(--mono); color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
.radar-v { display:block; font-family:var(--mono); font-size:22px; font-weight:700; margin-top:4px; }
.radar-syms { color:var(--soft); font-size:11px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sector-strip { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
.sector-card { border:1px solid var(--rule-soft); border-radius:10px; padding:8px 10px; background:rgba(255,255,255,.28); min-width:122px; }
.sector-name { display:block; font-weight:700; font-size:12px; color:var(--ink); }
.sector-meta { display:block; font-family:var(--mono); color:var(--muted); font-size:10px; margin-top:2px; }
.watch-list { display:grid; gap:8px; margin-top:10px; }
.watch-row { display:grid; grid-template-columns:90px minmax(0,1fr) auto; gap:10px; align-items:center; border:1px solid var(--rule-soft); border-radius:10px; padding:9px; background:rgba(255,255,255,.25); }
.watch-sym { font-family:var(--mono); font-weight:700; }
.watch-text { color:var(--soft); font-size:12px; }
.setup-chip { color:var(--blue); border-color:rgba(79,111,159,.35); background:rgba(79,111,159,.08); }
.score-legend { color:var(--muted); font-size:12px; margin:8px 0 12px; }
.scan-note, .empty {
  border:1px solid var(--rule-soft); background:rgba(255,255,255,.32); border-radius:10px;
  padding:12px; color:var(--soft); font-size:13px; margin:12px 0;
}
.scan-warning { border-color:rgba(161,61,45,.45) !important; background:rgba(161,61,45,.08) !important; }
.loading-row { display:flex; align-items:center; gap:10px; color:var(--soft); padding:18px 2px; }
.spinner { width:16px; height:16px; border-radius:50%; border:2px solid var(--rule); border-top-color:var(--ink); animation:spin .8s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
.opp-list { display:grid; gap:11px; margin-top:12px; }
.opp-row {
  display:grid; grid-template-columns:42px minmax(0,1fr); gap:12px; padding:14px;
  border:1px solid var(--rule-soft); border-radius:12px; background:rgba(255,255,255,.28);
}
.rank { font-family:var(--mono); color:var(--muted); font-size:13px; padding-top:3px; }
.sym-row { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
.sym {
  font-family:var(--mono); font-weight:700; font-size:18px; letter-spacing:-.02em;
  border:0; background:transparent; color:var(--ink); padding:0; cursor:pointer;
}
.sym:hover { text-decoration:underline; text-underline-offset:3px; }
.score, .badge {
  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em;
  border-radius:999px; padding:4px 7px; border:1px solid var(--rule); color:var(--soft);
}
.score.strong { color:var(--green); border-color:rgba(74,122,74,.4); background:rgba(74,122,74,.08); }
.score.good { color:var(--gold); border-color:rgba(176,141,60,.45); background:rgba(176,141,60,.08); }
.score.early { color:var(--blue); border-color:rgba(79,111,159,.35); background:rgba(79,111,159,.08); }
.score.weak { color:var(--muted); }
.badge.pass { color:var(--green); border-color:rgba(74,122,74,.45); background:rgba(74,122,74,.08); }
.badge.workup { color:var(--gold); border-color:rgba(176,141,60,.45); background:rgba(176,141,60,.08); }
.badge.reject { color:var(--red); border-color:rgba(161,61,45,.35); background:rgba(161,61,45,.08); }
.name { color:var(--soft); margin-top:2px; font-size:13px; }
.meta-row, .tag-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.meta {
  font-family:var(--mono); font-size:10.5px; color:var(--soft); border:1px solid var(--rule-soft);
  background:rgba(245,241,232,.7); border-radius:999px; padding:4px 7px;
}
.meta.good { color:var(--green); }
.meta.warn { color:var(--gold); }
.meta.bad { color:var(--red); }
.tag { font-size:11px; color:var(--muted); background:var(--elev); border-radius:999px; padding:4px 7px; }
.detail-card { margin-top:12px; border:1px solid var(--rule-soft); border-radius:12px; background:rgba(255,255,255,.25); padding:12px; }
.detail-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:10px; }
.detail-title { font-family:var(--display); font-size:20px; font-weight:500; letter-spacing:-.01em; }
.detail-sub { color:var(--soft); font-size:13px; margin-top:2px; }
.detail-section { margin-top:11px; }
.quick-line { color:var(--soft); font-size:13px; margin-top:9px; }
.reason-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px; }
.reason-box { border:1px solid var(--rule-soft); border-radius:10px; padding:9px; background:rgba(255,255,255,.28); }
.reason-k { display:block; font-family:var(--mono); color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
.reason-v { color:var(--soft); font-size:13px; }
.bars { display:grid; gap:5px; margin-top:10px; max-width:420px; }
.bar-row { display:grid; grid-template-columns:40px minmax(0,1fr) 30px; gap:8px; align-items:center; font-family:var(--mono); font-size:10px; color:var(--muted); }
.bar-track { height:5px; border-radius:999px; background:var(--rule-soft); overflow:hidden; }
.bar-fill { display:block; height:100%; border-radius:999px; background:var(--green); }
.trade-plan { margin-top:12px; border:1px solid var(--rule-soft); border-radius:12px; background:rgba(255,255,255,.26); overflow:hidden; }
.trade-plan-head { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 11px; border-bottom:1px solid var(--rule-soft); }
.trade-plan-title { font-family:var(--mono); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.trade-plan-note { color:var(--muted); font-size:12px; }
.paper-plan { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:0; }
.paper-cell { border-right:1px solid var(--rule-soft); padding:10px; min-width:0; }
.paper-cell:last-child { border-right:0; }
.paper-cell.good { background:rgba(74,122,74,.07); }
.paper-cell.warn { background:rgba(176,141,60,.08); }
.paper-cell.bad { background:rgba(161,61,45,.07); }
.paper-k { display:block; font-family:var(--mono); color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
.paper-v { display:block; margin-top:3px; font-family:var(--mono); color:var(--ink); font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.paper-sub { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
.level-chart { margin-top:10px; border:1px solid var(--rule-soft); border-radius:12px; background:rgba(255,255,255,.25); padding:10px; }
.level-chart svg { width:100%; height:178px; display:block; overflow:visible; }
.chart-grid { stroke:var(--rule-soft); stroke-width:1; }
.chart-line { fill:none; stroke:var(--blue); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.chart-level { stroke-width:1.5; stroke-dasharray:5 4; }
.chart-level.entry { stroke:var(--blue); }
.chart-level.target { stroke:var(--green); }
.chart-level.stop { stroke:var(--red); }
.chart-label { fill:var(--muted); font:10px var(--mono); }
.chart-caption { display:flex; flex-wrap:wrap; gap:7px; margin-top:7px; color:var(--muted); font-size:11px; }
.chart-dot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:4px; }
.chart-page { display:grid; gap:14px; }
.chart-shell { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(280px,.75fr); gap:14px; align-items:start; }
.chart-toolbar { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.timeframes { display:flex; gap:6px; flex-wrap:wrap; }
.tf-btn {
  border:1px solid var(--rule); border-radius:999px; background:transparent; color:var(--soft);
  padding:7px 10px; font-family:var(--mono); font-size:11px; font-weight:700;
}
.tf-btn.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.pro-chart { border:1px solid var(--rule-soft); border-radius:12px; background:rgba(255,255,255,.3); padding:12px; }
.pro-chart svg { width:100%; height:auto; display:block; overflow:visible; }
.candle-up { fill:rgba(74,122,74,.78); stroke:var(--green); }
.candle-down { fill:rgba(161,61,45,.72); stroke:var(--red); }
.wick-up { stroke:var(--green); }
.wick-down { stroke:var(--red); }
.ma20 { fill:none; stroke:var(--gold); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.ma50 { fill:none; stroke:var(--blue); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.vol-up { fill:rgba(74,122,74,.25); }
.vol-down { fill:rgba(161,61,45,.22); }
.axis-label { fill:var(--muted); font:10px var(--mono); }
.chart-panel { display:grid; gap:10px; }
.panel-block { border:1px solid var(--rule-soft); border-radius:12px; background:rgba(255,255,255,.28); padding:12px; }
.panel-block h4 { font-family:var(--display); font-size:18px; font-weight:500; margin-bottom:7px; }
.back-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.chart-lib-box { border:1px solid var(--rule-soft); border-radius:12px; background:rgba(255,255,255,.3); padding:12px; min-height:540px; }
.tv-chart { width:100%; height:500px; }
.quality-breakdown { display:grid; gap:7px; }
.quality-row { display:grid; grid-template-columns:120px minmax(0,1fr) 44px; gap:8px; align-items:center; font-family:var(--mono); font-size:11px; color:var(--muted); }
.lab-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:12px 0; }
.lab-cell { border:1px solid var(--rule-soft); border-radius:12px; background:rgba(255,255,255,.28); padding:12px; }
.lab-title { font-family:var(--mono); color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.07em; }
.lab-value { font-family:var(--display); font-size:30px; line-height:1; margin-top:6px; }
.missed-row { display:grid; grid-template-columns:90px minmax(0,1fr) auto; gap:10px; align-items:center; border:1px solid var(--rule-soft); border-radius:10px; padding:9px; background:rgba(255,255,255,.25); margin-top:8px; }
.read { margin-top:11px; padding:11px; border-left:3px solid var(--gold); background:rgba(176,141,60,.07); border-radius:8px; }
.read-one { font-weight:600; color:var(--ink); }
.read-setup { color:var(--soft); font-size:13px; margin-top:4px; }
.read-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px 10px; color:var(--soft); font-size:12px; margin-top:8px; }
.row-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.quality-grid, .perf-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.quality-cell, .perf-cell { border:1px solid var(--rule-soft); border-radius:10px; padding:12px; background:var(--elev); }
.q-k, .p-k { display:block; color:var(--muted); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; }
.q-v, .p-v { display:block; margin-top:6px; font-family:var(--mono); font-size:20px; font-weight:600; }
.good-text { color:var(--green); }
.bad-text { color:var(--red); }
.issue { border:1px solid var(--rule-soft); border-radius:9px; padding:10px 12px; margin-top:8px; color:var(--soft); background:rgba(255,255,255,.3); }
.trade-list { display:grid; gap:10px; }
.trade-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; border:1px solid var(--rule-soft); border-radius:12px; padding:13px; background:rgba(255,255,255,.3); }
.trade-head { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.dir { color:var(--green); font-family:var(--mono); font-weight:700; font-size:12px; text-transform:uppercase; }
.trade-sym { font-family:var(--mono); font-weight:700; }
.paper-badge { font-family:var(--mono); font-size:10px; text-transform:uppercase; padding:3px 7px; border-radius:999px; background:var(--elev); color:var(--muted); }
.qty { color:var(--soft); font-family:var(--mono); font-size:12px; }
.why { margin-top:8px; color:var(--soft); font-size:13px; font-style:italic; }
.trade-meta { margin-top:8px; color:var(--muted); font-family:var(--mono); font-size:12px; }
.outcome { align-self:start; font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; border-radius:999px; padding:6px 9px; border:1px solid var(--rule); color:var(--muted); }
.outcome.successful { color:var(--green); border-color:rgba(74,122,74,.42); background:rgba(74,122,74,.08); }
.outcome.failed { color:var(--red); border-color:rgba(161,61,45,.35); background:rgba(161,61,45,.08); }
.outcome.ambiguous { color:var(--gold); border-color:rgba(176,141,60,.42); background:rgba(176,141,60,.08); }
.trade-right { display:flex; align-items:flex-start; gap:8px; }
.perf-headline { display:flex; justify-content:space-between; gap:20px; align-items:flex-end; border:1px solid var(--rule-soft); border-radius:12px; padding:18px; background:rgba(255,255,255,.28); }
.expect { font-family:var(--display); font-size:40px; line-height:1; letter-spacing:-.03em; }
.expect-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
.perf-side { display:flex; gap:18px; text-align:right; }
.mini-stat-v { display:block; font-family:var(--mono); font-size:18px; font-weight:600; }
.mini-stat-l { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
.breakdown { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
.table th, .table td { border-bottom:1px solid var(--rule-soft); padding:8px 6px; text-align:right; }
.table th:first-child, .table td:first-child { text-align:left; }

function relTime(iso) {

  const d = new Date(iso);
  const s = (Date.now() - d.getTime()) / 1000;
  if (!Number.isFinite(s)) return "-";
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;

function combinedScanSortValue(row) {
  const gate = msInvestmentGate(row);
  const paperBonus = msPaperTestPlan(row, gate).ok ? 25 : 0;
  const softPenalty = row?._soft ? 8 : 0;
  return (msPrimaryScore(row) * 2) + gate.score + (msActionabilityScore(row) * 0.5) + paperBonus - softPenalty;

async function apiErrorMessage(response, label) {

  try {
    const j = await response.clone().json();
    detail = j?.message || j?.error || j?.reason || "";
  } catch {
    try { detail = await response.clone().text(); } catch {}
  }
  detail = String(detail || "").replace(/\s+/g, " ").slice(0, 180);
  return detail ? `${label} ${response.status}: ${detail}` : `${label} ${response.status}`;
}

function normalizeScanContract(scan = {}) {
  const errors = Array.isArray(scan.errors) ? scan.errors : Array.isArray(scan.batch_errors) ? scan.batch_errors : [];
  const diag = scan.scan_diagnostics || {};
  const eligible = Number(diag.universe_eligible_count ?? scan.universe_size ?? scan.universe?.filtered_count ?? 0) || 0;
  const attempted = Number(diag.attempted_count ?? scan.attempted_count ?? eligible) || 0;
  const completion = Number(diag.completion_pct ?? (eligible ? attempted / eligible * 100 : 0));
  const normalized = {
    ...scan,
    errors,
    batch_errors: errors,
    error_count: errors.length,
    scan_diagnostics: {
      universe_raw_count:Number(diag.universe_raw_count ?? scan.universe?.raw_count ?? eligible) || 0,
      universe_eligible_count:eligible,
      attempted_count:attempted,
      scored_count:Number(diag.scored_count ?? scan.scored_count ?? 0) || 0,
      failed_count:Number(diag.failed_count ?? errors.length) || 0,
      completion_pct:Number.isFinite(completion) ? Number(completion.toFixed(1)) : 0,
      coverage_target_pct:Number(diag.coverage_target_pct ?? 95) || 95,
      coverage_ok:diag.coverage_ok === true || completion >= Number(diag.coverage_target_pct ?? 95),
      returned_count:Number(diag.returned_count ?? scan.results?.length ?? 0) || 0,
      cache_hit_count:Number(diag.cache_hit_count ?? 0) || 0,
      live_fetch_count:Number(diag.live_fetch_count ?? 0) || 0,
      duration_ms:Number(diag.duration_ms ?? 0) || 0,
      market_session:String(diag.market_session || scan.market_session || "-"),
      data_as_of_utc:diag.data_as_of_utc || scan.generated_at || null,
      errors_by_type:diag.errors_by_type || {},
      scan_status:diag.scan_status || scan.scan_status || (completion < 90 ? "SCAN_INCOMPLETE" : "COMPLETE"),
      served_from_cache:diag.served_from_cache === true || scan._served === "cache" || scan._cached === true,
      universe_source:diag.universe_source || scan.universe_source || scan.universe?.source || "",
      full_market:diag.full_market === true || scan.universe?.full_market === true,
    },
  };
  normalized.scan_status = normalized.scan_diagnostics.scan_status;
  return normalized;
}
function mergeMarketScanUpdate(scan) {
  scan = normalizeScanContract(scan);
  if (!scan) return;
  const current = state.marketScan || { results:[], reads:[] };
  const bySymbol = new Map((current.results || []).map(r => [String(r.symbol || "").toUpperCase(), r]));
  for (const row of (scan.results || [])) {
    const sym = String(row.symbol || "").toUpperCase();
    if (!sym) continue;
    bySymbol.set(sym, { ...(bySymbol.get(sym) || {}), ...row });
  }
  const reads = new Map((current.reads || []).map(r => [String(r.symbol || "").toUpperCase(), r]));
  for (const rd of (scan.reads || [])) {
    const sym = String(rd.symbol || "").toUpperCase();
    if (sym) reads.set(sym, rd);
  }
  const results = Array.from(bySymbol.values())
    .sort((a, b) => combinedScanSortValue(b) - combinedScanSortValue(a))
    .map((r, i) => ({ ...r, rank:i + 1 }));
  state.marketScan = {
    ...current,
    results,
    reads:Array.from(reads.values()),
    ai_read_count:reads.size,
    llm_error:scan.llm_error || current.llm_error || null,
    errors:scan.errors || current.errors || [],
    batch_errors:scan.batch_errors || current.batch_errors || [],
    scan_diagnostics:scan.scan_diagnostics || current.scan_diagnostics || null,
    scan_status:scan.scan_status || current.scan_status || null,
    scan_note:scan.scan_note || current.scan_note || "",
    generated_at:scan.generated_at || current.generated_at || new Date().toISOString(),
  };
  state.marketScanRanAt = state.marketScan.generated_at;
}
async function runSingleSymbolRead(symbol, { silent = false } = {}) {

  renderCurrentView();
  try {
    const scan = await fetchMarketScan({
      symbols:[sym],
      exclude_symbols:[],
      max_universe:1,
      min_composite:0,
      force:true,
      write_reads:true,
      _patient:true,
    });
    mergeMarketScanUpdate(scan);
    const readCount = (scan.reads || []).length;
    if (!silent) toast(readCount ? `AI read loaded for ${sym}` : `No AI read returned for ${sym}`, readCount ? "" : "error");
  } finally {
    state.aiReadLoading[sym] = false;
    renderCurrentView();

    const rr = num(pb.net_reward_risk ?? row.net_reward_risk ?? row.reward_risk);

    const status = plan.ok
      ? (msPrimaryScore(row) >= 75 ? "Auto-paper eligible" : "Paper-ready, not prime")

function renderOpportunityChart(row, preview) {
  const history = chartHistoryFor(row.symbol);
  const values = history.concat([preview.entry, preview.target, preview.stop].filter(v => v != null && v > 0));
  if (!values.length) return "";
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (!(max > min)) { max += 1; min -= 1; }
  const pad = (max - min) * 0.12;
  min -= pad;
  max += pad;
  const w = 640, h = 150, left = 56, right = 74, top = 10, bottom = 24;
  const iw = w - left - right, ih = h - top - bottom;
  const y = v => top + (max - v) / (max - min) * ih;
  const x = i => left + (history.length <= 1 ? iw / 2 : i / (history.length - 1) * iw);
  const line = history.length > 1
    ? `<polyline class="chart-line" points="${history.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" />`
    : "";
  const levels = [
    ["target", "TP", preview.target],
    ["entry", "Entry", preview.entry],
    ["stop", "SL", preview.stop],
  ].filter(x => x[2] != null && x[2] > 0).map(([cls, label, value]) => {
    const yy = y(value).toFixed(1);
    return `<line class="chart-level ${cls}" x1="${left}" y1="${yy}" x2="${w - right}" y2="${yy}" /><text class="chart-label" x="${w - right + 8}" y="${Number(yy) + 3}">${esc(label)} ${esc(fmtUSD(value, 2))}</text>`;
  }).join("");
  return `<div class="level-chart">
    <svg viewBox="0 0 ${w} ${h}" aria-label="${esc(row.symbol)} price chart with entry take profit and stop loss">
      <line class="chart-grid" x1="${left}" y1="${top}" x2="${left}" y2="${h - bottom}" />
      <line class="chart-grid" x1="${left}" y1="${h - bottom}" x2="${w - right}" y2="${h - bottom}" />
      ${line}
      ${levels}
    </svg>

      <span><span class="chart-dot" style="background:var(--red)"></span>stop loss</span>
    </div>
  </div>`;
}

  const invalidPlans = list.filter(t => t.is_paper === true && !tradePlanStatus(t).ok).length;
  const closed = list.filter(tradeIsClosed).length;
  const withSetup = list.filter(tradeHasSetup).length;
  const moves = list.filter(tradeIsClosed).map(t => Number(t.pnl_pct)).filter(Number.isFinite);
  const avgMove = moves.length ? moves.reduce((a, b) => a + b, 0) / moves.length : null;
  const issues = [];
  if (!total) issues.push("No trades logged yet.");
  if (total - withSetup > 0) issues.push(`${total - withSetup} trade${total - withSetup === 1 ? "" : "s"} missing setup context. Use Full sweep so prime rows are auto-logged with setup data.`);
  if (!paper) issues.push("No paper trades yet.");
  if (invalidPlans) issues.push(`${invalidPlans} paper trade${invalidPlans === 1 ? "" : "s"} excluded because target/stop does not match direction.`);
  if (closed < 5) issues.push("Fewer than 5 closed outcomes. Treat performance as early and noisy.");
  if (!issues.length) issues.push("Journal quality is usable.");
  return `<section class="card">
    <div class="card-head"><h3>Journal Quality</h3></div>
    <div class="quality-grid">
      ${qualityCell("Logged", total)}
      ${qualityCell("Paper / Real", `${paper} / ${total - paper}`)}
      ${qualityCell("With Setup", total ? Math.round(withSetup / total * 100) + "%" : "0%")}
      ${qualityCell("Closed", closed)}
      ${qualityCell("Avg Move", avgMove == null ? "-" : fmtPct(avgMove, 1), avgMove)}
    </div>
    ${issues.map(x => `<div class="issue">${esc(x)}</div>`).join("")}
  </section>`;
}
function qualityCell(k, v, tone = null) {
  const cls = tone == null ? "" : tone >= 0 ? "good-text" : "bad-text";
  return `<div class="quality-cell"><span class="q-k">${esc(k)}</span><span class="q-v ${cls}">${esc(v)}</span></div>`;
}
function renderTradeRows(trades) {
  if (!trades.length) return `<div class="empty">No trades logged yet. Run Full sweep; prime paper-ready opportunities are logged automatically.</div>`;
  return trades.map(t => {
    const [label, cls, title] = tradeOutcome(t);
    const setup = t.scanner_snapshot?.read?.one_liner || t.analysis_snapshot?.headline || "No setup snapshot captured.";
    const snap = t.scanner_snapshot || {};
    const analysis = t.analysis_snapshot || {};
    const plan = [
      snap.entry != null || analysis.entry_price != null ? `entry ${fmtUSD(snap.entry ?? analysis.entry_price, 2)}` : "",
      snap.target != null || analysis.take_profit != null ? `take profit ${fmtUSD(snap.target ?? analysis.take_profit, 2)}` : analysis.action_price_zone ? `take profit ${analysis.action_price_zone}` : "",
      snap.stop != null || analysis.stop_loss != null ? `stop loss ${fmtUSD(snap.stop ?? analysis.stop_loss, 2)}` : analysis.action_invalidation ? `stop loss ${analysis.action_invalidation}` : "",
      analysis.action_timeframe || "",
    ].filter(Boolean).join(" - ");
    const closedMeta = tradeIsClosed(t) ? ` - ${t.exit_reason || title}${Number.isFinite(Number(t.pnl_pct)) ? ` - ${fmtPct(Number(t.pnl_pct), 2)}` : ""}` : "";
    return `<article class="trade-row">
      <div>
        <div class="trade-head">
          <span class="dir">${esc(t.direction || "buy")}</span>
          <span class="trade-sym">${esc(t.symbol)}</span>
          ${t.is_paper ? `<span class="paper-badge">paper</span>` : ""}
          <span class="qty">${Number(t.quantity || 0).toLocaleString("en-US", { maximumFractionDigits:4 })} @ ${fmtUSD(t.price, 2)}</span>
        </div>
        <div class="why">${esc(setup)}${plan ? ` - ${esc(plan)}` : ""}</div>
        <div class="trade-meta">${esc(fmtDate(t.trade_date || t.created_at))}${t.notes ? ` - ${esc(t.notes)}` : ""}${esc(closedMeta)}</div>
      </div>
      <div class="trade-right">
        <span class="outcome ${cls}" title="${esc(title)}">${esc(label)}</span>
        <button class="btn-ghost" data-act="delete-trade" data-trade-id="${esc(t.id || t.trade_id)}">x</button>
      </div>
    </article>`;
  }).join("");
}
function computePaperPerformance(trades) {
  const paper = (trades || []).filter(t => t.is_paper === true);
  const events = localJson(PAPER_EVENT_LEDGER_KEY, []);
  const resolvedEvents = events.filter(e => ["closed_target", "closed_stop", "closed_timeout", "ambiguous_same_bar"].includes(String(e.simulation_status || "")));
  const eventTime = e => new Date(e.exit_timestamp || e.fill_timestamp || e.trigger_timestamp || e.scan_timestamp || 0).getTime() || 0;
  const dedupeContinuingSetups = rows => {
    const map = new Map();
    for (const e of rows || []) {
      const key = e.setup_id || e.playbook?.setup_id || e.event_id || `${e.symbol || ""}|${e.setup_type || ""}|${e.scan_timestamp || ""}`;
      const prev = map.get(key);
      if (!prev || eventTime(e) < eventTime(prev)) map.set(key, e);
    }
    return Array.from(map.values()).sort((a, b) => eventTime(a) - eventTime(b));
  };
  const analyzableEvents = dedupeContinuingSetups(resolvedEvents.filter(e => e.simulation_status !== "ambiguous_same_bar" && Number.isFinite(Number(e.r_multiple)) && e.adjusted_ohlcv_used !== false));
  const selectedEvents = analyzableEvents.filter(e => e.selected_for_paper === true);
  const controlPool = analyzableEvents.filter(e => e.selected_for_paper !== true);
  const matchKey = e => [
    String(e.scan_timestamp || "").slice(0, 10),
    e.sector || e.sector_name || e.scanner_snapshot?.sector || "-",
    e.market_cap_bucket || e.size_bucket || e.scanner_snapshot?.market_cap_bucket || "-",
    e.liquidity_bucket || e.avg_dollar_vol_bucket || e.scanner_snapshot?.liquidity_bucket || "-",
  ].join("|");
  const selectedKeys = new Set(selectedEvents.map(matchKey));
  const controlEvents = controlPool.filter(e => selectedKeys.has(matchKey(e)));
  const closed = paper.filter(tradeIsClosed);
  const open = paper.filter(t => !tradeIsClosed(t));
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  const stdev = arr => {
    if (arr.length < 2) return 0;
    const m = avg(arr);
    return Math.sqrt(avg(arr.map(x => (x - m) ** 2)));
  };
  const ciMean = arr => {
    if (!arr.length) return [0, 0];
    const m = avg(arr);
    const se = stdev(arr) / Math.sqrt(arr.length || 1);
    const critical = arr.length < 30 ? 2.262 : 1.96;
    return [Number((m - critical * se).toFixed(2)), Number((m + critical * se).toFixed(2))];
  };
  const wilson = (wins, n) => {
    if (!n) return [0, 0];
    const z = 1.96, p = wins / n, denom = 1 + z * z / n;
    const centre = p + z * z / (2 * n);
    const margin = z * Math.sqrt((p * (1 - p) + z * z / (4 * n)) / n);
    return [Number(((centre - margin) / denom * 100).toFixed(1)), Number(((centre + margin) / denom * 100).toFixed(1))];
  };
  const maxDrawdown = values => {
    let equity = 0, peak = 0, maxDd = 0;
    for (const r of values) {
      equity += r;
      peak = Math.max(peak, equity);
      maxDd = Math.min(maxDd, equity - peak);
    }
    return Number(maxDd.toFixed(2));
  };
  function stat(rows) {
    rows = (rows || []).slice().sort((a, b) => eventTime(a) - eventTime(b));
    const rs = rows.map(t => Number(t.r_multiple)).filter(Number.isFinite);
    const wins = rows.filter(t => Number(t.r_multiple) > 0);
    const losses = rows.filter(t => Number(t.r_multiple) < 0);
    const grossWin = wins.reduce((a, t) => a + Math.max(0, Number(t.r_multiple) || 0), 0);
    const grossLoss = Math.abs(losses.reduce((a, t) => a + Math.min(0, Number(t.r_multiple) || 0), 0));
    const holds = rows.map(t => Number(t.holding_period_sessions ?? t.hold_days)).filter(Number.isFinite);
    const expCi = ciMean(rs);
    const winCi = wilson(wins.length, rows.length);
    return {
      n:rows.length,
      win_rate:rows.length ? Number((wins.length / rows.length * 100).toFixed(1)) : 0,
      win_rate_ci:winCi,
      expectancy_r:rs.length ? Number(avg(rs).toFixed(2)) : 0,
      expectancy_r_ci:expCi,
      profit_factor:grossLoss > 0 ? Number((grossWin / grossLoss).toFixed(2)) : (grossWin > 0 ? Infinity : 0),
      max_drawdown_r:maxDrawdown(rs),
      avg_win:wins.length ? Number(avg(wins.map(t => Number(t.r_multiple))).toFixed(2)) : null,
      avg_loss:losses.length ? Number(avg(losses.map(t => Number(t.r_multiple))).toFixed(2)) : null,
      avg_hold:holds.length ? Math.round(avg(holds)) : null,
      target:rows.filter(t => t.simulation_status === "closed_target" || t.lifecycle_status === "closed_target").length,
      stop:rows.filter(t => t.simulation_status === "closed_stop" || t.lifecycle_status === "closed_stop").length,
      timeout:rows.filter(t => t.simulation_status === "closed_timeout" || t.lifecycle_status === "closed_timeout").length,
      ambiguous:resolvedEvents.filter(t => t.simulation_status === "ambiguous_same_bar").length,
      meaningful_sample:rows.length >= PAPER_SIM_MIN_MEANINGFUL_SAMPLE,
    };
  }
  function eventGroups(picker, rows = analyzableEvents) {
    const map = {};
    for (const e of rows) (map[picker(e) || "-"] = map[picker(e) || "-"] || []).push(e);
    return Object.entries(map)
      .map(([key, groupRows]) => {
        const s = stat(groupRows);
        const confidenceScore = s.n >= PAPER_SIM_MIN_MEANINGFUL_SAMPLE ? s.expectancy_r_ci[0] : s.expectancy_r - (PAPER_SIM_MIN_MEANINGFUL_SAMPLE - s.n) * 0.25;
        return { key, ...s, confidence_score:Number(confidenceScore.toFixed(2)) };
      })
      .sort((a, b) => b.confidence_score - a.confidence_score || b.expectancy_r - a.expectancy_r || b.n - a.n);
  }
  const setupGroups = eventGroups(e => e.setup_type || "unknown");
  const bestSetup = setupGroups.find(g => g.n >= PAPER_SIM_MIN_MEANINGFUL_SAMPLE && g.expectancy_r_ci[0] > 0) || null;
  const spyReturns = analyzableEvents.map(e => Number(e.spy_comparison?.return_pct)).filter(Number.isFinite);
  return {
    total_paper:paper.length,
    total_events:events.length,
    resolved_events:resolvedEvents.length,
    ambiguous_count:resolvedEvents.filter(e => e.simulation_status === "ambiguous_same_bar").length,
    open_count:open.length,
    overall:stat(analyzableEvents),
    selected:stat(selectedEvents),
    controls:stat(controlEvents),
    matched_control_n:controlEvents.length,
    min_meaningful_sample:PAPER_SIM_MIN_MEANINGFUL_SAMPLE,
    spy_avg_return:spyReturns.length ? Number(avg(spyReturns).toFixed(2)) : null,
    best_setup:bestSetup,
    by_source:eventGroups(e => e.selected_for_paper ? "Selected paper" : "Matched controls"),
    by_setup:setupGroups,
    by_regime:eventGroups(e => e.regime_primary || "unknown"),
    by_trigger:eventGroups(e => e.trigger_type || "unknown"),
  };
}
function renderPaperPerformance(stats) {
  const o = stats.selected?.n ? stats.selected : stats.overall;
  const expCls = o.expectancy_r > 0 ? "good-text" : o.expectancy_r < 0 ? "bad-text" : "";
  if (!stats.total_events && !stats.total_paper) {
    return `<section class="card"><div class="card-head"><h3>Walk-Forward Performance</h3><button class="btn-ghost" data-act="run-paper-sim">Run sim</button></div><div class="empty">No scan events yet.</div></section>`;
  }
  if (!o.n) {
    return `<section class="card"><div class="card-head"><h3>Walk-Forward Performance</h3><button class="btn-ghost" data-act="run-paper-sim">Run sim</button></div><div class="empty">${stats.total_events} detected event${stats.total_events === 1 ? "" : "s"}, none resolved yet.</div></section>`;
  }
  return `<section class="card">
    <div class="card-head"><h3>Walk-Forward Performance</h3><button class="btn-ghost" data-act="run-paper-sim">Run sim</button></div>
    <div class="perf-headline">
      <div><div class="expect ${expCls}">${o.expectancy_r >= 0 ? "+" : ""}${o.expectancy_r}R</div><div class="expect-label">${stats.selected?.n ? "selected-strategy expectancy" : "expectancy / resolved event"}</div></div>
      <div class="perf-side">
        <div><span class="mini-stat-v">${o.win_rate}%</span><span class="mini-stat-l">win ${o.win_rate_ci[0]}-${o.win_rate_ci[1]}%</span></div>
        <div><span class="mini-stat-v">${o.n}</span><span class="mini-stat-l">n resolved</span></div>
        <div><span class="mini-stat-v">${o.profit_factor === Infinity ? "Inf" : o.profit_factor}</span><span class="mini-stat-l">profit factor</span></div>
      </div>
    </div>
    <div class="breakdown">
      <span class="meta">Exp CI ${o.expectancy_r_ci[0]}R to ${o.expectancy_r_ci[1]}R</span>
      <span class="meta bad">Max DD ${o.max_drawdown_r}R</span>
      <span class="meta good">Avg win ${o.avg_win != null ? o.avg_win + "R" : "-"}</span>
      <span class="meta bad">Avg loss ${o.avg_loss != null ? o.avg_loss + "R" : "-"}</span>
      <span class="meta good">${o.target} target</span>
      <span class="meta bad">${o.stop} stop</span>
      <span class="meta warn">${o.timeout} timeout</span>
      ${stats.ambiguous_count ? `<span class="meta warn">${stats.ambiguous_count} ambiguous</span>` : ""}
      ${stats.spy_avg_return != null ? `<span class="meta">SPY avg ${fmtPct(stats.spy_avg_return, 2)}</span>` : ""}
    </div>
    <div class="issue">Controls are matched by scan date, sector, size and liquidity. In-sample walk-forward results are evidence to monitor, not proof of an edge.</div>
    <div class="issue">Selected ${stats.selected.n} resolved vs ${stats.controls.n} matched controls. Minimum meaningful setup sample: ${stats.min_meaningful_sample}.</div>
    ${stats.best_setup ? `<div class="issue">Best setup by confidence-adjusted expectancy: ${esc(stats.best_setup.key)} (${stats.best_setup.n} resolved, ${stats.best_setup.expectancy_r >= 0 ? "+" : ""}${stats.best_setup.expectancy_r}R, CI low ${stats.best_setup.expectancy_r_ci[0]}R).</div>` : ""}
    ${groupTable("By source", stats.by_source)}
    ${groupTable("By setup", stats.by_setup)}
    ${groupTable("By regime", stats.by_regime)}
    ${groupTable("By trigger type", stats.by_trigger)}
  </section>`;
}
function groupTable(label, rows) {
  if (!rows.length) return "";
  return `<table class="table"><thead><tr><th>${esc(label)}</th><th>n</th><th>Win%</th><th>Exp R</th><th>PF</th><th>DD</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.key)}</td><td>${r.n}</td><td>${r.win_rate}% <span class="muted">${r.win_rate_ci[0]}-${r.win_rate_ci[1]}</span></td><td class="${r.expectancy_r >= 0 ? "good-text" : "bad-text"}">${r.expectancy_r >= 0 ? "+" : ""}${r.expectancy_r}R <span class="muted">${r.expectancy_r_ci[0]}-${r.expectancy_r_ci[1]}</span></td><td>${r.profit_factor === Infinity ? "Inf" : r.profit_factor}</td><td>${r.max_drawdown_r}R</td></tr>`).join("")}</tbody></table>`;
}

function renderSettings() {
  $("#topbarTitle").textContent = "Settings";
  $("#view").innerHTML = `
    <section class="card">
      <div class="card-head"><h3>Core Settings</h3></div>
      <div class="settings-row">
        <div><div class="lbl">Data mode</div><div class="sub">${esc(state.authLabel)}${state.uid ? ` - ${esc(state.uid.slice(0, 8))}` : ""}</div></div>
        <button class="btn-secondary" data-act="sign-out">Reset auth</button>
      </div>
      <div class="settings-row">
        <div><div class="lbl">Minimum reward/risk</div><div class="sub">Paper-ready setups must meet this threshold.</div></div>
        <input class="setting-input" id="minRewardRisk" type="number" min="0.5" step="0.1" value="${esc(state.investorProfile.min_reward_risk || 2)}" />
      </div>
      <div class="settings-row">
        <div><div class="lbl">Auto-log prime paper trades</div><div class="sub">After each full sweep, prime paper-ready setups are logged automatically.</div></div>
        <input id="autoPrimePaper" type="checkbox" ${state.investorProfile.auto_prime_paper !== false ? "checked" : ""} />
      </div>
      <div class="settings-row">
        <div><div class="lbl">Max auto paper trades per scan</div><div class="sub">Caps the number of new prime setups added to the journal.</div></div>
        <input class="setting-input" id="autoPrimeLimit" type="number" min="1" max="20" step="1" value="${esc(state.investorProfile.auto_prime_limit || 5)}" />
      </div>

        <button class="btn-secondary" data-act="export-data">Export journal</button>
      </div>
    </section>`;
}
async function exportData() {
  const trades = await loadTrades(1000);
  const payload = { exported_at:new Date().toISOString(), trades, market_scan_at:state.marketScanRanAt, profile:state.investorProfile };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `opportunity-journal-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
async function resetAuth() {
  if (auth?.currentUser) await auth.signOut().catch(() => {});
  state.uid = null;
  state.localOnly = true;
  state.authLabel = "local journal";
  toast("Using local journal");
  renderCurrentView();
}

document.addEventListener("click", async e => {
  const target = e.target.closest("[data-view], [data-act]");
  if (!target) return;
  if (target.dataset.view) return setView(target.dataset.view);
  const act = target.dataset.act;
  try {
    if (act === "stable-scan") await runRollingBroadScan();
    else if (act === "deep-scan") await runMarketScan({ discover:true });
    else if (act === "open-chart-page") openChartPage(target.dataset.symbol);
    else if (act === "back-discover") setView("discover");
    else if (act === "set-chart-tf") { state.chartTimeframe = target.dataset.tf || "3m"; renderCurrentView(); }
    else if (act === "refresh-chart-page") {
      await loadOpportunityChart(target.dataset.symbol || state.chartSymbol);
    }
    else if (act === "set-ms-lane") { state.marketScanLane = target.dataset.lane || "all"; renderCurrentView(); }
    else if (act === "toggle-ms-soft") { state.marketScanHideSoft = !state.marketScanHideSoft; renderCurrentView(); }
    else if (act === "toggle-analysis") {
      const sym = String(target.dataset.symbol || "").toUpperCase();
      const willOpen = !state.expandedAnalysis[sym];
      state.expandedAnalysis[sym] = willOpen;
      renderCurrentView();
      if (willOpen) {
        setTimeout(() => {
          if (!msScannerReadFor(sym) && !state.aiReadLoading[sym]) runSingleSymbolRead(sym);
          if (!chartHistoryFor(sym).length && !state.chartLoading[sym]) loadOpportunityChart(sym);
        }, 0);
      }
    }
    else if (act === "ai-read-scan") await runSingleSymbolRead(target.dataset.symbol);
    else if (act === "load-chart-scan") await loadOpportunityChart(target.dataset.symbol);
    else if (act === "paper-test-scan") await paperTestScannerOpportunity(target.dataset.symbol);
    else if (act === "delete-trigger") deleteTriggerWatch(target.dataset.key);
    else if (act === "run-paper-sim") await runPaperSimulationManual();
    else if (act === "delete-trade") {
      if (confirm("Delete this trade?")) {
        await deleteTrade(target.dataset.tradeId);
        toast("Trade deleted");
        renderCurrentView();
      }
    }
    else if (act === "save-settings") await saveInvestorProfile();
    else if (act === "export-data") await exportData();
    else if (act === "sign-out") await resetAuth();
  } catch (err) {
    console.error(err);
    toast(err.message || String(err), "error");
  }
});
document.addEventListener("change", e => {
  const filter = e.target?.dataset?.filter;
  if (!filter) return;
  if (filter === "capFilter") state.marketScanCapFilter = e.target.value || "all";
  if (filter === "setupFilter") state.marketScanSetupFilter = e.target.value || "all";
  if (filter === "sectorFilter") state.marketScanSectorFilter = e.target.value || "all";
  renderCurrentView();
});
document.addEventListener("input", e => {
  if (e.target?.id === "focusInput") state.marketScanFocus = e.target.value;
});
document.addEventListener("keydown", e => {
  if (e.target?.id === "focusInput" && e.key === "Enter") runMarketScan({ force:true });
});
$("#refreshBtn").addEventListener("click", () => {
  if (state.currentView === "chart" && state.chartSymbol) loadOpportunityChart(state.chartSymbol);
  else if (state.currentView === "discover") runRollingBroadScan();
  else renderCurrentView();
});

async function boot() {
  setMeta();
  if (!auth) {
    state.localOnly = true;
    state.authLabel = "local journal";
    setReady();
    return;
  }
  let triedAnon = false;
  auth.onAuthStateChanged(async user => {
    if (!user && !triedAnon) {
      triedAnon = true;
      try { await auth.signInAnonymously(); return; }
      catch (e) {
        console.warn("Anonymous auth failed", e);
        state.localOnly = true;
        state.authLabel = "local journal";
      }
    } else if (user) {
      state.uid = user.uid;
      state.localOnly = false;
      state.authLabel = user.isAnonymous ? "anonymous sync" : "signed in";
      await loadInvestorProfile();
      await loadCachedScan();
      setTimeout(resumeActiveScanJob, 0);
    }
    setReady();
  });
  setTimeout(() => {
    if ($("#app").classList.contains("hidden")) {
      state.localOnly = true;
      state.authLabel = "local journal";
      setReady();
    }
  }, 3500);
}
window.addEventListener("error", e => {
  console.error(e.error || e.message);
  toast(`Error: ${e.message}`, "error");
});
window.addEventListener("unhandledrejection", e => {
  console.error(e.reason);
  toast(`Error: ${e.reason?.message || e.reason}`, "error");
});
window.__PORTFOLIO_PAPER_TEST_EXPORTS__ = {
  normalizeAdjustedBars,
  simulateWalkForwardEvent,
  simulateSpyComparison,
  eventPlan,
  costModel,
  computePaperPerformance,
  deriveTrigger,
  normalizeScanContract,
  renderMarketScannerCard,
  radarBucket,
  state,
};
boot();
