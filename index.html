<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1a1814" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Portfolio" />
<title>Portfolio Advisor</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --bg:           #f5f1e8;
  --bg-elev:     #ede7d6;
  --bg-card:     #fbf8f0;
  --ink:          #1a1814;
  --ink-soft:    #4a4639;
  --ink-muted:   #8a8473;
  --rule:        #d8d2bf;
  --rule-soft:   #e8e2cf;
  --accent:      #a13d2d;
  --accent-soft: #c46b54;
  --green:       #4a7a4a;
  --green-soft:  #6b9b6b;
  --red:         #a13d2d;
  --red-soft:    #c46b54;
  --gold:        #b08d3c;
  --shadow:      0 1px 0 rgba(26,24,20,.04), 0 6px 18px -10px rgba(26,24,20,.18);
  --shadow-deep: 0 24px 60px -24px rgba(26,24,20,.28);
  --radius:      14px;
  --radius-sm:    8px;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:    'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  --mono:    'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}
[data-theme="night"] {
  --bg:           #14110d;
  --bg-elev:     #1d1914;
  --bg-card:     #1a1612;
  --ink:          #f0e9d6;
  --ink-soft:    #c4bca6;
  --ink-muted:   #8a8270;
  --rule:        #2d2820;
  --rule-soft:   #221d17;
  --accent:      #d97a5a;
  --accent-soft: #b85a3d;
  --green:       #7ab37a;
  --green-soft:  #5a8e5a;
  --red:         #d97a5a;
  --red-soft:    #b85a3d;
  --gold:        #d4a85c;
  --shadow:      0 1px 0 rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.5);
  --shadow-deep: 0 24px 60px -24px rgba(0,0,0,.7);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11', 'tnum';
  overscroll-behavior-y: none;
}
body {
  display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100dvh;
  padding-top: env(safe-area-inset-top);
}
.display { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; }
.mono    { font-family: var(--mono); font-feature-settings: 'tnum', 'zero'; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }
.label   { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }

.app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.view {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: 96px;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  position: sticky; top: 0; z-index: 30;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.topbar-title { font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.topbar-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.04em; }
.topbar-icons { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center;
  border: none; background: transparent; color: var(--ink-soft);
  cursor: pointer; border-radius: 50%;
  transition: background .15s, color .15s;
}
.icon-btn:hover, .icon-btn:active { background: var(--bg-elev); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }

.tabs {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--bg);
  border-top: 1px solid var(--rule);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px; border: none; background: transparent;
  color: var(--ink-muted);
  font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; transition: color .15s; border-radius: 10px;
}
.tab.active { color: var(--ink); }
.tab svg { width: 22px; height: 22px; stroke-width: 1.5; pointer-events: none; }
.tab.active svg { stroke-width: 2; }

.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.section-head h2 { font-family: var(--display); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }

.hero {
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 22px 20px 20px;
  margin: 16px 20px 8px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--gold) 50%, var(--accent) 100%);
}
.hero .eyebrow { margin-bottom: 8px; }
.hero-value { font-family: var(--display); font-size: 44px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.hero-value .currency-prefix {
  font-size: 22px; color: var(--ink-muted);
  margin-right: 4px; vertical-align: top; position: relative; top: 8px;
}
.hero-meta {
  display: flex; gap: 24px;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--rule-soft);
}
.hero-stat { flex: 1; }
.hero-stat-value { font-family: var(--mono); font-size: 15px; font-weight: 500; margin-top: 2px; }
.hero-stat-value.pos { color: var(--green); }
.hero-stat-value.neg { color: var(--red); }

.alloc-strip {
  display: flex; height: 6px; border-radius: 3px;
  overflow: hidden; margin-top: 14px; background: var(--rule);
}
.alloc-seg { height: 100%; transition: flex .3s; }
.alloc-legend {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 6px 16px; margin-top: 10px; font-size: 12px;
}
.alloc-legend-item { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
.alloc-dot { width: 8px; height: 8px; border-radius: 50%; }

.holdings { margin: 8px 0 20px; }
.holding {
  display: flex; align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer; transition: background .15s; position: relative;
}
.holding:hover, .holding:active { background: var(--bg-elev); }
.holding * { pointer-events: none; }
.holding-icon {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--bg-elev);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 600; font-size: 14px;
  color: var(--ink-soft);
  margin-right: 14px; flex-shrink: 0;
  border: 1px solid var(--rule);
}
.holding-icon[data-class="crypto"] { background: var(--bg); border-color: var(--gold); color: var(--gold); }
.holding-icon[data-class="metal"]  { background: var(--bg); border-color: var(--gold); color: var(--gold); }
.holding-icon[data-class="etf"]    { background: var(--bg); border-color: var(--ink-soft); color: var(--ink-soft); }
.holding-icon[data-class="cash"]   { background: var(--bg); border-color: var(--ink-muted); color: var(--ink-muted); }
.holding-main { flex: 1; min-width: 0; }
.holding-symbol { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.holding-name {
  font-size: 11.5px; color: var(--ink-muted); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
}
.holding-right { text-align: right; font-family: var(--mono); }
.holding-value { font-size: 14px; font-weight: 500; color: var(--ink); }
.holding-pnl { font-size: 11.5px; margin-top: 1px; letter-spacing: 0.02em; }
.holding-pnl.pos { color: var(--green); }
.holding-pnl.neg { color: var(--red); }
.holding-pnl.flat { color: var(--ink-muted); }
.holding-stance {
  position: absolute; top: 16px; right: 14px;
  font-family: var(--mono); font-size: 8.5px; font-weight: 600;
  padding: 2px 6px; border-radius: 3px; letter-spacing: 0.1em;
  display: none;
}
.holding-stance.show { display: inline-block; }
.holding-stance.ACCUMULATE { background: rgba(74,122,74,0.15); color: var(--green); }
.holding-stance.HOLD       { background: var(--bg-elev); color: var(--ink-soft); }
.holding-stance.TRIM       { background: rgba(176,141,60,0.15); color: var(--gold); }
.holding-stance.EXIT       { background: rgba(161,61,45,0.15); color: var(--red); }
.holding-stance.AVOID      { background: rgba(161,61,45,0.10); color: var(--red-soft); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  border-radius: var(--radius-sm);
  font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; transition: opacity .15s, transform .1s;
  text-transform: uppercase;
}
.btn:active { transform: scale(0.98); }
.btn:hover  { opacity: 0.92; }
.btn-secondary { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn-ghost { background: transparent; color: var(--ink-soft); border: none; padding: 10px 14px; }
.btn-block { display: flex; width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 11.5px; }
.btn-danger { background: transparent; color: var(--red); border-color: var(--red-soft); }

.btn-portfolio-analyze {
  display: flex; align-items: center; justify-content: space-between;
  margin: 14px 20px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius);
  cursor: pointer; transition: background .15s;
  position: relative; overflow: hidden;
}
.btn-portfolio-analyze::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent);
}
.btn-portfolio-analyze:hover { background: var(--bg-elev); }
.btn-portfolio-analyze .lbl { font-family: var(--display); font-size: 16px; font-weight: 500; }
.btn-portfolio-analyze .sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
.btn-portfolio-analyze .arrow { color: var(--accent); font-size: 18px; }

.pin-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; padding: 40px 30px;
}
.pin-logo { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 6px; }
.pin-tag { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 50px; }
.pin-prompt { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; letter-spacing: 0.04em; }
.pin-dots { display: flex; gap: 14px; margin-bottom: 36px; }
.pin-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--ink-soft); background: transparent;
  transition: background .15s, border-color .15s, transform .15s;
}
.pin-dot.filled { background: var(--ink); border-color: var(--ink); transform: scale(1.1); }
.pin-dot.error { background: var(--red); border-color: var(--red); animation: shake .4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
.pin-key {
  width: 72px; height: 72px;
  border: 1px solid var(--rule); background: var(--bg-card); color: var(--ink);
  font-family: var(--display); font-size: 26px; font-weight: 500;
  border-radius: 50%; cursor: pointer;
  transition: background .12s, transform .1s;
}
.pin-key:active { background: var(--bg-elev); transform: scale(0.95); }
.pin-key.empty { visibility: hidden; }
.pin-key.del { font-size: 22px; }
.pin-error { color: var(--red); font-size: 12px; margin-top: 14px; letter-spacing: 0.04em; height: 16px; }

.loader-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 95;
}
.loader-logo { font-family: var(--display); font-size: 28px; margin-bottom: 18px; letter-spacing: -0.01em; }
.loader-bar { width: 120px; height: 1.5px; background: var(--rule); position: relative; overflow: hidden; }
.loader-bar::after {
  content: ""; position: absolute; inset: 0; width: 40%;
  background: var(--ink); animation: loader 1.2s infinite ease-in-out;
}
@keyframes loader {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

.detail-head { padding: 18px 20px 12px; }
.detail-back {
  font-family: var(--sans); font-size: 13px; color: var(--ink-soft);
  background: none; border: none; padding: 4px 0; margin-bottom: 14px;
  cursor: pointer; letter-spacing: 0.04em;
  display: inline-flex; align-items: center; gap: 4px;
}
.detail-symbol { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.025em; line-height: 1; }
.detail-name { font-size: 12px; color: var(--ink-muted); margin-top: 4px; letter-spacing: 0.02em; }
.detail-price { font-family: var(--mono); font-size: 28px; font-weight: 500; margin-top: 14px; letter-spacing: -0.01em; }
.detail-change { font-family: var(--mono); font-size: 13px; margin-top: 4px; }
.detail-change.pos { color: var(--green); }
.detail-change.neg { color: var(--red); }
.detail-change.flat { color: var(--ink-muted); }

.chart-wrap {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); overflow: hidden;
}
.chart-controls { display: flex; border-bottom: 1px solid var(--rule-soft); }
.range-btn {
  flex: 1; padding: 10px 0; border: none; background: transparent;
  color: var(--ink-muted);
  font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.06em;
  cursor: pointer; transition: color .15s, background .15s;
}
.range-btn.active { color: var(--ink); background: var(--bg-elev); }
#chart { height: 280px; padding: 8px 4px; }

.ind-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--rule-soft);
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  overflow: hidden;
}
.ind-cell { background: var(--bg-card); padding: 12px 10px; text-align: center; }
.ind-cell .label { font-size: 9.5px; letter-spacing: 0.1em; }
.ind-cell .val { font-family: var(--mono); font-size: 14px; font-weight: 500; margin-top: 4px; color: var(--ink); }
.ind-cell .val.pos { color: var(--green); }
.ind-cell .val.neg { color: var(--red); }
.ind-cell .val.warn { color: var(--accent); }

.pos-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 16px 18px;
}
.pos-card h3 { font-family: var(--display); font-size: 16px; font-weight: 500; margin-bottom: 12px; letter-spacing: -0.01em; }
.pos-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.pos-row .lbl { color: var(--ink-muted); letter-spacing: 0.02em; }
.pos-row .val { font-family: var(--mono); font-weight: 500; }
.pos-row .val.pos { color: var(--green); }
.pos-row .val.neg { color: var(--red); }
.pos-row .val.flat { color: var(--ink-muted); }

.pos-actions {
  display: flex; gap: 8px; margin-top: 14px;
  padding-top: 14px; border-top: 1px solid var(--rule-soft);
}

/* ============ NEW AI CARD STYLES ============ */

.ai-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 0;
  position: relative; overflow: hidden;
}
.ai-card::before {
  content: ""; position: absolute; top: 0; left: 0;
  width: 4px; height: 100%; background: var(--accent);
}

/* Stance hero */
.stance-hero {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--rule-soft);
}
.stance-eyebrow {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 8px;
}
.stance-verb {
  font-family: var(--display); font-weight: 700;
  font-size: 38px; letter-spacing: -0.025em; line-height: 1;
}
.stance-verb.ACCUMULATE { color: var(--green); }
.stance-verb.HOLD       { color: var(--ink); }
.stance-verb.TRIM       { color: var(--gold); }
.stance-verb.EXIT       { color: var(--red); }
.stance-verb.AVOID      { color: var(--red-soft); }
.stance-headline {
  font-size: 14px; color: var(--ink-soft); margin-top: 8px;
  line-height: 1.45;
}
.stance-pills {
  display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
}
.pill {
  display: inline-flex; align-items: center;
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  padding: 4px 9px; border-radius: 4px;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.pill-conf {
  background: var(--bg-elev); color: var(--ink-soft);
  border: 1px solid var(--rule);
}
.pill-conv {
  background: transparent; color: var(--ink-muted);
  border: 1px dashed var(--rule);
}
.pill-conv.high, .pill-conf.high { color: var(--ink); border-color: var(--ink-soft); }
.pill-conv.medium, .pill-conf.medium { color: var(--ink-soft); }
.pill-conv.low, .pill-conf.low { color: var(--ink-muted); opacity: 0.85; }

/* Action block */
.action-block {
  padding: 16px 20px;
  background: linear-gradient(180deg, transparent 0%, rgba(161,61,45,0.04) 100%);
  border-bottom: 1px solid var(--rule-soft);
}
.action-block h4 {
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 10px;
}
.action-what {
  font-family: var(--display); font-size: 18px; font-weight: 500;
  letter-spacing: -0.01em; color: var(--ink); line-height: 1.3;
}
.action-meta {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin-top: 12px;
}
.action-meta-cell {
  background: var(--bg); border: 1px solid var(--rule-soft);
  border-radius: var(--radius-sm); padding: 8px 10px;
}
.action-meta-cell .lbl {
  font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500;
}
.action-meta-cell .val {
  font-family: var(--mono); font-size: 12.5px; font-weight: 500;
  color: var(--ink); margin-top: 3px;
}
.invalidation-row {
  margin-top: 12px;
  padding: 10px 12px;
  background: rgba(161,61,45,0.06);
  border: 1px solid var(--red-soft);
  border-radius: var(--radius-sm);
  font-size: 12px; color: var(--ink);
  line-height: 1.45;
}
.invalidation-row strong {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--red); font-weight: 600;
  display: block; margin-bottom: 3px;
}

/* Horizon strip */
.horizon-strip {
  display: grid; grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--rule-soft);
}
.horizon-cell {
  padding: 12px 10px; text-align: center;
  border-right: 1px solid var(--rule-soft);
}
.horizon-cell:last-child { border-right: none; }
.horizon-cell .lbl {
  font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500;
}
.horizon-cell .signal-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; margin-top: 6px;
}
.signal-dot.bullish          { background: var(--green); }
.signal-dot.neutralbullish   { background: var(--green-soft); opacity: 0.7; }
.signal-dot.neutral          { background: var(--ink-muted); }
.signal-dot.neutralbearish   { background: var(--red-soft); opacity: 0.7; }
.signal-dot.bearish          { background: var(--red); }
.horizon-cell .signal-text {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.04em;
  color: var(--ink-soft); margin-top: 5px;
}
.horizon-cell .note {

.toast {

// ============================================================================
// UTILS
// ============================================================================
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function fmtUSD(n, decimals = 2) {
  if (n == null || isNaN(n)) return "—";
  if (Math.abs(n) >= 1000) return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return n.toFixed(decimals);
}
function fmtPct(n, withSign = true) {
  if (n == null || isNaN(n)) return "—";
  const s = withSign && n > 0 ? "+" : "";
  return s + n.toFixed(2) + "%";
}
function fmtNum(n, decimals = 4) {
  if (n == null || isNaN(n)) return "—";
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: decimals });
}
function fmtRel(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const ms = Date.now() - d.getTime();
  const m = Math.floor(ms / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const days = Math.floor(h / 24);
  if (days < 7) return days + "d ago";
  return d.toLocaleDateString();
}
function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function toast(msg, ms = 2400, type = "default") {
  const el = $("#toast");
  el.textContent = msg;
  el.className = "toast show" + (type === "error" ? " error" : "");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}
function escAttr(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}
function signalToClass(s) { return String(s || "neutral").replace(/[^a-z]/g, ""); }
function stanceToClass(s) { return String(s || "HOLD").replace(/[^A-Z]/g, ""); }

// ============================================================================
// PIN GATE
// ============================================================================
let pinBuffer = "", pinMode = "enter", pinFirstTry = "";

function setupPinPad() {
  const pad = $("#pinPad");
  pad.innerHTML = "";
  const keys = [1,2,3,4,5,6,7,8,9,"",0,"⌫"];
  keys.forEach(k => {
    const b = document.createElement("button");
    b.className = "pin-key" + (k === "" ? " empty" : "") + (k === "⌫" ? " del" : "");
    b.textContent = k;
    b.addEventListener("click", () => handlePinKey(k));
    pad.appendChild(b);
  });
}
function handlePinKey(k) {
  $("#pinError").textContent = "";
  if (k === "⌫") pinBuffer = pinBuffer.slice(0, -1);
  else if (typeof k === "number" && pinBuffer.length < 4) pinBuffer += String(k);
  else return;
  updatePinDots();
  if (pinBuffer.length === 4) setTimeout(processPin, 120);
}
function updatePinDots(error = false) {
  $$("#pinDots .pin-dot").forEach((d, i) => {
    d.classList.toggle("filled", i < pinBuffer.length);
    d.classList.toggle("error", error);
  });
}
function processPin() {
  const stored = localStorage.getItem("pinHash");
  if (!stored) {
    if (pinMode === "create") {
      pinFirstTry = pinBuffer; pinBuffer = "";
      pinMode = "confirm";
      updatePinDots();
      $("#pinPrompt").textContent = "Confirm your PIN";
      return;
    }
    if (pinMode === "confirm") {
      if (pinBuffer === pinFirstTry) {
        localStorage.setItem("pinHash", hashPin(pinBuffer));
        unlockApp();
      } else {
        showPinError("PINs don't match. Start over.");
        pinFirstTry = ""; pinBuffer = "";
        pinMode = "create";
        $("#pinPrompt").textContent = "Create a 4-digit PIN";
        updatePinDots();
      }
    }
  } else {
    if (hashPin(pinBuffer) === stored) {
      unlockApp();
    } else {
      state.pinAttempts++;
      showPinError(state.pinAttempts >= 5 ? "Too many attempts." : "Incorrect PIN");
      pinBuffer = "";
      updatePinDots(true);
      setTimeout(() => updatePinDots(false), 400);
    }
  }
}
function showPinError(msg) { $("#pinError").textContent = msg; }
function hashPin(p) {
  let h = 0x811c9dc5;
  for (let i = 0; i < p.length; i++) {
    h ^= p.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(16);
}
function unlockApp() {
  $("#pinScreen").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#topbarMeta").textContent = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  loadInitialData().catch(e => showError("Init: " + e.message));
}
function showPinScreen() {
  $("#loader").classList.add("hidden");
  $("#pinScreen").classList.remove("hidden");
  setupPinPad();
  if (!localStorage.getItem("pinHash")) {
    pinMode = "create";
    $("#pinPrompt").textContent = "Create a 4-digit PIN";
  }
}

async function ensureAuth() {
  return new Promise((resolve, reject) => {
    auth.onAuthStateChanged(async user => {
      if (user) { state.uid = user.uid; resolve(user); }
      else {
        try { await auth.signInAnonymously(); }
        catch (e) { reject(e); }
      }
    });
  });
}

async function loadInitialData() {
  await ensureAuth();
  await loadHoldingsFromFirestore();
  if (state.holdings.length === 0) await seedHoldings();
  await loadAnalysesFromFirestore();
  await loadPortfolioAnalysis();
  await refreshAllPrices();
  renderCurrentView();
}

async function loadHoldingsFromFirestore() {
  const snap = await db.collection("users").doc(state.uid).collection("holdings").get();
  state.holdings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function seedHoldings() {
  for (const h of SEED_HOLDINGS) {
    try {
      await db.collection("users").doc(state.uid).collection("holdings").doc(h.symbol).set({
        symbol: h.symbol, asset_class: h.asset_class,
        quantity: h.quantity,
        avg_cost_total: h.avg_cost_total,
        avg_cost_unit: h.avg_cost_total / h.quantity,
        currency: "USD", name: h.name,
        added_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch (e) { console.warn("seed failed for", h.symbol, e); }
  }
  await loadHoldingsFromFirestore();
}

async function loadAnalysesFromFirestore() {
  try {
    const snap = await db.collection("users").doc(state.uid).collection("analyses")
      .orderBy("generated_at", "desc").limit(50).get();
    const latest = {};
    snap.docs.forEach(d => {
      const data = d.data();
      if (!latest[data.symbol] || (data.generated_at > latest[data.symbol].generated_at)) latest[data.symbol] = data;
    });
    state.analyses = latest;
  } catch (e) { console.warn("analyses load failed", e); state.analyses = {}; }
}

async function loadPortfolioAnalysis() {
  try {
    const snap = await db.collection("users").doc(state.uid).collection("portfolio_analyses")
      .orderBy("generated_at", "desc").limit(1).get();
    state.portfolioAnalysis = snap.docs[0]?.data() || null;
  } catch (e) { state.portfolioAnalysis = null; }
}

async function refreshAllPrices() {
  const promises = state.holdings.map(h =>
    fetch(`${WORKER_URL}/price/${encodeURIComponent(h.symbol)}`)
      .then(r => r.json())
      .then(p => { state.prices[h.symbol] = p; })
      .catch(e => console.warn("price fetch failed:", h.symbol, e))
  );
  await Promise.all(promises);
}

// ============================================================================
// METRICS
// ============================================================================
function holdingMetrics(h) {
  const p = state.prices[h.symbol];
  const cur = p?.current_price;
  const value = cur != null ? cur * h.quantity : null;
  const pnlAbs = value != null ? value - h.avg_cost_total : null;
  const pnlPct = h.avg_cost_total > 0 && pnlAbs != null ? (pnlAbs / h.avg_cost_total) * 100 : null;
  const dayPct = p && p.prev_close ? ((cur - p.prev_close) / p.prev_close) * 100 : null;
  return { current_price: cur, value, pnlAbs, pnlPct, dayPct };
}
function portfolioMetrics() {
  let totalValue = 0, totalCost = 0;
  let alloc = {};
  let dayChangeAbs = 0;
  for (const h of state.holdings) {
    const m = holdingMetrics(h);
    if (m.value != null) {
      totalValue += m.value;
      alloc[h.asset_class] = (alloc[h.asset_class] || 0) + m.value;
      const p = state.prices[h.symbol];
      if (p && p.prev_close) {
        const prevValue = p.prev_close * h.quantity;
        dayChangeAbs += (m.value - prevValue);
      }
    }
    totalCost += h.avg_cost_total;
  }
  const totalPnL = totalValue - totalCost;
  const totalPnLPct = totalCost > 0 ? (totalPnL / totalCost) * 100 : 0;
  const dayPct = (totalValue - dayChangeAbs) > 0 ? (dayChangeAbs / (totalValue - dayChangeAbs)) * 100 : 0;
  return { totalValue, totalCost, totalPnL, totalPnLPct, dayChangeAbs, dayPct, alloc };
}

function getThemeColors() {
  const css = getComputedStyle(document.documentElement);
  return {
    bg: css.getPropertyValue("--bg-card").trim(),
    text: css.getPropertyValue("--ink").trim(),
    muted: css.getPropertyValue("--ink-muted").trim(),
    rule: css.getPropertyValue("--rule").trim(),
    green: css.getPropertyValue("--green").trim(),
    red:   css.getPropertyValue("--red").trim(),
    accent: css.getPropertyValue("--accent").trim(),
    gold: css.getPropertyValue("--gold").trim(),
  };
}
function renderChart(symbol, range) {
  const price = state.prices[symbol];
  if (!price || !price.ohlcv) return;
  const c = getThemeColors();
  const el = $("#chart");
  if (!el || !window.LightweightCharts) return;
  el.innerHTML = "";
  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: c.bg }, textColor: c.muted, fontFamily: "'IBM Plex Mono', monospace" },
    grid: { vertLines: { color: c.rule, style: 1 }, horzLines: { color: c.rule, style: 1 } },
    crosshair: { mode: 1, vertLine: { color: c.muted, width: 1, style: 2 }, horzLine: { color: c.muted, width: 1, style: 2 } },
    rightPriceScale: { borderColor: c.rule },
    timeScale: { borderColor: c.rule, timeVisible: false, secondsVisible: false },
    handleScroll: true, handleScale: true, height: 280,
  });
  const candle = chart.addCandlestickSeries({
    upColor: c.green, downColor: c.red,
    borderUpColor: c.green, borderDownColor: c.red,
    wickUpColor: c.green, wickDownColor: c.red,
  });
  const now = Date.now();
  const rangeMs = { "1M": 30*864e5, "3M": 90*864e5, "6M": 180*864e5, "1Y": 365*864e5, "ALL": Infinity }[range];
  const filtered = price.ohlcv.filter(d => (now - d.t) <= rangeMs);
  const data = filtered.map(d => ({ time: Math.floor(d.t / 1000), open: d.o, high: d.h, low: d.l, close: d.c }));
  candle.setData(data);
  const closes = filtered.map(d => d.c);
  const times  = filtered.map(d => Math.floor(d.t / 1000));
  function maSeries(period, color) {
    if (closes.length < period) return null;
    const series = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    const out = [];
    for (let i = period - 1; i < closes.length; i++) {
      const slice = closes.slice(i - period + 1, i + 1);
      const avg = slice.reduce((a,b) => a + b, 0) / period;
      out.push({ time: times[i], value: avg });
    }
    series.setData(out);
    return series;
  }
  maSeries(20, c.gold);
  maSeries(50, c.accent);
  maSeries(200, c.muted);
  chart.timeScale().fitContent();
  state.chart = chart;
}
function setRange(r, symbol) {
  state.selectedRange = r;
  try { renderChart(symbol, r); } catch (e) { console.warn(e); }
  $$(".range-btn").forEach(b => b.classList.toggle("active", b.textContent === r));
}

async function loadIndicators(symbol) {
  try {
    const r = await fetch(`${WORKER_URL}/indicators/${encodeURIComponent(symbol)}`);
    const j = await r.json();
    const ind = j.indicators || {};
    const macdCross = ind.macd?.crossover || "none";
    const rsiClass = ind.rsi14 > 70 ? "warn" : ind.rsi14 < 30 ? "warn" : "";
    const trendClass = ind.trend === "above_200ma" ? "pos" : "neg";
    const macdClass = macdCross.startsWith("bullish") ? "pos" : macdCross.startsWith("bearish") ? "neg" : "";
    const strip = $("#indStrip");
    if (!strip) return;
    strip.innerHTML = `
      <div class="ind-cell"><div class="label">RSI 14</div><div class="val ${rsiClass}">${ind.rsi14 ? ind.rsi14.toFixed(1) : '—'}</div></div>
      <div class="ind-cell"><div class="label">MACD</div><div class="val ${macdClass}">${macdCross.replace(/_/g, ' ')}</div></div>
      <div class="ind-cell"><div class="label">Trend</div><div class="val ${trendClass}">${ind.trend === 'above_200ma' ? 'Above 200' : 'Below 200'}</div></div>
      <div class="ind-cell"><div class="label">52W</div><div class="val">${ind.pct_from_52w_high ? ind.pct_from_52w_high.toFixed(1) + '%' : '—'}</div></div>
    `;
  } catch (e) { console.warn("indicators load failed", e); }
}

async function runAnalysis(symbol) {
  const btn = $(`[data-act="run-analysis"][data-symbol="${symbol}"]`);
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Analyzing…'; btn.disabled = true; }
  try {
    const holding = state.holdings.find(h => h.symbol === symbol);
    const idToken = await auth.currentUser.getIdToken();
    const m = portfolioMetrics();
    const portfolioContext = {
      total_value: m.totalValue,
      total_cost: m.totalCost,
      total_pnl_pct: m.totalPnLPct,
      allocation_by_class: m.alloc,
    };
    const r = await fetch(`${WORKER_URL}/analyze`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        uid: state.uid, symbol,
        holding: holding ? { quantity: holding.quantity, avg_cost: holding.avg_cost_unit } : null,
        portfolio_context: portfolioContext,
        idToken,
      }),
    });
    if (!r.ok) {
      const text = await r.text();
      throw new Error(text);
    }
    const j = await r.json();
    if (j.analysis) {
      state.analyses[symbol] = {
        ...j.analysis, symbol,
        generated_at: new Date().toISOString(),
        current_price: j.current_price,
      };
      toast("Analysis complete");
      renderAssetDetail(symbol);
    } else throw new Error("No analysis returned");
  } catch (e) {
    toast("Analysis failed: " + (e.message || "unknown error").slice(0, 80), 3000, "error");
    if (btn) { btn.innerHTML = "Try Again"; btn.disabled = false; }
  }
}

async function runPortfolioAnalysis() {
  const btn = $('[data-act="run-portfolio-analysis"]');
  if (btn) {
    btn.style.opacity = "0.6";
    btn.style.pointerEvents = "none";
    const lbl = btn.querySelector(".lbl");
    if (lbl) lbl.innerHTML = '<span class="spinner"></span> Analyzing portfolio…';
  }
  try {
    const idToken = await auth.currentUser.getIdToken();
    const m = portfolioMetrics();
    const r = await fetch(`${WORKER_URL}/analyze-portfolio`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        uid: state.uid,
        idToken,
        holdings: state.holdings,
        portfolio_metrics: m,
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    if (j.analysis) {
      state.portfolioAnalysis = {
        ...j.analysis,
        generated_at: new Date().toISOString(),
      };
      toast("Portfolio analysis complete");
      renderPortfolio();
    } else throw new Error("No analysis returned");
  } catch (e) {
    toast("Portfolio analysis failed: " + (e.message || "unknown").slice(0, 80), 3000, "error");
    if (btn) {
      btn.style.opacity = "1"; btn.style.pointerEvents = "all";
      const lbl = btn.querySelector(".lbl");
      if (lbl) lbl.textContent = "Run Portfolio Analysis";
    }
  }
}

async function checkAlerts() {
  const alerts = await loadAlerts();
  for (const a of alerts) {
    const p = state.prices[a.symbol];
    if (!p) continue;
    const cur = p.current_price;
    const trigger = (a.type === "price_above" && cur > a.threshold) || (a.type === "price_below" && cur < a.threshold);
    if (trigger) {
      toast(`${a.symbol} ${a.type === 'price_above' ? 'crossed above' : 'dropped below'} $${fmtUSD(a.threshold)}`);
      await db.collection("users").doc(state.uid).collection("alerts").doc(a.id).update({
        active: false,
        triggered_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
  }
}

    analyses: state.analyses,

  const a = document.createElement("a");
  a.href = url;
  a.download = `portfolio_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================================
// MODALS
// ============================================================================
function openModal(html) {
  $("#modal").innerHTML = `<div class="modal-handle"></div>` + html;
  $("#modalBg").classList.add("show");
  $("#modal").classList.add("show");
}
function closeModal() {
  $("#modalBg").classList.remove("show");
  $("#modal").classList.remove("show");
}

function openAddHolding() {
  openModal(`
    <div class="modal-head"><h3>Add Holding</h3></div>
    <div class="field">
      <label>Asset Class</label>
      <select id="ah_class">
        ${ASSET_CLASSES.map(c => `<option value="${c.value}">${c.label}</option>`).join("")}
      </select>
    </div>
    <div id="ah_dynamic"></div>
    <button class="btn btn-block" data-act="submit-add" style="margin-top:8px;">Add</button>
  `);
  $("#ah_class").addEventListener("change", onAddClassChange);
  onAddClassChange();
}
function onAddClassChange() {
  const cls = $("#ah_class").value;
  const dyn = $("#ah_dynamic");
  if (cls === "cash") {
    dyn.innerHTML = `
      <div class="field">
        <label>Amount (USD)</label>
        <input id="ah_cash" type="number" step="any" placeholder="0.00" />
        <div class="field-hint">For cash positions, enter the dollar amount you hold.</div>
      </div>`;
  } else {
    dyn.innerHTML = `
      <div class="field" style="position:relative;">
        <label>Symbol</label>
        <input id="ah_symbol" placeholder="e.g. AAPL, BTC, SWRD" autocomplete="off" />
        <div id="ah_search_results" class="search-results hidden"></div>
        <div class="field-hint">Type to search or enter ticker directly.</div>
      </div>
      <div class="field-row">
        <div class="field"><label>Quantity</label><input id="ah_qty" type="number" step="any" placeholder="0" /></div>
        <div class="field"><label>Total Cost (USD)</label><input id="ah_cost" type="number" step="any" placeholder="0" /></div>
      </div>
      <div class="field"><label>Display Name (optional)</label><input id="ah_name" placeholder="e.g. Apple Inc." /></div>
    `;
    const symInput = $("#ah_symbol");
    symInput.addEventListener("input", debouncedSearch);
  }
}
const debouncedSearch = debounce(async () => {
  const q = $("#ah_symbol")?.value.trim();
  const results = $("#ah_search_results");
  if (!q || q.length < 1) { results.classList.add("hidden"); return; }
  try {
    const r = await fetch(`${WORKER_URL}/search?q=${encodeURIComponent(q)}`);
    const j = await r.json();
    const items = (j.results || []).slice(0, 6);
    if (items.length === 0) { results.classList.add("hidden"); return; }
    results.innerHTML = items.map(item => `
      <div class="search-result" data-act="pick-symbol" data-symbol="${escAttr(item.symbol)}" data-name="${escAttr(item.name || '')}">
        <span class="ex">${escAttr(item.exchange || '')}</span>
        <div class="sym">${escAttr(item.symbol)}</div>
        <div class="nm">${escAttr(item.name || '')}</div>
      </div>
    `).join("");
    results.classList.remove("hidden");
  } catch (e) { results.classList.add("hidden"); }
}, 300);

async function submitAddHolding() {
  const cls = $("#ah_class").value;
  if (cls === "cash") {
    const amount = parseFloat($("#ah_cash").value);
    if (!amount || amount <= 0) { toast("Enter a valid amount", 2400, "error"); return; }
    const existing = state.holdings.find(h => h.symbol === "CASH");
    if (existing) {
      const newQty = existing.quantity + amount;
      await db.collection("users").doc(state.uid).collection("holdings").doc("CASH").update({ quantity: newQty, avg_cost_total: newQty });
      toast(`Cash updated to $${fmtUSD(newQty, 2)}`);
    } else {
      await db.collection("users").doc(state.uid).collection("holdings").doc("CASH").set({
        symbol: "CASH", asset_class: "cash",
        quantity: amount, avg_cost_total: amount, avg_cost_unit: 1,
        currency: "USD", name: "Cash (USD)",
        added_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
      toast("Cash added");
    }
    closeModal();
    await loadHoldingsFromFirestore();
    await refreshAllPrices();
    renderCurrentView();
    return;
  }
  const symbol = $("#ah_symbol").value.trim().toUpperCase();
  const qty    = parseFloat($("#ah_qty").value);
  const cost   = parseFloat($("#ah_cost").value);
  const name   = $("#ah_name").value.trim() || symbol;
  if (!symbol || !qty || !cost) { toast("Fill all fields", 2400, "error"); return; }
  await db.collection("users").doc(state.uid).collection("holdings").doc(symbol).set({
    symbol, asset_class: cls,
    quantity: qty, avg_cost_total: cost, avg_cost_unit: cost / qty,
    currency: "USD", name,
    added_at: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true });
  toast("Holding added");
  closeModal();
  await loadHoldingsFromFirestore();
  await refreshAllPrices();
  renderCurrentView();
}

function openEditHolding(symbol) {
  const h = state.holdings.find(x => x.symbol === symbol);
  if (!h) return;
  const isCash = h.asset_class === "cash";
  openModal(`
    <div class="modal-head"><h3>Edit ${escAttr(symbol)}</h3></div>
    ${isCash ? `
      <div class="field"><label>Amount (USD)</label><input id="eh_cash" type="number" step="any" value="${h.quantity}" /></div>
    ` : `
      <div class="field-row">
        <div class="field"><label>Quantity</label><input id="eh_qty" type="number" step="any" value="${h.quantity}" /></div>
        <div class="field"><label>Total Cost (USD)</label><input id="eh_cost" type="number" step="any" value="${h.avg_cost_total}" /></div>
      </div>
      <div class="field"><label>Display Name</label><input id="eh_name" value="${escAttr(h.name || '')}" /></div>
    `}
    <button class="btn btn-block" data-act="submit-edit" data-symbol="${escAttr(symbol)}">Save Changes</button>
  `);
}
async function submitEditHolding(symbol) {
  const h = state.holdings.find(x => x.symbol === symbol);
  if (!h) return;
  if (h.asset_class === "cash") {
    const amount = parseFloat($("#eh_cash").value);
    if (!amount || amount <= 0) { toast("Enter a valid amount", 2400, "error"); return; }
    await db.collection("users").doc(state.uid).collection("holdings").doc(symbol).update({ quantity: amount, avg_cost_total: amount });
  } else {
    const qty = parseFloat($("#eh_qty").value);
    const cost = parseFloat($("#eh_cost").value);
    const name = $("#eh_name").value.trim();
    if (!qty || !cost) { toast("Fill all fields", 2400, "error"); return; }
    await db.collection("users").doc(state.uid).collection("holdings").doc(symbol).update({
      quantity: qty, avg_cost_total: cost, avg_cost_unit: cost / qty, name,
    });
  }
  toast("Updated");
  closeModal();
  await loadHoldingsFromFirestore();
  renderAssetDetail(symbol);
}

function confirmDeleteHolding(symbol) {
  if (confirm(`Remove ${symbol} from your portfolio? This won't delete past analyses or journal entries.`)) {
    deleteHolding(symbol);
  }
}
async function deleteHolding(symbol) {
  await db.collection("users").doc(state.uid).collection("holdings").doc(symbol).delete();
  toast(`${symbol} removed`);
  await loadHoldingsFromFirestore();
  state.selectedSymbol = null;
  setView("portfolio");
}

function openLogTrade(symbol) {
  const sigSnapshot = symbol && state.analyses[symbol] ? state.analyses[symbol] : null;
  const stanceLabel = sigSnapshot?.stance || sigSnapshot?.signal || null;
  openModal(`
    <div class="modal-head"><h3>Log Trade</h3></div>
    <div class="field-row">
      <div class="field"><label>Symbol</label><input id="lt_symbol" value="${escAttr(symbol || '')}" /></div>
      <div class="field"><label>Action</label>
        <select id="lt_action">
          <option value="buy">Buy</option>
          <option value="sell">Sell</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Quantity</label><input id="lt_qty" type="number" step="any" /></div>
      <div class="field"><label>Price (USD)</label><input id="lt_price" type="number" step="any" /></div>
    </div>
    <div class="field">
      <label>Reason / Thesis</label>
      <textarea id="lt_reason" rows="3" placeholder="Why did you make this trade?" style="font-family:var(--sans);"></textarea>
    </div>
    ${stanceLabel ? `<div style="font-family:var(--mono);font-size:10.5px;color:var(--ink-muted);margin-bottom:14px;padding:10px;background:var(--bg-elev);border-radius:6px;">App stance: ${escAttr(stanceLabel)} · ${escAttr(sigSnapshot.confidence || "")} confidence</div>` : ""}
    <button class="btn btn-block" data-act="submit-trade" ${stanceLabel ? `data-sig="${escAttr(stanceLabel)}" data-conf="${escAttr(sigSnapshot.confidence || '')}"` : ""}>Save</button>
  `);
}
async function submitTrade(sig, conf) {
  const symbol = $("#lt_symbol").value.trim().toUpperCase();
  const action = $("#lt_action").value;
  const qty    = parseFloat($("#lt_qty").value);
  const price  = parseFloat($("#lt_price").value);
  const reason = $("#lt_reason").value.trim();
  if (!symbol || !qty || !price) { toast("Fill all fields", 2400, "error"); return; }
  await db.collection("users").doc(state.uid).collection("journal").add({
    symbol, action, quantity: qty, price, reason,
    date: new Date().toISOString().slice(0, 10),
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    signal_at_time: sig || null,
    confidence_at_time: conf || null,
  });
  toast("Trade logged");
  closeModal();
  if (state.currentView === "journal") renderJournal();
}

function openAddAlert() {
  const opts = state.holdings.filter(h => h.asset_class !== "cash").map(h => `<option value="${escAttr(h.symbol)}">${escAttr(h.symbol)}</option>`).join("");
  openModal(`
    <div class="modal-head"><h3>New Alert</h3></div>
    <div class="field"><label>Symbol</label><select id="al_symbol">${opts}</select></div>
    <div class="field"><label>Trigger</label>
      <select id="al_type">
        <option value="price_above">Price above</option>
        <option value="price_below">Price below</option>
      </select>
    </div>
    <div class="field"><label>Threshold (USD)</label><input id="al_threshold" type="number" step="any" /></div>
    <button class="btn btn-block" data-act="submit-alert">Create Alert</button>
  `);
}
async function submitAlert() {
  const symbol = $("#al_symbol").value;
  const type   = $("#al_type").value;
  const threshold = parseFloat($("#al_threshold").value);
  if (!symbol || !threshold) { toast("Fill all fields", 2400, "error"); return; }
  await db.collection("users").doc(state.uid).collection("alerts").add({
    symbol, type, threshold, active: true,
    created_at: firebase.firestore.FieldValue.serverTimestamp(),
  });
  toast("Alert created");
  closeModal();
  if (state.currentView === "alerts") renderAlerts();
}

// ============================================================================
// EVENT DELEGATION
// ============================================================================
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-act], [data-view]");
  if (!target) return;

  if (target.dataset.view) {
    setView(target.dataset.view);
    return;
  }

  const act = target.dataset.act;
  const symbol = target.dataset.symbol;

  try {
    switch (act) {
      case "open-asset":             openAsset(symbol); break;
      case "back-markets":           backToMarkets(); break;
      case "set-range":              setRange(target.dataset.range, symbol); break;
      case "run-analysis":           runAnalysis(symbol); break;
      case "run-portfolio-analysis": runPortfolioAnalysis(); break;
      case "log-trade":              openLogTrade(symbol); break;
      case "add-holding":            openAddHolding(); break;
      case "submit-add":             submitAddHolding(); break;
      case "edit-holding":           openEditHolding(symbol); break;
      case "submit-edit":            submitEditHolding(symbol); break;
      case "delete-holding":         confirmDeleteHolding(symbol); break;
      case "submit-trade":           submitTrade(target.dataset.sig, target.dataset.conf); break;
      case "add-alert":              openAddAlert(); break;
      case "submit-alert":           submitAlert(); break;
      case "delete-alert":           deleteAlert(target.dataset.id); break;
      case "pick-symbol":
        $("#ah_symbol").value = target.dataset.symbol;
        $("#ah_name").value = target.dataset.name || "";
        $("#ah_search_results").classList.add("hidden");
        break;
      case "toggle-theme":           toggleTheme(); break;
      case "reset-pin":              resetPin(); break;
      case "manual-refresh":         manualRefresh(); break;
      case "export-data":            exportData(); break;
    }
  } catch (err) {
    showError("Action failed: " + err.message);
  }
});

$("#themeBtn").addEventListener("click", toggleTheme);
$("#refreshBtn").addEventListener("click", manualRefresh);
$("#modalBg").addEventListener("click", closeModal);

window.addEventListener("load", () => { setTimeout(showPinScreen, 600); });

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
