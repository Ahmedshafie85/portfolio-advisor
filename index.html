  padding: 0 18px 10px;
  border-bottom: 1px solid var(--rule-soft);
}
.lb-control-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 6px;
}
.lb-control-label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; color: var(--ink-muted);
  text-transform: uppercase;
  width: 70px; flex-shrink: 0;
}
.lb-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.lb-tf-pill, .lb-sort-pill {
  background: var(--bg-elev);
  border: 1px solid var(--rule-soft);
  border-radius: 14px;
  padding: 4px 11px;
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-soft);
  cursor: pointer;
}
.lb-tf-pill.active, .lb-sort-pill.active {
  background: var(--ink); color: var(--bg); border-color: var(--ink);
}
.lb-actions-row {
  margin-top: 8px;
  display: flex; gap: 8px;
}
.lb-disclaimer {
  padding: 10px 18px;
  background: rgba(176,141,60,0.08);
  border-bottom: 1px solid var(--rule-soft);
  font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-soft);
  line-height: 1.5;
}
.lb-disclaimer strong {
  font-weight: 600;
  color: var(--gold);
}
.lb-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--rule-soft);
}
.lb-row:last-child { border-bottom: none; }
.lb-rank {
  font-family: var(--display); font-size: 16px; font-weight: 600;
  color: var(--ink-muted);
  width: 22px; flex-shrink: 0;
  padding-top: 2px;
}
.lb-main { flex: 1; min-width: 0; }
.lb-symline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lb-sym {
  font-family: var(--display); font-size: 14px; font-weight: 600;
}
.lb-cat {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--ink-muted);
  padding: 2px 6px; background: var(--bg-elev); border-radius: 3px;
}
.lb-tag {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em;
  padding: 2px 6px; border-radius: 3px; text-transform: uppercase;
}
.lb-tag.held   { background: rgba(74,122,74,0.15); color: var(--green); }
.lb-tag.onlist { background: rgba(176,141,60,0.15); color: var(--gold); }
.lb-name {
  font-family: var(--sans); font-size: 11.5px; color: var(--ink-soft);
  margin-top: 2px; line-height: 1.3;
}
.lb-stats {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-top: 4px;
  font-family: var(--mono); font-size: 10.5px;
}
.lb-stat.pos { color: var(--green); }
.lb-stat.neg { color: var(--red); }
.lb-stat.warn { color: var(--red); }
.lb-stat.med { color: var(--gold); }
.lb-stat.ok  { color: var(--ink-soft); }
.lb-actions {
  display: flex; flex-direction: column; gap: 5px;
  flex-shrink: 0;
}
.lb-actions .btn { white-space: nowrap; padding: 5px 10px; font-size: 10.5px; }

/* ===== DISCOVER IDEAS (curated research) ===== */
.discover-card {
  margin: 18px 20px 24px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.discover-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--gold) 0%, var(--green) 100%);
}
.discover-card.collapsed { cursor: pointer; }
.discover-card.collapsed:hover { background: var(--bg-elev); }
.discover-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 18px 12px;
}
.discover-head h3 {
  font-family: var(--display); font-size: 17px; font-weight: 500;
}
.discover-sub {
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  margin-top: 4px;
}
.discover-disclaimer {
  padding: 8px 18px;
  background: var(--bg-elev);
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  line-height: 1.5;
  border-top: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
}
.discover-theme-block { padding: 4px 0; }
.discover-theme-head {
  padding: 12px 18px 4px;
  font-family: var(--mono); font-size: 10px;
  color: var(--ink-soft); letter-spacing: 0.10em;
  text-transform: uppercase; font-weight: 600;
}
.discover-item {
  padding: 12px 18px;
  border-top: 1px solid var(--rule-soft);
}
.discover-item-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  margin-bottom: 6px;
}
.discover-actions-row {
  display: flex; gap: 6px; align-items: center;
  flex-shrink: 0;
}
.discover-actions-row .btn { white-space: nowrap; }
.discover-sym {
  font-family: var(--display); font-size: 14px; font-weight: 600;
  margin-right: 6px;
}
.discover-name {
  font-family: var(--sans); font-size: 12px; color: var(--ink-soft);
}
.discover-tag {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
  padding: 4px 9px; border-radius: 3px; text-transform: uppercase;
  flex-shrink: 0;
}
.discover-tag.held   { background: rgba(74,122,74,0.15); color: var(--green); }
.discover-tag.onlist { background: rgba(176,141,60,0.15); color: var(--gold); }
.discover-thesis {
  font-family: var(--sans); font-size: 12.5px; color: var(--ink);
  line-height: 1.45; margin-bottom: 8px;
}
.discover-source {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
}
.discover-src::before { content: "via "; }

.discover-actions {
  display: flex; gap: 8px;
  padding: 10px 18px;
  background: var(--bg-elev);
  border-top: 1px solid var(--rule-soft);
}

/* Discover search + theme filter */
.discover-search-bar {
  display: flex; gap: 8px; align-items: center;
  padding: 10px 18px;
  border-top: 1px solid var(--rule-soft);
}
.discover-search-bar input {
  flex: 1;
  padding: 8px 12px;
  background: var(--bg); border: 1px solid var(--rule); border-radius: 6px;
  font-family: var(--sans); font-size: 13px; color: var(--ink);
  -webkit-appearance: none;
}
.discover-search-bar input:focus { outline: none; border-color: var(--ink); }
.discover-clear-btn {
  background: transparent; border: 1px solid var(--rule); border-radius: 6px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
  padding: 7px 11px; color: var(--ink-muted);
  cursor: pointer; text-transform: uppercase;
  white-space: nowrap;
}
.discover-clear-btn:hover { color: var(--ink); border-color: var(--ink); }
.discover-theme-pills {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 0 18px 12px;
  border-bottom: 1px solid var(--rule-soft);
}
.discover-theme-pill {
  background: var(--bg-elev); border: 1px solid var(--rule-soft);
  border-radius: 14px;
  padding: 5px 11px;
  font-family: var(--sans); font-size: 11.5px;
  color: var(--ink-soft); cursor: pointer;
  white-space: nowrap;
  transition: all .12s;
}
.discover-theme-pill:hover { border-color: var(--ink-soft); color: var(--ink); }
.discover-theme-pill.active {
  background: var(--ink); color: var(--bg); border-color: var(--ink);
}
.theme-pill-count {
  font-family: var(--mono); font-size: 9.5px;
  opacity: 0.7; margin-left: 3px;
}
.discover-no-results {
  padding: 24px 18px; text-align: center;
  font-family: var(--mono); font-size: 12px; color: var(--ink-muted);
  font-style: italic;
}
.discover-no-results strong { color: var(--ink); font-style: normal; }
.discover-fresh-badge {
  display: inline-block;
  margin-left: 6px;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
  padding: 2px 6px; border-radius: 3px; text-transform: uppercase;
  background: var(--gold); color: var(--bg);
}

/* Breakout-conditions prompt banner (Portfolio tab) */
.breakout-prompt-card {
  margin: 12px 20px;
  padding: 12px 16px;
  background: rgba(74,122,74,0.08);
  border: 1px solid var(--green);
  border-radius: 6px;
  display: flex; align-items: start; justify-content: space-between; gap: 12px;
}
.breakout-prompt-body { flex: 1; min-width: 0; }
.breakout-prompt-head {
  font-family: var(--display); font-size: 14px; font-weight: 500;
  margin-bottom: 4px;
}
.breakout-prompt-sub {
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  line-height: 1.4; margin-bottom: 8px;
}
.breakout-prompt-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.breakout-prompt-dismiss {
  background: transparent; border: none;
  font-family: var(--display); font-size: 18px;
  color: var(--ink-muted); cursor: pointer;
  padding: 4px 8px; line-height: 1;
  flex-shrink: 0;
}
.breakout-prompt-dismiss:hover { color: var(--red); }

/* ===== STRATEGY TIER HEADERS (bot tab) ===== */
.strategy-tier-header {
  margin: 22px 20px 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule-soft);
}
.strategy-tier-label {
  font-family: var(--display); font-size: 16px; font-weight: 500;
  letter-spacing: -0.01em;
}
.strategy-tier-hint {
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  margin-top: 3px; letter-spacing: 0.02em;
}

/* ===== BUY SUGGESTION CARD (watchlist detail) ===== */
.buy-suggest-card {
  margin: 12px 20px;
  background: var(--bg-card);
  border: 2px solid var(--green);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.buy-suggest-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--green);
}
.buy-suggest-head {
  display: flex; justify-content: space-between; align-items: start; gap: 12px;
  padding: 16px 18px 8px;
}
.buy-suggest-eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.10em;
  color: var(--green); text-transform: uppercase; margin-bottom: 6px;
  font-weight: 600;
}
.buy-suggest-action {
  font-family: var(--display); font-size: 17px; font-weight: 500;
  line-height: 1.3; color: var(--ink); margin-bottom: 4px;
}
.buy-suggest-meta {
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  line-height: 1.4;
}
.buy-suggest-why {
  padding: 0 18px 8px;
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft);
  line-height: 1.45;
}
.buy-suggest-disclaimer {
  padding: 8px 18px;
  background: var(--bg-elev);
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  line-height: 1.5;
  border-top: 1px solid var(--rule-soft);
}
.buy-suggest-actions {
  display: flex; gap: 8px;
  padding: 10px 18px 14px;
  border-top: 1px solid var(--rule-soft);
}

/* ===== DAILY PORTFOLIO SCAN ===== */
.scan-card {
  margin: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.scan-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green) 0%, var(--gold) 50%, var(--red) 100%);
}
.scan-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 18px 10px;
}
.scan-head h3 {
  font-family: var(--display); font-size: 17px; font-weight: 500;
  letter-spacing: -0.01em;
}
.scan-pill {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  background: var(--ink); color: var(--bg);
  padding: 4px 10px; border-radius: 12px;
  text-transform: uppercase;
}
.scan-empty {
  padding: 14px 18px 22px;
  font-family: var(--mono); font-size: 12px; color: var(--ink-muted);
  text-align: center; font-style: italic;
}
.scan-deployment-summary {
  padding: 10px 18px;
  background: var(--bg-elev);
  border-top: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
}
.scan-deployment-summary.low { background: rgba(74,122,74,0.06); }
.scan-deployment-summary.medium { background: rgba(176,141,60,0.06); }
.scan-deployment-summary.high { background: rgba(161,61,45,0.06); }
.sds-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.sds-label {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
  color: var(--ink-muted); text-transform: uppercase;
}
.sds-value {
  font-family: var(--display); font-size: 13px; font-weight: 500;
  color: var(--ink);
  text-align: right;
}
.sds-note {
  margin-top: 4px;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  font-style: italic;
}
.scan-list { padding: 0; }
.scan-item {
  display: grid; grid-template-columns: 28px 1fr auto;
  gap: 12px; align-items: start;
  padding: 12px 18px;
  border-top: 1px solid var(--rule-soft);
  cursor: pointer;
  transition: background-color .12s;
}
.scan-item:hover { background: var(--bg-elev); }
.scan-icon {
  font-family: var(--display); font-size: 22px; font-weight: 700;
  line-height: 1; padding-top: 2px;
  display: flex; justify-content: center;
}
.scan-body { min-width: 0; }
.scan-action {
  font-family: var(--display); font-size: 14px; font-weight: 500;
  margin-bottom: 4px; line-height: 1.35;
}
.scan-why {
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  line-height: 1.4; margin-bottom: 6px;
}
.scan-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.scan-sym {
  font-family: var(--display); font-size: 11px; font-weight: 600;
  padding: 2px 7px; background: var(--bg-elev); border-radius: 3px;
}
.scan-kind {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em;
  padding: 2px 6px; border-radius: 3px;
}
.scan-kind.trim { background: rgba(161,61,45,0.15); color: var(--red); }
.scan-kind.add  { background: rgba(74,122,74,0.15); color: var(--green); }
.scan-kind.open { background: rgba(176,141,60,0.15); color: var(--gold); }
.scan-conf {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em;
  padding: 2px 6px; border-radius: 3px;
  background: var(--bg-elev); color: var(--ink-muted);
  text-transform: uppercase;
}
.scan-conf.high { color: var(--green); }
.scan-conf.low { color: var(--ink-muted); }

/* Recency badges on scan items */
.scan-recency {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
  padding: 2px 6px; border-radius: 3px;
  text-transform: uppercase; font-weight: 600;
}
.scan-recency.new      { background: var(--green); color: var(--bg); }
.scan-recency.stronger { background: var(--gold); color: var(--bg); }
.scan-recency.carried  { background: var(--bg-elev); color: var(--ink-muted); border: 1px solid var(--rule-soft); }
.scan-recency.stale    { background: rgba(161,61,45,0.15); color: var(--red); border: 1px solid var(--red); }

/* Stale scan item — slightly de-emphasized */
.scan-item.stale {
  background: rgba(161,61,45,0.03);
}
.scan-item.stale .scan-action {
  color: var(--ink-soft);
}
.scan-log {
  background: var(--ink); color: var(--bg); border: none;
  padding: 6px 12px; border-radius: 4px;
  font-family: var(--sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.04em; cursor: pointer; align-self: center;
  flex-shrink: 0;
}
.scan-footer {
  padding: 8px 18px;
  border-top: 1px solid var(--rule-soft);
  background: var(--bg-elev);
  font-family: var(--mono); font-size: 10px; color: var(--ink-muted);
  text-align: center; letter-spacing: 0.04em;
}

/* ===== DAILY WATCHOUTS ===== */
.watchouts-card {  margin: 12px 20px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
}
.watchouts-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 8px;
}
.watchouts-head h3 {
  font-family: var(--display); font-size: 15px; font-weight: 500;
}
.watchouts-count {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
  background: var(--bg-elev); color: var(--ink-muted);
  padding: 3px 9px; border-radius: 10px;
  text-transform: uppercase;
}
.watchouts-list {}
.watchout-item {
  display: flex; gap: 12px;
  padding: 11px 18px;
  border-top: 1px solid var(--rule-soft);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background-color .12s;
}
.watchout-item:hover { background: var(--bg-elev); }
.watchout-icon {
  font-family: var(--display); font-size: 20px; line-height: 1;
  width: 22px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.watchout-body { flex: 1; min-width: 0; }
.watchout-title {
  font-family: var(--display); font-size: 14px; font-weight: 500;
  margin-bottom: 2px;
}
.watchout-detail {
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  line-height: 1.4;
}
.watchouts-more {
  padding: 9px 18px; text-align: center;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  background: var(--bg-elev); border-top: 1px solid var(--rule-soft);
  letter-spacing: 0.04em; text-transform: uppercase;
}

/* ===== COLLAPSIBLE ANALYSIS ===== */
.collapsible-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  margin: 12px 20px;
  overflow: hidden;
}

/* Recommended action banner — shown prominently at top of expanded analysis */
.recommended-action-banner {
  margin: 0 20px 12px;
  padding: 14px 16px;
  background: var(--bg-elev);
  border-left: 4px solid var(--ink-soft);
  border-radius: 6px;
}
.recommended-action-banner.compact {
  margin: 12px 20px 0;
  padding: 10px 14px;
}
.recommended-action-banner.buy,
.recommended-action-banner.strong-buy,
.recommended-action-banner.accumulate { border-left-color: var(--green); background: rgba(74,122,74,0.08); }
.recommended-action-banner.sell,
.recommended-action-banner.strong-sell,
.recommended-action-banner.trim,
.recommended-action-banner.reduce { border-left-color: var(--red); background: rgba(161,61,45,0.08); }
.recommended-action-banner.hold,
.recommended-action-banner.wait,
.recommended-action-banner.neutral { border-left-color: var(--gold); background: rgba(176,141,60,0.08); }
.rab-lbl {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.10em;
  text-transform: uppercase; color: var(--ink-muted);
  margin-bottom: 6px;
}
.rab-text {
  font-family: var(--display); font-size: 15px; font-weight: 500;
  line-height: 1.4; color: var(--ink);
}
.rab-inv {
  margin-top: 10px; padding-top: 8px;
  border-top: 1px dashed var(--rule);
  font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
  line-height: 1.45;
}
.rab-inv strong { color: var(--ink); font-weight: 600; }

/* Scenarios mini-collapsible inside the analysis */
.scenarios-collapsible {
  margin: 12px 0;
  padding: 10px 12px;
  background: var(--bg-elev);
  border: 1px solid var(--rule-soft);
  border-radius: 6px;
}
.scenarios-head {
  display: flex; justify-content: space-between; align-items: center;

function showBootError(msg) {

  if (loader) {

    `;
    loader.style.flexDirection = "column";
    loader.style.justifyContent = "center";
    loader.style.alignItems = "center";
  }
}

window.addEventListener("error", (e) => {
  // Always show boot errors visibly during startup
  if (document.getElementById("loader") && !document.getElementById("loader").classList.contains("hidden")) {

const NEWS_CACHE_KEY = "newsCache_v1";
const NEWS_CACHE_TTL_HOURS = 6; // fresh news < 6h old is still useful
function loadNewsCache() {
  try {
    const raw = localStorage.getItem(NEWS_CACHE_KEY);
    if (!raw) return { items: null, fetchedAt: null };
    const cache = JSON.parse(raw);
    if (!cache.fetchedAt) return { items: null, fetchedAt: null };
    const ageHours = (Date.now() - new Date(cache.fetchedAt).getTime()) / 3600000;
    if (ageHours > NEWS_CACHE_TTL_HOURS) return { items: null, fetchedAt: null };
    return { items: Array.isArray(cache.items) ? cache.items : null, fetchedAt: cache.fetchedAt };
  } catch (e) { return { items: null, fetchedAt: null }; }
}

    if (state.newsItems == null) return;

      fetchedAt: state.newsFetchedAt,

const REC_STATUS_KEY = "recStatus_v1";
function loadRecStatus() {
  try {
    const raw = localStorage.getItem(REC_STATUS_KEY);
    const all = raw ? JSON.parse(raw) : {};
    const today = new Date().toISOString().slice(0, 10);
    // Keep only today's entries — yesterday's recs are stale
    const fresh = {};
    for (const [k, v] of Object.entries(all)) {
      if (v && v.date === today) fresh[k] = v;
    }
    return fresh;
  } catch (e) { return {}; }
}

function fmtUSD(n, decimals = 2) {
  if (n == null || isNaN(n)) return "—";
  if (Math.abs(n) >= 1000) return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return n.toFixed(decimals);
}
function fmtPct(n, withSign = true) {
  if (n == null || isNaN(n)) return "—";
  const s = withSign && n > 0 ? "+" : "";
  return s + n.toFixed(2) + "%";
}
function fmtNum(n, decimals = 4) {
  if (n == null || isNaN(n)) return "—";
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: decimals });
}
function fmtRel(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const ms = Date.now() - d.getTime();
  const m = Math.floor(ms / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const days = Math.floor(h / 24);
  if (days < 7) return days + "d ago";
  return d.toLocaleDateString();
}
function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function toast(msg, ms = 2400, type = "default") {
  const el = $("#toast");
  el.textContent = msg;
  el.className = "toast show" + (type === "error" ? " error" : "");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}
function escAttr(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}
function signalToClass(s) { return String(s || "neutral").replace(/[^a-z]/g, ""); }
function stanceToClass(s) { return String(s || "HOLD").replace(/[^A-Z]/g, ""); }
function describeCondition(c) {
  switch (c.type) {
    case "rsi_below": return `RSI < ${c.threshold}`;
    case "rsi_above": return `RSI > ${c.threshold}`;
    case "ma_touch": return `MA${c.period || 200} touch (±${c.tolerance_pct || 1.5}%)`;
    case "near_52w_high": return `Within ${c.threshold_pct || 3}% of 52w high`;
    case "near_52w_low": return `Within ${c.threshold_pct || 5}% of 52w low`;
    case "drop_from_peak": return `${c.threshold_pct || 10}% off 90d peak`;
    case "price_above": return `Price > $${c.threshold}`;
    case "price_below": return `Price < $${c.threshold}`;
    case "ma_cross_bullish": return `Golden cross (${c.within_days || 3}d)`;
    case "ma_cross_bearish": return `Death cross (${c.within_days || 3}d)`;
    case "breakout_high": return `${c.period || 50}-day high breakout`;
    case "bollinger_lower": return `At lower BB (${c.period || 20},${c.std || 2}σ)`;
    case "bollinger_upper": return `At upper BB (${c.period || 20},${c.std || 2}σ)`;
    case "momentum_above": return `${c.months || 3}m return > ${c.threshold_pct || 10}%`;
    default: return c.type;
  }
}

let pinBuffer = "", pinMode = "enter", pinFirstTry = "";

function setupPinPad() {
  const pad = $("#pinPad");
  pad.innerHTML = "";
  const keys = [1,2,3,4,5,6,7,8,9,"",0,"⌫"];
  keys.forEach(k => {
    const b = document.createElement("button");
    b.className = "pin-key" + (k === "" ? " empty" : "") + (k === "⌫" ? " del" : "");
    b.textContent = k;
    b.addEventListener("click", () => handlePinKey(k));
    pad.appendChild(b);
  });
}
function handlePinKey(k) {
  $("#pinError").textContent = "";
  if (k === "⌫") pinBuffer = pinBuffer.slice(0, -1);
  else if (typeof k === "number" && pinBuffer.length < 4) pinBuffer += String(k);
  else return;
  updatePinDots();
  if (pinBuffer.length === 4) setTimeout(processPin, 120);
}
function updatePinDots(error = false) {
  $$("#pinDots .pin-dot").forEach((d, i) => {
    d.classList.toggle("filled", i < pinBuffer.length);
    d.classList.toggle("error", error);
  });
}
function processPin() {
  const stored = localStorage.getItem("pinHash");
  if (!stored) {
    if (pinMode === "create") {
      pinFirstTry = pinBuffer; pinBuffer = "";
      pinMode = "confirm";
      updatePinDots();
      $("#pinPrompt").textContent = "Confirm your PIN";
      return;
    }
    if (pinMode === "confirm") {
      if (pinBuffer === pinFirstTry) {
        localStorage.setItem("pinHash", hashPin(pinBuffer));
        unlockApp();
      } else {
        showPinError("PINs don't match. Start over.");
        pinFirstTry = ""; pinBuffer = "";
        pinMode = "create";
        $("#pinPrompt").textContent = "Create a 4-digit PIN";
        updatePinDots();
      }
    }
  } else {
    if (hashPin(pinBuffer) === stored) {
      unlockApp();
    } else {
      state.pinAttempts++;
      showPinError(state.pinAttempts >= 5 ? "Too many attempts." : "Incorrect PIN");
      pinBuffer = "";
      updatePinDots(true);
      setTimeout(() => updatePinDots(false), 400);
    }
  }
}
function showPinError(msg) { $("#pinError").textContent = msg; }
function hashPin(p) {
  let h = 0x811c9dc5;
  for (let i = 0; i < p.length; i++) {
    h ^= p.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(16);
}
function unlockApp() {
  $("#pinScreen").classList.add("hidden");
  $("#topbarMeta").textContent = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  // Check auth state — if signed in (anonymous or email), proceed to app
  // If never authed AND user hasn't opted into anonymous, show auth screen
  const skipAuth = localStorage.getItem("skipAuth") === "1";
  const currentUser = auth.currentUser;
  if (currentUser && (!currentUser.isAnonymous || skipAuth)) {
    enterApp();
  } else {
    showAuthScreen();
  }
}
function showPinScreen() {
  $("#loader").classList.add("hidden");
  $("#pinScreen").classList.remove("hidden");
  setupPinPad();
  if (!localStorage.getItem("pinHash")) {
    pinMode = "create";
    $("#pinPrompt").textContent = "Create a 4-digit PIN";
  }
}

function showAuthScreen() {
  $("#authScreen").classList.remove("hidden");
  $("#authError").textContent = "";
  state.authMode = "signin";
  updateAuthMode();
  $("#authMigrate").classList.add("hidden");
}

function updateAuthMode() {
  const mode = state.authMode || "signin";
  $$(".auth-tab").forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
  $("#authSubmitBtn").textContent = mode === "signup" ? "Create Account" : "Sign In";
  const pwInput = $("#authPassword");
  if (pwInput) pwInput.autocomplete = mode === "signup" ? "new-password" : "current-password";
}

function setAuthMode(mode) {
  state.authMode = mode;
  updateAuthMode();
  $("#authError").textContent = "";
}

async function submitAuth() {
  const email = $("#authEmail").value.trim();
  const password = $("#authPassword").value;
  const errEl = $("#authError");
  errEl.textContent = "";
  const submitBtn = $("#authSubmitBtn");
  if (!email || !password) { errEl.textContent = "Email and password required"; return; }
  if (password.length < 6) { errEl.textContent = "Password must be at least 6 characters"; return; }
  if (submitBtn.disabled) return;
  submitBtn.disabled = true;
  submitBtn.textContent = "...";

  // Capture the anonymous UID BEFORE we sign in (so we can migrate from it)
  const anonUid = (auth.currentUser?.isAnonymous && auth.currentUser?.uid) || null;
  const mode = state.authMode || "signin";

  try {
    if (mode === "signup") {
      await auth.createUserWithEmailAndPassword(email, password);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
    // Auth state listener will update state.uid
    await new Promise(r => setTimeout(r, 200)); // allow listener to settle
    state.uid = auth.currentUser.uid;
    localStorage.removeItem("skipAuth");

    // If we had anonymous data, offer migration
    if (anonUid && anonUid !== state.uid) {
      const hasAnonData = await checkAnonHasData(anonUid);
      if (hasAnonData) {
        state._pendingAnonUid = anonUid;
        $("#authMigrate").classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = mode === "signup" ? "Create Account" : "Sign In";
        return;
      }
    }
    enterApp();
  } catch (e) {
    errEl.textContent = friendlyAuthError(e);
    submitBtn.disabled = false;
    submitBtn.textContent = mode === "signup" ? "Create Account" : "Sign In";
  }
}

function friendlyAuthError(e) {
  const code = e.code || "";
  if (code === "auth/email-already-in-use") return "Email already registered. Try signing in.";
  if (code === "auth/invalid-email") return "That doesn't look like a valid email";
  if (code === "auth/weak-password") return "Password too weak";
  if (code === "auth/user-not-found" || code === "auth/wrong-password" || code === "auth/invalid-credential") return "Email or password incorrect";
  if (code === "auth/too-many-requests") return "Too many attempts. Try again in a moment.";
  if (code === "auth/network-request-failed") return "Network error — check connection";
  return e.message || "Sign-in failed";
}

async function checkAnonHasData(anonUid) {
  try {
    const holdings = await db.collection("users").doc(anonUid).collection("holdings").limit(1).get();
    if (holdings.docs.length > 0) return true;
    const journal = await db.collection("users").doc(anonUid).collection("journal").limit(1).get();
    if (journal.docs.length > 0) return true;
    return false;
  } catch (e) { return false; }
}

async function migrateAnonData(anonUid, newUid) {
  // Copy these subcollections from anon to new account
  const subcollections = ["holdings", "watchlist", "journal", "analyses", "portfolio_analyses", "triggers", "bot"];
  for (const sub of subcollections) {
    try {
      const snap = await db.collection("users").doc(anonUid).collection(sub).get();
      for (const doc of snap.docs) {
        const data = doc.data();
        // Avoid copying serverTimestamp() sentinels (they become null on a re-write); strip them
        delete data.added_at; delete data.last_updated; delete data.timestamp; delete data.saved_at;
        await db.collection("users").doc(newUid).collection(sub).doc(doc.id).set(data, { merge: true });
      }
    } catch (e) { console.warn("migrate failed for", sub, e); }
  }
}

async function handleMigrate(yes) {
  const anonUid = state._pendingAnonUid;
  if (!anonUid) { enterApp(); return; }
  const submitBtn = $("#authSubmitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Importing...";
  $("#authError").textContent = "";
  try {
    if (yes) {
      await migrateAnonData(anonUid, state.uid);
      toast("Data imported");
    }
    state._pendingAnonUid = null;
    enterApp();
  } catch (e) {
    $("#authError").textContent = "Import failed: " + (e.message || e);
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign In";
  }
}

function skipAuth() {
  // Use anonymous account — single device only
  localStorage.setItem("skipAuth", "1");
  if (!auth.currentUser) {
    auth.signInAnonymously().then(() => {
      state.uid = auth.currentUser.uid;
      enterApp();
    }).catch(e => {
      $("#authError").textContent = "Could not start anonymous session: " + (e.message || e);
    });
  } else {
    state.uid = auth.currentUser.uid;
    enterApp();
  }
}

function enterApp() {
  $("#authScreen").classList.add("hidden");
  $("#app").classList.remove("hidden");
  loadInitialData().catch(e => showError("Init: " + e.message));
}

async function signOutUser() {
  if (!confirm("Sign out? You'll need to sign back in to see your synced data.")) return;
  try {
    await auth.signOut();
    localStorage.removeItem("skipAuth");
    location.reload();
  } catch (e) { toast("Sign out failed: " + (e.message || e), 3000, "error"); }
}

async function ensureAuth() {
  // By the time loadInitialData runs, auth has been settled by the auth-screen flow.
  // This is just a safety check + state.uid sync.
  return new Promise((resolve, reject) => {
    if (auth.currentUser) {
      state.uid = auth.currentUser.uid;
      resolve(auth.currentUser);
      return;
    }
    auth.onAuthStateChanged(async user => {
      if (user) { state.uid = user.uid; resolve(user); }
      else {
        try {
          await auth.signInAnonymously();
          state.uid = auth.currentUser.uid;
          resolve(auth.currentUser);
        }
        catch (e) { reject(e); }
      }
    });
  });
}

async function loadInitialData() {
  await ensureAuth();
  await loadHoldingsFromFirestore();
  if (state.holdings.length === 0) await seedHoldings();
  await loadAnalysesFromFirestore();
  await loadPortfolioAnalysis();
  await loadWatchlist();
  if (state.watchlist.length === 0) await seedWatchlist();
  await loadTriggers();
  await loadBotState();
  await refreshAllPrices();
  renderCurrentView();
  // Background scan after first render
  setTimeout(() => runScan().catch(() => {}), 1500);

  // ROUND 1+1.5 AUTO-REFRESH:
  // The verdict math depends on 5 signal sources — Daily Scan (always runs),
  // AI Analyses (per-symbol manual), Macro, Pre-Surge, News, ETF momentum.
  // The latter three previously only ran when the user pressed buttons, which
  // meant the verdict was usually computed with 2-of-5 signals missing.
  // Auto-run each one in the background after first render. Each fetcher has
  // its own cache (Macro 6h, Pre-Surge 12h, News ~6h, ETF leaderboard ~24h)
  // so this is cheap on repeat opens.
  setTimeout(() => { autoRefreshSignals().catch(e => console.warn("auto-refresh:", e)); }, 2000);
}

// Background-fetch every signal the verdict depends on. Each individual
// fetcher decides whether to use cache or hit network; we just kick them off.
async function autoRefreshSignals() {
  // Macro — fetchMacroRegime already returns cached if <6h old
  try {
    const cached = loadMacroCache();
    if (!cached) {
      const m = await fetchMacroRegime();
      state.macro = m;
      renderCurrentView();
    } else {
      state.macro = cached;
    }
  } catch (e) { console.warn("auto macro:", e.message || e); }

  // Pre-Surge — only run if no cached scan from last 12h
  try {
    const lastRanAt = state.preSurgeRanAt ? new Date(state.preSurgeRanAt).getTime() : 0;
    const ageH = (Date.now() - lastRanAt) / 3600000;
    if (!state.preSurge || ageH > 12) {
      await runPreSurge(); // already renders on completion
    }
  } catch (e) { console.warn("auto pre-surge:", e.message || e); }

  // News — refreshNews uses its own freshness logic; only call if no cache
  try {
    if (!state.newsItems || !state.newsFetchedAt) {
      await refreshNews();
    }
  } catch (e) { console.warn("auto news:", e.message || e); }

  // ETF Leaderboard — used as opportunity candidates now
  try {
    if (!state.etfLeaderboard) {
      await fetchEtfLeaderboard(false); // false = use cache if fresh
    }
  } catch (e) { console.warn("auto etf:", e.message || e); }

  renderCurrentView();
}

  state.holdings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  // DIAGNOSTIC: dump cash holdings to console so we can see EXACTLY what
  // shape Firestore returned. If cash is broken on screen, open DevTools
  // console and check the output of this line — it tells us if it's a
  // code issue (logic bug) or a data issue (Firestore record malformed).
  const cashHoldings = state.holdings.filter(h =>
    h.symbol === "CASH" ||
    (typeof h.asset_class === "string" && h.asset_class.toLowerCase() === "cash")
  );
  if (cashHoldings.length === 0) {
    console.warn("[CASH DIAGNOSTIC] No cash holding found in Firestore.");
  } else {
    console.log("[CASH DIAGNOSTIC] Cash holding(s) loaded:", cashHoldings.map(h => ({
      id: h.id,
      symbol: h.symbol,
      asset_class: h.asset_class,
      asset_class_type: typeof h.asset_class,
      quantity: h.quantity,
      quantity_type: typeof h.quantity,
      avg_cost_total: h.avg_cost_total,
      name: h.name,
    })));
  }
}

async function loadTriggers() {

    console.warn("loadTriggers failed (probably no index):", e.message || e);
    // Keep whatever we already have in state.triggers
  }

  try {

    const latest = {};
    snap.docs.forEach(d => {

    });

async function refreshAllPrices() {
  // Build full price-fetch set:
  //   - All non-cash holdings
  //   - All watchlist symbols
  //   - SPY (benchmark for Pre-Surge Relative Strength scoring)
  // Watchlist symbols are usually also fetched by runScan, but having them here
  // means the Pre-Surge scanner has full OHLCV coverage even before /scan runs.
  const symbols = new Set();
  for (const h of state.holdings) if (h.asset_class !== "cash") symbols.add(h.symbol);
  for (const w of state.watchlist) symbols.add(w.symbol);
  symbols.add("SPY"); // benchmark
  const promises = Array.from(symbols).map(sym =>
    fetch(`${WORKER_URL}/price/${encodeURIComponent(sym)}`)
      .then(r => r.json())
      .then(p => { state.prices[sym] = p; })
      .catch(e => console.warn("price fetch failed:", sym, e))
  );
  await Promise.all(promises);
}

// ----- Lazy data fetcher for Pre-Surge scanner -----
// The scanner needs OHLCV for the full universe (watchlist + holdings + ETF_UNIVERSE).
// We don't pre-fetch the entire ETF universe on boot — too heavy. Instead, this
// function fetches any missing symbols on demand (when the scanner runs), with
// concurrency limited to 6 to avoid hammering the worker.
async function ensurePreSurgeData(onProgress) {
  const universe = getPreSurgeUniverse();
  const missing = universe.filter(sym => {
    const p = state.prices[sym];
    return !p || !p.ohlcv || p.ohlcv.length < 150;
  });
  if (missing.length === 0) return { fetched: 0, total: universe.length };

  let fetched = 0;
  // Concurrency 8 — balances first-scan latency (now ~166 symbols with SCAN_UNIVERSE)
  // against not hammering the worker. Yahoo's rate limits tolerate this fine.
  const concurrency = 8;
  const work = missing.slice();
  if (onProgress) onProgress(0, missing.length);

  await Promise.all(Array.from({ length: concurrency }, async () => {
    while (work.length > 0) {
      const sym = work.shift();
      if (!sym) break;
      try {
        const r = await fetch(`${WORKER_URL}/price/${encodeURIComponent(sym)}`);
        if (r.ok) {
          const p = await r.json();
          state.prices[sym] = p;
        }
      } catch (e) { /* tolerate failures */ }
      fetched++;
      if (onProgress) onProgress(fetched, missing.length);
    }
  }));
  return { fetched, total: universe.length };
}

async function runScan() {
  if (state.watchlist.length === 0) return;

  // Try worker /scan first, fall back to client-side computation
  try {
    const idToken = await auth.currentUser.getIdToken();
    const r = await fetch(`${WORKER_URL}/scan`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uid: state.uid, idToken }),
    });
    if (r.ok) {
      const j = await r.json();
      if (j.results && j.results.length) {
        for (const item of j.results) state.watchlistSnapshot[item.symbol] = item;
        state.lastScanAt = new Date().toISOString();
        await loadTriggers();
        if (state.currentView === "portfolio" || state.currentView === "watchlist") renderCurrentView();
        return j;
      }
    }
    throw new Error("scan endpoint failed or returned no results");
  } catch (e) {
    console.warn("worker scan failed, using client-side scan:", e.message || e);
  }

  // Client-side scan
  await fetchWatchlistSnapshot();
  state.lastScanAt = new Date().toISOString();
  // collect triggers from snapshots into local state.triggers
  state.triggers = [];
  for (const w of state.watchlist) {
    const snap = state.watchlistSnapshot[w.symbol];
    if (snap?.triggers?.length) {
      for (const t of snap.triggers) {
        state.triggers.push({
          id: `${w.symbol}_${t.condition_id}_${Date.now()}`,
          symbol: w.symbol,
          condition_id: t.condition_id,
          condition_type: t.type,
          detail: t.detail,
          triggered_at: new Date().toISOString(),
          seen: false,
        });
      }
    }
  }
  if (state.currentView === "portfolio" || state.currentView === "watchlist") renderCurrentView();
  return { results: Object.values(state.watchlistSnapshot) };
}

async function fetchWatchlistSnapshot() {
  if (state.watchlist.length === 0) return;

  // Try worker endpoint first; if it fails, compute client-side.
  try {
    const symbols = state.watchlist.map(w => w.symbol);
    const conditions_by_symbol = {};
    for (const w of state.watchlist) conditions_by_symbol[w.symbol] = w.conditions || [];
    const r = await fetch(`${WORKER_URL}/scan-snapshot`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbols, conditions_by_symbol }),
    });
    if (r.ok) {
      const j = await r.json();
      if (j.results && j.results.length) {
        for (const item of j.results) state.watchlistSnapshot[item.symbol] = item;
        return;
      }
    }
    throw new Error("scan-snapshot empty or failed");
  } catch (e) {
    console.warn("scan-snapshot failed; falling back to client-side TA:", e.message || e);
  }

  // ---- Client-side fallback: fetch prices, compute indicators locally ----
  for (const w of state.watchlist) {
    try {
      const snap = await computeClientSnapshot(w.symbol, w.conditions || []);
      if (snap) state.watchlistSnapshot[w.symbol] = snap;
    } catch (e) {
      console.warn("client snapshot failed for", w.symbol, e.message || e);
    }
  }
}

async function getOhlcv(symbol) {
  // cache for 5 min
  const cached = state.ohlcvCache[symbol];
  if (cached && (Date.now() - cached.fetched_at < 5 * 60 * 1000)) return cached.data;
  let data = null;
  if (state.prices[symbol] && state.prices[symbol].ohlcv) {
    data = state.prices[symbol];
  } else {
    const r = await fetch(`${WORKER_URL}/price/${encodeURIComponent(symbol)}`);
    if (!r.ok) throw new Error(`price fetch ${r.status}`);
    data = await r.json();
    state.prices[symbol] = data;
  }
  state.ohlcvCache[symbol] = { data, fetched_at: Date.now() };
  return data;
}

async function computeClientSnapshot(symbol, conditions) {
  const data = await getOhlcv(symbol);
  if (!data || !data.ohlcv || data.ohlcv.length < 30) {
    return {
      symbol,
      current_price: data?.current_price || null,
      day_change_pct: null,
      rsi14: null, trend: null,
      pct_from_52w_high: null,
      drop_from_peak_90d: null,
      triggers: [],
      setup_score: 0,
    };
  }
  const ohlcv = data.ohlcv;
  const closes = ohlcv.map(d => d.c);
  const highs  = ohlcv.map(d => d.h);
  const lows   = ohlcv.map(d => d.l);
  const cur    = data.current_price ?? closes[closes.length - 1];
  const prev   = data.prev_close ?? closes[closes.length - 2];
  const dayChangePct = prev ? ((cur - prev) / prev) * 100 : null;

  const rsi14 = computeRSI(closes, 14);
  const ma50  = computeMA(closes, 50);
  const ma200 = computeMA(closes, 200);
  const trend = ma200 != null && cur > ma200 ? "above_200ma" : "below_200ma";

  // 52-week range (last 252 sessions ≈ 1 year)
  const yearSlice = closes.slice(-252);
  const yearHighs = highs.slice(-252);
  const yearLows  = lows.slice(-252);
  const high52w = Math.max(...yearHighs);
  const low52w  = Math.min(...yearLows);
  const pctFrom52wHigh = high52w > 0 ? ((cur - high52w) / high52w) * 100 : null;
  const pctFrom52wLow  = low52w > 0  ? ((cur - low52w)  / low52w)  * 100 : null;

  // 90-day peak (drop_from_peak)
  const slice90 = highs.slice(-90);
  const peak90 = slice90.length ? Math.max(...slice90) : null;
  const dropFromPeak90 = peak90 ? ((cur - peak90) / peak90) * 100 : null;

  // MACD
  // MACD removed (no reliable data signal)

  // Evaluate conditions
  const triggers = [];
  for (const c of (conditions || [])) {
    let fired = false;
    let detail = "";
    switch (c.type) {
      case "rsi_below":
        if (rsi14 != null && rsi14 < c.threshold) { fired = true; detail = `RSI ${rsi14.toFixed(1)} < ${c.threshold}`; }
        break;
      case "rsi_above":
        if (rsi14 != null && rsi14 > c.threshold) { fired = true; detail = `RSI ${rsi14.toFixed(1)} > ${c.threshold}`; }
        break;
      case "ma_touch": {
        const period = c.period || 200;
        const tol = c.tolerance_pct || 1.5;
        const ma = computeMA(closes, period);
        if (ma != null) {
          const diffPct = Math.abs((cur - ma) / ma) * 100;
          if (diffPct <= tol) { fired = true; detail = `${diffPct.toFixed(2)}% from MA${period}`; }
        }
        break;
      }
      case "near_52w_high":
        if (pctFrom52wHigh != null && Math.abs(pctFrom52wHigh) <= (c.threshold_pct || 3)) {
          fired = true; detail = `${Math.abs(pctFrom52wHigh).toFixed(2)}% from 52w high`;
        }
        break;
      case "near_52w_low":
        if (pctFrom52wLow != null && pctFrom52wLow <= (c.threshold_pct || 5)) {
          fired = true; detail = `${pctFrom52wLow.toFixed(2)}% above 52w low`;
        }
        break;
      case "drop_from_peak":
        if (dropFromPeak90 != null && dropFromPeak90 <= -(c.threshold_pct || 10)) {
          fired = true; detail = `${dropFromPeak90.toFixed(2)}% off 90d peak`;
        }
        break;
      case "price_above":
        if (cur > c.threshold) { fired = true; detail = `$${cur.toFixed(2)} > $${c.threshold}`; }
        break;
      case "price_below":
        if (cur < c.threshold) { fired = true; detail = `$${cur.toFixed(2)} < $${c.threshold}`; }
        break;
      case "ma_cross_bullish": {
        // MA50 crossed above MA200 within `within_days` sessions
        const within = c.within_days || 3;
        for (let lb = 0; lb <= within; lb++) {
          const i = closes.length - 1 - lb;
          if (i < 200) break;
          const upToI    = closes.slice(0, i + 1);
          const upToIm1  = closes.slice(0, i);
          const m50_i    = computeMA(upToI, 50);
          const m200_i   = computeMA(upToI, 200);
          const m50_im1  = computeMA(upToIm1, 50);
          const m200_im1 = computeMA(upToIm1, 200);
          if (m50_i == null || m200_i == null || m50_im1 == null || m200_im1 == null) continue;
          if (m50_im1 <= m200_im1 && m50_i > m200_i) {
            fired = true; detail = `${lb}d ago`; break;
          }
        }
        break;
      }
      case "ma_cross_bearish": {
        const within = c.within_days || 3;
        for (let lb = 0; lb <= within; lb++) {
          const i = closes.length - 1 - lb;
          if (i < 200) break;
          const upToI    = closes.slice(0, i + 1);
          const upToIm1  = closes.slice(0, i);
          const m50_i    = computeMA(upToI, 50);
          const m200_i   = computeMA(upToI, 200);
          const m50_im1  = computeMA(upToIm1, 50);
          const m200_im1 = computeMA(upToIm1, 200);
          if (m50_i == null || m200_i == null || m50_im1 == null || m200_im1 == null) continue;
          if (m50_im1 >= m200_im1 && m50_i < m200_i) {
            fired = true; detail = `${lb}d ago`; break;
          }
        }
        break;
      }
      case "breakout_high": {
        const period = c.period || 50;
        if (closes.length >= period) {
          const window = closes.slice(-period);
          const winMax = Math.max(...window);
          if (cur >= winMax) { fired = true; detail = `${period}-day high $${cur.toFixed(2)}`; }
        }
        break;
      }
      case "bollinger_lower": {
        const period = c.period || 20;
        const std = c.std || 2;
        const bb = computeBollinger(closes, period, std);
        if (bb && cur <= bb.lower) {
          fired = true; detail = `at lower BB $${bb.lower.toFixed(2)}`;
        }
        break;
      }
      case "bollinger_upper": {
        const period = c.period || 20;
        const std = c.std || 2;
        const bb = computeBollinger(closes, period, std);
        if (bb && cur >= bb.upper) {
          fired = true; detail = `at upper BB $${bb.upper.toFixed(2)}`;
        }
        break;
      }
      case "momentum_above": {
        const months = c.months || 3;
        const threshold = c.threshold_pct || 10;
        const sessionsBack = months * 21; // ~21 trading days per month
        if (closes.length > sessionsBack) {
          const past = closes[closes.length - 1 - sessionsBack];
          const pct = past > 0 ? ((cur - past) / past) * 100 : 0;
          if (pct >= threshold) { fired = true; detail = `${months}m return ${pct.toFixed(1)}%`; }
        }
        break;
      }
    }
    if (fired) triggers.push({ condition_id: c.id, type: c.type, detail });
  }

  // setup score: simple heuristic (more triggers + RSI extremes + drop = higher)
  let score = triggers.length * 25;
  if (rsi14 != null) {
    if (rsi14 < 30) score += 20;
    else if (rsi14 < 40) score += 10;
    else if (rsi14 > 70) score -= 10;
  }
  if (dropFromPeak90 != null && dropFromPeak90 < -10) score += 15;

  return {
    symbol, current_price: cur, day_change_pct: dayChangePct,
    rsi14: rsi14 != null ? Math.round(rsi14 * 10) / 10 : null,
    trend, pct_from_52w_high: pctFrom52wHigh,
    pct_from_52w_low: pctFrom52wLow,
    drop_from_peak_90d: dropFromPeak90,
    triggers, setup_score: score,
  };
}

// ============================================================================
// TECHNICAL INDICATORS (client-side, used by watchlist + bot)
// ============================================================================
function computeRSI(closes, period = 14) {
  if (!closes || closes.length < period + 1) return null;
  let gains = 0, losses = 0;
  for (let i = closes.length - period; i < closes.length; i++) {
    const diff = closes[i] - closes[i - 1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  const avgGain = gains / period;
  const avgLoss = losses / period;
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - (100 / (1 + rs));
}

function computeMA(closes, period) {
  if (!closes || closes.length < period) return null;
  const slice = closes.slice(-period);
  return slice.reduce((a, b) => a + b, 0) / period;
}

// ============================================================================
// PRE-SURGE MATH — leading-indicator helpers for the Pre-Surge scanner
// Free, fully client-side, uses only data already cached in state.prices.
// ============================================================================

// On-Balance Volume time series (Granville 1963).
// Returns array same length as closes; obv[i] = cumulative volume signed by
// direction of close[i] vs close[i-1]. Flat closes contribute 0.
function computeOBVSeries(closes, volumes) {
  if (!closes || !volumes || closes.length !== volumes.length || closes.length < 2) return null;
  const out = new Array(closes.length);
  out[0] = 0;
  for (let i = 1; i < closes.length; i++) {
    const prev = out[i - 1];
    const v = volumes[i] || 0;
    if (closes[i] > closes[i - 1])      out[i] = prev + v;
    else if (closes[i] < closes[i - 1]) out[i] = prev - v;
    else                                 out[i] = prev;
  }
  return out;
}

// Linear-regression slope of a numeric series over its full length.
// Returns slope per-index (i.e. per-bar). Use directly to compare two series.
// For comparing slope MAGNITUDES across scales, divide by the series mean.
function linearSlope(series) {
  if (!series || series.length < 2) return null;
  const n = series.length;
  let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
  for (let i = 0; i < n; i++) {
    sumX += i;
    sumY += series[i];
    sumXY += i * series[i];
    sumXX += i * i;
  }
  const denom = n * sumXX - sumX * sumX;
  if (denom === 0) return 0;
  return (n * sumXY - sumX * sumY) / denom;
}

// Slope normalized to series mean — comparable across series of different scales.
// Returns slope-per-bar as a fraction of the average value (≈ daily % drift).
function normalizedSlope(series) {
  if (!series || series.length < 2) return null;
  const slope = linearSlope(series);
  if (slope == null) return null;
  const mean = series.reduce((a, b) => a + b, 0) / series.length;
  if (Math.abs(mean) < 1e-9) return 0;
  return slope / Math.abs(mean);
}

// Bollinger Bandwidth = (upper - lower) / mid. Returns time-series of bandwidth
// values over the last `lookback` sessions (used for percentile ranking).
function computeBandwidthSeries(closes, period = 20, stdMult = 2, lookback = 126) {
  if (!closes || closes.length < period + lookback) return null;
  const out = [];
  const start = closes.length - lookback;
  for (let i = start; i < closes.length; i++) {
    const slice = closes.slice(i - period + 1, i + 1);
    if (slice.length < period) { out.push(null); continue; }
    const mid = slice.reduce((a, b) => a + b, 0) / period;
    const variance = slice.reduce((s, x) => s + (x - mid) ** 2, 0) / period;
    const std = Math.sqrt(variance);
    out.push(mid > 0 ? ((mid + stdMult * std) - (mid - stdMult * std)) / mid : 0);
  }
  return out;
}

// Returns percentile rank of `value` within `series` (lower = tighter = more compressed).
function percentileRank(series, value) {
  if (!series || series.length === 0 || value == null) return null;
  const valid = series.filter(x => x != null && !isNaN(x));
  if (valid.length === 0) return null;
  let below = 0;
  for (const v of valid) if (v < value) below++;
  return (below / valid.length) * 100;
}

// Comparative Relative Strength series = price[target] / price[bench].
// Both arrays must align by index (same trading days). Returns null if misaligned.
function computeRSSeries(targetCloses, benchCloses) {
  if (!targetCloses || !benchCloses) return null;
  const n = Math.min(targetCloses.length, benchCloses.length);
  if (n < 2) return null;
  // Use the trailing window so the arrays align even if start dates differ
  const tSlice = targetCloses.slice(-n);
  const bSlice = benchCloses.slice(-n);
  const out = [];
  for (let i = 0; i < n; i++) {
    if (bSlice[i] > 0) out.push(tSlice[i] / bSlice[i]);
    else out.push(null);
  }
  return out;
}

// ============================================================================
// MACRO REGIME — DXY + 10Y yield → regime classification + sector mapping
//
// Two macro variables drive cross-asset capital flow more than anything else:
//   • US Dollar Index (DXY): when it falls, dollar-denominated risk assets
//     (gold, silver, EM, long-duration tech, crypto) tend to outperform.
//     When it rises, defensive sectors and US-listed multinationals lag.
//   • 10-Year Treasury Yield: when it falls, long-duration assets (growth tech,
//     REITs, utilities, gold) tend to outperform. When it rises sharply,
//     financials and value tend to outperform; growth tech and metals lag.
//
// The combination produces 4 archetypal regimes. We classify by 252d percentile
// rank of DXY and 50d change in 10Y yield, mapping to a "favors / against"
// list of sectors and a few specific tickers in the user's universe.
//
// Data refresh: localStorage TTL of 6 hours (macro moves slowly).
// ============================================================================

const MACRO_CACHE_KEY = "macroRegime_v1";
const MACRO_TTL_HOURS = 6;

function loadMacroCache() {
  try {
    const raw = localStorage.getItem(MACRO_CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (!c.fetchedAt) return null;
    const ageH = (Date.now() - new Date(c.fetchedAt).getTime()) / 3600000;
    if (ageH > MACRO_TTL_HOURS) return null;
    return c;
  } catch (e) { return null; }
}
function saveMacroCache(payload) {
  try {
    localStorage.setItem(MACRO_CACHE_KEY, JSON.stringify({
      ...payload, fetchedAt: new Date().toISOString(),
    }));
  } catch (e) {}
}

// Returns percentile rank of `value` within `series` (0 = lowest, 100 = highest).
function pctileRank(series, value) {
  const valid = series.filter(x => x != null && !isNaN(x));
  if (valid.length === 0 || value == null) return null;
  let below = 0;
  for (const v of valid) if (v < value) below++;
  return (below / valid.length) * 100;
}

// Given DXY + TNX response, compute the regime classification.
function classifyMacroRegime(raw) {
  if (!raw || !raw.dxy || !raw.tnx) return null;
  const dxyCloses = raw.dxy.ohlcv.map(d => d.c);
  const tnxCloses = raw.tnx.ohlcv.map(d => d.c);
  if (dxyCloses.length < 50 || tnxCloses.length < 50) return null;

  const dxyCur  = raw.dxy.current ?? dxyCloses[dxyCloses.length - 1];
  const tnxRaw  = raw.tnx.current ?? tnxCloses[tnxCloses.length - 1];

  // Yahoo's ^TNX historically returns the yield × 10 (e.g. 45.0 for 4.50%).
  // But the convention has flipped sources/dates in the past — some endpoints
  // return the raw yield (4.5). Self-detect: real 10Y yields trade 1-8% these
  // last 40 years, so a value > 15 must be the ×10 convention.
  const tnxScaleDivisor = tnxRaw > 15 ? 10 : 1;
  const tnxDisplayPct = tnxRaw / tnxScaleDivisor;

  // DXY: 252d percentile rank (low = weak dollar regime = bullish risk/metals)
  const dxy252 = pctileRank(dxyCloses.slice(-252), dxyCur);
  const dxy50  = pctileRank(dxyCloses.slice(-50), dxyCur);
  // DXY 20-day slope (sign matters more than magnitude)
  const dxy20Slope = dxyCloses.length >= 20
    ? (dxyCloses[dxyCloses.length - 1] - dxyCloses[dxyCloses.length - 20]) / dxyCloses[dxyCloses.length - 20] * 100
    : null;

  // 10Y: 50d change in yield (in real % points). Use the same scaling
  // divisor we detected for the current value so the math is consistent
  // regardless of which ^TNX convention Yahoo is currently using.
  const tnxAgo50 = tnxCloses.length >= 50 ? tnxCloses[tnxCloses.length - 50] : null;
  const tnx50Change = tnxAgo50 != null
    ? (tnxRaw - tnxAgo50) / tnxScaleDivisor
    : null;

  // Classify into one of 4 archetypes
  const dxyFalling = (dxy20Slope != null && dxy20Slope < -1.5) || (dxy252 != null && dxy252 < 25);
  const dxyRising  = (dxy20Slope != null && dxy20Slope > 1.5)  || (dxy252 != null && dxy252 > 75);
  const yieldsFalling = tnx50Change != null && tnx50Change < -0.3;
  const yieldsRising  = tnx50Change != null && tnx50Change > 0.3;

  let regime, regimeLabel, regimeBlurb, favors, against;

  if (dxyFalling && yieldsFalling) {
    regime = "risk_on_metals";
    regimeLabel = "Weak Dollar + Falling Yields";
    regimeBlurb = "Strongest tailwind for long-duration risk: metals, growth tech, EM, crypto. Defensive value lags.";
    favors = ["Gold/Silver (ISLN, IGLN, PPLT, GLD, SLV)", "Long-duration tech (QQQ, MSFT, NVDA)", "EM equities (EIMI, VWO, INDA)", "Crypto (BTC, ETH, MSTR)"];
    against = ["Financials (XLF, JPM)", "Dollar-strong defensive (utilities)"];
  } else if (dxyFalling && yieldsRising) {
    regime = "reflation";
    regimeLabel = "Weak Dollar + Rising Yields";
    regimeBlurb = "Reflation trade — commodities and value cyclicals tend to win, long-duration growth and gold get mixed signals.";
    favors = ["Energy (XLE, XOM, CVX)", "Industrials (XLI, CAT, DE)", "EM equities", "Materials"];
    against = ["Long-duration growth", "Utilities", "Gold gets mixed signals — watch DXY break"];
  } else if (dxyRising && yieldsFalling) {
    regime = "deflation_scare";
    regimeLabel = "Strong Dollar + Falling Yields";
    regimeBlurb = "Defensive/flight-to-quality regime — typically a slowdown signal. Treasuries and quality outperform; risk assets struggle.";
    favors = ["Long Treasuries (TLT, IEF)", "Quality defensive (utilities, healthcare)", "Cash"];
    against = ["EM (EIMI, VWO)", "Metals (mixed — gold may benefit from real-yield drop)", "Commodities", "Crypto"];
  } else if (dxyRising && yieldsRising) {
    regime = "risk_off";
    regimeLabel = "Strong Dollar + Rising Yields";
    regimeBlurb = "Risk-off regime — both real rates and dollar headwinds against most asset classes. Cash and short-duration win.";
    favors = ["Cash / short-duration bonds", "Financials (rising yields help margins)", "Dollar-positive defensive"];
    against = ["Metals (ISLN, IGLN, PPLT)", "Long-duration growth (QQQ, tech)", "EM", "Crypto", "MSTR"];
  } else if (dxyFalling) {
    // Dollar clearly falling, yields ambiguous — risk-on bias for metals + crypto
    regime = "weak_dollar_only";
    regimeLabel = "Weak Dollar · Yields Range-Bound";
    regimeBlurb = "Dollar weakness alone is a tailwind for metals and dollar-denominated risk. Yield direction unclear — long-duration growth gets a partial pass.";
    favors = ["Metals (ISLN, IGLN, PPLT)", "EM equities (EIMI, INDA)", "Crypto (BTC, ETH, MSTR)"];
    against = ["Dollar-positive defensive"];
  } else if (dxyRising) {
    regime = "strong_dollar_only";
    regimeLabel = "Strong Dollar · Yields Range-Bound";
    regimeBlurb = "Dollar strength is a headwind for everything dollar-denominated. Metals, EM, and commodities lag; cash and US-positive sectors hold up.";
    favors = ["Cash", "US-domestic large caps", "Financials"];
    against = ["Metals (ISLN, IGLN, PPLT)", "EM", "Crypto", "Commodities"];
  } else if (yieldsFalling) {
    // Yields clearly falling, dollar flat — duration trade
    regime = "duration_rally";
    regimeLabel = "Falling Yields · Dollar Range-Bound";
    regimeBlurb = "Pure duration tailwind. Long-duration growth, long Treasuries, gold (real-yield drop) outperform.";
    favors = ["Long-duration tech (QQQ, MSFT, NVDA)", "Long Treasuries (TLT, IEF)", "Gold (IGLN, GLD)", "REITs"];
    against = ["Financials", "Short-duration value"];
  } else if (yieldsRising) {
    regime = "duration_pain";
    regimeLabel = "Rising Yields · Dollar Range-Bound";
    regimeBlurb = "Yield rise is a pure headwind for long-duration assets. Financials and value cyclicals tend to outperform.";
    favors = ["Financials (JPM, GS)", "Energy", "Short-duration value"];
    against = ["Long-duration tech", "Long Treasuries (TLT)", "Gold", "REITs"];
  } else {
    regime = "neutral";
    regimeLabel = "Range-Bound";
    regimeBlurb = "No clear macro directional bias right now. Focus on idiosyncratic catalysts; cross-asset rotation signals are weak.";
    favors = ["Idiosyncratic stock selection", "Balanced allocation"];
    against = [];
  }

  return {
    regime, regimeLabel, regimeBlurb, favors, against,
    dxy: { current: dxyCur, pctile_252d: dxy252, pctile_50d: dxy50, slope_20d_pct: dxy20Slope, day_change_pct: raw.dxy.day_change_pct },
    tnx: { current: tnxRaw, display_pct: tnxDisplayPct, change_50d_pp: tnx50Change, day_change_pct: raw.tnx.day_change_pct },
  };
}

async function fetchMacroRegime() {
  // Try cache first
  const cached = loadMacroCache();
  if (cached) return cached;
  const r = await fetch(`${WORKER_URL}/macro-regime`);
  if (!r.ok) throw new Error(`macro fetch ${r.status}`);
  const raw = await r.json();
  const classified = classifyMacroRegime(raw);
  if (!classified) throw new Error("macro classification failed (insufficient data)");
  saveMacroCache({ raw, classified });
  return { raw, classified, fetchedAt: new Date().toISOString() };
}

// Map each macro regime to which of the user's holdings get a "favored" tag.
// Lightweight — just sector-class heuristics, not a full mapping.
function userHoldingsMacroVerdict(classified) {
  if (!classified) return { favored: [], headwind: [] };
  const favored = [], headwind = [];
  for (const h of state.holdings) {
    if (h.asset_class === "cash") continue;
    const v = symbolMacroVerdict(h.symbol, h.asset_class, classified.regime);
    if (v === "favored") favored.push(h.symbol);
    else if (v === "headwind") headwind.push(h.symbol);
  }
  // Watchlist too
  for (const w of state.watchlist) {
    const v = symbolMacroVerdict(w.symbol, w.asset_class, classified.regime);
    if (v === "favored" && !favored.includes(w.symbol)) favored.push(w.symbol);
    else if (v === "headwind" && !headwind.includes(w.symbol)) headwind.push(w.symbol);
  }
  return { favored, headwind };
}

function symbolMacroVerdict(symbol, assetClass, regime) {
  // Defensive: this is heuristic — we use asset_class buckets + a few known tickers.
  const metalSyms = new Set(["GLD","SLV","ISLN","IGLN","PPLT","PSLV","SIVR","GDX","GDXJ"]);
  const cryptoProxies = new Set(["BTC","ETH","MSTR","COIN","MARA","RIOT"]);
  const longDurationTech = new Set(["QQQ","MSFT","AAPL","NVDA","GOOGL","AMZN","META","TSLA","ADBE","CRM","NFLX","ORCL","AVGO","AMD"]);
  const emEquity = new Set(["EIMI","VWO","INDA","MCHI","EWJ"]);
  const longTreasuries = new Set(["TLT","IEF","ZROZ","EDV"]);
  const financials = new Set(["JPM","BAC","GS","MS","C","XLF","WFC","SCHW"]);
  const energy = new Set(["XOM","CVX","COP","SLB","EOG","OXY","XLE"]);
  const cyclicals = new Set(["CAT","DE","GE","BA","XLI","XLB"]);

  const isMetal = assetClass === "metal" || metalSyms.has(symbol);
  const isCrypto = assetClass === "crypto" || cryptoProxies.has(symbol);
  const isLDT = longDurationTech.has(symbol);
  const isEM = emEquity.has(symbol);
  const isLT = longTreasuries.has(symbol);
  const isFin = financials.has(symbol);
  const isEnergy = energy.has(symbol);
  const isCyc = cyclicals.has(symbol);

  switch (regime) {
    case "risk_on_metals":
      if (isMetal || isCrypto || isLDT || isEM) return "favored";
      if (isFin) return "headwind";
      return null;
    case "reflation":
      if (isEnergy || isCyc || isEM) return "favored";
      if (isLT || isMetal) return "headwind";
      return null;
    case "deflation_scare":
      if (isLT) return "favored";
      if (isCrypto || isEM || isCyc || isEnergy) return "headwind";
      if (isMetal) return null; // mixed for metals
      return null;
    case "risk_off":
      if (isFin) return "favored";
      if (isMetal || isCrypto || isLDT || isEM) return "headwind";
      return null;
    case "weak_dollar_only":
      if (isMetal || isCrypto || isEM) return "favored";
      return null;
    case "strong_dollar_only":
      if (isMetal || isCrypto || isEM) return "headwind";
      if (isFin) return "favored";
      return null;
    case "duration_rally":
      if (isLDT || isLT || isMetal) return "favored";
      if (isFin) return "headwind";
      return null;
    case "duration_pain":
      if (isFin || isEnergy) return "favored";
      if (isLDT || isLT || isMetal) return "headwind";
      return null;
    case "neutral":
    default:
      return null;
  }
}

// SHORT INTEREST — Days-to-Cover for SCAN_UNIVERSE
// Cached for 24h since FINRA short data is bi-monthly anyway.
// ============================================================================
const SHORT_INTEREST_CACHE_KEY = "shortInterest_v1";
const SHORT_INTEREST_TTL_HOURS = 24;

function loadShortInterestCache() {
  try {
    const raw = localStorage.getItem(SHORT_INTEREST_CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (!c.fetchedAt) return null;
    const ageH = (Date.now() - new Date(c.fetchedAt).getTime()) / 3600000;
    if (ageH > SHORT_INTEREST_TTL_HOURS) return null;
    return c.results || null;
  } catch (e) { return null; }
}
function saveShortInterestCache(results) {
  try {
    localStorage.setItem(SHORT_INTEREST_CACHE_KEY, JSON.stringify({
      results, fetchedAt: new Date().toISOString(),
    }));
  } catch (e) {}
}

async function fetchShortInterestForUniverse(symbols) {
  // Cache hit?
  const cached = loadShortInterestCache();
  if (cached) return cached;
  const r = await fetch(`${WORKER_URL}/short-interest`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ symbols }),
  });
  if (!r.ok) throw new Error(`short-interest fetch ${r.status}`);
  const j = await r.json();
  const results = j.results || {};
  saveShortInterestCache(results);
  return results;
}

// ============================================================================
// PRE-SURGE COMPOSITE SCORER
// Three signals, composite 0-100. Threshold ≥70 = flagged.
//
// SQUEEZE (0-40): Bollinger Bandwidth percentile vs 6-month history.
//   - Bandwidth percentile ≤ 5: 25 pts (severe compression)
//   - Bandwidth percentile ≤ 10: 20 pts (compressed)
//   - Bandwidth percentile ≤ 20: 12 pts (tight)
//   - + days-in-squeeze bonus (max 8 pts): 1 pt per session BW < 10th pctile, capped
//   - + volume-expansion bonus (max 7 pts): today's vol > 1.5× 20d avg AND we're in squeeze
//
// ACCUMULATION (0-30): OBV slope vs price slope over 20 sessions.
//   - normalizedSlope ratio = obvSlope / max(absPriceSlope, smallEpsilon)
//   - Strong (price flat ±2%, OBV slope > 0): 20-30 pts scaled
//   - + up-volume vs down-volume ratio bonus (max 5 pts)
//
// RELATIVE STRENGTH (0-30): RS line slope vs SPY over 50 sessions.
//   - Positive RS slope + flat-to-down absolute price: 15-25 pts scaled
//   - + RS percentile rank vs last 6 months (max 5 pts)
//
// Returns { composite, squeeze, accumulation, rs, breakdown } or null if
// insufficient data.
// ============================================================================
function computePreSurgeScore(symbol, opts = {}) {
  const data = state.prices[symbol];
  if (!data || !data.ohlcv || data.ohlcv.length < 150) return null;

  // Build aligned closes + volumes arrays — skip any bars with bad data so the
  // two arrays stay index-aligned (critical for OBV correctness).
  const closes = [];
  const volumes = [];
  for (const d of data.ohlcv) {
    if (d.c == null || isNaN(d.c)) continue;
    closes.push(d.c);
    volumes.push(d.v != null && !isNaN(d.v) ? d.v : 0);
  }
  if (closes.length < 150) return null;

  const breakdown = [];

  // ---- SQUEEZE ----
  let squeezeScore = 0;
  const bwSeries = computeBandwidthSeries(closes, 20, 2, 126);
  let bwPctile = null;
  let daysInSqueeze = 0;
  let volExpansion = false;
  if (bwSeries && bwSeries.length > 0) {
    const curBw = bwSeries[bwSeries.length - 1];
    // For percentile rank, use the FULL 126-session window
    bwPctile = percentileRank(bwSeries, curBw);
    if (bwPctile != null) {
      if (bwPctile <= 5)       squeezeScore += 25;
      else if (bwPctile <= 10) squeezeScore += 20;
      else if (bwPctile <= 20) squeezeScore += 12;
      // Days-in-squeeze bonus: count trailing sessions where BW was in bottom 10th
      const threshold10 = (() => {
        const sorted = bwSeries.filter(x => x != null).slice().sort((a, b) => a - b);
        return sorted.length ? sorted[Math.floor(sorted.length * 0.10)] : null;
      })();
      if (threshold10 != null) {
        for (let i = bwSeries.length - 1; i >= 0; i--) {
          if (bwSeries[i] != null && bwSeries[i] <= threshold10) daysInSqueeze++;
          else break;
        }
        squeezeScore += Math.min(8, daysInSqueeze);
      }
      // Volume expansion bonus: today's vol > 1.5× 20-day avg, AND we're in squeeze
      if (bwPctile <= 20 && volumes.length >= 21) {
        const todayVol = volumes[volumes.length - 1];
        const avg20 = volumes.slice(-21, -1).reduce((a, b) => a + b, 0) / 20;
        if (avg20 > 0 && todayVol > 1.5 * avg20) {
          volExpansion = true;
          squeezeScore += 7;
        }
      }
    }
  }
  squeezeScore = Math.min(40, Math.max(0, squeezeScore));
  breakdown.push({
    label: "Squeeze",
    score: squeezeScore,
    max: 40,
    detail: bwPctile != null
      ? `BW pctile ${bwPctile.toFixed(0)}% · ${daysInSqueeze}d in squeeze${volExpansion ? " · vol expansion ✓" : ""}`
      : "insufficient data",
  });

  // ---- ACCUMULATION ----
  let accuScore = 0;
  let obvDir = null, priceDir = null;
  if (closes.length >= 20 && volumes.length === closes.length) {
    const recent20Closes = closes.slice(-20);
    const recent20Vols   = volumes.slice(-20);
    const obvSeries = computeOBVSeries(recent20Closes, recent20Vols);
    if (obvSeries) {
      const obvSlopeNorm = normalizedSlope(obvSeries);
      const priceSlopeNorm = normalizedSlope(recent20Closes);
      if (obvSlopeNorm != null && priceSlopeNorm != null) {
        obvDir = obvSlopeNorm;
        priceDir = priceSlopeNorm;
        // Flat-to-down price AND positive OBV slope = textbook accumulation
        if (priceSlopeNorm < 0.002 && obvSlopeNorm > 0) {
          // Scale: stronger OBV climb relative to price flatness = more points
          const ratio = obvSlopeNorm / Math.max(Math.abs(priceSlopeNorm), 0.0005);
          if (ratio > 3)      accuScore += 25;
          else if (ratio > 2) accuScore += 20;
          else if (ratio > 1) accuScore += 14;
          else                accuScore += 8;
        }
        // Up-day vs down-day volume ratio bonus
        let upVol = 0, downVol = 0;
        for (let i = 1; i < recent20Closes.length; i++) {
          if (recent20Closes[i] > recent20Closes[i - 1]) upVol += recent20Vols[i];
          else if (recent20Closes[i] < recent20Closes[i - 1]) downVol += recent20Vols[i];
        }
        if (downVol > 0 && upVol / downVol > 1.5) accuScore += 5;
      }
    }
  }
  accuScore = Math.min(30, Math.max(0, accuScore));
  breakdown.push({
    label: "Accumulation",
    score: accuScore,
    max: 30,
    detail: (obvDir != null && priceDir != null)
      ? `OBV ${obvDir > 0 ? "↑" : "↓"} · Price ${priceDir > 0 ? "↑" : priceDir < -0.002 ? "↓" : "→"}`
      : "insufficient data",
  });

  // ---- RELATIVE STRENGTH ----
  let rsScore = 0;
  let rsSlopeNorm = null, rsPctile = null;
  const bench = opts.benchmarkCloses || state.prices["SPY"]?.ohlcv?.map(d => d.c);
  if (bench && bench.length >= 50 && closes.length >= 50) {
    const tCloses50 = closes.slice(-50);
    const bCloses50 = bench.slice(-50);
    const rs50 = computeRSSeries(tCloses50, bCloses50);
    if (rs50 && rs50.length >= 30) {
      rsSlopeNorm = normalizedSlope(rs50.filter(x => x != null));
      const priceSlopeNorm = normalizedSlope(tCloses50);
      if (rsSlopeNorm != null && priceSlopeNorm != null) {
        // Positive RS slope while price is flat-to-down = capital rotating in quietly
        if (rsSlopeNorm > 0 && priceSlopeNorm < 0.003) {
          if (rsSlopeNorm > 0.003)      rsScore += 25;
          else if (rsSlopeNorm > 0.001) rsScore += 18;
          else                          rsScore += 10;
        } else if (rsSlopeNorm > 0.002) {
          // Even with rising price, strong RS gets some credit
          rsScore += 12;
        }
        // RS percentile bonus
        if (bench.length >= 126 && closes.length >= 126) {
          const rs126 = computeRSSeries(closes.slice(-126), bench.slice(-126));
          if (rs126) {
            const curRS = rs126[rs126.length - 1];
            rsPctile = percentileRank(rs126, curRS);
            if (rsPctile != null && rsPctile > 75) rsScore += 5;
          }
        }
      }
    }
  }
  rsScore = Math.min(30, Math.max(0, rsScore));
  breakdown.push({
    label: "Relative Strength",
    score: rsScore,
    max: 30,
    detail: rsSlopeNorm != null
      ? `RS ${rsSlopeNorm > 0 ? "↑" : "↓"} vs SPY${rsPctile != null ? ` · ${rsPctile.toFixed(0)}th pctile` : ""}`
      : "no SPY benchmark",
  });

  const composite = squeezeScore + accuScore + rsScore;
  return {
    symbol,
    composite,
    squeeze: squeezeScore,
    accumulation: accuScore,
    rs: rsScore,
    breakdown,
    current_price: data.current_price || closes[closes.length - 1],
    flagged_at: new Date().toISOString(),
  };
}

// PRE-SURGE UNIVERSE SCANNER
// Runs computePreSurgeScore across watchlist + non-cash holdings + ETF_UNIVERSE.
// Filters composite ≥ THRESHOLD, ranks descending. Returns array.

// PRE-SURGE SCAN-ONLY UNIVERSE
// ~80 large-cap names the Pre-Surge scanner watches WITHOUT cluttering the
// watchlist UI. These are high-liquidity stocks where leading indicators
// (OBV, BB squeeze, RS rotation) are most reliable — i.e. enough institutional
// flow for accumulation to be detectable on daily bars.
//
// Selection criteria:
//   - US-listed (so SPY benchmark is comparable for RS)
//   - $20B+ market cap, $500M+ avg daily volume
//   - Across all S&P sectors so rotation is detectable
//   - A handful of high-quality mid-caps that move with rotation
//
// If you want to add a name permanently to your watchlist with conditions,
// use the Watchlist tab. SCAN_UNIVERSE just gives Pre-Surge eyes on more names.
// ============================================================================
const SCAN_UNIVERSE = [
  // Mega-cap tech (the gravitational center)

  // Financials
  "JPM","BAC","WFC","GS","MS","C","BLK","SCHW","AXP","V","MA",
  // Healthcare & pharma
  "UNH","JNJ","LLY","MRK","PFE","ABBV","TMO","ABT","DHR","BMY","CVS","ISRG",
  // Consumer
  "WMT","COST","HD","NKE","SBUX","MCD","PG","KO","PEP","DIS","LOW",
  // Energy
