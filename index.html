<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1814" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Opportunity Tester" />
<title>Portfolio Advisor - Opportunity Tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#f5f1e8;
  --panel:#fbf8f0;
  --elev:#ede7d6;
  --ink:#1a1814;
  --soft:#4a4639;
  --muted:#8a8473;
  --rule:#d8d2bf;
  --rule-soft:#e8e2cf;
  --green:#4a7a4a;
  --red:#a13d2d;
  --gold:#b08d3c;
  --blue:#4f6f9f;
  --display:"Fraunces", Georgia, serif;
  --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", "SF Mono", Menlo, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; }
body { min-height:100vh; min-height:100dvh; overflow:hidden; }
button, input, select { font:inherit; }
button { cursor:pointer; }
.hidden { display:none !important; }
.loader {
  position:fixed; inset:0; display:grid; place-items:center; z-index:99;
  background:var(--bg); color:var(--ink);
}
.loader-inner { width:min(320px, 82vw); text-align:center; }
.loader-title { font-family:var(--display); font-size:30px; letter-spacing:-.02em; margin-bottom:16px; }
.loader-bar { height:3px; border-radius:999px; background:var(--rule); overflow:hidden; }
.loader-bar:before { content:""; display:block; height:100%; width:46%; background:var(--ink); border-radius:999px; animation:load 1.2s ease-in-out infinite; }
@keyframes load { 0%{ transform:translateX(-110%);} 100%{ transform:translateX(230%);} }
.app { height:100vh; height:100dvh; display:flex; flex-direction:column; }
.topbar {
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px 14px; border-bottom:1px solid var(--rule); background:rgba(245,241,232,.92);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.top-title { font-family:var(--display); font-size:28px; font-weight:500; letter-spacing:-.02em; line-height:1.05; }
.top-meta { margin-top:4px; color:var(--muted); font-family:var(--mono); font-size:11px; letter-spacing:.04em; }
.icon-btn {
  width:38px; height:38px; border:0; border-radius:50%; background:transparent; color:var(--soft);
  display:grid; place-items:center;
}
.icon-btn:hover { background:var(--elev); color:var(--ink); }
.icon-btn svg { width:21px; height:21px; stroke-width:1.8; }
.view { flex:1; overflow:auto; padding:20px 20px 100px; -webkit-overflow-scrolling:touch; }
.tabs {
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(3,1fr);
  background:rgba(245,241,232,.94); border-top:1px solid var(--rule);
  padding:7px 8px calc(8px + env(safe-area-inset-bottom)); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.tab {
  min-height:66px; border:0; border-radius:10px; background:transparent; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  font-size:12px; font-weight:600; letter-spacing:.03em;
}
.tab svg { width:22px; height:22px; stroke-width:1.7; }
.tab.active { color:var(--ink); box-shadow:inset 0 0 0 2px #0b6fdb; }
.section-title { font-family:var(--display); font-size:28px; font-weight:500; letter-spacing:-.02em; margin-bottom:14px; }
.card {
  background:var(--panel); border:1px solid var(--rule); border-radius:12px; box-shadow:0 14px 35px -28px rgba(26,24,20,.35);
  padding:18px; margin-bottom:18px;
}
.card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:12px; }
.card h3 { font-family:var(--display); font-size:22px; font-weight:500; letter-spacing:-.01em; }
.muted { color:var(--muted); }
.mono { font-family:var(--mono); }
.btn, .btn-secondary, .btn-ghost {
  border-radius:999px; border:1px solid var(--ink); padding:8px 13px; min-height:36px;
  font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
}
.btn { background:var(--ink); color:var(--bg); }
.btn-secondary { background:transparent; color:var(--ink); border-color:var(--rule); }
.btn-ghost { background:transparent; color:var(--soft); border-color:var(--rule); padding:6px 10px; min-height:30px; }
.btn:disabled, .btn-secondary:disabled, .btn-ghost:disabled { opacity:.55; cursor:default; }
.pill-row { display:flex; flex-wrap:wrap; gap:7px; margin:12px 0; }
.pill {
  border:1px solid var(--rule); background:transparent; color:var(--soft); border-radius:999px;
  padding:7px 11px; font-size:12px; font-weight:600;
}
.pill.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.toolbar { display:grid; grid-template-columns:minmax(180px,1fr) repeat(3, minmax(110px,150px)); gap:8px; margin:12px 0; }
.toolbar input, .toolbar select, .setting-input {
  min-height:38px; border:1px solid var(--rule); border-radius:10px; background:rgba(255,255,255,.35);
  color:var(--ink); padding:8px 10px; outline:none;
}
.desk-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:12px 0; }
.desk-cell { border:1px solid var(--rule-soft); background:var(--elev); border-radius:10px; padding:10px; }
.desk-k { display:block; color:var(--muted); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; }
.desk-v { display:block; margin-top:5px; font-family:var(--mono); font-size:20px; font-weight:600; }
.score-legend { color:var(--muted); font-size:12px; margin:8px 0 12px; }
.scan-note, .empty {
  border:1px solid var(--rule-soft); background:rgba(255,255,255,.32); border-radius:10px;
  padding:12px; color:var(--soft); font-size:13px; margin:12px 0;
}
.loading-row { display:flex; align-items:center; gap:10px; color:var(--soft); padding:18px 2px; }
.spinner { width:16px; height:16px; border-radius:50%; border:2px solid var(--rule); border-top-color:var(--ink); animation:spin .8s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
.opp-list { display:grid; gap:11px; margin-top:12px; }
.opp-row {
  display:grid; grid-template-columns:42px minmax(0,1fr); gap:12px; padding:14px;
  border:1px solid var(--rule-soft); border-radius:12px; background:rgba(255,255,255,.28);
}
.rank { font-family:var(--mono); color:var(--muted); font-size:13px; padding-top:3px; }
.sym-row { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
.sym { font-family:var(--mono); font-weight:700; font-size:18px; letter-spacing:-.02em; }
.score, .badge {
  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em;
  border-radius:999px; padding:4px 7px; border:1px solid var(--rule); color:var(--soft);
}
.score.strong { color:var(--green); border-color:rgba(74,122,74,.4); background:rgba(74,122,74,.08); }
.score.good { color:var(--gold); border-color:rgba(176,141,60,.45); background:rgba(176,141,60,.08); }
.score.early { color:var(--blue); border-color:rgba(79,111,159,.35); background:rgba(79,111,159,.08); }
.score.weak { color:var(--muted); }
.badge.pass { color:var(--green); border-color:rgba(74,122,74,.45); background:rgba(74,122,74,.08); }
.badge.workup { color:var(--gold); border-color:rgba(176,141,60,.45); background:rgba(176,141,60,.08); }
.badge.reject { color:var(--red); border-color:rgba(161,61,45,.35); background:rgba(161,61,45,.08); }
.name { color:var(--soft); margin-top:2px; font-size:13px; }
.meta-row, .tag-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.meta {
  font-family:var(--mono); font-size:10.5px; color:var(--soft); border:1px solid var(--rule-soft);
  background:rgba(245,241,232,.7); border-radius:999px; padding:4px 7px;
}
.meta.good { color:var(--green); }
.meta.warn { color:var(--gold); }
.meta.bad { color:var(--red); }
.tag { font-size:11px; color:var(--muted); background:var(--elev); border-radius:999px; padding:4px 7px; }
.reason-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px; }
.reason-box { border:1px solid var(--rule-soft); border-radius:10px; padding:9px; background:rgba(255,255,255,.28); }
.reason-k { display:block; font-family:var(--mono); color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
.reason-v { color:var(--soft); font-size:13px; }
.bars { display:grid; gap:5px; margin-top:10px; max-width:420px; }
.bar-row { display:grid; grid-template-columns:40px minmax(0,1fr) 30px; gap:8px; align-items:center; font-family:var(--mono); font-size:10px; color:var(--muted); }
.bar-track { height:5px; border-radius:999px; background:var(--rule-soft); overflow:hidden; }
.bar-fill { display:block; height:100%; border-radius:999px; background:var(--green); }
.paper-plan { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; margin-top:12px; }
.paper-cell { border:1px solid rgba(74,122,74,.22); border-radius:10px; background:rgba(74,122,74,.07); padding:8px; min-width:0; }
.paper-k { display:block; font-family:var(--mono); color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
.paper-v { display:block; margin-top:3px; font-family:var(--mono); color:var(--ink); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.read { margin-top:11px; padding:11px; border-left:3px solid var(--gold); background:rgba(176,141,60,.07); border-radius:8px; }
.read-one { font-weight:600; color:var(--ink); }
.read-setup { color:var(--soft); font-size:13px; margin-top:4px; }
.read-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px 10px; color:var(--soft); font-size:12px; margin-top:8px; }
.row-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.quality-grid, .perf-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.quality-cell, .perf-cell { border:1px solid var(--rule-soft); border-radius:10px; padding:12px; background:var(--elev); }
.q-k, .p-k { display:block; color:var(--muted); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; }
.q-v, .p-v { display:block; margin-top:6px; font-family:var(--mono); font-size:20px; font-weight:600; }
.good-text { color:var(--green); }
.bad-text { color:var(--red); }
.issue { border:1px solid var(--rule-soft); border-radius:9px; padding:10px 12px; margin-top:8px; color:var(--soft); background:rgba(255,255,255,.3); }
.trade-list { display:grid; gap:10px; }
.trade-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; border:1px solid var(--rule-soft); border-radius:12px; padding:13px; background:rgba(255,255,255,.3); }
.trade-head { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.dir { color:var(--green); font-family:var(--mono); font-weight:700; font-size:12px; text-transform:uppercase; }
.trade-sym { font-family:var(--mono); font-weight:700; }
.paper-badge { font-family:var(--mono); font-size:10px; text-transform:uppercase; padding:3px 7px; border-radius:999px; background:var(--elev); color:var(--muted); }
.qty { color:var(--soft); font-family:var(--mono); font-size:12px; }
.why { margin-top:8px; color:var(--soft); font-size:13px; font-style:italic; }
.trade-meta { margin-top:8px; color:var(--muted); font-family:var(--mono); font-size:12px; }
.outcome { align-self:start; font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; border-radius:999px; padding:6px 9px; border:1px solid var(--rule); color:var(--muted); }
.outcome.successful { color:var(--green); border-color:rgba(74,122,74,.42); background:rgba(74,122,74,.08); }
.outcome.failed { color:var(--red); border-color:rgba(161,61,45,.35); background:rgba(161,61,45,.08); }
.outcome.ambiguous { color:var(--gold); border-color:rgba(176,141,60,.42); background:rgba(176,141,60,.08); }
.trade-right { display:flex; align-items:flex-start; gap:8px; }
.perf-headline { display:flex; justify-content:space-between; gap:20px; align-items:flex-end; border:1px solid var(--rule-soft); border-radius:12px; padding:18px; background:rgba(255,255,255,.28); }
.expect { font-family:var(--display); font-size:40px; line-height:1; letter-spacing:-.03em; }
.expect-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
.perf-side { display:flex; gap:18px; text-align:right; }
.mini-stat-v { display:block; font-family:var(--mono); font-size:18px; font-weight:600; }
.mini-stat-l { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
.breakdown { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
.table th, .table td { border-bottom:1px solid var(--rule-soft); padding:8px 6px; text-align:right; }
.table th:first-child, .table td:first-child { text-align:left; }
.settings-row { display:grid; grid-template-columns:minmax(160px,1fr) minmax(120px,220px); gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--rule-soft); }
.settings-row:last-child { border-bottom:0; }
.lbl { font-weight:600; }
.sub { color:var(--muted); font-size:12px; margin-top:2px; }
.toast {
  position:fixed; left:50%; bottom:94px; transform:translateX(-50%) translateY(20px);
  min-width:220px; max-width:min(520px,calc(100vw - 36px)); padding:12px 14px; border-radius:999px;
  background:var(--ink); color:var(--bg); box-shadow:0 16px 45px -24px rgba(26,24,20,.5);
  opacity:0; pointer-events:none; transition:.18s; z-index:60; text-align:center; font-size:13px;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.error { background:var(--red); }
@media (max-width: 760px) {
  .view { padding:18px 14px 96px; }
  .toolbar { grid-template-columns:1fr 1fr; }
  .toolbar input { grid-column:1 / -1; }
  .desk-grid, .quality-grid, .perf-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .opp-row { grid-template-columns:1fr; }
  .rank { display:none; }
  .reason-grid, .read-grid, .paper-plan { grid-template-columns:1fr 1fr; }
  .perf-headline { align-items:flex-start; flex-direction:column; }
  .perf-side { text-align:left; }
  .settings-row { grid-template-columns:1fr; }
}
</style>
</head>
<body>

    <div class="loader-title">Opportunity Tester</div>

</div>

<div class="toast" id="toast"></div>

};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const num = v => {
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
};
function fmtUSD(v, d = 2) {
  const n = num(v);
  if (n == null) return "-";
  return "$" + n.toLocaleString("en-US", { minimumFractionDigits:d, maximumFractionDigits:d });
}
function fmtPct(v, d = 1) {
  const n = num(v);
  if (n == null) return "-";
  return `${n >= 0 ? "+" : ""}${n.toFixed(d)}%`;
}
function fmtDate(v) {
  if (!v) return "";
  if (v && typeof v === "object" && v.seconds) return new Date(v.seconds * 1000).toISOString().slice(0, 10);
  const d = new Date(v);
  return isNaN(d.getTime()) ? String(v).slice(0, 10) : d.toISOString().slice(0, 10);
}
function relTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const s = (Date.now() - d.getTime()) / 1000;
  if (!Number.isFinite(s)) return "-";
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
function toast(message, type = "") {
  const el = $("#toast");
  el.textContent = message;

function parseSymbolList(value) {
  return Array.from(new Set(String(value || "")
    .split(/[\s,]+/)
    .map(s => s.trim().toUpperCase())
    .filter(s => /^[A-Z][A-Z0-9.\-]{0,9}$/.test(s))));
}
function buildBroadScanBatches() {
  const batches = [];
  for (const def of BROAD_SCAN_BATCH_DEFS) {
    const symbols = parseSymbolList(def.symbols);
    for (let i = 0; i < symbols.length; i += BROAD_BATCH_SIZE) {
      const chunk = symbols.slice(i, i + BROAD_BATCH_SIZE);
      batches.push({
        key:`${def.key}_${Math.floor(i / BROAD_BATCH_SIZE) + 1}`,
        label:symbols.length > BROAD_BATCH_SIZE ? `${def.label} ${Math.floor(i / BROAD_BATCH_SIZE) + 1}` : def.label,
        symbols:chunk,
      });
    }
  }
  return batches;
}
function broadUniverseSymbols() {
  return parseSymbolList(BROAD_SCAN_BATCH_DEFS.map(x => x.symbols).join(" "));
}
function combinedScanSortValue(row) {
  const gate = msInvestmentGate(row);
  const paperBonus = msPaperTestPlan(row, gate).ok ? 25 : 0;
  const softPenalty = row?._soft ? 8 : 0;
  return (msPrimaryScore(row) * 2) + gate.score + (msActionabilityScore(row) * 0.5) + paperBonus - softPenalty;
}
function combineBroadScans(scans, finalReadScan = null, errors = []) {
  const bySymbol = new Map();
  let requested = 0;
  let scored = 0;
  let returned = 0;
  for (const item of scans) {
    const batch = item.batch || {};
    const scan = item.scan || {};
    const results = Array.isArray(scan.results) ? scan.results : [];
    requested += batch.symbols?.length || scan.universe_size || 0;
    scored += Number(scan.scored_count || results.length || 0);
    returned += results.length;
    for (const row of results) {
      const sym = String(row?.symbol || "").toUpperCase();
      if (!sym) continue;
      const stamped = { ...row, source_batch:batch.label || scan.universe_source || "broad" };
      const existing = bySymbol.get(sym);
      if (!existing || combinedScanSortValue(stamped) > combinedScanSortValue(existing)) bySymbol.set(sym, stamped);
    }
  }
  if (finalReadScan?.results?.length) {
    for (const row of finalReadScan.results) {
      const sym = String(row?.symbol || "").toUpperCase();
      if (sym) bySymbol.set(sym, { ...(bySymbol.get(sym) || {}), ...row, source_batch:bySymbol.get(sym)?.source_batch || "final read" });
    }
  }
  const ranked = Array.from(bySymbol.values())
    .sort((a, b) => combinedScanSortValue(b) - combinedScanSortValue(a))
    .slice(0, 100)
    .map((r, i) => ({ ...r, rank:i + 1 }));
  const reads = Array.isArray(finalReadScan?.reads) ? finalReadScan.reads : [];
  const ready = ranked.filter(r => !r._soft && msInvestmentGate(r).score >= 76).length;
  const paperReady = ranked.filter(r => msPaperTestPlan(r).ok).length;
  const aiNote = finalReadScan
    ? reads.length
      ? ` AI API reads loaded for ${reads.length} top rows.`
      : finalReadScan.llm_error
        ? " AI API read failed; deterministic scoring still completed."
        : " AI API returned no written reads for the top rows."
    : " Batch scoring is deterministic; AI API reads run on the final top list.";
  return {
    results:ranked,
    reads,
    scan_note:`Rolling broad scan covered ${requested} requested symbols across ${scans.length} batches. ${scored} scored, ${returned} returned from batch leaders; combined list has ${ranked.length} ranked candidates, ${ready} Ready and ${paperReady} paper-ready.${aiNote} Auto-paper runs only after this combined ranking is complete.`,
    universe_source:"rolling_broad",
    universe_size:requested,
    scored_count:scored,
    returned_count:returned,
    batch_count:scans.length,
    batch_errors:errors,
    coverage_symbols:broadUniverseSymbols().length,
    ai_read_count:reads.length,
    llm_error:finalReadScan?.llm_error || null,
    generated_at:new Date().toISOString(),
  };
}
async function fetchMarketScan(body) {
  const idToken = auth?.currentUser ? await auth.currentUser.getIdToken().catch(() => null) : null;
  const r = await fetch(`${WORKER_URL}/scan-market`, {

function mergeMarketScanUpdate(scan) {
  if (!scan) return;
  const current = state.marketScan || { results:[], reads:[] };
  const bySymbol = new Map((current.results || []).map(r => [String(r.symbol || "").toUpperCase(), r]));
  for (const row of (scan.results || [])) {
    const sym = String(row.symbol || "").toUpperCase();
    if (!sym) continue;
    bySymbol.set(sym, { ...(bySymbol.get(sym) || {}), ...row });
  }
  const reads = new Map((current.reads || []).map(r => [String(r.symbol || "").toUpperCase(), r]));
  for (const rd of (scan.reads || [])) {
    const sym = String(rd.symbol || "").toUpperCase();
    if (sym) reads.set(sym, rd);
  }
  const results = Array.from(bySymbol.values())
    .sort((a, b) => combinedScanSortValue(b) - combinedScanSortValue(a))
    .map((r, i) => ({ ...r, rank:i + 1 }));
  state.marketScan = {
    ...current,
    results,
    reads:Array.from(reads.values()),
    ai_read_count:reads.size,
    llm_error:scan.llm_error || current.llm_error || null,
    scan_note:scan.scan_note || current.scan_note || "",

}

async function runRollingBroadScan() {
  if (state.marketScanLoading) return;
  const batches = buildBroadScanBatches();
  const universeCount = broadUniverseSymbols().length;
  state.marketScanLoading = true;
  state.broadScanProgress = { current:0, total:batches.length, label:"starting", requested:universeCount, scored:0 };
  renderCurrentView();
  const scans = [];
  const errors = [];
  let scored = 0;
  try {
    for (let i = 0; i < batches.length; i++) {
      const batch = batches[i];
      state.broadScanProgress = { current:i + 1, total:batches.length, label:batch.label, requested:universeCount, scored };
      renderCurrentView();
      try {
        const scan = await fetchMarketScan({
          symbols:batch.symbols,
          exclude_symbols:[],
          max_universe:batch.symbols.length,
          min_composite:0,
          force:true,
          write_reads:false,
          _patient:true,
        });
        scans.push({ batch, scan });
        scored += Number(scan.scored_count || scan.results?.length || 0);
      } catch (e) {
        errors.push({ batch:batch.label, error:String(e.message || e).slice(0, 120) });
      }
      state.broadScanProgress = { current:i + 1, total:batches.length, label:batch.label, requested:universeCount, scored };
      renderCurrentView();
    }
    let combined = combineBroadScans(scans, null, errors);
    const topSymbols = combined.results.slice(0, 18).map(r => String(r.symbol || "").toUpperCase()).filter(Boolean);
    if (topSymbols.length) {
      state.broadScanProgress = { current:batches.length, total:batches.length, label:"final AI API reads", requested:universeCount, scored };
      renderCurrentView();
      try {
        const finalReadScan = await fetchMarketScan({
          symbols:topSymbols,
          exclude_symbols:[],
          max_universe:topSymbols.length,
          min_composite:0,
          force:true,
          write_reads:true,
          _patient:true,
        });
        combined = combineBroadScans(scans, finalReadScan, errors);
      } catch (e) {
        errors.push({ batch:"final AI API reads", error:String(e.message || e).slice(0, 120) });
        combined.batch_errors = errors;
        combined.scan_note += " Final written reads were unavailable, but the ranked sweep is still usable.";
      }
    }
    state.marketScan = combined;
    state.marketScanRanAt = combined.generated_at || new Date().toISOString();
    const auto = await autoLogPrimePaperTrades(combined);
    const suffix = auto.logged ? ` - auto-paper logged ${auto.logged}: ${auto.symbols.join(", ")}` : "";
    toast(`Broad sweep ranked ${combined.results.length} opportunities${suffix}`);
  } catch (e) {
    state.marketScan = { results:[], reads:[], scan_note:`Broad sweep failed: ${e.message || e}`, universe_source:"rolling_broad" };
    toast("Broad sweep failed", "error");
  } finally {
    state.marketScanLoading = false;
    state.broadScanProgress = null;
    renderCurrentView();
  }
}

const MARKET_SCAN_LANES = [
  ["paper", "Paper-ready"],
  ["actable", "Actable"],
  ["all", "All"],
  ["momentum", "Momentum"],

const MEGA_SYMBOLS = new Set(["AAPL","MSFT","NVDA","AVGO","GOOGL","META","AMZN","TSLA","LLY","JPM","V","MA","UNH","XOM","COST","WMT","HD","PG","NFLX","ORCL","CRM"]);
function msComponent(row, key) {
  return num(row?.components?.[key]?.score) || 0;
}
function msPrimaryScore(row) {
  return num(row?.opportunity_score) ?? num(row?.composite) ?? 0;
}
function msActionabilityScore(row) {
  return num(row?.actionability_score) ?? 0;
}
function msTags(row) {
  return Array.isArray(row?.tags) ? row.tags : [];
}
function msRiskReward(row) {
  const provided = num(row?.reward_risk);
  if (provided != null) return provided;
  const price = num(row?.current_price);
  const support = num(row?.nearest_support);
  const resistance = num(row?.nearest_resistance);
  const direction = setupDirection(row);
  const plan = coherentPlan(price, resistance, support, direction);
  if (!plan.ok) return null;
  return plan.rr;
}
function setupDirection(row) {
  const text = [
    row?.direction,
    row?.trade_direction,
    row?.setup_direction,
    row?.side,
    row?.bias,
    row?.score_reason,
    ...(msTags(row) || []),
  ].filter(Boolean).join(" ").toLowerCase();
  if (/\b(short|bear|bearish|sell|put|breakdown|downside)\b/.test(text)) return "short";
  return "long";
}
function coherentPlan(entry, target, stop, direction = "long") {
  const e = num(entry), t = num(target), s = num(stop);
  if (!(e > 0 && t > 0 && s > 0)) return { ok:false, reason:"missing entry/target/stop" };
  if (direction === "short") {
    if (!(t < e && s > e)) return { ok:false, reason:"short plan needs target below entry and stop above entry" };
    return { ok:true, rr:(e - t) / (s - e) };
  }
  if (!(t > e && s < e)) return { ok:false, reason:"long plan needs target above entry and stop below entry" };
  return { ok:true, rr:(t - e) / (e - s) };
}
function msSector(symbol, row = null) {
  if (row?.sector) return row.sector;
  const s = String(symbol || "").toUpperCase();
  const groups = [
    ["Technology", ["AAPL","MSFT","NVDA","AVGO","ORCL","CRM","AMD","NOW","PLTR","ADBE","CSCO","QCOM","TXN","MU","ANET","PANW","CRWD","DDOG","NET","SNOW","ZS","MDB","TEAM","FTNT","SMH","CIBR"]],
    ["Communication", ["GOOGL","META","NFLX","DIS","TMUS","CMCSA","RBLX","SPOT","PINS","TTD","RDDT"]],
    ["Discretionary", ["AMZN","TSLA","HD","MCD","NKE","BKNG","LOW","SBUX","TJX","CMG","ABNB","DKNG","CAVA","RCL","CCL","NCLH"]],
    ["Financials", ["JPM","BAC","V","MA","GS","WFC","MS","AXP","SCHW","BLK","HOOD","COIN","SOFI","AFRM","CME","IBKR"]],
    ["Health Care", ["UNH","LLY","JNJ","ABBV","MRK","ISRG","TMO","ABT","AMGN","VRTX","NVO","HIMS"]],
    ["Industrials", ["GE","CAT","BA","UBER","HON","RTX","UNP","DE","LMT","AXON","PWR","RKLB","JOBY","ACHR"]],
    ["Energy", ["XOM","CVX","COP","SLB","EOG","FANG","LNG","XLE","KMI"]],
    ["Materials", ["LIN","FCX","NEM","SHW","ALB","GLD","SLV","GDX","URA","CCJ","MP","LAC"]],
    ["Crypto", ["BTC","ETH","MSTR","COIN"]],
  ];
  for (const [sector, syms] of groups) if (syms.includes(s)) return sector;
  return "Unknown";
}
function msCapBucket(row) {
  const sym = String(row?.symbol || "").toUpperCase();

  }
  if (!o.n) {
    return `<section class="card"><div class="card-head"><h3>Paper Performance</h3><button class="btn-ghost" data-act="run-paper-sim">Run sim</button></div><div class="empty">${stats.open_count} open paper trade${stats.open_count === 1 ? "" : "s"}, none closed yet.</div></section>`;
  }
  return `<section class="card">
    <div class="card-head"><h3>Paper Performance</h3><button class="btn-ghost" data-act="run-paper-sim">Run sim</button></div>
    <div class="perf-headline">
      <div><div class="expect ${expCls}">${o.expectancy >= 0 ? "+" : ""}${o.expectancy}%</div><div class="expect-label">expectancy / trade</div></div>
      <div class="perf-side">
        <div><span class="mini-stat-v">${o.win_rate}%</span><span class="mini-stat-l">win rate</span></div>
        <div><span class="mini-stat-v">${o.n}</span><span class="mini-stat-l">closed</span></div>
        <div><span class="mini-stat-v">${o.avg_hold != null ? o.avg_hold + "d" : "-"}</span><span class="mini-stat-l">avg hold</span></div>
      </div>
    </div>
    <div class="breakdown">
      <span class="meta good">Avg win ${o.avg_win != null ? fmtPct(o.avg_win, 2) : "-"}</span>
      <span class="meta bad">Avg loss ${o.avg_loss != null ? fmtPct(o.avg_loss, 2) : "-"}</span>
      <span class="meta good">${o.target} target</span>
      <span class="meta bad">${o.stop} stop</span>
      <span class="meta warn">${o.timeout} timeout</span>
      ${stats.open_count ? `<span class="meta">${stats.open_count} open</span>` : ""}
    </div>
    ${groupTable("By source", stats.by_source)}
    ${groupTable("By conviction", stats.by_conviction)}
  </section>`;
}
function groupTable(label, rows) {
  if (!rows.length) return "";
  return `<table class="table"><thead><tr><th>${esc(label)}</th><th>n</th><th>Win%</th><th>Expect.</th><th>Hold</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.key)}</td><td>${r.n}</td><td>${r.win_rate}%</td><td class="${r.expectancy >= 0 ? "good-text" : "bad-text"}">${r.expectancy >= 0 ? "+" : ""}${r.expectancy}%</td><td>${r.avg_hold != null ? r.avg_hold + "d" : "-"}</td></tr>`).join("")}</tbody></table>`;
}

function renderSettings() {
  $("#topbarTitle").textContent = "Settings";
  $("#view").innerHTML = `
    <section class="card">
      <div class="card-head"><h3>Core Settings</h3></div>
      <div class="settings-row">
        <div><div class="lbl">Data mode</div><div class="sub">${esc(state.authLabel)}${state.uid ? ` - ${esc(state.uid.slice(0, 8))}` : ""}</div></div>
        <button class="btn-secondary" data-act="sign-out">Reset auth</button>
      </div>
      <div class="settings-row">
        <div><div class="lbl">Minimum reward/risk</div><div class="sub">Paper-ready setups must meet this threshold.</div></div>
        <input class="setting-input" id="minRewardRisk" type="number" min="0.5" step="0.1" value="${esc(state.investorProfile.min_reward_risk || 2)}" />
      </div>
      <div class="settings-row">
        <div><div class="lbl">Auto-log prime paper trades</div><div class="sub">After each broad scan, prime paper-ready setups are logged automatically.</div></div>
        <input id="autoPrimePaper" type="checkbox" ${state.investorProfile.auto_prime_paper !== false ? "checked" : ""} />
      </div>
      <div class="settings-row">
        <div><div class="lbl">Max auto paper trades per scan</div><div class="sub">Caps the number of new prime setups added to the journal.</div></div>
        <input class="setting-input" id="autoPrimeLimit" type="number" min="1" max="20" step="1" value="${esc(state.investorProfile.auto_prime_limit || 5)}" />
      </div>
      <div class="settings-row">
        <div><div class="lbl">Worker</div><div class="sub">${esc(WORKER_URL.replace("https://", ""))}</div></div>
        <button class="btn-secondary" data-act="stable-scan">Run full sweep</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
        <button class="btn" data-act="save-settings">Save</button>
        <button class="btn-secondary" data-act="run-paper-sim">Run paper sim</button>
        <button class="btn-secondary" data-act="export-data">Export journal</button>
      </div>
    </section>`;
}
async function exportData() {
  const trades = await loadTrades(1000);
  const payload = { exported_at:new Date().toISOString(), trades, market_scan_at:state.marketScanRanAt, profile:state.investorProfile };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `opportunity-journal-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
async function resetAuth() {
  if (auth?.currentUser) await auth.signOut().catch(() => {});
  state.uid = null;
  state.localOnly = true;
  state.authLabel = "local journal";
  toast("Using local journal");
  renderCurrentView();
}

document.addEventListener("click", async e => {
  const target = e.target.closest("[data-view], [data-act]");
  if (!target) return;
  if (target.dataset.view) return setView(target.dataset.view);
  const act = target.dataset.act;
  try {
    if (act === "stable-scan") await runRollingBroadScan();
    else if (act === "deep-scan") await runMarketScan({ discover:true });
    else if (act === "set-ms-lane") { state.marketScanLane = target.dataset.lane || "all"; renderCurrentView(); }
    else if (act === "toggle-ms-soft") { state.marketScanHideSoft = !state.marketScanHideSoft; renderCurrentView(); }
    else if (act === "toggle-analysis") {
      const sym = String(target.dataset.symbol || "").toUpperCase();
      state.expandedAnalysis[sym] = !state.expandedAnalysis[sym];
      renderCurrentView();
    }
    else if (act === "ai-read-scan") await runSingleSymbolRead(target.dataset.symbol);
    else if (act === "paper-test-scan") await paperTestScannerOpportunity(target.dataset.symbol);
    else if (act === "run-paper-sim") await runPaperSimulationManual();
    else if (act === "delete-trade") {
      if (confirm("Delete this trade?")) {
        await deleteTrade(target.dataset.tradeId);
        toast("Trade deleted");
        renderCurrentView();
      }
    }
    else if (act === "save-settings") await saveInvestorProfile();
    else if (act === "export-data") await exportData();
    else if (act === "sign-out") await resetAuth();
  } catch (err) {
    console.error(err);
    toast(err.message || String(err), "error");
  }
});
document.addEventListener("change", e => {
  const filter = e.target?.dataset?.filter;
  if (!filter) return;
  if (filter === "capFilter") state.marketScanCapFilter = e.target.value || "all";
  if (filter === "setupFilter") state.marketScanSetupFilter = e.target.value || "all";
  if (filter === "sectorFilter") state.marketScanSectorFilter = e.target.value || "all";
  renderCurrentView();
});
document.addEventListener("input", e => {
  if (e.target?.id === "focusInput") state.marketScanFocus = e.target.value;
});
document.addEventListener("keydown", e => {
  if (e.target?.id === "focusInput" && e.key === "Enter") runMarketScan({ force:true });
});
$("#refreshBtn").addEventListener("click", () => {
  if (state.currentView === "discover") runRollingBroadScan();
  else renderCurrentView();
});

async function boot() {
  setMeta();
  if (!auth) {
    state.localOnly = true;
    state.authLabel = "local journal";
    setReady();
    return;
  }
  let triedAnon = false;
  auth.onAuthStateChanged(async user => {
    if (!user && !triedAnon) {
      triedAnon = true;
      try { await auth.signInAnonymously(); return; }
      catch (e) {
        console.warn("Anonymous auth failed", e);
        state.localOnly = true;
        state.authLabel = "local journal";
      }
    } else if (user) {
      state.uid = user.uid;
      state.localOnly = false;
      state.authLabel = user.isAnonymous ? "anonymous sync" : "signed in";
      await loadInvestorProfile();
      await loadCachedScan();
    }
    setReady();
  });
  setTimeout(() => {
    if ($("#app").classList.contains("hidden")) {
      state.localOnly = true;
      state.authLabel = "local journal";
      setReady();
    }
  }, 3500);
}
window.addEventListener("error", e => {
  console.error(e.error || e.message);
  toast(`Error: ${e.message}`, "error");
});
window.addEventListener("unhandledrejection", e => {
  console.error(e.reason);
  toast(`Error: ${e.reason?.message || e.reason}`, "error");
});
boot();
</script>
</body>
</html>
