<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1a1814" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Portfolio" />
<title>Portfolio Advisor</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --bg:           #f5f1e8;
  --bg-elev:     #ede7d6;
  --bg-card:     #fbf8f0;
  --ink:          #1a1814;
  --ink-soft:    #4a4639;
  --ink-muted:   #8a8473;
  --rule:        #d8d2bf;
  --rule-soft:   #e8e2cf;
  --accent:      #a13d2d;
  --accent-soft: #c46b54;
  --green:       #4a7a4a;
  --green-soft:  #6b9b6b;
  --red:         #a13d2d;
  --red-soft:    #c46b54;
  --gold:        #b08d3c;
  --shadow:      0 1px 0 rgba(26,24,20,.04), 0 6px 18px -10px rgba(26,24,20,.18);
  --shadow-deep: 0 24px 60px -24px rgba(26,24,20,.28);
  --radius:      14px;
  --radius-sm:    8px;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:    'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  --mono:    'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}
[data-theme="night"] {
  --bg:           #14110d;
  --bg-elev:     #1d1914;
  --bg-card:     #1a1612;
  --ink:          #f0e9d6;
  --ink-soft:    #c4bca6;
  --ink-muted:   #8a8270;
  --rule:        #2d2820;
  --rule-soft:   #221d17;
  --accent:      #d97a5a;
  --accent-soft: #b85a3d;
  --green:       #7ab37a;
  --green-soft:  #5a8e5a;
  --red:         #d97a5a;
  --red-soft:    #b85a3d;
  --gold:        #d4a85c;
  --shadow:      0 1px 0 rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.5);
  --shadow-deep: 0 24px 60px -24px rgba(0,0,0,.7);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11', 'tnum';
  overscroll-behavior-y: none;
}
body {
  display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100dvh;
  padding-top: env(safe-area-inset-top);
}
.display { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; }
.mono    { font-family: var(--mono); font-feature-settings: 'tnum', 'zero'; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }
.label   { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }

.app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.view {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: 96px;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  position: sticky; top: 0; z-index: 30;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.topbar-title { font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.topbar-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.04em; }
.topbar-icons { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center;
  border: none; background: transparent; color: var(--ink-soft);
  cursor: pointer; border-radius: 50%;
  transition: background .15s, color .15s;
}
.icon-btn:hover, .icon-btn:active { background: var(--bg-elev); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }

.tabs {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: var(--bg);
  border-top: 1px solid var(--rule);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 2px; border: none; background: transparent;
  color: var(--ink-muted);
  font-family: var(--sans); font-size: 9.5px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; transition: color .15s; border-radius: 10px;
}
.tab.active { color: var(--ink); }
.tab svg { width: 22px; height: 22px; stroke-width: 1.5; pointer-events: none; }
.tab.active svg { stroke-width: 2; }

.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.section-head h2 { font-family: var(--display); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }

.hero {
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 22px 20px 20px;
  margin: 16px 20px 8px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--gold) 50%, var(--accent) 100%);
}
.hero .eyebrow { margin-bottom: 8px; }
.hero-value { font-family: var(--display); font-size: 44px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.hero-value .currency-prefix {
  font-size: 22px; color: var(--ink-muted);
  margin-right: 4px; vertical-align: top; position: relative; top: 8px;
}
.hero-meta {
  display: flex; gap: 24px;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--rule-soft);
}
.hero-stat { flex: 1; }
.hero-stat-value { font-family: var(--mono); font-size: 15px; font-weight: 500; margin-top: 2px; }
.hero-stat-value.pos { color: var(--green); }
.hero-stat-value.neg { color: var(--red); }

.alloc-strip {
  display: flex; height: 6px; border-radius: 3px;
  overflow: hidden; margin-top: 14px; background: var(--rule);
}
.alloc-seg { height: 100%; transition: flex .3s; }
.alloc-legend {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 6px 16px; margin-top: 10px; font-size: 12px;
}
.alloc-legend-item { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
.alloc-dot { width: 8px; height: 8px; border-radius: 50%; }

.holdings { margin: 8px 0 20px; }
.holding {
  display: flex; align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer; transition: background .15s; position: relative;
}
.holding:hover, .holding:active { background: var(--bg-elev); }
.holding * { pointer-events: none; }
.holding-icon {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--bg-elev);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 600; font-size: 14px;
  color: var(--ink-soft);
  margin-right: 14px; flex-shrink: 0;
  border: 1px solid var(--rule);
}
.holding-icon[data-class="crypto"] { background: var(--bg); border-color: var(--gold); color: var(--gold); }
.holding-icon[data-class="metal"]  { background: var(--bg); border-color: var(--gold); color: var(--gold); }
.holding-icon[data-class="etf"]    { background: var(--bg); border-color: var(--ink-soft); color: var(--ink-soft); }
.holding-icon[data-class="cash"]   { background: var(--bg); border-color: var(--ink-muted); color: var(--ink-muted); }
.holding-main { flex: 1; min-width: 0; }
.holding-symbol { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.holding-name {
  font-size: 11.5px; color: var(--ink-muted); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
}
.holding-right { text-align: right; font-family: var(--mono); }
.holding-value { font-size: 14px; font-weight: 500; color: var(--ink); }
.holding-pnl { font-size: 11.5px; margin-top: 1px; letter-spacing: 0.02em; }
.holding-pnl.pos { color: var(--green); }
.holding-pnl.neg { color: var(--red); }
.holding-pnl.flat { color: var(--ink-muted); }
.holding-stance {
  position: absolute; top: 16px; right: 14px;
  font-family: var(--mono); font-size: 8.5px; font-weight: 600;
  padding: 2px 6px; border-radius: 3px; letter-spacing: 0.1em;
  display: none;
}
.holding-stance.show { display: inline-block; }
.holding-stance.ACCUMULATE { background: rgba(74,122,74,0.15); color: var(--green); }
.holding-stance.HOLD       { background: var(--bg-elev); color: var(--ink-soft); }
.holding-stance.TRIM       { background: rgba(176,141,60,0.15); color: var(--gold); }
.holding-stance.EXIT       { background: rgba(161,61,45,0.15); color: var(--red); }
.holding-stance.AVOID      { background: rgba(161,61,45,0.10); color: var(--red-soft); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  border-radius: var(--radius-sm);
  font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; transition: opacity .15s, transform .1s;
  text-transform: uppercase;
}
.btn:active { transform: scale(0.98); }
.btn:hover  { opacity: 0.92; }
.btn-secondary { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn-ghost { background: transparent; color: var(--ink-soft); border: none; padding: 10px 14px; }
.btn-block { display: flex; width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 11.5px; }
.btn-danger { background: transparent; color: var(--red); border-color: var(--red-soft); }

.btn-portfolio-analyze {
  display: flex; align-items: center; justify-content: space-between;
  margin: 14px 20px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius);
  cursor: pointer; transition: background .15s;
  position: relative; overflow: hidden;
}
.btn-portfolio-analyze::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent);
}
.btn-portfolio-analyze:hover { background: var(--bg-elev); }
.btn-portfolio-analyze .lbl { font-family: var(--display); font-size: 16px; font-weight: 500; }
.btn-portfolio-analyze .sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
.btn-portfolio-analyze .arrow { color: var(--accent); font-size: 18px; }

/* Opportunity pulse card */
.opp-pulse {
  margin: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.opp-pulse::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; background: var(--gold);
}
.opp-pulse-head {
  padding: 14px 18px 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.opp-pulse-head .ttl { font-family: var(--display); font-size: 17px; font-weight: 500; }
.opp-pulse-head .count {
  font-family: var(--mono); font-size: 11px;
  background: rgba(176,141,60,0.15); color: var(--gold);
  padding: 3px 9px; border-radius: 3px; letter-spacing: 0.08em; font-weight: 600;
}
.opp-pulse-eyebrow {
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--gold); font-weight: 600; margin-bottom: 4px;
}
.opp-row {
  display: flex; align-items: center;
  padding: 12px 18px;
  border-top: 1px solid var(--rule-soft);
  cursor: pointer; transition: background .15s;
}
.opp-row * { pointer-events: none; }
.opp-row:hover { background: var(--bg-elev); }
.opp-row .opp-main { flex: 1; min-width: 0; }
.opp-row .opp-sym { font-family: var(--display); font-size: 15px; font-weight: 600; }
.opp-row .opp-cond {
  font-family: var(--mono); font-size: 11px;
  color: var(--gold); margin-top: 2px; letter-spacing: 0.02em;
}
.opp-row .opp-meta {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  margin-top: 2px;
}
.opp-row .opp-arrow { color: var(--gold); font-size: 18px; margin-left: 12px; }

/* Watchlist */
.watch-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer; transition: background .15s;
  position: relative;
}
.watch-row * { pointer-events: none; }
.watch-row:hover { background: var(--bg-elev); }
.watch-row.has-trigger { background: rgba(176,141,60,0.05); }
.watch-row.has-trigger::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--gold);
}
.watch-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.watch-sym { font-family: var(--display); font-size: 16px; font-weight: 600; }
.watch-name { font-size: 11px; color: var(--ink-muted); }
.watch-cls {
  font-family: var(--mono); font-size: 8.5px;
  padding: 1px 6px; border-radius: 3px;
  background: var(--bg-elev); color: var(--ink-muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.watch-price { font-family: var(--mono); font-size: 14px; font-weight: 500; text-align: right; }
.watch-day { font-family: var(--mono); font-size: 11px; text-align: right; }
.watch-day.pos { color: var(--green); }
.watch-day.neg { color: var(--red); }
.watch-stats {
  grid-column: 1 / -1;
  display: flex; flex-wrap: wrap; gap: 14px;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft);
  margin-top: 2px; letter-spacing: 0.02em;
}
.watch-stat-rsi.warn { color: var(--accent); }
.watch-stat-rsi.over { color: var(--gold); }
.watch-trend.above { color: var(--green); }
.watch-trend.below { color: var(--red); }
.watch-cond-pills {
  grid-column: 1 / -1;
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 6px;
}
.watch-cond-pill {
  font-family: var(--mono); font-size: 9px; font-weight: 500;
  padding: 2px 7px; border-radius: 3px;
  background: var(--bg-elev); color: var(--ink-muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.watch-cond-pill.fired {
  background: rgba(176,141,60,0.18); color: var(--gold);
  border: 1px solid var(--gold);
}

.watch-detail-actions {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 14px 20px;
  border-top: 1px solid var(--rule-soft);
  background: var(--bg-card);
}

.cond-list { margin: 6px 0 14px; }
.cond-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px;
  background: var(--bg-elev);
  border-radius: 6px;
  margin-bottom: 6px;
  font-family: var(--mono); font-size: 11.5px;
}
.cond-item .cond-text { color: var(--ink); }
.cond-item button {
  background: transparent; border: none; color: var(--ink-muted);
  cursor: pointer; font-size: 16px; padding: 0 6px;
}

.scan-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono); font-size: 11px; color: var(--ink-muted);
  letter-spacing: 0.02em;
}
.scan-bar button {
  margin-left: auto;
  padding: 5px 12px;
  background: var(--ink); color: var(--bg); border: none;
  border-radius: 4px; font-family: var(--sans); font-size: 11px;
  font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer;
}

.pin-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; padding: 40px 30px;
}
.pin-logo { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 6px; }
.pin-tag { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 50px; }
.pin-prompt { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; letter-spacing: 0.04em; }
.pin-dots { display: flex; gap: 14px; margin-bottom: 36px; }
.pin-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--ink-soft); background: transparent;
  transition: background .15s, border-color .15s, transform .15s;
}
.pin-dot.filled { background: var(--ink); border-color: var(--ink); transform: scale(1.1); }
.pin-dot.error { background: var(--red); border-color: var(--red); animation: shake .4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
.pin-key {
  width: 72px; height: 72px;
  border: 1px solid var(--rule); background: var(--bg-card); color: var(--ink);
  font-family: var(--display); font-size: 26px; font-weight: 500;
  border-radius: 50%; cursor: pointer;
  transition: background .12s, transform .1s;
}
.pin-key:active { background: var(--bg-elev); transform: scale(0.95); }
.pin-key.empty { visibility: hidden; }
.pin-key.del { font-size: 22px; }
.pin-error { color: var(--red); font-size: 12px; margin-top: 14px; letter-spacing: 0.04em; height: 16px; }

.loader-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 95;
}
.loader-logo { font-family: var(--display); font-size: 28px; margin-bottom: 18px; letter-spacing: -0.01em; }
.loader-bar { width: 120px; height: 1.5px; background: var(--rule); position: relative; overflow: hidden; }
.loader-bar::after {
  content: ""; position: absolute; inset: 0; width: 40%;
  background: var(--ink); animation: loader 1.2s infinite ease-in-out;
}
@keyframes loader {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

.detail-head { padding: 18px 20px 12px; }
.detail-back {
  font-family: var(--sans); font-size: 13px; color: var(--ink-soft);
  background: none; border: none; padding: 4px 0; margin-bottom: 14px;
  cursor: pointer; letter-spacing: 0.04em;
  display: inline-flex; align-items: center; gap: 4px;
}
.detail-symbol { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.025em; line-height: 1; }
.detail-name { font-size: 12px; color: var(--ink-muted); margin-top: 4px; letter-spacing: 0.02em; }
.detail-price { font-family: var(--mono); font-size: 28px; font-weight: 500; margin-top: 14px; letter-spacing: -0.01em; }
.detail-change { font-family: var(--mono); font-size: 13px; margin-top: 4px; }
.detail-change.pos { color: var(--green); }
.detail-change.neg { color: var(--red); }
.detail-change.flat { color: var(--ink-muted); }

.chart-wrap {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); overflow: hidden;
}
.chart-controls { display: flex; border-bottom: 1px solid var(--rule-soft); }
.range-btn {
  flex: 1; padding: 10px 0; border: none; background: transparent;
  color: var(--ink-muted);
  font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.06em;
  cursor: pointer; transition: color .15s, background .15s;
}
.range-btn.active { color: var(--ink); background: var(--bg-elev); }
#chart { height: 280px; padding: 8px 4px; }

.ind-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--rule-soft);
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  overflow: hidden;
}
.ind-cell { background: var(--bg-card); padding: 12px 10px; text-align: center; }
.ind-cell .label { font-size: 9.5px; letter-spacing: 0.1em; }
.ind-cell .val { font-family: var(--mono); font-size: 14px; font-weight: 500; margin-top: 4px; color: var(--ink); }
.ind-cell .val.pos { color: var(--green); }
.ind-cell .val.neg { color: var(--red); }
.ind-cell .val.warn { color: var(--accent); }

.pos-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 16px 18px;
}
.pos-card h3 { font-family: var(--display); font-size: 16px; font-weight: 500; margin-bottom: 12px; letter-spacing: -0.01em; }
.pos-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.pos-row .lbl { color: var(--ink-muted); letter-spacing: 0.02em; }
.pos-row .val { font-family: var(--mono); font-weight: 500; }
.pos-row .val.pos { color: var(--green); }
.pos-row .val.neg { color: var(--red); }
.pos-row .val.flat { color: var(--ink-muted); }

.pos-actions {
  display: flex; gap: 8px; margin-top: 14px;
  padding-top: 14px; border-top: 1px solid var(--rule-soft);
}

/* AI card */
.ai-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 0;
  position: relative; overflow: hidden;
}
.ai-card::before {
  content: ""; position: absolute; top: 0; left: 0;
  width: 4px; height: 100%; background: var(--accent);
}
.stance-hero { padding: 22px 20px 18px; border-bottom: 1px solid var(--rule-soft); }
.stance-eyebrow {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 8px;
}
.stance-verb {
  font-family: var(--display); font-weight: 700;
  font-size: 38px; letter-spacing: -0.025em; line-height: 1;
}
.stance-verb.ACCUMULATE { color: var(--green); }
.stance-verb.HOLD       { color: var(--ink); }
.stance-verb.TRIM       { color: var(--gold); }
.stance-verb.EXIT       { color: var(--red); }
.stance-verb.AVOID      { color: var(--red-soft); }
.stance-headline { font-size: 14px; color: var(--ink-soft); margin-top: 8px; line-height: 1.45; }
.stance-pills { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center;
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  padding: 4px 9px; border-radius: 4px;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.pill-conf { background: var(--bg-elev); color: var(--ink-soft); border: 1px solid var(--rule); }
.pill-conv { background: transparent; color: var(--ink-muted); border: 1px dashed var(--rule); }
.pill-conv.high, .pill-conf.high { color: var(--ink); border-color: var(--ink-soft); }
.pill-conv.medium, .pill-conf.medium { color: var(--ink-soft); }
.pill-conv.low, .pill-conf.low { color: var(--ink-muted); opacity: 0.85; }

.action-block {
  padding: 16px 20px;
  background: linear-gradient(180deg, transparent 0%, rgba(161,61,45,0.04) 100%);
  border-bottom: 1px solid var(--rule-soft);
}
.action-block h4 {
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 10px;
}
.action-what {
  font-family: var(--display); font-size: 18px; font-weight: 500;
  letter-spacing: -0.01em; color: var(--ink); line-height: 1.3;
}
.action-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.action-meta-cell {
  background: var(--bg); border: 1px solid var(--rule-soft);
  border-radius: var(--radius-sm); padding: 8px 10px;
}
.action-meta-cell .lbl {
  font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500;
}
.action-meta-cell .val {
  font-family: var(--mono); font-size: 12.5px; font-weight: 500;
  color: var(--ink); margin-top: 3px;
}
.invalidation-row {
  margin-top: 12px;
  padding: 10px 12px;
  background: rgba(161,61,45,0.06);
  border: 1px solid var(--red-soft);
  border-radius: var(--radius-sm);
  font-size: 12px; color: var(--ink); line-height: 1.45;
}
.invalidation-row strong {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--red); font-weight: 600;
  display: block; margin-bottom: 3px;
}

.horizon-strip { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--rule-soft); }
.horizon-cell { padding: 12px 10px; text-align: center; border-right: 1px solid var(--rule-soft); }
.horizon-cell:last-child { border-right: none; }
.horizon-cell .lbl { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }
.horizon-cell .signal-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-top: 6px; }
.signal-dot.bullish        { background: var(--green); }
.signal-dot.neutralbullish { background: var(--green-soft); opacity: 0.7; }
.signal-dot.neutral        { background: var(--ink-muted); }
.signal-dot.neutralbearish { background: var(--red-soft); opacity: 0.7; }
.signal-dot.bearish        { background: var(--red); }
.horizon-cell .signal-text { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.04em; color: var(--ink-soft); margin-top: 5px; }
.horizon-cell .note { font-size: 10.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.35; min-height: 28px; }

.ai-body { padding: 16px 20px; }
.ai-section { margin-bottom: 16px; }
.ai-section:last-child { margin-bottom: 0; }
.ai-section h4 { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; margin-bottom: 6px; }
.ai-section p { font-size: 13.5px; color: var(--ink); line-height: 1.55; }

.confluence-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.confluence-score { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }

.scenarios-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 6px; }
.scenario { padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--rule-soft); background: var(--bg); }
.scenario.bull { border-left: 3px solid var(--green); }
.scenario.bear { border-left: 3px solid var(--red); }
.scenario.base { border-left: 3px solid var(--ink-muted); }
.scenario .scn-lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
.scenario.bull .scn-lbl { color: var(--green); }
.scenario.bear .scn-lbl { color: var(--red); }
.scenario.base .scn-lbl { color: var(--ink-muted); }
.scenario .scn-cond { font-size: 12.5px; color: var(--ink); line-height: 1.45; }
.scenario .scn-impl { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; line-height: 1.4; font-style: italic; }

.risks ul { list-style: none; margin-top: 4px; }
.risks li { font-size: 13px; padding: 5px 0 5px 18px; position: relative; color: var(--ink); line-height: 1.45; }
.risks li::before { content: ""; position: absolute; left: 4px; top: 12px; width: 4px; height: 1px; background: var(--accent); }

.what-changed {
  padding: 10px 12px;
  background: var(--bg-elev);
  border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--ink-soft);
  line-height: 1.5; font-family: var(--sans);
}
.what-changed::before {
  content: "WHAT CHANGED"; display: block;
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.14em; color: var(--ink-muted); margin-bottom: 4px;
}

.counter-arg {
  margin-top: 10px; padding: 12px 14px;
  background: rgba(176,141,60,0.06);
  border: 1px dashed var(--gold);
  border-radius: var(--radius-sm);
}
.counter-arg .ca-lbl {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 5px;
}
.counter-arg .ca-text { font-size: 12.5px; color: var(--ink); line-height: 1.55; font-style: italic; }

.position-context-block {
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--ink); line-height: 1.5;
}

.ai-actions { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--rule-soft); }
.ai-stamp {
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-muted);
  letter-spacing: 0.04em; padding: 0 20px 14px; line-height: 1.5;
}

.empty-ai { text-align: center; padding: 30px 20px; color: var(--ink-muted); font-size: 13px; }
.empty-ai .display { font-size: 16px; color: var(--ink-soft); margin-bottom: 14px; display: block; }

.port-analysis-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 0;
  position: relative; overflow: hidden;
}
.port-analysis-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--gold); }
.port-stance-hero { padding: 22px 20px 18px; border-bottom: 1px solid var(--rule-soft); }
.port-stance-verb {
  font-family: var(--display); font-weight: 700;
  font-size: 32px; letter-spacing: -0.02em; line-height: 1;
}
.port-stance-verb.DEFENSIVE { color: var(--ink-soft); }
.port-stance-verb.BALANCED  { color: var(--ink); }
.port-stance-verb.AGGRESSIVE { color: var(--accent); }
.port-stance-verb.MISALIGNED, .port-stance-verb.MIS-ALIGNED { color: var(--red); }

.list-block {
  background: var(--bg);
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius-sm);
  padding: 4px 0; margin-top: 6px;
}
.list-block .li { padding: 8px 12px; border-bottom: 1px solid var(--rule-soft); font-size: 12.5px; color: var(--ink); line-height: 1.5; }
.list-block .li:last-child { border-bottom: none; }

.rec-block {
  background: var(--bg);
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius-sm);
  padding: 12px; margin-top: 8px;
}
.rec-block.high { border-left: 3px solid var(--accent); }
.rec-block.medium { border-left: 3px solid var(--gold); }
.rec-block.low { border-left: 3px solid var(--ink-muted); }
.rec-action { font-family: var(--display); font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.4; }
.rec-rationale { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-top: 5px; }
.rec-priority {
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-top: 6px; display: inline-block;
  padding: 2px 6px; border-radius: 3px;
}
.rec-priority.high { background: rgba(161,61,45,0.12); color: var(--accent); }
.rec-priority.medium { background: rgba(176,141,60,0.15); color: var(--gold); }
.rec-priority.low { background: var(--bg-elev); color: var(--ink-muted); }

.sent-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 18px 20px;
}
.sent-card h3 { font-family: var(--display); font-size: 16px; font-weight: 500; margin-bottom: 12px; }
.sent-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; font-size: 13px;
  border-bottom: 1px solid var(--rule-soft);
}
.sent-row:last-child { border: none; }
.sent-row .lbl { color: var(--ink-muted); }
.sent-row .val { font-family: var(--mono); font-weight: 500; }
.news-list { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule-soft); }
.news-item { padding: 8px 0; border-bottom: 1px solid var(--rule-soft); }
.news-item:last-child { border: none; }
.news-item a { color: var(--ink); text-decoration: none; font-size: 13px; line-height: 1.4; display: block; }
.news-item a:hover { color: var(--accent); }
.news-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted); margin-top: 3px; letter-spacing: 0.02em; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(20,17,13,0.5);
  z-index: 90; opacity: 0; pointer-events: none;
  transition: opacity .2s;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal-bg.show { opacity: 1; pointer-events: all; }
.modal {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-card);
  border-radius: 18px 18px 0 0;
  padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
  z-index: 91; transform: translateY(100%);
  transition: transform .25s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow-deep);
}
.modal.show { transform: translateY(0); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-head h3 { font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
.modal-handle { width: 36px; height: 4px; background: var(--rule); border-radius: 2px; margin: 0 auto 18px; }

.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--rule);
  background: var(--bg); color: var(--ink);
  font-family: var(--mono); font-size: 15px;
  border-radius: var(--radius-sm);
  -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ink); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-hint { font-size: 11px; color: var(--ink-muted); margin-top: 4px; letter-spacing: 0.02em; line-height: 1.4; }

.search-results {
  position: absolute; left: 0; right: 0; top: 100%;
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius-sm);
  margin-top: 4px; max-height: 240px; overflow-y: auto;
  box-shadow: var(--shadow-deep); z-index: 5;
}
.search-result { padding: 10px 14px; border-bottom: 1px solid var(--rule-soft); cursor: pointer; transition: background .12s; }
.search-result:last-child { border: none; }
.search-result:hover { background: var(--bg-elev); }
.search-result .sym { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.search-result .nm { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
.search-result .ex { font-family: var(--mono); font-size: 10px; color: var(--ink-muted); float: right; }

.empty-state { text-align: center; padding: 60px 30px; color: var(--ink-muted); }
.empty-state .display { font-size: 22px; font-weight: 500; color: var(--ink-soft); margin-bottom: 8px; display: block; }
.empty-state p { font-size: 13px; margin-bottom: 22px; }

.settings-group {
  margin: 0 20px 24px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); overflow: hidden;
}
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--rule-soft); }
.setting-row:last-child { border-bottom: none; }
.setting-row .lbl { font-size: 14px; }
.setting-row .sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }

.toggle {
  position: relative; width: 44px; height: 26px;
  background: var(--rule); border-radius: 13px;
  cursor: pointer; transition: background .2s; flex-shrink: 0;
}
.toggle::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; background: var(--bg-card);
  border-radius: 50%; transition: transform .2s; box-shadow: var(--shadow);
}
.toggle.on { background: var(--ink); }
.toggle.on::after { transform: translateX(18px); }

.journal-entry { padding: 14px 20px; border-bottom: 1px solid var(--rule-soft); }
.journal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.journal-symbol { font-family: var(--display); font-size: 16px; font-weight: 600; }
.journal-action {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 3px; margin-left: 8px;
}
.journal-action.buy  { background: rgba(74,122,74,0.12); color: var(--green); }
.journal-action.sell { background: rgba(161,61,45,0.12); color: var(--red); }
.journal-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.02em; }
.journal-reason { font-size: 13px; margin-top: 8px; color: var(--ink-soft); line-height: 1.45; }
.journal-snapshot {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  margin-top: 6px; padding: 6px 8px; background: var(--bg-elev);
  border-radius: 4px; letter-spacing: 0.02em;
}

.alert-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--rule-soft); }
.alert-info .symbol { font-family: var(--display); font-size: 15px; font-weight: 600; }
.alert-info .cond { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
.alert-actions { display: flex; gap: 6px; }

.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg);
  padding: 12px 18px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
  box-shadow: var(--shadow-deep);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: all; }
.toast.error { background: var(--red); }

.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--rule); border-top-color: var(--ink);
  border-radius: 50%; animation: spin .8s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-banner {
  margin: 12px 20px; padding: 12px 14px;
  background: rgba(161,61,45,0.08); border: 1px solid var(--red-soft);
  border-radius: var(--radius-sm);
  font-family: var(--mono); font-size: 11.5px; color: var(--red);
  line-height: 1.5; word-break: break-word;
}

.hidden { display: none !important; }
::-webkit-scrollbar { width: 0; }

/* ===== BOT SIMULATOR ===== */
.bot-hero {
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 22px 20px;
  margin: 16px 20px 12px;
  position: relative; overflow: hidden;
}
.bot-hero::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green) 0%, var(--gold) 50%, var(--accent) 100%);
}
.bot-hero h3 { font-family: var(--display); font-size: 18px; font-weight: 500; margin-bottom: 4px; }
.bot-hero .sub { font-size: 12px; color: var(--ink-muted); margin-bottom: 16px; }
.bot-stats {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 12px 18px;
}
.bot-stat-block {
  padding: 12px 14px;
  background: var(--bg-elev);
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule-soft);
}
.bot-stat-block .label { display: block; margin-bottom: 4px; }
.bot-stat-block .val { font-family: var(--mono); font-size: 16px; font-weight: 500; }
.bot-stat-block .val.pos { color: var(--green); }
.bot-stat-block .val.neg { color: var(--red); }
.bot-stat-block .sub { font-size: 10.5px; color: var(--ink-muted); margin-top: 2px; font-family: var(--mono); }

.strategy-card {
  margin: 12px 20px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.strategy-card .strat-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.strategy-card .strat-name {
  font-family: var(--display); font-size: 17px; font-weight: 500;
}
.strategy-card .strat-tag {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
}
.strat-tag.app { background: rgba(176,141,60,0.15); color: var(--gold); border: 1px solid var(--gold); }
.strat-tag.classic { background: rgba(74,122,74,0.12); color: var(--green); border: 1px solid var(--green); }

.strat-metrics {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.strat-metric {
  text-align: left;
  padding: 8px 10px;
  background: var(--bg-elev);
  border-radius: 6px;
}
.strat-metric .label { font-size: 9.5px; }
.strat-metric .val { font-family: var(--mono); font-size: 14px; font-weight: 500; margin-top: 2px; }
.strat-metric .val.pos { color: var(--green); }
.strat-metric .val.neg { color: var(--red); }

.bot-trade-list { margin: 0; padding: 0; }
.bot-trade {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 13px;
}
.bot-trade:last-child { border-bottom: none; }
.bot-trade-l { display: flex; flex-direction: column; gap: 2px; }
.bot-trade-sym { font-family: var(--display); font-weight: 600; font-size: 14px; }
.bot-trade-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted); }

  letter-spacing: 0.04em; cursor: pointer;

// Boot-time error trap: if anything goes wrong before the app shows, display it on the loader.
function showBootError(msg) {
  console.error("BOOT ERROR:", msg);
  const loader = document.getElementById("loader");
  if (loader) {
    loader.innerHTML = `
      <div style="font-family: serif; font-size: 24px; margin-bottom: 18px;">Portfolio</div>
      <div style="font-family: monospace; font-size: 12px; color: #a13d2d; padding: 16px; max-width: 90%; word-break: break-word; line-height: 1.5; background: rgba(161,61,45,0.08); border-radius: 8px; margin: 0 20px;">
        <b>Boot error:</b><br>${String(msg).slice(0, 400)}
      </div>
      <button onclick="location.reload()" style="margin-top: 16px; padding: 8px 18px; background: #1a1814; color: #f5f1e8; border: none; border-radius: 6px; font-family: sans-serif; font-size: 13px; cursor: pointer;">Reload</button>
    `;
    loader.style.flexDirection = "column";
    loader.style.justifyContent = "center";
    loader.style.alignItems = "center";
  }
}

window.addEventListener("error", (e) => {
  // Always show boot errors visibly during startup
  if (document.getElementById("loader") && !document.getElementById("loader").classList.contains("hidden")) {
    showBootError((e.error?.message || e.message) + (e.filename ? ` (line ${e.lineno})` : ""));
  } else {
    showError(e.message + (e.filename ? ` (${e.filename}:${e.lineno})` : ""));
  }
});
window.addEventListener("unhandledrejection", (e) => {
  if (document.getElementById("loader") && !document.getElementById("loader").classList.contains("hidden")) {
    showBootError("Promise: " + (e.reason?.message || e.reason));
  } else {
    showError("Promise: " + (e.reason?.message || e.reason));
  }
});

const $  = (sel, root) => (root || document).querySelector(sel);

function fmtUSD(n, decimals = 2) {
  if (n == null || isNaN(n)) return "—";
  if (Math.abs(n) >= 1000) return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return n.toFixed(decimals);
}
function fmtPct(n, withSign = true) {
  if (n == null || isNaN(n)) return "—";
  const s = withSign && n > 0 ? "+" : "";
  return s + n.toFixed(2) + "%";
}
function fmtNum(n, decimals = 4) {
  if (n == null || isNaN(n)) return "—";
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: decimals });
}
function fmtRel(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const ms = Date.now() - d.getTime();
  const m = Math.floor(ms / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const days = Math.floor(h / 24);
  if (days < 7) return days + "d ago";
  return d.toLocaleDateString();
}
function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function toast(msg, ms = 2400, type = "default") {
  const el = $("#toast");
  el.textContent = msg;

  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}

}
function signalToClass(s) { return String(s || "neutral").replace(/[^a-z]/g, ""); }
function stanceToClass(s) { return String(s || "HOLD").replace(/[^A-Z]/g, ""); }
function describeCondition(c) {
  switch (c.type) {
    case "rsi_below": return `RSI < ${c.threshold}`;
    case "rsi_above": return `RSI > ${c.threshold}`;
    case "ma_touch": return `MA${c.period || 200} touch (±${c.tolerance_pct || 1.5}%)`;
    case "near_52w_high": return `Within ${c.threshold_pct || 3}% of 52w high`;
    case "near_52w_low": return `Within ${c.threshold_pct || 5}% of 52w low`;
    case "macd_bullish_cross": return `MACD bull cross (${c.within_days || 3}d)`;
    case "macd_bearish_cross": return `MACD bear cross (${c.within_days || 3}d)`;
    case "drop_from_peak": return `${c.threshold_pct || 10}% off 90d peak`;
    case "price_above": return `Price > $${c.threshold}`;
    case "price_below": return `Price < $${c.threshold}`;
    case "ma_cross_bullish": return `Golden cross (${c.within_days || 3}d)`;
    case "ma_cross_bearish": return `Death cross (${c.within_days || 3}d)`;
    case "breakout_high": return `${c.period || 50}-day high breakout`;
    case "bollinger_lower": return `At lower BB (${c.period || 20},${c.std || 2}σ)`;
    case "bollinger_upper": return `At upper BB (${c.period || 20},${c.std || 2}σ)`;
    case "momentum_above": return `${c.months || 3}m return > ${c.threshold_pct || 10}%`;
    default: return c.type;
  }
}

// ============================================================================
// PIN GATE
// ============================================================================
let pinBuffer = "", pinMode = "enter", pinFirstTry = "";

function setupPinPad() {
  const pad = $("#pinPad");
  pad.innerHTML = "";
  const keys = [1,2,3,4,5,6,7,8,9,"",0,"⌫"];
  keys.forEach(k => {
    const b = document.createElement("button");
    b.className = "pin-key" + (k === "" ? " empty" : "") + (k === "⌫" ? " del" : "");
    b.textContent = k;
    b.addEventListener("click", () => handlePinKey(k));
    pad.appendChild(b);
  });
}
function handlePinKey(k) {
  $("#pinError").textContent = "";
  if (k === "⌫") pinBuffer = pinBuffer.slice(0, -1);
  else if (typeof k === "number" && pinBuffer.length < 4) pinBuffer += String(k);
  else return;
  updatePinDots();
  if (pinBuffer.length === 4) setTimeout(processPin, 120);
}
function updatePinDots(error = false) {
  $$("#pinDots .pin-dot").forEach((d, i) => {
    d.classList.toggle("filled", i < pinBuffer.length);
    d.classList.toggle("error", error);
  });
}
function processPin() {
  const stored = localStorage.getItem("pinHash");
  if (!stored) {
    if (pinMode === "create") {
      pinFirstTry = pinBuffer; pinBuffer = "";
      pinMode = "confirm";
      updatePinDots();
      $("#pinPrompt").textContent = "Confirm your PIN";
      return;
    }
    if (pinMode === "confirm") {
      if (pinBuffer === pinFirstTry) {
        localStorage.setItem("pinHash", hashPin(pinBuffer));
        unlockApp();
      } else {
        showPinError("PINs don't match. Start over.");
        pinFirstTry = ""; pinBuffer = "";
        pinMode = "create";
        $("#pinPrompt").textContent = "Create a 4-digit PIN";
        updatePinDots();
      }
    }
  } else {
    if (hashPin(pinBuffer) === stored) {
      unlockApp();
    } else {
      state.pinAttempts++;
      showPinError(state.pinAttempts >= 5 ? "Too many attempts." : "Incorrect PIN");
      pinBuffer = "";
      updatePinDots(true);
      setTimeout(() => updatePinDots(false), 400);
    }
  }
}
function showPinError(msg) { $("#pinError").textContent = msg; }
function hashPin(p) {
  let h = 0x811c9dc5;
  for (let i = 0; i < p.length; i++) {
    h ^= p.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(16);
}
function unlockApp() {
  $("#pinScreen").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#topbarMeta").textContent = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  loadInitialData().catch(e => showError("Init: " + e.message));
}
function showPinScreen() {
  $("#loader").classList.add("hidden");
  $("#pinScreen").classList.remove("hidden");
  setupPinPad();
  if (!localStorage.getItem("pinHash")) {
    pinMode = "create";
    $("#pinPrompt").textContent = "Create a 4-digit PIN";
  }
}

// ============================================================================
async function ensureAuth() {
  return new Promise((resolve, reject) => {
    auth.onAuthStateChanged(async user => {
      if (user) { state.uid = user.uid; resolve(user); }
      else {
        try { await auth.signInAnonymously(); }
        catch (e) { reject(e); }
      }
    });
  });
}

async function loadInitialData() {
  await ensureAuth();
  await loadHoldingsFromFirestore();
  if (state.holdings.length === 0) await seedHoldings();
  await loadAnalysesFromFirestore();
  await loadPortfolioAnalysis();
  await loadWatchlist();
  if (state.watchlist.length === 0) await seedWatchlist();
  await loadTriggers();
  await loadBotState();
  await refreshAllPrices();
  renderCurrentView();
  // Background scan after first render
  setTimeout(() => runScan().catch(() => {}), 1500);
}

async function loadHoldingsFromFirestore() {
  const snap = await db.collection("users").doc(state.uid).collection("holdings").get();
  state.holdings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function seedHoldings() {
  for (const h of SEED_HOLDINGS) {
    try {
      await db.collection("users").doc(state.uid).collection("holdings").doc(h.symbol).set({
        symbol: h.symbol, asset_class: h.asset_class,
        quantity: h.quantity,
        avg_cost_total: h.avg_cost_total,
        avg_cost_unit: h.avg_cost_total / h.quantity,
        currency: "USD", name: h.name,
        added_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch (e) { console.warn("seed failed for", h.symbol, e); }
  }
  await loadHoldingsFromFirestore();
}

async function loadWatchlist() {
  try {
    const snap = await db.collection("users").doc(state.uid).collection("watchlist").get();
    state.watchlist = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { state.watchlist = []; }
}

async function seedWatchlist() {
  for (const w of SEED_WATCHLIST) {
    try {
      await db.collection("users").doc(state.uid).collection("watchlist").doc(w.symbol).set({
        symbol: w.symbol,
        asset_class: w.asset_class,
        name: w.name,
        conditions: w.conditions,
        added_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch (e) { console.warn("watchlist seed failed for", w.symbol, e); }
  }
  await loadWatchlist();
}

async function loadTriggers() {
  try {
    const snap = await db.collection("users").doc(state.uid).collection("triggers")
      .where("seen", "==", false).limit(20).get();
    const remoteTriggers = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.triggered_at || "").localeCompare(a.triggered_at || ""));
    // Merge with any local-only triggers (don't overwrite if remote returns nothing)
    if (remoteTriggers.length > 0) state.triggers = remoteTriggers;
  } catch (e) {
    console.warn("loadTriggers failed (probably no index):", e.message || e);
    // Keep whatever we already have in state.triggers
  }
}

async function loadAnalysesFromFirestore() {
  try {
    const snap = await db.collection("users").doc(state.uid).collection("analyses")
      .orderBy("generated_at", "desc").limit(50).get();
    const latest = {};
    snap.docs.forEach(d => {
      const data = d.data();
      if (!latest[data.symbol] || (data.generated_at > latest[data.symbol].generated_at)) latest[data.symbol] = data;
    });
    state.analyses = latest;
  } catch (e) { console.warn("analyses load failed", e); state.analyses = {}; }
}

async function loadPortfolioAnalysis() {
  try {
    const snap = await db.collection("users").doc(state.uid).collection("portfolio_analyses")
      .orderBy("generated_at", "desc").limit(1).get();
    state.portfolioAnalysis = snap.docs[0]?.data() || null;
  } catch (e) { state.portfolioAnalysis = null; }
}

async function refreshAllPrices() {
  const promises = state.holdings.map(h =>
    fetch(`${WORKER_URL}/price/${encodeURIComponent(h.symbol)}`)
      .then(r => r.json())
      .then(p => { state.prices[h.symbol] = p; })
      .catch(e => console.warn("price fetch failed:", h.symbol, e))
  );
  await Promise.all(promises);
}

async function runScan() {
  if (state.watchlist.length === 0) return;
  // Try worker /scan first, fall back to client-side computation
  try {
    const idToken = await auth.currentUser.getIdToken();
    const r = await fetch(`${WORKER_URL}/scan`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uid: state.uid, idToken }),
    });
    if (r.ok) {
      const j = await r.json();
      if (j.results && j.results.length) {
        for (const item of j.results) state.watchlistSnapshot[item.symbol] = item;
        state.lastScanAt = new Date().toISOString();
        await loadTriggers();
        if (state.currentView === "portfolio" || state.currentView === "watchlist") renderCurrentView();
        return j;
      }
    }
    throw new Error("scan endpoint failed or returned no results");
  } catch (e) {
    console.warn("worker scan failed, using client-side scan:", e.message || e);
  }

  // Client-side scan
  await fetchWatchlistSnapshot();
  state.lastScanAt = new Date().toISOString();
  // collect triggers from snapshots into local state.triggers
  state.triggers = [];
  for (const w of state.watchlist) {
    const snap = state.watchlistSnapshot[w.symbol];
    if (snap?.triggers?.length) {
      for (const t of snap.triggers) {
        state.triggers.push({
          id: `${w.symbol}_${t.condition_id}_${Date.now()}`,
          symbol: w.symbol,
          condition_id: t.condition_id,
          condition_type: t.type,
          detail: t.detail,
          triggered_at: new Date().toISOString(),
          seen: false,
        });
      }
    }
  }
  if (state.currentView === "portfolio" || state.currentView === "watchlist") renderCurrentView();
  return { results: Object.values(state.watchlistSnapshot) };
}

async function fetchWatchlistSnapshot() {
  if (state.watchlist.length === 0) return;

  // Try worker endpoint first; if it fails, compute client-side.
  try {
    const symbols = state.watchlist.map(w => w.symbol);
    const conditions_by_symbol = {};
    for (const w of state.watchlist) conditions_by_symbol[w.symbol] = w.conditions || [];
    const r = await fetch(`${WORKER_URL}/scan-snapshot`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbols, conditions_by_symbol }),
    });
    if (r.ok) {
      const j = await r.json();
      if (j.results && j.results.length) {
        for (const item of j.results) state.watchlistSnapshot[item.symbol] = item;
        return;
      }
    }
    throw new Error("scan-snapshot empty or failed");
  } catch (e) {
    console.warn("scan-snapshot failed; falling back to client-side TA:", e.message || e);
  }

  // ---- Client-side fallback: fetch prices, compute indicators locally ----
  for (const w of state.watchlist) {
    try {
      const snap = await computeClientSnapshot(w.symbol, w.conditions || []);
      if (snap) state.watchlistSnapshot[w.symbol] = snap;
    } catch (e) {
      console.warn("client snapshot failed for", w.symbol, e.message || e);
    }
  }
}

async function getOhlcv(symbol) {
  // cache for 5 min
  const cached = state.ohlcvCache[symbol];
  if (cached && (Date.now() - cached.fetched_at < 5 * 60 * 1000)) return cached.data;
  let data = null;
  if (state.prices[symbol] && state.prices[symbol].ohlcv) {
    data = state.prices[symbol];
  } else {
    const r = await fetch(`${WORKER_URL}/price/${encodeURIComponent(symbol)}`);
    if (!r.ok) throw new Error(`price fetch ${r.status}`);
    data = await r.json();
    state.prices[symbol] = data;
  }
  state.ohlcvCache[symbol] = { data, fetched_at: Date.now() };
  return data;
}

async function computeClientSnapshot(symbol, conditions) {
  const data = await getOhlcv(symbol);
  if (!data || !data.ohlcv || data.ohlcv.length < 30) {
    return {
      symbol,
      current_price: data?.current_price || null,
      day_change_pct: null,
      rsi14: null, trend: null,
      pct_from_52w_high: null,
      drop_from_peak_90d: null,
      triggers: [],
      setup_score: 0,
    };
  }
  const ohlcv = data.ohlcv;
  const closes = ohlcv.map(d => d.c);
  const highs  = ohlcv.map(d => d.h);
  const lows   = ohlcv.map(d => d.l);
  const cur    = data.current_price ?? closes[closes.length - 1];
  const prev   = data.prev_close ?? closes[closes.length - 2];
  const dayChangePct = prev ? ((cur - prev) / prev) * 100 : null;

  const rsi14 = computeRSI(closes, 14);
  const ma50  = computeMA(closes, 50);
  const ma200 = computeMA(closes, 200);
  const trend = ma200 != null && cur > ma200 ? "above_200ma" : "below_200ma";

  // 52-week range (last 252 sessions ≈ 1 year)
  const yearSlice = closes.slice(-252);
  const yearHighs = highs.slice(-252);
  const yearLows  = lows.slice(-252);
  const high52w = Math.max(...yearHighs);
  const low52w  = Math.min(...yearLows);
  const pctFrom52wHigh = high52w > 0 ? ((cur - high52w) / high52w) * 100 : null;
  const pctFrom52wLow  = low52w > 0  ? ((cur - low52w)  / low52w)  * 100 : null;

  // 90-day peak (drop_from_peak)
  const slice90 = highs.slice(-90);
  const peak90 = slice90.length ? Math.max(...slice90) : null;
  const dropFromPeak90 = peak90 ? ((cur - peak90) / peak90) * 100 : null;

  // MACD
  const macd = computeMACD(closes);

  // Evaluate conditions
  const triggers = [];
  for (const c of (conditions || [])) {
    let fired = false;
    let detail = "";
    switch (c.type) {
      case "rsi_below":
        if (rsi14 != null && rsi14 < c.threshold) { fired = true; detail = `RSI ${rsi14.toFixed(1)} < ${c.threshold}`; }
        break;
      case "rsi_above":
        if (rsi14 != null && rsi14 > c.threshold) { fired = true; detail = `RSI ${rsi14.toFixed(1)} > ${c.threshold}`; }
        break;
      case "ma_touch": {
        const period = c.period || 200;
        const tol = c.tolerance_pct || 1.5;
        const ma = computeMA(closes, period);
        if (ma != null) {
          const diffPct = Math.abs((cur - ma) / ma) * 100;
          if (diffPct <= tol) { fired = true; detail = `${diffPct.toFixed(2)}% from MA${period}`; }
        }
        break;
      }
      case "near_52w_high":
        if (pctFrom52wHigh != null && Math.abs(pctFrom52wHigh) <= (c.threshold_pct || 3)) {
          fired = true; detail = `${Math.abs(pctFrom52wHigh).toFixed(2)}% from 52w high`;
        }
        break;
      case "near_52w_low":
        if (pctFrom52wLow != null && pctFrom52wLow <= (c.threshold_pct || 5)) {
          fired = true; detail = `${pctFrom52wLow.toFixed(2)}% above 52w low`;
        }
        break;
      case "drop_from_peak":
        if (dropFromPeak90 != null && dropFromPeak90 <= -(c.threshold_pct || 10)) {
          fired = true; detail = `${dropFromPeak90.toFixed(2)}% off 90d peak`;
        }
        break;
      case "macd_bullish_cross":
        if (macd && macd.lastCrossover === "bullish" && macd.daysSinceCross <= (c.within_days || 3)) {
          fired = true; detail = `bullish cross ${macd.daysSinceCross}d ago`;
        }
        break;
      case "macd_bearish_cross":
        if (macd && macd.lastCrossover === "bearish" && macd.daysSinceCross <= (c.within_days || 3)) {
          fired = true; detail = `bearish cross ${macd.daysSinceCross}d ago`;
        }
        break;
      case "price_above":
        if (cur > c.threshold) { fired = true; detail = `$${cur.toFixed(2)} > $${c.threshold}`; }
        break;
      case "price_below":
        if (cur < c.threshold) { fired = true; detail = `$${cur.toFixed(2)} < $${c.threshold}`; }
        break;
      case "ma_cross_bullish": {
        // MA50 crossed above MA200 within `within_days` sessions
        const within = c.within_days || 3;
        for (let lb = 0; lb <= within; lb++) {
          const i = closes.length - 1 - lb;
          if (i < 200) break;
          const upToI    = closes.slice(0, i + 1);
          const upToIm1  = closes.slice(0, i);
          const m50_i    = computeMA(upToI, 50);
          const m200_i   = computeMA(upToI, 200);
          const m50_im1  = computeMA(upToIm1, 50);
          const m200_im1 = computeMA(upToIm1, 200);
          if (m50_i == null || m200_i == null || m50_im1 == null || m200_im1 == null) continue;
          if (m50_im1 <= m200_im1 && m50_i > m200_i) {
            fired = true; detail = `${lb}d ago`; break;
          }
        }
        break;
      }
      case "ma_cross_bearish": {
        const within = c.within_days || 3;
        for (let lb = 0; lb <= within; lb++) {
          const i = closes.length - 1 - lb;
          if (i < 200) break;
          const upToI    = closes.slice(0, i + 1);
          const upToIm1  = closes.slice(0, i);
          const m50_i    = computeMA(upToI, 50);
          const m200_i   = computeMA(upToI, 200);
          const m50_im1  = computeMA(upToIm1, 50);
          const m200_im1 = computeMA(upToIm1, 200);
          if (m50_i == null || m200_i == null || m50_im1 == null || m200_im1 == null) continue;
          if (m50_im1 >= m200_im1 && m50_i < m200_i) {
            fired = true; detail = `${lb}d ago`; break;
          }
        }
        break;
      }
      case "breakout_high": {
        const period = c.period || 50;
        if (closes.length >= period) {
          const window = closes.slice(-period);
          const winMax = Math.max(...window);
          if (cur >= winMax) { fired = true; detail = `${period}-day high $${cur.toFixed(2)}`; }
        }
        break;
      }
      case "bollinger_lower": {
        const period = c.period || 20;
        const std = c.std || 2;
        const bb = computeBollinger(closes, period, std);
        if (bb && cur <= bb.lower) {
          fired = true; detail = `at lower BB $${bb.lower.toFixed(2)}`;
        }
        break;
      }
      case "bollinger_upper": {
        const period = c.period || 20;
        const std = c.std || 2;
        const bb = computeBollinger(closes, period, std);
        if (bb && cur >= bb.upper) {
          fired = true; detail = `at upper BB $${bb.upper.toFixed(2)}`;
        }
        break;
      }
      case "momentum_above": {
        const months = c.months || 3;
        const threshold = c.threshold_pct || 10;
        const sessionsBack = months * 21; // ~21 trading days per month
        if (closes.length > sessionsBack) {
          const past = closes[closes.length - 1 - sessionsBack];
          const pct = past > 0 ? ((cur - past) / past) * 100 : 0;
          if (pct >= threshold) { fired = true; detail = `${months}m return ${pct.toFixed(1)}%`; }
        }
        break;
      }
    }
    if (fired) triggers.push({ condition_id: c.id, type: c.type, detail });
  }

  // setup score: simple heuristic (more triggers + RSI extremes + drop = higher)
  let score = triggers.length * 25;
  if (rsi14 != null) {
    if (rsi14 < 30) score += 20;
    else if (rsi14 < 40) score += 10;
    else if (rsi14 > 70) score -= 10;
  }
  if (dropFromPeak90 != null && dropFromPeak90 < -10) score += 15;

  return {
    symbol, current_price: cur, day_change_pct: dayChangePct,
    rsi14: rsi14 != null ? Math.round(rsi14 * 10) / 10 : null,
    trend, pct_from_52w_high: pctFrom52wHigh,
    pct_from_52w_low: pctFrom52wLow,
    drop_from_peak_90d: dropFromPeak90,
    macd_crossover: macd?.lastCrossover || "none",
    triggers, setup_score: score,
  };
}

// ============================================================================
// TECHNICAL INDICATORS (client-side, used by watchlist + bot)
// ============================================================================
function computeRSI(closes, period = 14) {
  if (!closes || closes.length < period + 1) return null;
  let gains = 0, losses = 0;
  for (let i = closes.length - period; i < closes.length; i++) {
    const diff = closes[i] - closes[i - 1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  const avgGain = gains / period;
  const avgLoss = losses / period;
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - (100 / (1 + rs));
}

function computeMA(closes, period) {
  if (!closes || closes.length < period) return null;
  const slice = closes.slice(-period);
  return slice.reduce((a, b) => a + b, 0) / period;
}

function computeEMA(closes, period) {
  if (!closes || closes.length < period) return [];
  const k = 2 / (period + 1);
  const out = [];
  let ema = closes.slice(0, period).reduce((a, b) => a + b, 0) / period;
  out[period - 1] = ema;
  for (let i = period; i < closes.length; i++) {
    ema = closes[i] * k + ema * (1 - k);
    out[i] = ema;
  }
  return out;
}

function computeMACD(closes, fast = 12, slow = 26, signal = 9) {
  if (!closes || closes.length < slow + signal) return null;
  const emaFast = computeEMA(closes, fast);
  const emaSlow = computeEMA(closes, slow);
  const macdLine = closes.map((_, i) =>
    (emaFast[i] != null && emaSlow[i] != null) ? emaFast[i] - emaSlow[i] : null
  );
  const macdValues = macdLine.filter(v => v != null);
  const signalLine = computeEMA(macdValues, signal);
  // align signal to original index
  const offset = macdLine.indexOf(macdValues[0]);
  // detect last crossover
  let lastCrossover = "none", daysSinceCross = Infinity;
  for (let i = closes.length - 1; i > offset + signal; i--) {
    const sigIdx = i - offset;
    const sigPrev = signalLine[sigIdx - 1];
    const sigCur  = signalLine[sigIdx];
    const macdPrev = macdLine[i - 1];
    const macdCur  = macdLine[i];
    if (sigPrev == null || sigCur == null || macdPrev == null || macdCur == null) continue;
    const diffPrev = macdPrev - sigPrev;
    const diffCur  = macdCur - sigCur;
    if (diffPrev <= 0 && diffCur > 0) {
      lastCrossover = "bullish";
      daysSinceCross = closes.length - 1 - i;
      break;
    }
    if (diffPrev >= 0 && diffCur < 0) {
      lastCrossover = "bearish";
      daysSinceCross = closes.length - 1 - i;
      break;
    }
  }
  return { lastCrossover, daysSinceCross };
}

async function markTriggerSeen(triggerId) {
  // Always update local state
  state.triggers = state.triggers.filter(t => t.id !== triggerId);
  // Try Firestore update (may fail for local-only triggers, that's OK)
  try {
    await db.collection("users").doc(state.uid).collection("triggers").doc(triggerId)
      .update({ seen: true });
  } catch (e) { /* local-only trigger, no Firestore doc */ }
}

// ============================================================================
// METRICS
// ============================================================================
function holdingMetrics(h) {
  const p = state.prices[h.symbol];
  const cur = p?.current_price;
  const value = cur != null ? cur * h.quantity : null;
  const pnlAbs = value != null ? value - h.avg_cost_total : null;
  const pnlPct = h.avg_cost_total > 0 && pnlAbs != null ? (pnlAbs / h.avg_cost_total) * 100 : null;
  const dayPct = p && p.prev_close ? ((cur - p.prev_close) / p.prev_close) * 100 : null;
  return { current_price: cur, value, pnlAbs, pnlPct, dayPct };
}
function portfolioMetrics() {
  let totalValue = 0, totalCost = 0;
  let alloc = {};
  let dayChangeAbs = 0;
  for (const h of state.holdings) {
    const m = holdingMetrics(h);
    if (m.value != null) {
      totalValue += m.value;
      alloc[h.asset_class] = (alloc[h.asset_class] || 0) + m.value;
      const p = state.prices[h.symbol];
      if (p && p.prev_close) {
        const prevValue = p.prev_close * h.quantity;
        dayChangeAbs += (m.value - prevValue);
      }
    }
    totalCost += h.avg_cost_total;
  }
  const totalPnL = totalValue - totalCost;
  const totalPnLPct = totalCost > 0 ? (totalPnL / totalCost) * 100 : 0;
  const dayPct = (totalValue - dayChangeAbs) > 0 ? (dayChangeAbs / (totalValue - dayChangeAbs)) * 100 : 0;
  return { totalValue, totalCost, totalPnL, totalPnLPct, dayChangeAbs, dayPct, alloc };
}

// ----- Portfolio
// ============================================================================
// DAILY WATCHOUTS — observational warnings on currently-held positions only.
// Mixes 3 signal sources:
//   1) Drawdown alerts:    position down > X% from cost basis
//   2) Take-profit candidates: position up > Y% from cost basis
//   3) Watchlist crossover: a position you OWN has a watchlist condition firing
// ============================================================================
const WATCHOUT_DRAWDOWN_PCT = -8;   // flag if position is down 8%+ from cost
const WATCHOUT_TAKEPROFIT_PCT = 15; // flag if position is up 15%+ from cost

function computeWatchouts() {
  const items = [];

  for (const h of state.holdings) {
    if (h.asset_class === "cash") continue;
    const hm = holdingMetrics(h);
    if (hm.pnlPct == null) continue;
    const cur = state.prices[h.symbol]?.current_price;
    if (!cur) continue;

    // Drawdown
    if (hm.pnlPct <= WATCHOUT_DRAWDOWN_PCT) {
      items.push({
        kind: "drawdown",
        symbol: h.symbol,
        severity: hm.pnlPct <= -15 ? "high" : "medium",
        title: `${h.symbol} ${hm.pnlPct.toFixed(1)}% from cost`,
        detail: `Held ${h.quantity} @ ~$${fmtUSD(h.avg_cost ?? h.cost_basis ?? cur)}, now $${fmtUSD(cur)}`,
        sortKey: hm.pnlPct, // most negative first
      });
    }
    // Take-profit
    else if (hm.pnlPct >= WATCHOUT_TAKEPROFIT_PCT) {
      items.push({
        kind: "takeprofit",
        symbol: h.symbol,
        severity: hm.pnlPct >= 30 ? "high" : "medium",
        title: `${h.symbol} +${hm.pnlPct.toFixed(1)}% from cost`,
        detail: `Position up — consider trimming. Cost ~$${fmtUSD(h.avg_cost ?? h.cost_basis ?? cur)}, now $${fmtUSD(cur)}`,
        sortKey: -hm.pnlPct, // biggest gains first
      });
    }
  }

  // Watchlist crossover: positions you OWN that have a watchlist condition firing
  const heldSymbols = new Set(state.holdings.filter(h => h.asset_class !== "cash").map(h => h.symbol));
  for (const t of (state.triggers || [])) {
    if (!heldSymbols.has(t.symbol)) continue;
    items.push({
      kind: "crossover",
      symbol: t.symbol,
      severity: "medium",
      title: `${t.symbol} · watchlist condition firing`,
      detail: `${describeTriggerCondition(t)} — you own this position`,
      sortKey: 1000, // group at top within their bucket
      triggerId: t.id,
    });
  }

  // Sort: drawdown first (most negative), then crossover, then take-profit
  const order = { drawdown: 0, crossover: 1, takeprofit: 2 };
  items.sort((a, b) => {
    const oa = order[a.kind], ob = order[b.kind];
    if (oa !== ob) return oa - ob;
    return a.sortKey - b.sortKey;
  });
  return items;
}

function describeTriggerCondition(trigger) {
  if (trigger.detail) return trigger.detail;
  if (trigger.condition_type) {
    return trigger.condition_type.replace(/_/g, " ");
  }
  return "condition fired";
}

function renderWatchouts() {
  const items = computeWatchouts();
  if (items.length === 0) return "";

  const iconFor = (kind) => {
    if (kind === "drawdown") return "↓";
    if (kind === "takeprofit") return "↑";
    return "⚑";
  };
  const colorFor = (kind, severity) => {
    if (kind === "drawdown") return severity === "high" ? "var(--red)" : "#c25a3a";
    if (kind === "takeprofit") return "var(--green)";
    return "var(--gold)";
  };

  // Show top 4, collapsible if more
  const visibleCount = 4;
  const visible = items.slice(0, visibleCount);
  const hiddenCount = items.length - visibleCount;

  const itemsHtml = visible.map(it => `
    <div class="watchout-item" data-act="open-asset" data-symbol="${escAttr(it.symbol)}" style="border-left-color:${colorFor(it.kind, it.severity)};">
      <div class="watchout-icon" style="color:${colorFor(it.kind, it.severity)};">${iconFor(it.kind)}</div>
      <div class="watchout-body">
        <div class="watchout-title">${escAttr(it.title)}</div>
        <div class="watchout-detail">${escAttr(it.detail)}</div>
      </div>
    </div>
  `).join("");

  return `
    <div class="watchouts-card">
      <div class="watchouts-head">
        <h3>Today's Watchouts</h3>
        <span class="watchouts-count">${items.length}</span>
      </div>
      <div class="watchouts-list">${itemsHtml}</div>
      ${hiddenCount > 0 ? `<div class="watchouts-more">+${hiddenCount} more</div>` : ""}
    </div>
  `;
}

// ----- Watchlist
function renderWatchlist() {
  if (state.selectedSymbol) {
    renderWatchDetail(state.selectedSymbol);
    return;
  }
  $("#topbarTitle").textContent = "Watchlist";
  const view = $("#view");

  const lastScan = state.lastScanAt ? `Last scan: ${fmtRel(state.lastScanAt)}` : "Not scanned yet";

  if (state.watchlist.length === 0) {
    view.innerHTML = `
      <div class="empty-state">
        <span class="display">Watchlist is empty</span>
        <p>Add tickers you'd consider buying. The app watches them and surfaces setups when conditions trigger.</p>
        <button class="btn" data-act="add-watch">Add to Watchlist</button>
      </div>
    `;
    return;
  }

  const sorted = state.watchlist.slice().sort((a, b) => {
    const sa = state.watchlistSnapshot[a.symbol];
    const sb = state.watchlistSnapshot[b.symbol];
    const ta = sa?.triggers?.length || 0;
    const tb = sb?.triggers?.length || 0;
    if (ta !== tb) return tb - ta;
    return (sb?.setup_score || 0) - (sa?.setup_score || 0);
  });

  const rows = sorted.map(w => {
    const snap = state.watchlistSnapshot[w.symbol];
    const hasTrigger = snap?.triggers?.length > 0;
    const condPills = (w.conditions || []).map(c => {
      const fired = snap?.triggers?.some(t => t.condition_id === c.id);
      return `<span class="watch-cond-pill ${fired ? 'fired' : ''}">${escAttr(describeCondition(c))}</span>`;
    }).join("");

    const dayClass = (snap?.day_change_pct || 0) >= 0 ? "pos" : "neg";
    const rsiClass = snap?.rsi14 < 35 ? "warn" : snap?.rsi14 > 70 ? "over" : "";
    const trendClass = snap?.trend === "above_200ma" ? "above" : "below";

    return `
      <div class="watch-row ${hasTrigger ? 'has-trigger' : ''}" data-act="open-watch" data-symbol="${escAttr(w.symbol)}">
        <div class="watch-head">
          <span class="watch-sym">${escAttr(w.symbol)}</span>
          <span class="watch-cls">${escAttr(ALLOC_LABELS[w.asset_class] || w.asset_class)}</span>
          <span class="watch-name">${escAttr(w.name || '')}</span>
        </div>
        <div>
          <div class="watch-price">${snap?.current_price != null ? '$' + fmtUSD(snap.current_price) : '—'}</div>
          <div class="watch-day ${dayClass}">${snap?.day_change_pct != null ? fmtPct(snap.day_change_pct) : '—'}</div>
        </div>
        <div class="watch-stats">
          <span class="watch-stat-rsi ${rsiClass}">RSI ${snap?.rsi14 != null ? snap.rsi14 : '—'}</span>
          <span class="watch-trend ${trendClass}">${snap?.trend === 'above_200ma' ? '↑ 200MA' : '↓ 200MA'}</span>
          <span>${snap?.pct_from_52w_high != null ? snap.pct_from_52w_high.toFixed(1) + '% from 52w high' : ''}</span>
        </div>
        ${condPills ? `<div class="watch-cond-pills">${condPills}</div>` : ""}
      </div>
    `;
  }).join("");

  view.innerHTML = `
    <div class="scan-bar">
      <span>${lastScan}</span>
      <button data-act="rescan">Scan now</button>
    </div>
    <div class="section-head" style="padding: 18px 20px 0;">
      <h2>Watchlist</h2>
      <button class="btn-ghost" data-act="add-watch" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;">+ Add</button>
    </div>
    <div class="holdings">${rows}</div>
  `;

  // Lazy snapshot fetch if missing
  const missingSnaps = state.watchlist.some(w => !state.watchlistSnapshot[w.symbol]);
  if (missingSnaps && !state._snapFetching) {
    state._snapFetching = true;
    fetchWatchlistSnapshot()
      .catch(() => {})
      .finally(() => {
        state._snapFetching = false;
        if (state.currentView === "watchlist" && !state.selectedSymbol) renderWatchlist();
      });
  }
}

async function renderAssetDetail(symbol) {
  $("#topbarTitle").textContent = symbol;

  const view = $("#view");
  const isCash = holding?.asset_class === "cash";
  let price = state.prices[symbol];
  const analysis = state.analyses[symbol];

  if (!price) {
    view.innerHTML = `
      <div class="detail-head">
        <button class="detail-back" data-act="back-markets">← Back</button>
        <div class="detail-symbol">${escAttr(symbol)}</div>
      </div>
      <div class="empty-state"><span class="spinner"></span><p style="margin-top:14px;">Loading data…</p></div>
    `;

        <div class="pos-row"><span class="lbl">Unrealized P&L</span><span class="val ${hm.pnlAbs >= 0 ? 'pos' : 'neg'}">${hm.pnlAbs >= 0 ? '+' : ''}$${fmtUSD(Math.abs(hm.pnlAbs), 0)} · ${fmtPct(hm.pnlPct)}</span></div>
        <div class="pos-row"><span class="lbl">% of Portfolio</span><span class="val">${pctOfPort != null ? pctOfPort.toFixed(1) + '%' : '—'}</span></div>` : ''}
        <div class="pos-actions">

          <button class="btn btn-danger btn-sm" data-act="delete-holding" data-symbol="${escAttr(symbol)}">Remove</button>
        </div>
      </div>
    `;

  let aiCard = "";

  let sentBlock = "";
  if (!isCash) {
    chartBlock = `
      <div class="chart-wrap">
        <div class="chart-controls">
          ${["1M","3M","6M","1Y","ALL"].map(r => `<button class="range-btn ${r === state.selectedRange ? 'active' : ''}" data-act="set-range" data-range="${r}" data-symbol="${escAttr(symbol)}">${r}</button>`).join("")}
        </div>
        <div id="chart"></div>
      </div>
      <div class="ind-strip" id="indStrip"></div>

    sentBlock = `<div id="sentBlock"></div>`;
  } else {
    chartBlock = `<div class="empty-state" style="padding:20px;color:var(--ink-muted);font-size:13px;">Cash holdings have no chart or technical analysis.</div>`;

    <div class="detail-head">
      <button class="detail-back" data-act="back-markets">← Back</button>
      <div class="detail-symbol">${escAttr(symbol)}</div>
      <div class="detail-name">${escAttr(holding?.name || "")}</div>
      <div class="detail-price">$${fmtUSD(cur)}</div>
      ${!isCash ? `<div class="detail-change ${dayPct >= 0 ? 'pos' : 'neg'}">${dayPct >= 0 ? '+' : ''}$${fmtUSD(Math.abs((cur - price.prev_close)))} · ${fmtPct(dayPct)} today</div>` : `<div class="detail-change flat">Cash · fixed value</div>`}
