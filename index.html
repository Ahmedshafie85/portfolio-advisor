// ============================================================================
// TRADING BOT SIMULATOR
// ============================================================================
// One active strategy + one benchmark, both running on the same universe
// (watchlist + non-cash holdings):
//
//   1) "app"  — App's signals: enter on RSI<35 AND drop_from_peak < -7%
//                              exit on RSI>65 OR price >= 1.15× entry OR <= 0.92× entry
//   2) "bh"   — Buy & Hold benchmark: equal-weight buy on day 1, never sell.
//
// Why B&H instead of another active strategy: it's the honest baseline.
// If the app's clever entries can't beat just sitting on the same basket,
// the signals are noise. Each starts with $10,000.

const BOT_STARTING_CAPITAL = 10000;
const BOT_POSITION_PCT     = 0.10;
const BOT_MAX_POSITIONS    = 5;
const BOT_STOP_LOSS_PCT    = 0.92;  // -8%
const BOT_TAKE_PROFIT_PCT  = 1.15;  // +15%
const BOT_TX_COST_PCT      = 0.001; // 0.1% per side (buy + sell), realistic friction

function emptyBotState(label) {
  return {
    label,
    cash: BOT_STARTING_CAPITAL,
    positions: {}, // symbol -> { entryDate, entryPrice, qty, entryReason }
    trades: [],    // closed trades [{ symbol, entryDate, exitDate, entryPrice, exitPrice, qty, pnl, pnlPct, reason }]
    equity: [],    // [{ date, value }]
    started_at: new Date().toISOString(),
    last_run_at: null,
  };
}

async function loadBotState() {
  try {
    const doc = await db.collection("users").doc(state.uid).collection("bot").doc("state").get();
    if (!doc.exists) return;
    const data = doc.data();
    // New-shape fields: dip, trend, golden, meanrev, dca, bh
    for (const strat of BOT_STRATEGIES) {
      if (data[strat.key]) state.bot[strat.key] = data[strat.key];
    }
    // Migration from old shape: { app, classic } where classic = B&H
    if (data.app && !state.bot.dip) {
      state.bot.dip = { ...data.app, label: "Dip Buyer" };
    }
    if (data.classic && !state.bot.bh) {
      state.bot.bh = { ...data.classic, label: "Buy & Hold" };
    }
  } catch (e) { console.warn("bot load failed", e); }
}

async function saveBotState() {
  try {
    const payload = { saved_at: firebase.firestore.FieldValue.serverTimestamp() };
    for (const strat of BOT_STRATEGIES) payload[strat.key] = state.bot[strat.key];
    await db.collection("users").doc(state.uid).collection("bot").doc("state").set(payload);
  } catch (e) { console.warn("bot save failed", e); }
}

// Build the trading universe = watchlist symbols + non-cash holdings
function botUniverse() {
  const set = new Set();
  for (const w of state.watchlist) set.add(w.symbol);
  for (const h of state.holdings) if (h.asset_class !== "cash") set.add(h.symbol);
  return Array.from(set);
}

// Strategies expressed as (priceSeriesUpToDay i) → "buy" | "sell" | null
function appSignal(closes, highs, idx, hasPosition, entryPrice, _position, _times) {
  // Slice to just the data up to idx
  const upToIdx = closes.slice(0, idx + 1);
  const rsi = computeRSI(upToIdx, 14);
  if (rsi == null) return null;
  const slice90 = highs.slice(Math.max(0, idx - 89), idx + 1);
  const peak = Math.max(...slice90);
  const cur  = closes[idx];
  const dropFromPeak = peak > 0 ? ((cur - peak) / peak) * 100 : 0;

  if (hasPosition) {
    if (rsi > 65) return { side: "sell", reason: `RSI ${rsi.toFixed(1)} overbought` };
    if (cur >= entryPrice * BOT_TAKE_PROFIT_PCT) return { side: "sell", reason: `+${((cur/entryPrice - 1)*100).toFixed(1)}% take-profit` };
    if (cur <= entryPrice * BOT_STOP_LOSS_PCT)   return { side: "sell", reason: `${((cur/entryPrice - 1)*100).toFixed(1)}% stop-loss` };
    return null;
  }
  if (rsi < 35 && dropFromPeak <= -7) {
    return { side: "buy", reason: `RSI ${rsi.toFixed(1)} + ${dropFromPeak.toFixed(1)}% off peak` };
  }
  return null;
}

// Buy & Hold benchmark: on the first day we see a symbol with no position,
// buy equal-weight (capped to BOT_POSITION_PCT * 2 to avoid over-concentration).
// Never sells. The honest baseline: "what if I just bought the basket?"
function bhSignal(closes, highs, idx, hasPosition, entryPrice, _position, _times) {
  if (hasPosition) return null;
  // Wait until we have at least 30 bars so positions enter at a reasonable starting point
  if (idx < 30) return null;
  return { side: "buy", reason: "Buy & hold (day 1)" };
}

// ----- Trend Follower: enters on 50-day high breakout -----
// Entry: today closes at the highest level of the last 50 sessions AND price > MA50
// Exit:  close drops below MA50, or trailing stop hits -10% from peak since entry
function trendSignal(closes, highs, idx, hasPosition, entryPrice, position, _times) {
  if (idx < 50) return null;
  const cur = closes[idx];
  const ma50 = computeMA(closes.slice(0, idx + 1), 50);
  if (ma50 == null) return null;

  if (hasPosition) {
    if (cur < ma50) return { side: "sell", reason: "Close < MA50" };
    // Trailing stop: track peak since entry stored on position
    const peakSince = position?.peakSinceEntry || entryPrice;
    if (cur <= peakSince * 0.90) return { side: "sell", reason: `-10% trailing from $${peakSince.toFixed(2)}` };
    return null;
  }
  // 50-day breakout: today's close = max of last 50 closes
  const window = closes.slice(idx - 49, idx + 1);
  const winMax = Math.max(...window);
  if (cur >= winMax && cur > ma50) {
    return { side: "buy", reason: `50-day high breakout @$${cur.toFixed(2)}` };
  }
  return null;
}

// ----- Dual Momentum (Antonacci) — rotates monthly into the best-performing symbol -----
// Entry: hold the symbol with the highest 12-month total return, but only if that
//        return is positive (absolute momentum filter). Otherwise hold cash.
// Exit:  rebalance monthly. Sell whatever no longer qualifies as top-momentum.
// This is a *cross-symbol* strategy. We approximate it per-symbol by:
//   Buy:  this symbol's 12-month return > 0 AND > (universe median by ~10%)
//   Sell: this symbol's 12-month return turned negative OR fell below universe median
function goldenCrossSignal(closes, highs, idx, hasPosition, entryPrice, position, _times) {
  if (idx < 252) return null;
  const cur = closes[idx];
  // 12-month return for THIS symbol
  const past = closes[idx - 252];
  const ret12m = past > 0 ? ((cur - past) / past) * 100 : 0;
  // Monthly rebalance check: only act once per ~21 sessions
  const lastRebalanceIdx = position?._lastRebalIdx || 0;
  if (hasPosition && (idx - lastRebalanceIdx) < 21) return null;

  if (hasPosition) {
    // Absolute momentum: if return turned negative, exit
    if (ret12m <= 0) return { side: "sell", reason: `12m return ${ret12m.toFixed(1)}% — absolute momentum lost` };
    // Otherwise stay (relative momentum check requires cross-symbol context we don't have here)
    return null;
  }
  // Entry: 12m return must be strongly positive (we approximate "top of universe" with absolute threshold)
  if (ret12m >= 10) {
    return { side: "buy", reason: `12m momentum +${ret12m.toFixed(1)}%` };
  }
  return null;
}

// ----- Adaptive Asset Allocation -----
// Entry: positive 6-month momentum AND volatility below recent average
// Exit:  6-month return turns negative OR volatility spikes above 1.5× recent avg
// Position sizing in the backtest engine is volatility-targeted (smaller for volatile assets)
function adaptiveSignal(closes, highs, idx, hasPosition, entryPrice, _position, _times) {
  if (idx < 126) return null; // need ~6 months
  const cur = closes[idx];
  const past6m = closes[idx - 126];
  const ret6m = past6m > 0 ? ((cur - past6m) / past6m) * 100 : 0;

  // Realized volatility over last 30 sessions vs last 90
  const window30 = closes.slice(idx - 29, idx + 1);
  const window90 = closes.slice(idx - 89, idx + 1);
  const vol = (w) => {
    if (w.length < 2) return 0;
    const rets = []; for (let i = 1; i < w.length; i++) rets.push((w[i] / w[i-1]) - 1);
    const m = rets.reduce((a,b)=>a+b,0) / rets.length;
    const v = rets.reduce((s,r)=>s+(r-m)**2,0) / rets.length;
    return Math.sqrt(v);
  };
  const vol30 = vol(window30), vol90 = vol(window90);

  if (hasPosition) {
    if (ret6m <= 0) return { side: "sell", reason: `6m return ${ret6m.toFixed(1)}% — momentum gone` };
    if (vol90 > 0 && vol30 > vol90 * 1.5) return { side: "sell", reason: `Vol spike (${(vol30*100).toFixed(1)}% vs ${(vol90*100).toFixed(1)}% avg)` };
    return null;
  }
  // Entry: positive 6m return + vol not elevated
  if (ret6m >= 5 && (vol90 === 0 || vol30 <= vol90 * 1.2)) {
    return { side: "buy", reason: `6m +${ret6m.toFixed(1)}%, vol in range` };
  }
  return null;
}

// Bollinger Bands: returns { mid, upper, lower } based on MA20 ± 2σ
function computeBollinger(closes, period = 20, stdMultiplier = 2) {
  if (!closes || closes.length < period) return null;
  const slice = closes.slice(-period);
  const mid = slice.reduce((a, b) => a + b, 0) / period;
  const variance = slice.reduce((sum, x) => sum + (x - mid) ** 2, 0) / period;
  const std = Math.sqrt(variance);
  return { mid, upper: mid + stdMultiplier * std, lower: mid - stdMultiplier * std };
}

// ----- Mean Reversion: Bollinger Bands -----
// Entry: close at or below lower band (MA20 - 2σ)
// Exit:  close at or above MA20, OR -8% stop, OR 10 sessions held (time stop)
function meanReversionSignal(closes, highs, idx, hasPosition, entryPrice, position, _times) {
  if (idx < 20) return null;
  const cur = closes[idx];
  const upTo = closes.slice(0, idx + 1);
  const bb = computeBollinger(upTo);
  if (!bb) return null;

  if (hasPosition) {
    if (cur >= bb.mid) return { side: "sell", reason: `Reverted to MA20 ($${bb.mid.toFixed(2)})` };
    if (cur <= entryPrice * 0.92) return { side: "sell", reason: `-8% stop` };
    // 10-day time stop
    const heldDays = position?.daysHeld || 0;
    if (heldDays >= 10) return { side: "sell", reason: `10-day time stop` };
    return null;
  }
  if (cur <= bb.lower) {
    return { side: "buy", reason: `Below lower BB ($${bb.lower.toFixed(2)})` };
  }
  return null;
}

// ----- DCA: mechanical fixed-amount buys, never sells -----
// Buys $100 of each universe symbol every 14 sessions. Doesn't use this signal fn
// directly — the backtest engine handles it via mode "dca".
function dcaSignal() { return null; }
function valueAvgSignal() { return null; } // handled in engine like DCA
function regimeSwitchSignal() { return null; } // handled in engine

// ----- Portfolio Bot — paper-trades the daily-scan logic, TUNED for bull markets -----
// v2 (May 2026): The original Portfolio Bot lost money on the 2-year backtest
// because rules were too quick to trim winners and too cautious on entries.
// Specific tunings (all designed to keep drawdown protection in bear markets):
//   - Trim threshold raised from +25% to +40% (let winners run further)
//   - Trim is PARTIAL (~30% of position) instead of full exit — implemented
//     in the engine by tagging the trade as a partial sell. Note: in the
//     current backtest engine we don't have native partial-sells, so we
//     compromise by closing the full position at +40% rather than +25%.
//     This is half-measure but moves in the right direction.
//   - Entry: RSI<40 OR drop>=10% (was AND with stricter thresholds). Either
//     condition fires. Crucially, in a bull market the drop-only path lets
//     us add to held positions during normal -10% pullbacks even when RSI
//     isn't oversold.
//   - Stop loss widened from -8% to -12% — prevents getting shaken out by
//     routine pullbacks. Real breakdowns still trigger.
//   - Minimum hold period of 10 sessions (~2 weeks) before any non-stop exit.
//     Prevents whipsaw: buying Monday and selling Wednesday on RSI noise.
function portfolioBotSignal(closes, highs, idx, hasPosition, entryPrice, position, _times) {
  if (idx < 90) return null;
  const cur = closes[idx];
  const upToIdx = closes.slice(0, idx + 1);
  const rsi = computeRSI(upToIdx, 14);
  if (rsi == null) return null;
  const slice90 = highs.slice(idx - 89, idx + 1);
  const peak = Math.max(...slice90);
  const dropFromPeak = peak > 0 ? ((cur - peak) / peak) * 100 : 0;

  if (hasPosition) {
    const pnlPct = ((cur - entryPrice) / entryPrice) * 100;
    // Stop loss ALWAYS allowed (overrides minimum hold for safety)
    if (pnlPct <= -12) return { side: "sell", reason: `${pnlPct.toFixed(1)}% stop (wide)` };
    // Minimum hold: don't sell within 10 sessions of buying for non-stop reasons
    const daysHeld = position?.daysHeld ?? (idx - (position?._entryIdx ?? idx));
    if (daysHeld < 10) return null;
    // Take profit raised to +40% (was +25%) — let winners run longer
    if (pnlPct >= 40) return { side: "sell", reason: `+${pnlPct.toFixed(1)}% TP (40%)` };
    // Overbought: only fires AT EXTREME (>80, was >75) — gives more rope in strong trends
    if (rsi > 80) return { side: "sell", reason: `RSI ${rsi.toFixed(0)} extreme overbought` };
    return null;
  }
  // Entry: EITHER oversold OR significant drop from peak (was AND, with stricter thresholds)
  // This lets us add during routine pullbacks in bull markets, not just during corrections
  if (rsi < 40) {
    return { side: "buy", reason: `RSI ${rsi.toFixed(0)} oversold` };
  }
  if (dropFromPeak <= -10) {
    return { side: "buy", reason: `${dropFromPeak.toFixed(1)}% off 90d peak` };
  }
  return null;
}

// ----- App Composite: Trend OR Dip Buyer (whichever fires) -----
// The reasoning: Trend Follower captures bull-market breakouts, Dip Buyer
// captures corrections. Each is in the market only ~25% of the time alone.
// Combined, they should be in the market more often without sacrificing
// signal quality. Exit rules use whichever rule the entry came from
// (we tag the position with which strategy bought it via entryReason).
function compositeSignal(closes, highs, idx, hasPosition, entryPrice, position, times) {
  if (hasPosition) {
    // Use exit logic matching the entry strategy. The entryReason starts
    // with "TREND:" or "DIP:" so we can route accordingly.
    const tag = (position?.entryReason || "").startsWith("TREND:") ? "trend" : "dip";
    const exitFn = tag === "trend" ? trendSignal : appSignal;
    return exitFn(closes, highs, idx, true, entryPrice, position, times);
  }
  // For buy decisions, prefer Trend Follower (it fires on strength,
  // arguably better entry quality). If Trend doesn't fire, try Dip.
  const trendSig = trendSignal(closes, highs, idx, false, null, null, times);
  if (trendSig?.side === "buy") {
    return { side: "buy", reason: "TREND: " + trendSig.reason };
  }
  const dipSig = appSignal(closes, highs, idx, false, null, null, times);
  if (dipSig?.side === "buy") {
    return { side: "buy", reason: "DIP: " + dipSig.reason };
  }
  return null;
}

// Backtest a single strategy over the provided per-symbol OHLCV.
// `mode` controls position sizing: "active" (10% per trade, max 5 concurrent)
// or "bh" (equal-weight across universe, no max).
function backtestStrategy(strategyFn, symbolOhlcv, mode = "active", startCapital = BOT_STARTING_CAPITAL, lookbackDays = 730) {
  const sim = emptyBotState("backtest");
  sim.cash = startCapital;

  const universeSymbols = Object.keys(symbolOhlcv);
  // For B&H: deploy cash equally across all symbols
  // For B&H: conviction-weighted slice across the universe
  const bhTotalWeight = mode === "bh" ? getUniverseConvictionTotal(universeSymbols) : 0;
  const bhSliceFor = (sym) => {
    if (mode !== "bh" || bhTotalWeight === 0) return null;
    return startCapital * (getConvictionWeight(sym) / bhTotalWeight);
  };

  // For DCA: per-cycle slice scaled by conviction
  const DCA_BASE = 100; // base $ per cycle per symbol (will be scaled by conviction)

  // Build a unified date timeline (union of all symbols' dates), trimmed to lookbackDays
  const allDates = new Set();
  for (const sym of universeSymbols) {
    const ohlcv = symbolOhlcv[sym];
    for (const bar of ohlcv) allDates.add(bar.t);
  }
  const sorted = Array.from(allDates).sort((a, b) => a - b);
  const cutoff = Date.now() - lookbackDays * 86400000;
  const dates  = sorted.filter(t => t >= cutoff);

  // Pre-index per-symbol by timestamp for fast lookup
  const indexed = {};
  for (const sym of universeSymbols) {
    indexed[sym] = { byT: {}, closes: [], highs: [], times: [] };
    const ohlcv = symbolOhlcv[sym];
    for (let i = 0; i < ohlcv.length; i++) {
      indexed[sym].byT[ohlcv[i].t] = i;
      indexed[sym].closes.push(ohlcv[i].c);
      indexed[sym].highs.push(ohlcv[i].h);
      indexed[sym].times.push(ohlcv[i].t);
    }
  }

  // For DCA: cycle every 14 sessions, slice scaled per symbol by conviction
  const DCA_INTERVAL = 14;
  let dcaSessionCounter = 0;
  const dcaSliceFor = (sym) => DCA_BASE * getConvictionWeight(sym); // $100/$200/$300 per cycle

  // For Value-Averaging: each cycle, target grows by a fixed amount.
  // Target = (cycleIdx * targetIncrement) * convictionWeight / totalConvWeight
  // Buys are sized to bring actual symbol value up to target. Above target → smaller buys or skip.
  // Edleson's method beats DCA by buying more on dips, less on rallies, automatically.
  const valueAvgTotalWeight = mode === "valueavg" ? getUniverseConvictionTotal(universeSymbols) : 0;
  const VALUE_AVG_CYCLE_INCREMENT = startCapital / 60; // spread starting capital over 60 cycles (~2 years bi-weekly)
  let valueAvgCycleIdx = 0;
  const valueAvgTargetFor = (sym, cycleN) => {
    if (mode !== "valueavg" || valueAvgTotalWeight === 0) return 0;
    const symWeight = getConvictionWeight(sym) / valueAvgTotalWeight;
    return cycleN * VALUE_AVG_CYCLE_INCREMENT * symWeight;
  };

  // For Regime-Switch (Faber tactical): check breadth monthly (21 sessions).
  // breadth = % of universe symbols above their 200-day MA on this date.
  // breadth >= 60%: be 100% equity (like B&H)
  // breadth <= 40%: hold only 50% equity, 50% cash
  // 40-60%: hold current allocation (no action)
  // Rebalancing happens on regime-check days only.
  const REGIME_CHECK_INTERVAL = 21; // sessions ≈ monthly
  const regimeTotalWeight = mode === "regime" ? getUniverseConvictionTotal(universeSymbols) : 0;
  const regimeFullSliceFor = (sym) => {
    if (mode !== "regime" || regimeTotalWeight === 0) return 0;
    return startCapital * (getConvictionWeight(sym) / regimeTotalWeight);
  };
  // Compute breadth for the current date — % of symbols with cur > 200d MA
  function computeBreadth(t) {
    let above = 0, total = 0;
    for (const sym of universeSymbols) {
      const idx = indexed[sym].byT[t];
      if (idx == null || idx < 200) continue;
      const ma200 = computeMA(indexed[sym].closes.slice(0, idx + 1), 200);
      if (ma200 == null) continue;
      total++;
      if (indexed[sym].closes[idx] > ma200) above++;
    }
    return total === 0 ? 0.5 : above / total;
  }

  let regimeMode = "neutral"; // "risk-on" | "neutral" | "risk-off"
  let lastRegimeCheckIdx = -REGIME_CHECK_INTERVAL;
  // Alt rotation state
  const ALT_CHECK_INTERVAL = 30; // ~monthly rotation
  let lastAltCheckIdx = -ALT_CHECK_INTERVAL;
  let altTarget = null; // symbol to hold, or null = hold BTC, or "CASH"

  for (const t of dates) {
    let positionsValue = 0;
    dcaSessionCounter++;
    const isDcaDay = (mode === "dca" || mode === "crypto_dca") && (dcaSessionCounter % DCA_INTERVAL === 1);
    const isValueAvgDay = (mode === "valueavg") && (dcaSessionCounter % DCA_INTERVAL === 1);
    if (isValueAvgDay) valueAvgCycleIdx++;
    // Regime check: do this once per ~21 sessions
    const regimeDayIdx = dcaSessionCounter;
    const isRegimeCheckDay = (mode === "regime") && ((regimeDayIdx - lastRegimeCheckIdx) >= REGIME_CHECK_INTERVAL);
    if (isRegimeCheckDay) {
      lastRegimeCheckIdx = regimeDayIdx;
      const breadth = computeBreadth(t);
      const newMode = breadth >= 0.60 ? "risk-on" : (breadth <= 0.40 ? "risk-off" : regimeMode);
      regimeMode = newMode;
    }
    // Alt-momentum rotation check
    const isAltCheckDay = (mode === "altrotate") && ((dcaSessionCounter - lastAltCheckIdx) >= ALT_CHECK_INTERVAL);
    if (isAltCheckDay) {
      lastAltCheckIdx = dcaSessionCounter;
      // Compute 90-day return for each alt vs BTC's 90-day return
      const btcIdx = indexed["BTC"]?.byT[t];
      const btc90 = (btcIdx != null && btcIdx >= 90)
        ? ((indexed["BTC"].closes[btcIdx] - indexed["BTC"].closes[btcIdx - 90]) / indexed["BTC"].closes[btcIdx - 90])
        : null;
      const altRanks = [];
      for (const alt of ["ETH", "SOL", "XRP"]) {
        const ai = indexed[alt]?.byT[t];
        if (ai == null || ai < 90) continue;
        const ret90 = (indexed[alt].closes[ai] - indexed[alt].closes[ai - 90]) / indexed[alt].closes[ai - 90];
        altRanks.push({ sym: alt, ret90, excessVsBtc: btc90 != null ? ret90 - btc90 : ret90 });
      }
      altRanks.sort((a, b) => b.excessVsBtc - a.excessVsBtc);
      const top = altRanks[0];
      if (top && top.excessVsBtc > 0.05) {
        altTarget = top.sym; // hold top alt
      } else if (btc90 != null && btc90 > 0) {
        altTarget = "BTC";
      } else {
        altTarget = "CASH";
      }
    }

    for (const sym of universeSymbols) {
      const idx = indexed[sym].byT[t];
      if (idx == null) continue;
      const closes = indexed[sym].closes;
      const highs  = indexed[sym].highs;
      const times  = indexed[sym].times;
      const cur    = closes[idx];
      const hasPos = !!sim.positions[sym];
      const position = hasPos ? sim.positions[sym] : null;
      const entryPrice = hasPos ? position.entryPrice : null;

      // Update per-position tracking before signal evaluation
      if (hasPos) {
        // Peak since entry (for trailing stops)
        if (cur > (position.peakSinceEntry || position.entryPrice)) {
          position.peakSinceEntry = cur;
        }
        // Days held (for time stops) — count actual sessions for this symbol since entry
        const entryIdx = indexed[sym].byT[new Date(position.entryDate).getTime()] ?? position._entryIdx;
        if (entryIdx != null) {
          position._entryIdx = entryIdx;
          position.daysHeld = idx - entryIdx;
        }
      }

      let sig = null;
      if (mode === "dca") {
        // DCA bypasses strategy fn: buy on cadence, never sell
        const sliceForThis = dcaSliceFor(sym);
        if (isDcaDay && sim.cash >= sliceForThis) {
          sig = { side: "buy", reason: `DCA cycle ${Math.ceil(dcaSessionCounter / DCA_INTERVAL)}` };
        }
      } else if (mode === "valueavg") {
        // Value Averaging: compute target value for this symbol, compare to actual.
        // If actual < target, buy enough to catch up. If actual > target by a lot, sell excess.
        if (isValueAvgDay) {
          const target = valueAvgTargetFor(sym, valueAvgCycleIdx);
          const actual = hasPos ? (position.qty * cur) : 0;
          const gap = target - actual;
          if (gap > 50 && sim.cash >= gap) {
            // Buy to fill the gap. Note: we mark size in the reason for the engine to pick up.
            sig = { side: "buy", reason: `VA cycle ${valueAvgCycleIdx} (gap +$${gap.toFixed(0)})`, _vaSize: gap };
          } else if (gap < -200 && hasPos) {
            // Sell down the excess (sell ~half the gap to avoid being too jumpy)
            const sellPortion = Math.min(0.5, Math.abs(gap) / actual);
            sig = { side: "sell", reason: `VA cycle ${valueAvgCycleIdx} (excess $${(-gap).toFixed(0)})`, _vaSellPortion: sellPortion };
          }
        }
      } else if (mode === "regime") {
        // Regime-switch: only act on check days
        if (isRegimeCheckDay) {
          const fullSlice = regimeFullSliceFor(sym);
          const targetMultiplier = regimeMode === "risk-off" ? 0.5 : 1.0; // 50% in risk-off, 100% otherwise
          const targetValue = fullSlice * targetMultiplier;
          const actual = hasPos ? (position.qty * cur) : 0;
          const gap = targetValue - actual;
          if (gap > 100 && sim.cash >= gap) {
            sig = { side: "buy", reason: `Regime ${regimeMode}: enter/add`, _vaSize: gap };
          } else if (gap < -100 && hasPos) {
            const sellPortion = Math.min(1.0, Math.abs(gap) / actual);
            sig = { side: "sell", reason: `Regime ${regimeMode}: trim to ${(targetMultiplier*100).toFixed(0)}%`, _vaSellPortion: sellPortion };
          }
        }
      } else if (mode === "altrotate") {
        // Alt rotation: on check days, adjust position to match altTarget decision
        if (isAltCheckDay) {
          const shouldHold = (altTarget === sym);
          if (shouldHold && !hasPos) {
            // Buy this symbol — full position
            const size = sim.cash * 0.9; // deploy nearly all cash into the winner
            if (size >= 50) sig = { side: "buy", reason: `Alt rotation: ${sym} top momentum`, _vaSize: size };
          } else if (!shouldHold && hasPos) {
            // Sell this symbol — full exit
            sig = { side: "sell", reason: `Alt rotation: rotating out of ${sym}`, _vaSellPortion: 1.0 };
          }
        }
      } else {
        sig = strategyFn(closes, highs, idx, hasPos, entryPrice, position, times);
      }

      if (sig?.side === "sell" && hasPos) {
        const pos = sim.positions[sym];
        // For Value-Avg and Regime modes, support PARTIAL sells via _vaSellPortion
        const sellQty = sig._vaSellPortion ? pos.qty * sig._vaSellPortion : pos.qty;
        const grossProceeds = sellQty * cur;
        const txCost = grossProceeds * BOT_TX_COST_PCT;
        const proceeds = grossProceeds - txCost;
        const pnl = proceeds - (sellQty * pos.entryPrice);
        const pnlPct = ((cur / pos.entryPrice) - 1) * 100;
        sim.cash += proceeds;
        sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        sim.trades.push({
          symbol: sym,
          entryDate: pos.entryDate, exitDate: new Date(t).toISOString().slice(0,10),
          entryPrice: pos.entryPrice, exitPrice: cur,
          qty: sellQty, pnl, pnlPct,
          entryReason: pos.entryReason, exitReason: sig.reason,
        });
        if (sig._vaSellPortion && sig._vaSellPortion < 0.999) {
          // Partial sell: reduce qty but keep position open at same avg cost
          pos.qty -= sellQty;
        } else {
          delete sim.positions[sym];
        }
      } else if (sig?.side === "buy") {
        let sizeUSD;
        if (mode === "bh") {
          if (hasPos) continue;
          sizeUSD = bhSliceFor(sym);
          if (!sizeUSD || sim.cash < sizeUSD || sizeUSD < 50) continue;
          const txCost = sizeUSD * BOT_TX_COST_PCT;
          const investAmount = sizeUSD - txCost;
          const qty = investAmount / cur;
          sim.positions[sym] = {
            entryDate: new Date(t).toISOString().slice(0,10),
            entryPrice: cur, qty, entryReason: sig.reason,
            peakSinceEntry: cur, daysHeld: 0, _entryIdx: idx,
          };
          sim.cash -= sizeUSD;
          sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        } else if (mode === "dca") {
          sizeUSD = dcaSliceFor(sym);
          if (sim.cash < sizeUSD) continue;
          const txCost = sizeUSD * BOT_TX_COST_PCT;
          const investAmount = sizeUSD - txCost;
          const addQty = investAmount / cur;
          if (hasPos) {
            const pos = sim.positions[sym];
            const newQty = pos.qty + addQty;
            const newCost = (pos.qty * pos.entryPrice) + investAmount;
            pos.qty = newQty;
            pos.entryPrice = newCost / newQty;
          } else {
            sim.positions[sym] = {
              entryDate: new Date(t).toISOString().slice(0,10),
              entryPrice: cur, qty: addQty, entryReason: sig.reason,
              _entryIdx: idx,
            };
          }
          sim.cash -= sizeUSD;
          sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        } else if (mode === "valueavg" || mode === "regime" || mode === "crypto_dca" || mode === "crypto_bh" || mode === "altrotate") {
          // Value-Avg / Regime: size determined by sig._vaSize (gap to target)
          sizeUSD = sig._vaSize || 0;
          if (sizeUSD < 50 || sim.cash < sizeUSD) continue;
          const txCost = sizeUSD * BOT_TX_COST_PCT;
          const investAmount = sizeUSD - txCost;
          const addQty = investAmount / cur;
          if (hasPos) {
            const pos = sim.positions[sym];
            const newQty = pos.qty + addQty;
            const newCost = (pos.qty * pos.entryPrice) + investAmount;
            pos.qty = newQty;
            pos.entryPrice = newCost / newQty;
          } else {
            sim.positions[sym] = {
              entryDate: new Date(t).toISOString().slice(0,10),
              entryPrice: cur, qty: addQty, entryReason: sig.reason,
              peakSinceEntry: cur, daysHeld: 0, _entryIdx: idx,
            };
          }
          sim.cash -= sizeUSD;
          sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        } else {
          // Active strategies: 10% per trade, max 5 concurrent
          if (hasPos) continue;
          if (Object.keys(sim.positions).length >= BOT_MAX_POSITIONS) continue;
          const equity = sim.cash + positionsValue;
          sizeUSD = equity * BOT_POSITION_PCT;
          if (sim.cash < sizeUSD || sizeUSD < 100) continue;
          const txCost = sizeUSD * BOT_TX_COST_PCT;
          const investAmount = sizeUSD - txCost;
          const qty = investAmount / cur;
          sim.positions[sym] = {
            entryDate: new Date(t).toISOString().slice(0,10),
            entryPrice: cur, qty, entryReason: sig.reason,
            peakSinceEntry: cur, daysHeld: 0, _entryIdx: idx,
          };
          sim.cash -= sizeUSD;
          sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        }
      }

      if (sim.positions[sym]) positionsValue += sim.positions[sym].qty * cur;
    }

    // Equity curve + deployment + drawdown tracking
    let v = 0;
    for (const sym of Object.keys(sim.positions)) {
      const idx = indexed[sym].byT[t];
      const last = idx != null ? indexed[sym].closes[idx] : sim.positions[sym].entryPrice;
      v += sim.positions[sym].qty * last;
    }
    const equity = sim.cash + v;
    const deploymentPct = equity > 0 ? (v / equity) * 100 : 0;
    sim.equity.push({ date: new Date(t).toISOString().slice(0,10), value: equity });
    sim.deploymentSum = (sim.deploymentSum || 0) + deploymentPct;
    sim.deploymentCount = (sim.deploymentCount || 0) + 1;
    // Max drawdown: track running peak, biggest % drop from any peak
    if (equity > (sim.equityPeak || 0)) sim.equityPeak = equity;
    if (sim.equityPeak > 0) {
      const dd = ((equity - sim.equityPeak) / sim.equityPeak) * 100; // negative
      if (dd < (sim.maxDrawdown || 0)) sim.maxDrawdown = dd;
    }
  }

  return sim;
}

// Strategy registry: all six strategies + how to run them.
// `mode` = "active" | "bh" | "dca" — controls sizing in backtestStrategy.
// The order here drives display order in the bot view.
// Strategy registry: 7 strategies organized in 3 tiers (May 2026 cleanup).

// TIER 1 — PASSIVE / CORE (proven baseline, always invested):
//   bh        Buy & Hold — gold standard, hard to beat
//   dca       Dollar-Cost Avg — leader in most backtests
//   valueavg  Value Averaging — Edleson's enhanced DCA
//
// TIER 2 — ACTIVE / TACTICAL (each captures a specific regime):
//   trend     Trend Follower — captures bull runs (breakout signal)

//   meanrev     Mean Reversion — duplicates Dip Buyer w/ higher tx cost

// "high" = 3, "medium" = 2, "low" = 1, no analysis = 1 (treat as average).
// Returns the symbol's weight; caller divides by total weight of universe.
function getConvictionWeight(symbol) {
  const a = state.analyses?.[symbol];
  const conv = (a?.conviction || "").toLowerCase();
  if (conv === "high") return 3;
  if (conv === "medium") return 2;
  if (conv === "low") return 1;
  return 1;
}
function getUniverseConvictionTotal(symbols) {
  return symbols.reduce((sum, s) => sum + getConvictionWeight(s), 0);
}

async function runBacktest() {
  const universe = botUniverse();
  if (universe.length === 0) {
    toast("No symbols to test (add holdings or watchlist items)", 3000, "error");
    return;
  }
  state.botRunning = true;
  toast(`Backtesting ${universe.length} symbols × ${BOT_STRATEGIES.length} strategies…`, 3000);
  renderBot();

  // Fetch OHLCV for all symbols once, share across strategies
  const symbolOhlcv = {};
  for (const sym of universe) {
    try {
      const data = await getOhlcv(sym);
      if (data?.ohlcv?.length) symbolOhlcv[sym] = data.ohlcv;
    } catch (e) { console.warn("bot ohlcv fetch failed for", sym, e.message || e); }
  }
  if (Object.keys(symbolOhlcv).length === 0) {
    state.botRunning = false;
    toast("Could not fetch any OHLCV data", 3000, "error");
    renderBot();
    return;
  }

  // Run each strategy
  const now = new Date().toISOString();
  for (const strat of BOT_STRATEGIES) {
    const result = backtestStrategy(strat.fn, symbolOhlcv, strat.mode);
    result.label = strat.label;
    result.last_run_at = now;
    state.bot[strat.key] = result;
  }
  await saveBotState();

  // Build a tiny summary toast based on the leaderboard
  const ranked = BOT_STRATEGIES
    .map(s => ({ key: s.key, label: s.label, eq: botMetrics(state.bot[s.key])?.equity || 0 }))
    .sort((a, b) => b.eq - a.eq);
  state.botRunning = false;
  toast(`Backtest done · winner: ${ranked[0].label} ($${fmtUSD(ranked[0].eq, 0)})`, 3500);
  renderBot();
}

async function runForwardStep() {
  // Initialise any missing strategies
  for (const strat of BOT_STRATEGIES) {
    if (!state.bot[strat.key]) state.bot[strat.key] = emptyBotState(strat.label);
  }

  const universe = botUniverse();
  if (universe.length === 0) { toast("Empty universe", 2400, "error"); return; }

  state.botRunning = true;
  renderBot();

  const today = new Date().toISOString().slice(0, 10);
  const tradesAdded = {};

  // Pre-fetch all symbols once
  const symData = {};
  for (const sym of universe) {
    try {
      const data = await getOhlcv(sym);
      if (data?.ohlcv?.length) symData[sym] = data;
    } catch (e) { /* skip */ }
  }

  // DCA cadence: count sessions since this strategy's start, buy every 14
  const dcaSim = state.bot.dca;
  const isDcaDay = ((dcaSim.equity?.length || 0) % 14 === 0);
  const DCA_BASE = 100;
  const dcaSliceFor = (sym) => DCA_BASE * getConvictionWeight(sym);

  // B&H: conviction-weighted slice
  const bhTotalWeight = getUniverseConvictionTotal(universe);
  const bhSliceFor = (sym) => bhTotalWeight > 0 ? BOT_STARTING_CAPITAL * (getConvictionWeight(sym) / bhTotalWeight) : 0;

  for (const sym of Object.keys(symData)) {
    const data = symData[sym];
    const closes = data.ohlcv.map(d => d.c);
    const highs  = data.ohlcv.map(d => d.h);
    const times  = data.ohlcv.map(d => d.t);
    const idx    = closes.length - 1;
    const cur    = data.current_price ?? closes[idx];

    for (const strat of BOT_STRATEGIES) {
      const sim = state.bot[strat.key];
      const hasPos = !!sim.positions[sym];
      const position = hasPos ? sim.positions[sym] : null;
      const entryPrice = hasPos ? position.entryPrice : null;

      // Update tracking
      if (hasPos) {
        if (cur > (position.peakSinceEntry || position.entryPrice)) position.peakSinceEntry = cur;
        // For forward mode we count each step as 1 day held
        position.daysHeld = (position.daysHeld || 0) + 1;
      }

      // Determine signal
      let sig = null;
      if (strat.mode === "dca") {
        const sliceForThis = dcaSliceFor(sym);
        if (isDcaDay && sim.cash >= sliceForThis) {
          sig = { side: "buy", reason: `DCA cycle ${Math.ceil((sim.equity?.length || 0) / 14) + 1}` };
        }
      } else if (strat.mode === "bh") {
        const sliceForThis = bhSliceFor(sym);
        if (!hasPos && sim.cash >= sliceForThis && sliceForThis >= 50) {
          sig = { side: "buy", reason: "Buy & hold (initial buy)" };
        }
      } else {
        sig = strat.fn(closes, highs, idx, hasPos, entryPrice, position, times);
        // Portfolio Bot also honors live AI analysis cards (forward mode only).
        // If the rule-scan didn't fire but the analysis stance is decisive, act on it.
        if (strat.key === "portfolio") {
          const analysis = state.analyses?.[sym];
          const stance = (analysis?.stance || "").toLowerCase();
          const conv = (analysis?.conviction || "").toLowerCase();
          if (!sig && !hasPos && (stance.includes("buy") || stance.includes("accumulate") || stance.includes("add"))) {
            sig = { side: "buy", reason: `AI: ${(analysis.stance || "BUY")}${conv ? " (" + conv + " conv)" : ""}` };
          } else if (!sig && hasPos && (stance.includes("sell") || stance.includes("trim") || stance.includes("reduce"))) {
            sig = { side: "sell", reason: `AI: ${(analysis.stance || "SELL")}${conv ? " (" + conv + " conv)" : ""}` };
          }
        }
      }

      if (!sig) continue;

      if (sig.side === "sell" && hasPos) {
        const grossProceeds = position.qty * cur;
        const txCost = grossProceeds * BOT_TX_COST_PCT;
        const proceeds = grossProceeds - txCost;
        const pnl = proceeds - (position.qty * position.entryPrice);
        const pnlPct = ((cur / position.entryPrice) - 1) * 100;
        sim.cash += proceeds;
        sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        sim.trades.push({
          symbol: sym, entryDate: position.entryDate, exitDate: today,
          entryPrice: position.entryPrice, exitPrice: cur,
          qty: position.qty, pnl, pnlPct,
          entryReason: position.entryReason, exitReason: sig.reason,
        });
        delete sim.positions[sym];
        tradesAdded[strat.key] = (tradesAdded[strat.key] || 0) + 1;
      } else if (sig.side === "buy") {
        let sizeUSD;
        if (strat.mode === "bh") {
          if (hasPos) continue;
          sizeUSD = bhSliceFor(sym);
        } else if (strat.mode === "dca") {
          sizeUSD = dcaSliceFor(sym);
          if (sim.cash < sizeUSD) continue;
          const txCost = sizeUSD * BOT_TX_COST_PCT;
          const investAmount = sizeUSD - txCost;
          if (hasPos) {
            const addQty = investAmount / cur;
            const newQty = position.qty + addQty;
            const newCost = (position.qty * position.entryPrice) + investAmount;
            position.qty = newQty;
            position.entryPrice = newCost / newQty;
          } else {
            const qty = investAmount / cur;
            sim.positions[sym] = { entryDate: today, entryPrice: cur, qty, entryReason: sig.reason };
          }
          sim.cash -= sizeUSD;
          sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
          tradesAdded[strat.key] = (tradesAdded[strat.key] || 0) + 1;
          continue;
        } else {
          // Active strategy: 10% per trade, max 5 concurrent
          if (hasPos) continue;
          if (Object.keys(sim.positions).length >= BOT_MAX_POSITIONS) continue;
          let positionsValue = 0;
          for (const s of Object.keys(sim.positions)) {
            const p2 = state.prices[s]?.current_price || sim.positions[s].entryPrice;
            positionsValue += sim.positions[s].qty * p2;
          }
          const equity = sim.cash + positionsValue;
          sizeUSD = equity * BOT_POSITION_PCT;
          if (sim.cash < sizeUSD || sizeUSD < 100) continue;
        }
        const txCost = sizeUSD * BOT_TX_COST_PCT;
        const investAmount = sizeUSD - txCost;
        const qty = investAmount / cur;
        sim.positions[sym] = {
          entryDate: today, entryPrice: cur, qty, entryReason: sig.reason,
          peakSinceEntry: cur, daysHeld: 0,
        };
        sim.cash -= sizeUSD;
        sim.totalTxCost = (sim.totalTxCost || 0) + txCost;
        tradesAdded[strat.key] = (tradesAdded[strat.key] || 0) + 1;
      }
    }
  }

  // Append equity snapshots for every strategy + track deployment + drawdown
  for (const strat of BOT_STRATEGIES) {
    const sim = state.bot[strat.key];
    let positionsValue = 0;
    for (const s of Object.keys(sim.positions)) {
      const p2 = state.prices[s]?.current_price || sim.positions[s].entryPrice;
      positionsValue += sim.positions[s].qty * p2;
    }
    const equity = sim.cash + positionsValue;
    const deploymentPct = equity > 0 ? (positionsValue / equity) * 100 : 0;
    sim.equity.push({ date: today, value: equity });
    sim.deploymentSum = (sim.deploymentSum || 0) + deploymentPct;
    sim.deploymentCount = (sim.deploymentCount || 0) + 1;
    if (equity > (sim.equityPeak || 0)) sim.equityPeak = equity;
    if (sim.equityPeak > 0) {
      const dd = ((equity - sim.equityPeak) / sim.equityPeak) * 100;
      if (dd < (sim.maxDrawdown || 0)) sim.maxDrawdown = dd;
    }
    sim.last_run_at = new Date().toISOString();
  }

  await saveBotState();
  state.botRunning = false;
  const totalActions = Object.values(tradesAdded).reduce((a, b) => a + b, 0);
  toast(totalActions > 0
    ? `Step complete · ${totalActions} actions across ${Object.keys(tradesAdded).length} strategies`
    : "Step complete · no actions today");
  renderBot();
}

function resetBot() {
  if (!confirm("Reset all bot strategies? This wipes every paper-trade and equity history across all six strategies.")) return;
  for (const strat of BOT_STRATEGIES) state.bot[strat.key] = null;
  saveBotState();
  toast("Bot reset");
  renderBot();
}

function botMetrics(sim) {
  if (!sim) return null;
  const trades = sim.trades || [];
  const wins   = trades.filter(t => t.pnl > 0).length;
  const losses = trades.filter(t => t.pnl <= 0).length;
  const winRate = trades.length > 0 ? (wins / trades.length) * 100 : 0;

  let posValue = 0;
  let openCount = 0;
  for (const sym of Object.keys(sim.positions || {})) {
    openCount++;
    const cur = state.prices[sym]?.current_price || sim.positions[sym].entryPrice;
    posValue += sim.positions[sym].qty * cur;
  }
  const equity = sim.cash + posValue;
  const totalReturn = ((equity / BOT_STARTING_CAPITAL) - 1) * 100;
  const realizedPnL = trades.reduce((sum, t) => sum + t.pnl, 0);
  const avgWin   = wins   > 0 ? trades.filter(t => t.pnl > 0).reduce((s, t) => s + t.pnlPct, 0) / wins : 0;
  const avgLoss  = losses > 0 ? trades.filter(t => t.pnl <= 0).reduce((s, t) => s + t.pnlPct, 0) / losses : 0;

  // New metrics: average deployment, max drawdown, transaction cost drag
  const avgDeployment = sim.deploymentCount > 0
    ? sim.deploymentSum / sim.deploymentCount
    : (equity > 0 ? (posValue / equity) * 100 : 0);
  const maxDrawdown = sim.maxDrawdown || 0;
  const totalTxCost = sim.totalTxCost || 0;
  // Drag = how many percentage points of return were eaten by transaction costs
  const txDragPct = (totalTxCost / BOT_STARTING_CAPITAL) * 100;

  return {
    equity, cashLeft: sim.cash, positionsValue: posValue,
    openCount, tradeCount: trades.length, wins, losses, winRate,
    totalReturn, realizedPnL, avgWin, avgLoss,
    avgDeployment, maxDrawdown, totalTxCost, txDragPct,
  };
}

// Multi-strategy equity chart with toggle chips. `visibleKeys` controls which lines render.
function renderEquityChart(visibleKeys) {
  const series = [];
  for (const strat of BOT_STRATEGIES) {
    if (!visibleKeys[strat.key]) continue;
    const sim = state.bot[strat.key];
    if (!sim?.equity?.length) continue;
    series.push({ data: sim.equity, color: strat.color, label: strat.tag, key: strat.key });
  }
  if (series.length === 0) return `<div style="text-align:center;color:var(--ink-muted);font-size:12px;padding:30px;">Toggle strategies above to show their equity lines.</div>`;

  let minV = Infinity, maxV = -Infinity, minT = Infinity, maxT = -Infinity;
  for (const s of series) {
    for (const p of s.data) {
      if (p.value < minV) minV = p.value;
      if (p.value > maxV) maxV = p.value;
      const t = new Date(p.date).getTime();
      if (t < minT) minT = t;
      if (t > maxT) maxT = t;
    }
  }
  // Always include starting capital in the y range so the baseline is visible
  if (BOT_STARTING_CAPITAL < minV) minV = BOT_STARTING_CAPITAL * 0.98;
  if (BOT_STARTING_CAPITAL > maxV) maxV = BOT_STARTING_CAPITAL * 1.02;

  const w = 320, h = 160, pad = 28;
  const xRange = maxT - minT || 1;
  const yRange = (maxV - minV) || 1;
  function xFor(t) { return pad + ((t - minT) / xRange) * (w - pad - 8); }
  function yFor(v) { return h - pad - ((v - minV) / yRange) * (h - pad - 16); }

  const baseY = yFor(BOT_STARTING_CAPITAL);
  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">`;
  svg += `<line x1="${pad}" y1="${baseY}" x2="${w - 8}" y2="${baseY}" stroke="var(--rule)" stroke-dasharray="3,3" stroke-width="1"/>`;
  svg += `<text x="${pad - 4}" y="${baseY - 3}" font-family="monospace" font-size="9" fill="var(--ink-muted)" text-anchor="end">$${BOT_STARTING_CAPITAL.toLocaleString()}</text>`;
  svg += `<text x="${pad - 4}" y="${pad + 4}" font-family="monospace" font-size="9" fill="var(--ink-muted)" text-anchor="end">$${Math.round(maxV).toLocaleString()}</text>`;
  svg += `<text x="${pad - 4}" y="${h - pad}" font-family="monospace" font-size="9" fill="var(--ink-muted)" text-anchor="end">$${Math.round(minV).toLocaleString()}</text>`;
  for (const s of series) {
    const points = s.data.map(p => `${xFor(new Date(p.date).getTime())},${yFor(p.value)}`).join(" ");
    svg += `<polyline points="${points}" stroke="${s.color}" fill="none" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  svg += `</svg>`;
  return svg;
}

        </div></div>
      </div>
  `;

  const subline = noClosedTrades
    ? `Started ${escAttr((sim.started_at || "").slice(0,10))} · ${escAttr(strat.desc)}`
    : `Started ${escAttr((sim.started_at || "").slice(0,10))} · ${m.tradeCount} trades closed · ${escAttr(strat.desc)}`;

  return `
    <div class="strategy-card">
      <div class="strat-head">
        <div>
          <div class="strat-name">${escAttr(sim.label || strat.label)}</div>

  `;
}

function renderBot() {
  $("#topbarTitle").textContent = "Trading Bot";
  const view = $("#view");
  const universe = botUniverse();
  const populatedKeys = BOT_STRATEGIES.filter(s => state.bot[s.key]);
  const noData = populatedKeys.length === 0;
  const lastRun = populatedKeys.map(s => state.bot[s.key]?.last_run_at).filter(Boolean).sort().pop();

  let body = "";
  if (noData) {
    body = `
      <div class="bot-empty">
        <span class="display">Trading Bot Sandbox</span>
        <p>Seven equity strategies paper-trade against each other on the same universe (<b>${universe.length}</b> symbols
        from your watchlist + holdings). Each starts with
        $${BOT_STARTING_CAPITAL.toLocaleString()}. The leaderboard shows which is winning, the chart shows
        when leadership changed, and the per-strategy cards explain what each is doing.</p>
        <button class="btn" data-act="bot-backtest">Run 2-Year Backtest</button>
      </div>
    `;
  } else {
    // Group cards by tier for visual organization
    const tiers = [
      { key: "passive",  label: "Passive / Core",     hint: "Always invested. Proven baselines." },
      { key: "active",   label: "Active / Tactical",  hint: "Each captures a specific regime." },
      { key: "check",    label: "Reality Check",      hint: "Paper-trades the daily scan." },
    ];
    const cardsByTier = tiers.map(tier => {
      const stratsInTier = BOT_STRATEGIES.filter(s => (s.tier || "active") === tier.key && state.bot[s.key]);
      if (stratsInTier.length === 0) return "";
      const cards = stratsInTier.map(s => renderStrategyCard(s.key)).join("");
      return `
        <div class="strategy-tier-header">
          <div class="strategy-tier-label">${escAttr(tier.label)}</div>
          <div class="strategy-tier-hint">${escAttr(tier.hint)}</div>
        </div>
        ${cards}
      `;
    }).join("");

    const needsRerun = BOT_STRATEGIES.some(s => state.bot[s.key] && !state.bot[s.key].deploymentCount && !state.bot[s.key].equityPeak);
    const rerunNotice = needsRerun ? `
      <div style="margin:12px 20px;padding:10px 14px;background:rgba(176,141,60,0.10);border:1px solid var(--gold);border-radius:8px;font-size:12px;color:var(--ink-soft);font-family:var(--mono);">
        Strategy lineup updated. Reset and re-run the backtest to populate the new strategies with metrics.
      </div>` : "";
    body = `
      <div class="bot-hero">
        <h3>Paper Trading Bot</h3>
        <div class="sub">Universe: ${universe.length} symbols · ${lastRun ? "Last run " + fmtRel(lastRun) : "Never run"}</div>
        ${renderChartToggles(state.botChartVisible)}
        <div style="margin:0;padding:0;border:none;background:transparent;">${renderEquityChart(state.botChartVisible)}</div>
      </div>
      ${rerunNotice}
      ${renderLeaderboard()}
      ${cardsByTier}
    `;
  }

  view.innerHTML = `
    <div class="bot-bar">
      <span class="grow">${state.botRunning ? '<span class="spinner"></span> Running…' : "Paper trades · no real money"}</span>
      <button data-act="bot-step" ${state.botRunning ? "disabled" : ""}>Step Forward</button>
      <button data-act="bot-backtest" ${state.botRunning ? "disabled" : ""}>Backtest</button>
      <button data-act="bot-reset" ${state.botRunning ? "disabled" : ""} style="background:transparent;color:var(--red);border:1px solid var(--red);">Reset</button>
    </div>
    ${body}
  `;
}

  await refreshAllPrices();
  renderCurrentView();
  // Refresh all verdict-input signals too. Each respects its own cache TTL,
  // so this is cheap if called within the cache window.
  await autoRefreshSignals().catch(e => console.warn("manual auto-refresh:", e));

async function exportData() {
  const journal = await loadJournal();
  const data = {

    holdings: state.holdings,
    analyses: state.analyses,
    portfolio_analysis: state.portfolioAnalysis,
    watchlist: state.watchlist,
    bot: state.bot,
    journal,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `portfolio_${new Date().toISOString().slice(0,10)}.json`;

const debouncedSearchHold = debounce(async () => {

async function submitAddHolding() {
  const cls = $("#ah_class").value;
  if (cls === "cash") {
    const amount = parseFloat($("#ah_cash").value);
    if (!amount || amount <= 0) { toast("Enter a valid amount", 2400, "error"); return; }
    const existing = state.holdings.find(h => h.symbol === "CASH");
    if (existing) {
      const newQty = existing.quantity + amount;
      await db.collection("users").doc(state.uid).collection("holdings").doc("CASH").update({ quantity: newQty, avg_cost_total: newQty });
      toast(`Cash updated to $${fmtUSD(newQty, 2)}`);
    } else {
      await db.collection("users").doc(state.uid).collection("holdings").doc("CASH").set({
        symbol: "CASH", asset_class: "cash",
        quantity: amount, avg_cost_total: amount, avg_cost_unit: 1,
        currency: "USD", name: "Cash (USD)",
        added_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
      toast("Cash added");
    }
    closeModal();
    await loadHoldingsFromFirestore();
    await refreshAllPrices();
    renderCurrentView();
    return;
  }
  const symbol = $("#ah_symbol").value.trim().toUpperCase();
  const qty    = parseFloat($("#ah_qty").value);
  const cost   = parseFloat($("#ah_cost").value);
  const name   = $("#ah_name").value.trim() || symbol;
  if (!symbol || !qty || !cost) { toast("Fill all fields", 2400, "error"); return; }
  await db.collection("users").doc(state.uid).collection("holdings").doc(symbol).set({
    symbol, asset_class: cls,
    quantity: qty, avg_cost_total: cost, avg_cost_unit: cost / qty,
    currency: "USD", name,
    added_at: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true });
  toast("Holding added");
  closeModal();
  await loadHoldingsFromFirestore();
  await refreshAllPrices();
  renderCurrentView();
}

function renderCondFields() {
  const type = $("#cond_type").value;
  const cfg = CONDITION_TYPES.find(c => c.value === type);
  const dflt = cfg?.default || {};
  const fieldsBox = $("#cond_fields");

  if (type === "rsi_below" || type === "rsi_above") {
    fieldsBox.innerHTML = `<div class="field"><label>Threshold (RSI)</label><input id="cf_threshold" type="number" step="1" value="${dflt.threshold}" /></div>`;
  } else if (type === "ma_touch") {
    fieldsBox.innerHTML = `
      <div class="field-row">
        <div class="field"><label>MA Period</label>
          <select id="cf_period">
            <option value="20">MA20</option>
            <option value="50" ${dflt.period === 50 ? 'selected' : ''}>MA50</option>
            <option value="200" ${dflt.period === 200 ? 'selected' : ''}>MA200</option>
          </select>
        </div>
        <div class="field"><label>Tolerance %</label><input id="cf_tolerance" type="number" step="0.1" value="${dflt.tolerance_pct}" /></div>
      </div>
    `;
  } else if (type === "near_52w_high" || type === "near_52w_low" || type === "drop_from_peak") {
    fieldsBox.innerHTML = `<div class="field"><label>Percent Threshold</label><input id="cf_threshold_pct" type="number" step="0.5" value="${dflt.threshold_pct}" /></div>`;
  } else if (type === "macd_bullish_cross" || type === "macd_bearish_cross" || type === "ma_cross_bullish" || type === "ma_cross_bearish") {
    fieldsBox.innerHTML = `<div class="field"><label>Within (days)</label><input id="cf_within_days" type="number" step="1" value="${dflt.within_days}" /></div>`;
  } else if (type === "price_above" || type === "price_below") {
    fieldsBox.innerHTML = `<div class="field"><label>Price Threshold ($)</label><input id="cf_threshold" type="number" step="any" value="${dflt.threshold}" /></div>`;
  } else if (type === "breakout_high") {
    fieldsBox.innerHTML = `<div class="field"><label>Lookback (days)</label><input id="cf_period" type="number" step="1" value="${dflt.period}" /><div class="field-hint">Fires when today's close = highest in last N days. 50 is standard, 252 = 52-week high.</div></div>`;
  } else if (type === "bollinger_lower" || type === "bollinger_upper") {
    fieldsBox.innerHTML = `
      <div class="field-row">
        <div class="field"><label>MA Period</label><input id="cf_period" type="number" step="1" value="${dflt.period}" /></div>
        <div class="field"><label>Std Dev</label><input id="cf_std" type="number" step="0.1" value="${dflt.std}" /></div>
      </div>
      <div class="field-hint" style="margin-top:8px;">Bollinger uses MA(N) ± Xσ. 20 / 2 is the standard setup.</div>
    `;
  } else if (type === "momentum_above") {
    fieldsBox.innerHTML = `
      <div class="field-row">
        <div class="field"><label>Months Lookback</label><input id="cf_months" type="number" step="1" value="${dflt.months}" /></div>
        <div class="field"><label>Min Return %</label><input id="cf_threshold_pct" type="number" step="1" value="${dflt.threshold_pct}" /></div>
      </div>
    `;
  }
}
async function submitCondition(symbol) {
  const w = state.watchlist.find(x => x.symbol === symbol);
  if (!w) return;
  const type = $("#cond_type").value;
  const newCond = { id: `${symbol.toLowerCase()}_${Date.now()}`, type };
  if (type === "rsi_below" || type === "rsi_above") {
    newCond.threshold = parseFloat($("#cf_threshold").value);
  } else if (type === "ma_touch") {
    newCond.period = parseInt($("#cf_period").value, 10);
    newCond.tolerance_pct = parseFloat($("#cf_tolerance").value);
  } else if (type === "near_52w_high" || type === "near_52w_low" || type === "drop_from_peak") {
    newCond.threshold_pct = parseFloat($("#cf_threshold_pct").value);
  } else if (type === "macd_bullish_cross" || type === "macd_bearish_cross" || type === "ma_cross_bullish" || type === "ma_cross_bearish") {
    newCond.within_days = parseInt($("#cf_within_days").value, 10);
  } else if (type === "price_above" || type === "price_below") {
    newCond.threshold = parseFloat($("#cf_threshold").value);
  } else if (type === "breakout_high") {
    newCond.period = parseInt($("#cf_period").value, 10);
  } else if (type === "bollinger_lower" || type === "bollinger_upper") {
    newCond.period = parseInt($("#cf_period").value, 10);
    newCond.std = parseFloat($("#cf_std").value);
  } else if (type === "momentum_above") {
    newCond.months = parseInt($("#cf_months").value, 10);
    newCond.threshold_pct = parseFloat($("#cf_threshold_pct").value);
  }
  const newConds = [...(w.conditions || []), newCond];
  await db.collection("users").doc(state.uid).collection("watchlist").doc(symbol).update({ conditions: newConds });
  toast("Condition added");
  closeModal();
  await loadWatchlist();
  renderWatchDetail(symbol);
}

async function removeCondition(symbol, condId) {
  const w = state.watchlist.find(x => x.symbol === symbol);
  if (!w) return;
  const newConds = (w.conditions || []).filter(c => c.id !== condId);
  await db.collection("users").doc(state.uid).collection("watchlist").doc(symbol).update({ conditions: newConds });
  await loadWatchlist();
  renderWatchDetail(symbol);
}

function openLogTrade(symbol, recKey) {
  state._pendingRecKey = recKey || null;
  const sigSnapshot = symbol && state.analyses[symbol] ? state.analyses[symbol] : null;
  const stanceLabel = sigSnapshot?.stance || sigSnapshot?.signal || null;

  // Pre-fill exit/TP from analysis if available
  const analysis = sigSnapshot || {};
  const aTp = analysis.take_profit || {};
  const aExit = analysis.exit_strategy || {};
  const prefillTp1 = aTp.tp1 || "";
  const prefillTp2 = aTp.tp2 || "";
  const prefillTp3 = aTp.tp3 || "";
  const prefillStop = aExit.stop_loss || aExit.invalidation || "";
  const prefillExitTrigger = aExit.thesis_break || aExit.trailing_rule || "";

  // Build picker options from holdings + watchlist (deduped, alphabetical)
  const seen = new Set();
  const opts = [];
  for (const h of state.holdings) {
    if (h.asset_class === "cash") continue;
    if (seen.has(h.symbol)) continue;
    seen.add(h.symbol);
    opts.push({ symbol: h.symbol, name: h.name || "", source: "owned" });
  }
  for (const w of (state.watchlist || [])) {
    if (seen.has(w.symbol)) continue;
    seen.add(w.symbol);
    opts.push({ symbol: w.symbol, name: w.name || "", source: "watch" });
  }
  opts.sort((a, b) => a.symbol.localeCompare(b.symbol));

  const optionsHtml = opts.map(o => {
    const sel = o.symbol === symbol ? "selected" : "";
    return `<option value="${escAttr(o.symbol)}" ${sel}>${escAttr(o.symbol)}${o.name ? " — " + escAttr(o.name) : ""}${o.source === "owned" ? " (held)" : ""}</option>`;
  }).join("");

  openModal(`
    <div class="modal-head"><h3>Log Trade</h3></div>
    <div class="field">
      <label>Symbol</label>
      <select id="lt_symbol_select" style="width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--rule);border-radius:6px;font-family:var(--sans);font-size:14px;color:var(--ink);">
        <option value="">— Select a symbol —</option>
        ${optionsHtml}
        <option value="__OTHER__">Other (type manually)</option>
      </select>
    </div>
    <div class="field hidden" id="lt_symbol_other_wrap">
      <label>Symbol Code</label>
      <input id="lt_symbol_other" placeholder="e.g. SOL" style="text-transform:uppercase;" />
      <div class="field-hint" style="font-size:11px;color:var(--ink-muted);margin-top:4px;">Use the same code your data source uses (e.g. BTC, AAPL, VOO).</div>
    </div>
    <div class="field-row">
      <div class="field"><label>Action</label>
        <select id="lt_action">
          <option value="buy">Buy</option>
          <option value="sell">Sell</option>
        </select>
      </div>
      <div class="field"><label>Quantity</label><input id="lt_qty" type="number" step="any" /></div>
    </div>
    <div class="field">
      <label>Price per Unit (USD)</label>
      <input id="lt_price" type="number" step="any" />
    </div>
    <div class="field">
      <label>Reason / Thesis</label>
      <textarea id="lt_reason" rows="2" placeholder="Why did you make this trade?" style="font-family:var(--sans);"></textarea>
    </div>

    <div class="lt-strategy-block">
      <div class="lt-strategy-head">Take Profit Strategy</div>
      <div class="lt-strategy-hint">Stage your exits. Pre-filled from the latest analysis if available.</div>
      <div class="field-row">
        <div class="field"><label>TP1 (first scale-out)</label><input id="lt_tp1" placeholder="e.g. +10% or $120" value="${escAttr(prefillTp1)}" /></div>
        <div class="field"><label>TP2 (core target)</label><input id="lt_tp2" placeholder="e.g. +25% or $145" value="${escAttr(prefillTp2)}" /></div>
      </div>
      <div class="field"><label>TP3 (stretch)</label><input id="lt_tp3" placeholder="e.g. +50% or $180" value="${escAttr(prefillTp3)}" /></div>
    </div>

    <div class="lt-strategy-block">
      <div class="lt-strategy-head">Exit Strategy</div>
      <div class="lt-strategy-hint">Where you cut the loss or admit the thesis is wrong.</div>
      <div class="field"><label>Stop / Hard exit</label><input id="lt_stop" placeholder="e.g. -8% or $98" value="${escAttr(prefillStop)}" /></div>
      <div class="field"><label>Thesis-break trigger</label><textarea id="lt_exit_trigger" rows="2" placeholder="What would invalidate this trade?" style="font-family:var(--sans);">${escAttr(prefillExitTrigger)}</textarea></div>
    </div>

    ${stanceLabel ? `<div style="font-family:var(--mono);font-size:10.5px;color:var(--ink-muted);margin-bottom:14px;padding:10px;background:var(--bg-elev);border-radius:6px;">App stance: ${escAttr(stanceLabel)} · ${escAttr(sigSnapshot.confidence || "")} confidence</div>` : ""}
    <button class="btn btn-block" data-act="submit-trade" id="lt_submit_btn" ${stanceLabel ? `data-sig="${escAttr(stanceLabel)}" data-conf="${escAttr(sigSnapshot.confidence || '')}"` : ""}>Save</button>
  `);

  // Show "other symbol" input when user picks "Other"
  const sel = $("#lt_symbol_select");
  const otherWrap = $("#lt_symbol_other_wrap");
  sel.addEventListener("change", () => {
    if (sel.value === "__OTHER__") otherWrap.classList.remove("hidden");
    else otherWrap.classList.add("hidden");
  });
}

async function submitTrade(sig, conf) {
  const submitBtn = $("#lt_submit_btn");
  if (!submitBtn || submitBtn.disabled) return; // hard debounce: prevents double-tap double-save
  submitBtn.disabled = true;
  submitBtn.textContent = "Saving...";

  try {
    // Resolve symbol from picker (or manual fallback)
    const sel = $("#lt_symbol_select");
    let symbol = sel.value;
    if (symbol === "__OTHER__") {
      symbol = ($("#lt_symbol_other")?.value || "").trim().toUpperCase();
    } else if (!symbol) {
      symbol = "";
    }
    const action = $("#lt_action").value;
    const qty    = parseFloat($("#lt_qty").value);
    const price  = parseFloat($("#lt_price").value);
    const reason = $("#lt_reason").value.trim();
    const tp1    = ($("#lt_tp1")?.value || "").trim();
    const tp2    = ($("#lt_tp2")?.value || "").trim();
    const tp3    = ($("#lt_tp3")?.value || "").trim();
    const stop   = ($("#lt_stop")?.value || "").trim();
    const exitTrigger = ($("#lt_exit_trigger")?.value || "").trim();
    if (!symbol || !qty || !price) {
      toast("Fill symbol, quantity, and price", 2400, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Save";
      return;
    }
    if (qty <= 0 || price <= 0) {
      toast("Quantity and price must be positive", 2400, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Save";
      return;
    }

    // 1) Save journal entry — includes take-profit and exit strategy
    const journalRef = await db.collection("users").doc(state.uid).collection("journal").add({
      symbol, action, quantity: qty, price, reason,
      take_profit: { tp1, tp2, tp3 },
      exit_strategy: { stop_loss: stop, thesis_break: exitTrigger },
      date: new Date().toISOString().slice(0, 10),
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      signal_at_time: sig || null,
      confidence_at_time: conf || null,
    });

    // 2) Sync to portfolio holdings
    try {
      await syncTradeToHoldings(symbol, action, qty, price);
    } catch (e) {
      // Roll back the journal entry so it doesn't show a phantom trade
      try { await journalRef.delete(); } catch (_) {}
      toast(`Couldn't sync: ${e.message || e}`, 4000, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Save";
      return;
    }

    // 3) If this log was triggered from a recommendation, mark it done
    if (state._pendingRecKey) {
      state.recStatus[state._pendingRecKey] = {
        date: new Date().toISOString().slice(0, 10),
        status: "done",
        ts: Date.now(),
      };
      saveRecStatus();
      state._pendingRecKey = null;
    }

    toast(`Trade logged · Portfolio updated`);
    closeModal();
    await loadHoldingsFromFirestore();
    await refreshAllPrices();
    renderCurrentView();
  } catch (e) {
    toast("Save failed: " + (e.message || e), 4000, "error");
    submitBtn.disabled = false;
    submitBtn.textContent = "Save";
  }
}

// Apply a logged trade to the user's actual holdings.
// BUY:  add to position (or create), AND subtract proceeds from cash
// SELL: subtract from position (or close), AND add proceeds to cash
//
// IMPORTANT: this app's holdings schema uses these fields:
//   - quantity:        units held
//   - avg_cost_unit:   weighted-average cost per unit (USD)
//   - avg_cost_total:  total invested (= quantity × avg_cost_unit)
//   - asset_class:     "crypto" | "etf" | "metal" | "us_stock" | "cash"
//   - name:            optional display name
async function syncTradeToHoldings(symbol, action, qty, price) {
  if (symbol === "CASH") throw new Error("Cannot trade CASH directly");
  const holdingsRef = db.collection("users").doc(state.uid).collection("holdings");
  const existing = state.holdings.find(h => h.symbol === symbol && h.asset_class !== "cash");
  const cashHolding = state.holdings.find(h => h.symbol === "CASH" && h.asset_class === "cash");
  const tradeValue = qty * price;

  if (action === "buy") {
    // Validate cash if we have a cash holding tracked
    if (cashHolding) {
      const available = cashHolding.quantity || 0;
      if (tradeValue > available + 1e-6) {
        throw new Error(`Need $${fmtUSD(tradeValue)} but only have $${fmtUSD(available)} cash`);
      }
    }
    if (existing) {
      const oldQty   = existing.quantity || 0;
      const oldUnit  = existing.avg_cost_unit ?? (existing.avg_cost_total ? existing.avg_cost_total / oldQty : price);
      const newQty   = oldQty + qty;
      const newUnit  = ((oldQty * oldUnit) + (qty * price)) / newQty;
      const newTotal = newUnit * newQty;
      await holdingsRef.doc(existing.id).update({
        quantity: newQty,
        avg_cost_unit: newUnit,
        avg_cost_total: newTotal,
        last_updated: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } else {
      const assetClass = guessAssetClass(symbol);
      await holdingsRef.doc(symbol).set({
        symbol,
        quantity: qty,
        avg_cost_unit: price,
        avg_cost_total: qty * price,
        asset_class: assetClass,
        currency: "USD",
        added_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
    // Subtract from cash
    if (cashHolding) {
      const newCash = cashHolding.quantity - tradeValue;
      await holdingsRef.doc(cashHolding.id).update({
        quantity: newCash, avg_cost_total: newCash, avg_cost_unit: 1,
        last_updated: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
  } else if (action === "sell") {
    if (!existing) {
      throw new Error(`No ${symbol} position to sell from`);
    }
    const oldQty  = existing.quantity || 0;
    if (qty > oldQty + 1e-9) {
      throw new Error(`Trying to sell ${qty} ${symbol} but only have ${oldQty}`);
    }
    const newQty = oldQty - qty;
    if (newQty <= 1e-9) {
      await holdingsRef.doc(existing.id).delete();
    } else {
      const oldUnit = existing.avg_cost_unit ?? (existing.avg_cost_total ? existing.avg_cost_total / oldQty : 0);
      await holdingsRef.doc(existing.id).update({
        quantity: newQty,
        avg_cost_total: oldUnit * newQty,
        last_updated: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
    // Add proceeds to cash (or create cash holding if none yet)
    if (cashHolding) {
      const newCash = (cashHolding.quantity || 0) + tradeValue;
      await holdingsRef.doc(cashHolding.id).update({
        quantity: newCash, avg_cost_total: newCash, avg_cost_unit: 1,
        last_updated: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } else {
      await holdingsRef.doc("CASH").set({
        symbol: "CASH", asset_class: "cash",
        quantity: tradeValue, avg_cost_total: tradeValue, avg_cost_unit: 1,
        currency: "USD", name: "Cash (USD)",
        added_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
  }
}

// Heuristic: is this likely crypto, ETF, metal, or stock? Used when creating new holdings.
function guessAssetClass(sym) {
  const knownCrypto = ["BTC", "ETH", "SOL", "ADA", "DOT", "MATIC", "LINK", "AVAX", "DOGE", "XRP"];
  const knownMetal  = ["GLD", "SLV", "IGLN", "ISLN", "PSLV"];
  const knownETF    = ["VOO", "QQQ", "SPY", "IWM", "DIA", "VTI", "TLT", "EIMI", "SWRD", "VEA", "EFA"];
  if (knownCrypto.includes(sym)) return "crypto";
  if (knownMetal.includes(sym))  return "metal";
  if (knownETF.includes(sym))    return "etf";
  return "us_stock";
}

async function openTrigger(symbol, triggerId) {
  if (triggerId) await markTriggerSeen(triggerId);
  openAsset(symbol, "portfolio");
}

// ============================================================================
// EVENT DELEGATION
// ============================================================================
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-act], [data-view]");
  if (!target) return;

  if (target.dataset.view) {
    setView(target.dataset.view);
    return;
  }

  const act = target.dataset.act;
  const symbol = target.dataset.symbol;

  try {
    switch (act) {
      case "open-asset":             openAsset(symbol); break;
      case "open-asset-from-watch":  openAsset(symbol, "watchlist"); break;
      case "open-watch":             openWatchItem(symbol); break;
      case "back-watch":             backToWatchlist(); break;
      case "back-markets":           backToMarkets(); break;
      case "set-range":              setRange(target.dataset.range, symbol); break;
      case "run-analysis":           runAnalysis(symbol); break;
      case "run-portfolio-analysis": runPortfolioAnalysis(); break;
      case "rescan":                 rescan(); break;
      case "open-trigger":           openTrigger(symbol, target.dataset.triggerId); break;
      case "log-trade":              openLogTrade(symbol, target.dataset.recKey); break;
      case "add-holding":            openAddHolding(); break;
      case "submit-add":             submitAddHolding(); break;
      case "edit-holding":           openEditHolding(symbol); break;
      case "submit-edit":            submitEditHolding(symbol); break;
      case "delete-holding":         confirmDeleteHolding(symbol); break;
      case "submit-trade":           submitTrade(target.dataset.sig, target.dataset.conf); break;
      case "add-watch":              openAddWatch(); break;
      case "submit-add-watch":       submitAddWatch(); break;
      case "rm-watch":               removeFromWatch(symbol); break;
      case "add-cond":               openAddCondition(symbol); break;
      case "submit-cond":            submitCondition(symbol); break;
      case "rm-cond":                removeCondition(symbol, target.dataset.cid); break;
      case "refresh-news":           refreshNews(); break;
      case "run-presurge":           runPreSurge(); break;
      case "toggle-presurge-debug":  state.preSurgeDebug = !state.preSurgeDebug; renderCurrentView(); break;
      case "refresh-macro":          refreshMacro(); break;
      case "toggle-raw-signals":
        state.rawSignalsExpanded = !state.rawSignalsExpanded;
        try { localStorage.setItem("rawSignalsExpanded", state.rawSignalsExpanded ? "1" : "0"); } catch (e) {}
        renderCurrentView();
        break;
      case "toggle-trade-plan": {
        const key = target.dataset.key;
        if (key) {
          if (!state.tradePlanExpanded) state.tradePlanExpanded = {};
          state.tradePlanExpanded[key] = !state.tradePlanExpanded[key];
          renderCurrentView();
        }
        break;
      }
      case "mark-rec-done":          markRecommendationDone(target.dataset.recKey); break;
      case "dismiss-rec":            dismissRecommendation(target.dataset.recKey); break;
      case "preview-chart":          togglePreviewChart(target.dataset.symbol, target.dataset.name); break;
      case "pick-symbol":
        $("#ah_symbol").value = target.dataset.symbol;
        $("#ah_name").value = target.dataset.name || "";
        $("#ah_search_results").classList.add("hidden");
        break;
      case "pick-aw-symbol":
        $("#aw_symbol").value = target.dataset.symbol;
        $("#aw_name").value = target.dataset.name || "";
        $("#aw_search_results").classList.add("hidden");
        break;
      case "toggle-theme":           toggleTheme(); break;
      case "reset-pin":              resetPin(); break;
      case "manual-refresh":         manualRefresh(); break;
      case "export-data":            exportData(); break;
      case "bot-backtest":           runBacktest(); break;
      case "bot-step":               runForwardStep(); break;
      case "bot-reset":              resetBot(); break;
      case "bot-toggle-line":        toggleBotLine(target.dataset.key); break;
      case "toggle-analysis":        toggleAnalysis(target.dataset.key); break;
      case "auth-tab":               setAuthMode(target.dataset.mode); break;
      case "auth-submit":            submitAuth(); break;
      case "auth-skip":              skipAuth(); break;
      case "auth-migrate-yes":       handleMigrate(true); break;
      case "auth-migrate-no":        handleMigrate(false); break;
      case "sign-out":               signOutUser(); break;
      case "delete-journal":         deleteJournalEntry(target.dataset.id); break;
      case "add-curated":            addCuratedToWatchlist(target.dataset.symbol, target.dataset.name); break;
      case "analyze-from-discover":  analyzeFromDiscover(target.dataset.symbol, target.dataset.name); break;
      case "toggle-watchouts":       toggleWatchouts(); break;
      case "refresh-discover":       refreshDiscover(); break;
      case "clear-discover":         clearDiscoverDynamic(); break;
      case "filter-theme":           toggleDiscoverThemeFilter(target.dataset.theme); break;
      case "clear-discover-filters": clearDiscoverFilters(); break;
      case "refresh-leaderboard":    fetchEtfLeaderboard(true); break;
      case "lb-tf":                  setLeaderboardTimeframe(target.dataset.tf); break;
      case "lb-sort":                setLeaderboardSort(target.dataset.sort); break;
      case "dismiss-breakout-prompt": dismissBreakoutPrompt(); break;
      case "add-breakout-conditions": addBreakoutConditionsToHeld(); break;
    }
  } catch (err) {
    showError("Action failed: " + err.message);
  }
});

$("#themeBtn").addEventListener("click", toggleTheme);
$("#refreshBtn").addEventListener("click", manualRefresh);

// Show PIN screen after load, with a fallback in case `load` never fires
let _pinShown = false;
function safeShowPin() {
  if (_pinShown) return;
  _pinShown = true;
  try { showPinScreen(); }
  catch (e) { showBootError("Failed to show PIN screen: " + e.message); }
}
window.addEventListener("load", () => { setTimeout(safeShowPin, 600); });
// Fallback: if for any reason the load event hasn't triggered our handler within 3 seconds, force it
setTimeout(safeShowPin, 3000);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
