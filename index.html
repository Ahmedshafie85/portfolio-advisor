<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1a1814" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Portfolio" />
<title>Portfolio Advisor</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --bg:           #f5f1e8;
  --bg-elev:     #ede7d6;
  --bg-card:     #fbf8f0;
  --ink:          #1a1814;
  --ink-soft:    #4a4639;
  --ink-muted:   #8a8473;
  --rule:        #d8d2bf;
  --rule-soft:   #e8e2cf;
  --accent:      #a13d2d;
  --accent-soft: #c46b54;
  --green:       #4a7a4a;
  --green-soft:  #6b9b6b;
  --red:         #a13d2d;
  --red-soft:    #c46b54;
  --gold:        #b08d3c;
  --shadow:      0 1px 0 rgba(26,24,20,.04), 0 6px 18px -10px rgba(26,24,20,.18);
  --shadow-deep: 0 24px 60px -24px rgba(26,24,20,.28);
  --radius:      14px;
  --radius-sm:    8px;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:    'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  --mono:    'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}
[data-theme="night"] {
  --bg:           #14110d;
  --bg-elev:     #1d1914;
  --bg-card:     #1a1612;
  --ink:          #f0e9d6;
  --ink-soft:    #c4bca6;
  --ink-muted:   #8a8270;
  --rule:        #2d2820;
  --rule-soft:   #221d17;
  --accent:      #d97a5a;
  --accent-soft: #b85a3d;
  --green:       #7ab37a;
  --green-soft:  #5a8e5a;
  --red:         #d97a5a;
  --red-soft:    #b85a3d;
  --gold:        #d4a85c;
  --shadow:      0 1px 0 rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.5);
  --shadow-deep: 0 24px 60px -24px rgba(0,0,0,.7);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11', 'tnum';
  overscroll-behavior-y: none;
}
body {
  display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100dvh;
  padding-top: env(safe-area-inset-top);
}
.display { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; }
.mono    { font-family: var(--mono); font-feature-settings: 'tnum', 'zero'; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }
.label   { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }

.app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.view {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: 96px;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  position: sticky; top: 0; z-index: 30;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.topbar-title { font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.topbar-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.04em; }
.topbar-icons { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center;
  border: none; background: transparent; color: var(--ink-soft);
  cursor: pointer; border-radius: 50%;
  transition: background .15s, color .15s;
}
.icon-btn:hover, .icon-btn:active { background: var(--bg-elev); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }

.tabs {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--bg);
  border-top: 1px solid var(--rule);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px; border: none; background: transparent;
  color: var(--ink-muted);
  font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; transition: color .15s; border-radius: 10px;
}
.tab.active { color: var(--ink); }
.tab svg { width: 22px; height: 22px; stroke-width: 1.5; }
.tab.active svg { stroke-width: 2; }

.section { padding: 20px; }
.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.section-head h2 { font-family: var(--display); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }

.hero {
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 22px 20px 20px;
  margin: 16px 20px 8px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--gold) 50%, var(--accent) 100%);
}
.hero .eyebrow { margin-bottom: 8px; }
.hero-value { font-family: var(--display); font-size: 44px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.hero-value .currency-prefix {
  font-size: 22px; color: var(--ink-muted);
  margin-right: 4px; vertical-align: top; position: relative; top: 8px;
}
.hero-meta {
  display: flex; gap: 24px;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--rule-soft);
}
.hero-stat { flex: 1; }
.hero-stat-value { font-family: var(--mono); font-size: 15px; font-weight: 500; margin-top: 2px; }
.hero-stat-value.pos { color: var(--green); }
.hero-stat-value.neg { color: var(--red); }

.alloc-strip {
  display: flex; height: 6px; border-radius: 3px;
  overflow: hidden; margin-top: 14px; background: var(--rule);
}
.alloc-seg { height: 100%; transition: flex .3s; }
.alloc-legend {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 6px 16px; margin-top: 10px; font-size: 12px;
}
.alloc-legend-item { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
.alloc-dot { width: 8px; height: 8px; border-radius: 50%; }

.holdings { margin: 8px 0 20px; }
.holding {
  display: flex; align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rule-soft);
  cursor: pointer; transition: background .15s; position: relative;
}
.holding:hover, .holding:active { background: var(--bg-elev); }
.holding-icon {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--bg-elev);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 600; font-size: 14px;
  color: var(--ink-soft);
  margin-right: 14px; flex-shrink: 0;
  border: 1px solid var(--rule);
}
.holding-icon[data-class="crypto"] { background: var(--bg); border-color: var(--gold); color: var(--gold); }
.holding-icon[data-class="metal"]  { background: var(--bg); border-color: var(--gold); color: var(--gold); }
.holding-icon[data-class="etf"]    { background: var(--bg); border-color: var(--ink-soft); color: var(--ink-soft); }
.holding-icon[data-class="cash"]   { background: var(--bg); border-color: var(--ink-muted); color: var(--ink-muted); }
.holding-main { flex: 1; min-width: 0; }
.holding-symbol { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.holding-name {
  font-size: 11.5px; color: var(--ink-muted); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
}
.holding-right { text-align: right; font-family: var(--mono); }
.holding-value { font-size: 14px; font-weight: 500; color: var(--ink); }
.holding-pnl { font-size: 11.5px; margin-top: 1px; letter-spacing: 0.02em; }
.holding-pnl.pos { color: var(--green); }
.holding-pnl.neg { color: var(--red); }
.holding-pnl.flat { color: var(--ink-muted); }
.holding-signal {
  position: absolute; top: 18px; right: 14px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); display: none;
}
.holding-signal.show { display: block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  border-radius: var(--radius-sm);
  font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; transition: opacity .15s, transform .1s;
  text-transform: uppercase;
}
.btn:active { transform: scale(0.98); }
.btn:hover  { opacity: 0.92; }
.btn-secondary { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn-ghost { background: transparent; color: var(--ink-soft); border: none; padding: 10px 14px; }
.btn-block { display: flex; width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 11.5px; }
.btn-danger { background: transparent; color: var(--red); border-color: var(--red-soft); }

.pin-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; padding: 40px 30px;
}
.pin-logo { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 6px; }
.pin-tag { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 50px; }
.pin-prompt { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; letter-spacing: 0.04em; }
.pin-dots { display: flex; gap: 14px; margin-bottom: 36px; }
.pin-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--ink-soft); background: transparent;
  transition: background .15s, border-color .15s, transform .15s;
}
.pin-dot.filled { background: var(--ink); border-color: var(--ink); transform: scale(1.1); }
.pin-dot.error { background: var(--red); border-color: var(--red); animation: shake .4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
.pin-key {
  width: 72px; height: 72px;
  border: 1px solid var(--rule); background: var(--bg-card); color: var(--ink);
  font-family: var(--display); font-size: 26px; font-weight: 500;
  border-radius: 50%; cursor: pointer;
  transition: background .12s, transform .1s;
}
.pin-key:active { background: var(--bg-elev); transform: scale(0.95); }
.pin-key.empty { visibility: hidden; }
.pin-key.del { font-size: 22px; }
.pin-error { color: var(--red); font-size: 12px; margin-top: 14px; letter-spacing: 0.04em; height: 16px; }

.loader-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 95;
}
.loader-logo { font-family: var(--display); font-size: 28px; margin-bottom: 18px; letter-spacing: -0.01em; }
.loader-bar { width: 120px; height: 1.5px; background: var(--rule); position: relative; overflow: hidden; }
.loader-bar::after {
  content: ""; position: absolute; inset: 0; width: 40%;
  background: var(--ink); animation: loader 1.2s infinite ease-in-out;
}
@keyframes loader {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

.detail-head { padding: 18px 20px 12px; }
.detail-back {
  font-family: var(--sans); font-size: 13px; color: var(--ink-soft);
  background: none; border: none; padding: 4px 0; margin-bottom: 14px;
  cursor: pointer; letter-spacing: 0.04em;
  display: inline-flex; align-items: center; gap: 4px;
}
.detail-symbol { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.025em; line-height: 1; }
.detail-name { font-size: 12px; color: var(--ink-muted); margin-top: 4px; letter-spacing: 0.02em; }
.detail-price { font-family: var(--mono); font-size: 28px; font-weight: 500; margin-top: 14px; letter-spacing: -0.01em; }
.detail-change { font-family: var(--mono); font-size: 13px; margin-top: 4px; }
.detail-change.pos { color: var(--green); }
.detail-change.neg { color: var(--red); }
.detail-change.flat { color: var(--ink-muted); }

.chart-wrap {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); overflow: hidden;
}
.chart-controls { display: flex; border-bottom: 1px solid var(--rule-soft); }
.range-btn {
  flex: 1; padding: 10px 0; border: none; background: transparent;
  color: var(--ink-muted);
  font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.06em;
  cursor: pointer; transition: color .15s, background .15s;
}
.range-btn.active { color: var(--ink); background: var(--bg-elev); }
#chart { height: 280px; padding: 8px 4px; }

.ind-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--rule-soft);
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  overflow: hidden;
}
.ind-cell { background: var(--bg-card); padding: 12px 10px; text-align: center; }
.ind-cell .label { font-size: 9.5px; letter-spacing: 0.1em; }
.ind-cell .val { font-family: var(--mono); font-size: 14px; font-weight: 500; margin-top: 4px; color: var(--ink); }
.ind-cell .val.pos { color: var(--green); }
.ind-cell .val.neg { color: var(--red); }
.ind-cell .val.warn { color: var(--accent); }

.pos-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 16px 18px;
}
.pos-card h3 { font-family: var(--display); font-size: 16px; font-weight: 500; margin-bottom: 12px; letter-spacing: -0.01em; }
.pos-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.pos-row .lbl { color: var(--ink-muted); letter-spacing: 0.02em; }
.pos-row .val { font-family: var(--mono); font-weight: 500; }
.pos-row .val.pos { color: var(--green); }
.pos-row .val.neg { color: var(--red); }
.pos-row .val.flat { color: var(--ink-muted); }

.pos-actions {
  display: flex; gap: 8px; margin-top: 14px;
  padding-top: 14px; border-top: 1px solid var(--rule-soft);
}

.ai-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 18px 20px;
  position: relative; overflow: hidden;
}
.ai-card::before {
  content: ""; position: absolute; top: 0; left: 0;
  width: 4px; height: 100%; background: var(--accent);
}
.ai-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.ai-head h3 { font-family: var(--display); font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
.signal-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; border: 1px solid var(--rule);
}
.signal-pill.bullish          { background: rgba(74,122,74,0.12); color: var(--green); border-color: var(--green-soft); }
.signal-pill.neutral-bullish  { background: rgba(74,122,74,0.06); color: var(--green-soft); border-color: var(--rule); }
.signal-pill.neutral          { color: var(--ink-soft); }
.signal-pill.neutral-bearish  { background: rgba(161,61,45,0.06); color: var(--red-soft); border-color: var(--rule); }
.signal-pill.bearish          { background: rgba(161,61,45,0.12); color: var(--red); border-color: var(--red-soft); }
.signal-pill.no-signal        { color: var(--ink-muted); border-style: dashed; }

.confidence-pill {
  display: inline-flex;
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  padding: 3px 8px; background: var(--bg-elev); color: var(--ink-soft);
  border-radius: 4px; letter-spacing: 0.1em; text-transform: uppercase; margin-left: 6px;
}

.ai-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft); }
.ai-section:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.ai-section h4 {
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 6px;
}
.ai-section p { font-size: 14px; color: var(--ink); line-height: 1.55; }

.levels-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft); border-radius: var(--radius-sm);
  overflow: hidden; margin-top: 8px;
}
.level-cell { background: var(--bg-card); padding: 10px 8px; text-align: center; }
.level-cell .lvl-lbl { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
.level-cell .lvl-val { font-family: var(--mono); font-size: 14px; margin-top: 3px; font-weight: 500; }
.lvl-val.support { color: var(--green); }
.lvl-val.resistance { color: var(--red); }
.lvl-val.stop { color: var(--accent); }

.risks ul { list-style: none; margin-top: 6px; }
.risks li {
  font-size: 13px; padding: 5px 0 5px 18px; position: relative;
  color: var(--ink); line-height: 1.45;
}
.risks li::before {
  content: ""; position: absolute; left: 4px; top: 12px;
  width: 4px; height: 1px; background: var(--accent);
}

.ai-actions {
  display: flex; gap: 8px;
  margin-top: 16px; padding-top: 14px;
  border-top: 1px solid var(--rule-soft);
}
.ai-stamp { font-family: var(--mono); font-size: 10px; color: var(--ink-muted); letter-spacing: 0.04em; margin-top: 12px; }

.empty-ai { text-align: center; padding: 30px 20px; color: var(--ink-muted); font-size: 13px; }
.empty-ai .display { font-size: 16px; color: var(--ink-soft); margin-bottom: 14px; display: block; }

.sent-card {
  margin: 14px 20px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); padding: 18px 20px;
}
.sent-card h3 { font-family: var(--display); font-size: 16px; font-weight: 500; margin-bottom: 12px; }
.sent-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; font-size: 13px;
  border-bottom: 1px solid var(--rule-soft);
}
.sent-row:last-child { border: none; }
.sent-row .lbl { color: var(--ink-muted); }
.sent-row .val { font-family: var(--mono); font-weight: 500; }
.news-list { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule-soft); }
.news-item { padding: 8px 0; border-bottom: 1px solid var(--rule-soft); }
.news-item:last-child { border: none; }
.news-item a { color: var(--ink); text-decoration: none; font-size: 13px; line-height: 1.4; display: block; }
.news-item a:hover { color: var(--accent); }
.news-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted); margin-top: 3px; letter-spacing: 0.02em; }

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(20,17,13,0.5);
  z-index: 90; opacity: 0; pointer-events: none;
  transition: opacity .2s;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal-bg.show { opacity: 1; pointer-events: all; }
.modal {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-card);
  border-radius: 18px 18px 0 0;
  padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
  z-index: 91; transform: translateY(100%);
  transition: transform .25s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow-deep);
}
.modal.show { transform: translateY(0); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-head h3 { font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
.modal-handle { width: 36px; height: 4px; background: var(--rule); border-radius: 2px; margin: 0 auto 18px; }

.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 500; margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--rule);
  background: var(--bg); color: var(--ink);
  font-family: var(--mono); font-size: 15px;
  border-radius: var(--radius-sm);
  -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ink); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-hint { font-size: 11px; color: var(--ink-muted); margin-top: 4px; letter-spacing: 0.02em; }

/* Symbol search dropdown */
.search-results {
  position: absolute; left: 0; right: 0; top: 100%;
  background: var(--bg-card);
  border: 1px solid var(--rule); border-radius: var(--radius-sm);
  margin-top: 4px; max-height: 240px; overflow-y: auto;
  box-shadow: var(--shadow-deep); z-index: 5;
}
.search-result {
  padding: 10px 14px; border-bottom: 1px solid var(--rule-soft);
  cursor: pointer; transition: background .12s;
}
.search-result:last-child { border: none; }
.search-result:hover { background: var(--bg-elev); }
.search-result .sym { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.search-result .nm { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
.search-result .ex { font-family: var(--mono); font-size: 10px; color: var(--ink-muted); float: right; }

.empty-state { text-align: center; padding: 60px 30px; color: var(--ink-muted); }
.empty-state .display { font-size: 22px; font-weight: 500; color: var(--ink-soft); margin-bottom: 8px; display: block; }
.empty-state p { font-size: 13px; margin-bottom: 22px; }

.settings-group {
  margin: 0 20px 24px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--bg-card); overflow: hidden;
}
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--rule-soft); }
.setting-row:last-child { border-bottom: none; }
.setting-row .lbl { font-size: 14px; }
.setting-row .sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }

.toggle {
  position: relative; width: 44px; height: 26px;
  background: var(--rule); border-radius: 13px;
  cursor: pointer; transition: background .2s; flex-shrink: 0;
}
.toggle::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; background: var(--bg-card);
  border-radius: 50%; transition: transform .2s; box-shadow: var(--shadow);
}
.toggle.on { background: var(--ink); }
.toggle.on::after { transform: translateX(18px); }

.journal-entry { padding: 14px 20px; border-bottom: 1px solid var(--rule-soft); }
.journal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.journal-symbol { font-family: var(--display); font-size: 16px; font-weight: 600; }
.journal-action {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 3px; margin-left: 8px;
}
.journal-action.buy  { background: rgba(74,122,74,0.12); color: var(--green); }
.journal-action.sell { background: rgba(161,61,45,0.12); color: var(--red); }
.journal-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.02em; }
.journal-reason { font-size: 13px; margin-top: 8px; color: var(--ink-soft); line-height: 1.45; }
.journal-snapshot {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  margin-top: 6px; padding: 6px 8px; background: var(--bg-elev);
  border-radius: 4px; letter-spacing: 0.02em;
}

.alert-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--rule-soft); }
.alert-info .symbol { font-family: var(--display); font-size: 15px; font-weight: 600; }
.alert-info .cond { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
.alert-actions { display: flex; gap: 6px; }

.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg);
  padding: 12px 18px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
  box-shadow: var(--shadow-deep);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: all; }
.toast.error { background: var(--red); }

.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--rule); border-top-color: var(--ink);
  border-radius: 50%; animation: spin .8s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.hidden { display: none !important; }
::-webkit-scrollbar { width: 0; }
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<script>
// ============================================================================
// CONFIG
// ============================================================================
const WORKER_URL = "https://portfolio-advisor.abdelshafie-ahmed.workers.dev";

const firebaseConfig = {
  apiKey: "AIzaSyBwsK7cJfbNcx_JMv6ogdyvjtszcKG37xI",
  authDomain: "promos-maroc.firebaseapp.com",
  projectId: "promos-maroc",
  storageBucket: "promos-maroc.firebasestorage.app",
  messagingSenderId: "56006761255",
  appId: "1:56006761255:web:f8e2e5b6236a722e386702"
};

const SEED_HOLDINGS = [
  { symbol: "SWRD", asset_class: "etf",      quantity: 581.9955,    avg_cost_total: 28093, name: "SPDR MSCI World UCITS ETF" },
  { symbol: "EIMI", asset_class: "etf",      quantity: 297.3597,    avg_cost_total: 12857, name: "iShares Core MSCI EM IMI" },
  { symbol: "ISLN", asset_class: "metal",    quantity: 138.234,     avg_cost_total: 7096,  name: "iShares Physical Silver ETC" },
  { symbol: "MSTR", asset_class: "us_stock", quantity: 24.0824,     avg_cost_total: 7266,  name: "Strategy (MicroStrategy)" },
  { symbol: "IGLN", asset_class: "metal",    quantity: 12.881,      avg_cost_total: 1002,  name: "iShares Physical Gold ETC" },
  { symbol: "ETH",  asset_class: "crypto",   quantity: 1.68280236,  avg_cost_total: 6336,  name: "Ethereum" },
  { symbol: "BTC",  asset_class: "crypto",   quantity: 0.10996493,  avg_cost_total: 8855,  name: "Bitcoin" },
  { symbol: "CASH", asset_class: "cash",     quantity: 1760,        avg_cost_total: 1760,  name: "Cash (USD)" },
];

const ALLOC_COLORS = {
  etf:      "#4a4639",
  us_stock: "#a13d2d",
  crypto:   "#b08d3c",
  metal:    "#d4a85c",
  cash:     "#8a8473",
};
const ALLOC_LABELS = {
  etf: "ETFs",
  us_stock: "Stocks",
  crypto: "Crypto",
  metal: "Metals",
  cash: "Cash",
};

const ASSET_CLASSES = [
  { value: "us_stock", label: "US Stock" },
  { value: "etf",      label: "ETF" },
  { value: "crypto",   label: "Crypto" },
  { value: "metal",    label: "Metal / Commodity" },
  { value: "cash",     label: "Cash" },
];

// ============================================================================
// STATE
// ============================================================================
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

const state = {
  uid: null,
  pin: null,
  pinAttempts: 0,
  currentView: "portfolio",
  holdings: [],
  prices: {},
  analyses: {},
  selectedSymbol: null,
  selectedRange: "3M",
  chart: null,
  theme: localStorage.getItem("theme") || "day",
};
document.documentElement.setAttribute("data-theme", state.theme);

// ============================================================================
// UTILS
// ============================================================================
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

function fmtUSD(n, decimals = 2) {
  if (n == null || isNaN(n)) return "—";
  if (Math.abs(n) >= 1000) {
    return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  return n.toFixed(decimals);
}
function fmtPct(n, withSign = true) {
  if (n == null || isNaN(n)) return "—";
  const s = withSign && n > 0 ? "+" : "";
  return s + n.toFixed(2) + "%";
}
function fmtNum(n, decimals = 4) {
  if (n == null || isNaN(n)) return "—";
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: decimals });
}
function fmtRel(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const ms = Date.now() - d.getTime();
  const m = Math.floor(ms / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const days = Math.floor(h / 24);
  if (days < 7) return days + "d ago";
  return d.toLocaleDateString();
}
function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function toast(msg, ms = 2400, type = "default") {
  const el = $("#toast");
  el.textContent = msg;
  el.className = "toast show" + (type === "error" ? " error" : "");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}

// ============================================================================
// PIN GATE
// ============================================================================
function setupPinPad() {
  const pad = $("#pinPad");
  pad.innerHTML = "";
  const keys = [1,2,3,4,5,6,7,8,9,"",0,"⌫"];
  keys.forEach(k => {
    const b = document.createElement("button");
    b.className = "pin-key" + (k === "" ? " empty" : "") + (k === "⌫" ? " del" : "");
    b.textContent = k;
    b.addEventListener("click", () => handlePinKey(k));
    pad.appendChild(b);
  });
}
let pinBuffer = "", pinMode = "enter", pinFirstTry = "";

function handlePinKey(k) {
  $("#pinError").textContent = "";
  if (k === "⌫") {
    pinBuffer = pinBuffer.slice(0, -1);
  } else if (typeof k === "number" && pinBuffer.length < 4) {
    pinBuffer += String(k);
  } else { return; }
  updatePinDots();
  if (pinBuffer.length === 4) {
    setTimeout(() => processPin(), 120);
  }
}
function updatePinDots(error = false) {
  $$("#pinDots .pin-dot").forEach((d, i) => {
    d.classList.toggle("filled", i < pinBuffer.length);
    d.classList.toggle("error", error);
  });
}
function processPin() {
  const stored = localStorage.getItem("pinHash");
  if (!stored) {
    if (pinMode === "enter" || pinMode === "create") {
      pinFirstTry = pinBuffer;
      pinBuffer = "";
      pinMode = "confirm";
      updatePinDots();
      $("#pinPrompt").textContent = "Confirm your PIN";
      return;
    }
    if (pinMode === "confirm") {
      if (pinBuffer === pinFirstTry) {
        localStorage.setItem("pinHash", hashPin(pinBuffer));
        unlockApp();
      } else {
        showPinError("PINs don't match. Start over.");
        pinFirstTry = ""; pinBuffer = "";
        pinMode = "create";
        $("#pinPrompt").textContent = "Create a 4-digit PIN";
        updatePinDots();
      }
    }
  } else {
    if (hashPin(pinBuffer) === stored) {
      unlockApp();
    } else {
      state.pinAttempts++;
      showPinError(state.pinAttempts >= 5 ? "Too many attempts." : "Incorrect PIN");
      pinBuffer = "";
      updatePinDots(true);
      setTimeout(() => updatePinDots(false), 400);
    }
  }
}
function showPinError(msg) { $("#pinError").textContent = msg; }
function hashPin(p) {
  let h = 0x811c9dc5;
  for (let i = 0; i < p.length; i++) {
    h ^= p.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(16);
}
function unlockApp() {
  $("#pinScreen").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#topbarMeta").textContent = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  loadInitialData();
}
function showPinScreen() {
  $("#loader").classList.add("hidden");
  $("#pinScreen").classList.remove("hidden");
  setupPinPad();
  if (!localStorage.getItem("pinHash")) {
    pinMode = "create";
    $("#pinPrompt").textContent = "Create a 4-digit PIN";
  }
}

// ============================================================================
// AUTH + DATA
// ============================================================================
async function ensureAuth() {
  return new Promise((resolve, reject) => {
    auth.onAuthStateChanged(async user => {
      if (user) {
        state.uid = user.uid;
        resolve(user);
      } else {
        try { await auth.signInAnonymously(); }
        catch (e) { reject(e); }
      }
    });
  });
}

async function loadInitialData() {
  await ensureAuth();
  await loadHoldingsFromFirestore();
  if (state.holdings.length === 0) await seedHoldings();
  await loadAnalysesFromFirestore();
  await refreshAllPrices();
  renderCurrentView();
}

async function loadHoldingsFromFirestore() {
  const snap = await db.collection("users").doc(state.uid).collection("holdings").get();
  state.holdings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function seedHoldings() {
  for (const h of SEED_HOLDINGS) {
    const doc = {
      symbol: h.symbol,
      asset_class: h.asset_class,
      quantity: h.quantity,
      avg_cost_total: h.avg_cost_total,
      avg_cost_unit: h.avg_cost_total / h.quantity,
      currency: "USD",
      name: h.name,
      added_at: firebase.firestore.FieldValue.serverTimestamp(),
    };
    await db.collection("users").doc(state.uid).collection("holdings").doc(h.symbol).set(doc);
  }
  await loadHoldingsFromFirestore();
}

async function loadAnalysesFromFirestore() {
  const snap = await db.collection("users").doc(state.uid).collection("analyses")
    .orderBy("generated_at", "desc").limit(50).get();
  const latest = {};
  snap.docs.forEach(d => {
    const data = d.data();
    if (!latest[data.symbol] || (data.generated_at > latest[data.symbol].generated_at)) {
      latest[data.symbol] = data;
    }
  });
  state.analyses = latest;
}

async function refreshAllPrices() {
  const promises = state.holdings.map(h =>
    fetch(`${WORKER_URL}/price/${encodeURIComponent(h.symbol)}`)
      .then(r => r.json())
      .then(p => { state.prices[h.symbol] = p; })
      .catch(e => console.warn("price fetch failed:", h.symbol, e))
  );
  await Promise.all(promises);
}

// ============================================================================
// METRICS
// ============================================================================
function holdingMetrics(h) {
  const p = state.prices[h.symbol];
  const cur = p?.current_price;
  const value = cur != null ? cur * h.quantity : null;
  const pnlAbs = value != null ? value - h.avg_cost_total : null;
  const pnlPct = h.avg_cost_total > 0 && pnlAbs != null ? (pnlAbs / h.avg_cost_total) * 100 : null;
  const dayPct = p && p.prev_close ? ((cur - p.prev_close) / p.prev_close) * 100 : null;
  return { current_price: cur, value, pnlAbs, pnlPct, dayPct };
}
function portfolioMetrics() {
  let totalValue = 0, totalCost = 0;
  let alloc = {};
  let dayChangeAbs = 0;
  for (const h of state.holdings) {
    const m = holdingMetrics(h);
    if (m.value != null) {
      totalValue += m.value;
      alloc[h.asset_class] = (alloc[h.asset_class] || 0) + m.value;
      const p = state.prices[h.symbol];
      if (p && p.prev_close) {
        const prevValue = p.prev_close * h.quantity;
        dayChangeAbs += (m.value - prevValue);
      }
    }
    totalCost += h.avg_cost_total;
  }
  const totalPnL = totalValue - totalCost;
  const totalPnLPct = totalCost > 0 ? (totalPnL / totalCost) * 100 : 0;
  const dayPct = (totalValue - dayChangeAbs) > 0 ? (dayChangeAbs / (totalValue - dayChangeAbs)) * 100 : 0;
  return { totalValue, totalCost, totalPnL, totalPnLPct, dayChangeAbs, dayPct, alloc };
}

// ============================================================================
// VIEWS
// ============================================================================
function renderCurrentView() {
  const v = state.currentView;
  if (v === "portfolio") renderPortfolio();
  else if (v === "markets") renderMarkets();
  else if (v === "journal") renderJournal();
  else if (v === "alerts") renderAlerts();
  else if (v === "settings") renderSettings();
}
function setView(v) {
  state.currentView = v;
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === v));
  state.selectedSymbol = null;
  renderCurrentView();
}

// ----- Portfolio
function renderPortfolio() {
  const m = portfolioMetrics();
  const view = $("#view");

  let allocSegs = "", allocLegend = "";
  const allocEntries = Object.entries(m.alloc).sort((a, b) => b[1] - a[1]);
  for (const [cls, val] of allocEntries) {
    const pct = m.totalValue > 0 ? (val / m.totalValue) * 100 : 0;
    allocSegs += `<div class="alloc-seg" style="flex:${pct};background:${ALLOC_COLORS[cls] || '#888'}"></div>`;
    allocLegend += `<div class="alloc-legend-item">
      <div class="alloc-dot" style="background:${ALLOC_COLORS[cls] || '#888'}"></div>
      <span>${ALLOC_LABELS[cls] || cls} · ${pct.toFixed(1)}%</span>
    </div>`;
  }

  let holdingsHtml = "";
  if (state.holdings.length === 0) {
    holdingsHtml = `<div class="empty-state">
      <span class="display">No holdings yet</span>
      <p>Tap below to add your first position.</p>
      <button class="btn" onclick="openAddHolding()">Add Holding</button>
    </div>`;
  } else {
    state.holdings.sort((a, b) => (holdingMetrics(b).value || 0) - (holdingMetrics(a).value || 0));
    holdingsHtml = state.holdings.map(h => {
      const hm = holdingMetrics(h);

  if (!price) {
    view.innerHTML = `

      <div class="detail-name">${holding?.name || ""}</div>
      <div class="detail-price">$${fmtUSD(cur)}</div>
      ${!isCash ? `<div class="detail-change ${dayPct >= 0 ? 'pos' : 'neg'}">${dayPct >= 0 ? '+' : ''}$${fmtUSD(Math.abs((cur - price.prev_close)))} · ${fmtPct(dayPct)} today</div>` : `<div class="detail-change flat">Cash · fixed value</div>`}

    ${a.sentiment_summary ? `<div class="ai-section"><h4>Sentiment</h4><p>${a.sentiment_summary}</p></div>` : ""}
    ${(wl.support || wl.resistance || wl.stop_loss_idea) ? `

        <div class="level-cell"><div class="lvl-lbl">Resistance</div><div class="lvl-val resistance">${wl.resistance ? '$' + fmtUSD(wl.resistance) : '—'}</div></div>

// ----- Chart
function getThemeColors() {
  const css = getComputedStyle(document.documentElement);
  return {
    bg: css.getPropertyValue("--bg-card").trim(),
    text: css.getPropertyValue("--ink").trim(),
    muted: css.getPropertyValue("--ink-muted").trim(),
    rule: css.getPropertyValue("--rule").trim(),
    green: css.getPropertyValue("--green").trim(),
    red:   css.getPropertyValue("--red").trim(),
    accent: css.getPropertyValue("--accent").trim(),
    gold: css.getPropertyValue("--gold").trim(),
  };
}
function renderChart(symbol, range) {
  const price = state.prices[symbol];
  if (!price || !price.ohlcv) return;
  const c = getThemeColors();
  const el = $("#chart");
  if (!el) return;
  el.innerHTML = "";

  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: c.bg }, textColor: c.muted, fontFamily: "'IBM Plex Mono', monospace" },
    grid: { vertLines: { color: c.rule, style: 1 }, horzLines: { color: c.rule, style: 1 } },
    crosshair: { mode: 1, vertLine: { color: c.muted, width: 1, style: 2 }, horzLine: { color: c.muted, width: 1, style: 2 } },
    rightPriceScale: { borderColor: c.rule },
    timeScale: { borderColor: c.rule, timeVisible: false, secondsVisible: false },
    handleScroll: true, handleScale: true,
    height: 280,
  });

  const candle = chart.addCandlestickSeries({
    upColor: c.green, downColor: c.red,
    borderUpColor: c.green, borderDownColor: c.red,
    wickUpColor: c.green, wickDownColor: c.red,
  });

  const now = Date.now();
  const rangeMs = { "1M": 30*864e5, "3M": 90*864e5, "6M": 180*864e5, "1Y": 365*864e5, "ALL": Infinity }[range];
  const filtered = price.ohlcv.filter(d => (now - d.t) <= rangeMs);
  const data = filtered.map(d => ({
    time: Math.floor(d.t / 1000),
    open: d.o, high: d.h, low: d.l, close: d.c,
  }));
  candle.setData(data);

  const closes = filtered.map(d => d.c);
  const times  = filtered.map(d => Math.floor(d.t / 1000));
  function maSeries(period, color) {
    if (closes.length < period) return null;
    const series = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    const out = [];
    for (let i = period - 1; i < closes.length; i++) {
      const slice = closes.slice(i - period + 1, i + 1);
      const avg = slice.reduce((a,b) => a + b, 0) / period;
      out.push({ time: times[i], value: avg });
    }
    series.setData(out);
    return series;
  }
  maSeries(20, c.gold);
  maSeries(50, c.accent);
  maSeries(200, c.muted);

  chart.timeScale().fitContent();
  state.chart = chart;
}
function setRange(r, symbol) {
  state.selectedRange = r;
  renderChart(symbol, r);
  $$(".range-btn").forEach(b => b.classList.toggle("active", b.textContent === r));
}

async function loadIndicators(symbol) {
  try {
    const r = await fetch(`${WORKER_URL}/indicators/${encodeURIComponent(symbol)}`);
    const j = await r.json();
    const ind = j.indicators || {};
    const macdCross = ind.macd?.crossover || "none";
    const rsiClass = ind.rsi14 > 70 ? "warn" : ind.rsi14 < 30 ? "warn" : "";
    const trendClass = ind.trend === "above_200ma" ? "pos" : "neg";
    const macdClass = macdCross.startsWith("bullish") ? "pos" : macdCross.startsWith("bearish") ? "neg" : "";

    const strip = $("#indStrip");
    if (!strip) return;
    strip.innerHTML = `
      <div class="ind-cell"><div class="label">RSI 14</div><div class="val ${rsiClass}">${ind.rsi14 ? ind.rsi14.toFixed(1) : '—'}</div></div>
      <div class="ind-cell"><div class="label">MACD</div><div class="val ${macdClass}">${macdCross.replace(/_/g, ' ')}</div></div>
      <div class="ind-cell"><div class="label">Trend</div><div class="val ${trendClass}">${ind.trend === 'above_200ma' ? 'Above 200' : 'Below 200'}</div></div>
      <div class="ind-cell"><div class="label">52W</div><div class="val">${ind.pct_from_52w_high ? ind.pct_from_52w_high.toFixed(1) + '%' : '—'}</div></div>
    `;
  } catch (e) { console.warn("indicators load failed", e); }
}

async function loadSentiment(symbol) {
  const block = $("#sentBlock");
  if (!block) return;
  block.innerHTML = `<div class="sent-card"><h3>Sentiment & News</h3><div class="empty-state" style="padding:20px;"><span class="spinner"></span></div></div>`;
  try {
    const r = await fetch(`${WORKER_URL}/sentiment/${encodeURIComponent(symbol)}`);
    const j = await r.json();
    const reddit = j.reddit || {};
    const news   = j.news?.headlines || [];
    let newsHtml = news.slice(0, 5).map(n => `
      <div class="news-item">
        <a href="${n.link}" target="_blank" rel="noopener">${n.title}</a>
        <div class="news-meta">${n.source || ''} ${n.published ? '· ' + new Date(n.published).toLocaleDateString() : ''}</div>
      </div>
    `).join("");
    if (!newsHtml) newsHtml = `<div class="news-item" style="color:var(--ink-muted);font-size:13px;">No recent headlines.</div>`;

    block.innerHTML = `
      <div class="sent-card">
        <h3>Reddit · 24h</h3>
        <div class="sent-row"><span class="lbl">Mentions</span><span class="val">${reddit.mention_count_24h || 0}</span></div>
        <div class="sent-row"><span class="lbl">Bullish / Bearish keywords</span><span class="val">${reddit.bullish_count || 0} / ${reddit.bearish_count || 0}</span></div>
        <div class="sent-row"><span class="lbl">Sentiment</span><span class="val">${reddit.sentiment_score != null ? (reddit.sentiment_score > 0.1 ? 'Bullish-skewed' : reddit.sentiment_score < -0.1 ? 'Bearish-skewed' : 'Mixed') : '—'}</span></div>
      </div>
      <div class="sent-card">
        <h3>News</h3>
        <div class="news-list">${newsHtml}</div>
      </div>
    `;
  } catch (e) {
    block.innerHTML = `<div class="sent-card"><h3>Sentiment</h3><div class="empty-state" style="padding:20px;color:var(--ink-muted);">Couldn't load sentiment.</div></div>`;
  }
}

async function runAnalysis(symbol) {
  const btn = $("#analyzeBtn") || $("#reanalyzeBtn");
  if (btn) {
    btn.innerHTML = '<span class="spinner"></span> Analyzing…';
    btn.disabled = true;
  }
  try {
    const holding = state.holdings.find(h => h.symbol === symbol);
    const idToken = await auth.currentUser.getIdToken();
    const r = await fetch(`${WORKER_URL}/analyze`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        uid: state.uid,
        symbol,
        holding: holding ? { quantity: holding.quantity, avg_cost: holding.avg_cost_unit } : null,
        idToken,
      }),
    });
    if (!r.ok) {
      const text = await r.text();
      throw new Error(text);
    }
    const j = await r.json();
    if (j.analysis) {
      state.analyses[symbol] = {
        ...j.analysis, symbol,
        generated_at: new Date().toISOString(),
        current_price: j.current_price,
      };
      toast("Analysis complete");
      renderAssetDetail(symbol);
    } else {
      throw new Error("No analysis returned");
    }
  } catch (e) {
    toast("Analysis failed: " + (e.message || "unknown error").slice(0, 80), 3000, "error");
    console.error(e);
    if (btn) {
      btn.innerHTML = "Try Again";
      btn.disabled = false;
    }
  }
}

async function loadAlerts() {
  const snap = await db.collection("users").doc(state.uid).collection("alerts")
    .where("active", "==", true).get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function renderAlerts() {
  $("#topbarTitle").textContent = "Alerts";
  const view = $("#view");
  view.innerHTML = `
    <div class="section-head" style="padding: 20px 20px 0;">
      <h2>Alerts</h2>
      <button class="btn-ghost" onclick="openAddAlert()" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;">+ Add</button>
    </div>
    <div id="alertsList"><div class="empty-state"><span class="spinner"></span></div></div>
  `;
  const alerts = await loadAlerts();
  if (alerts.length === 0) {
    $("#alertsList").innerHTML = `<div class="empty-state">
      <span class="display">No active alerts</span>
      <p>Alerts trigger when prices cross your set thresholds. Checked when you open the app or refresh.</p>
    </div>`;
    return;
  }
  $("#alertsList").innerHTML = alerts.map(a => `
    <div class="alert-row">
      <div class="alert-info">
        <div class="symbol">${a.symbol}</div>
        <div class="cond">${a.type === 'price_above' ? 'Above' : 'Below'} $${fmtUSD(a.threshold)}</div>
      </div>
      <div class="alert-actions">
        <button class="btn-ghost btn-sm" onclick="deleteAlert('${a.id}')">Remove</button>
      </div>
    </div>
  `).join("");
}
async function deleteAlert(id) {
  await db.collection("users").doc(state.uid).collection("alerts").doc(id).delete();
  toast("Alert removed");
  renderAlerts();
}
async function checkAlerts() {
  const alerts = await loadAlerts();
  for (const a of alerts) {
    const p = state.prices[a.symbol];
    if (!p) continue;
    const cur = p.current_price;
    const trigger = (a.type === "price_above" && cur > a.threshold) ||
                   (a.type === "price_below" && cur < a.threshold);
    if (trigger) {
      toast(`${a.symbol} ${a.type === 'price_above' ? 'crossed above' : 'dropped below'} $${fmtUSD(a.threshold)}`);
      await db.collection("users").doc(state.uid).collection("alerts").doc(a.id).update({
        active: false,
        triggered_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
  }
}

      <div class="setting-row">
        <div><div class="lbl">Theme</div><div class="sub">Day or night</div></div>
        <div class="toggle ${state.theme === 'night' ? 'on' : ''}" onclick="toggleTheme()"></div>
      </div>
      <div class="setting-row">
        <div><div class="lbl">Change PIN</div><div class="sub">Reset your local lock</div></div>
        <button class="btn btn-secondary btn-sm" onclick="resetPin()">Change</button>
      </div>
    </div>
    <div class="settings-group">
      <div class="setting-row">
        <div><div class="lbl">Refresh All Prices</div><div class="sub">Pull latest from data sources</div></div>
        <button class="btn btn-secondary btn-sm" onclick="manualRefresh()">Refresh</button>
      </div>
      <div class="setting-row">
        <div><div class="lbl">Export Portfolio (JSON)</div><div class="sub">Holdings + journal + alerts</div></div>
        <button class="btn btn-secondary btn-sm" onclick="exportData()">Export</button>
      </div>
    </div>
    <div class="settings-group">
      <div class="setting-row">
        <div><div class="lbl">User ID</div><div class="sub mono" style="font-family:var(--mono);font-size:10.5px;">${state.uid || '—'}</div></div>
      </div>
      <div class="setting-row">
        <div><div class="lbl">Worker</div><div class="sub mono" style="font-family:var(--mono);font-size:10.5px;">portfolio-advisor.workers.dev</div></div>
      </div>
      <div class="setting-row">
        <div><div class="lbl">Version</div><div class="sub">1.1.0</div></div>
      </div>
    </div>
    <div class="empty-state" style="padding: 30px 20px;">
      <p style="font-size:11px;color:var(--ink-muted);line-height:1.6;">
        This app is a tool, not an advisor. All signals are inputs, not recommendations.<br>
        Decisions are yours. Trade journal exists so you can audit yourself.
      </p>
    </div>
  `;
}
function toggleTheme() {
  state.theme = state.theme === "day" ? "night" : "day";
  document.documentElement.setAttribute("data-theme", state.theme);
  localStorage.setItem("theme", state.theme);
  renderCurrentView();
}
function resetPin() {
  if (confirm("Reset PIN? You'll need to create a new one.")) {
    localStorage.removeItem("pinHash");
    location.reload();
  }
}
async function manualRefresh() {
  toast("Refreshing prices…");
  await refreshAllPrices();
  await checkAlerts();
  toast("Refreshed");
  renderCurrentView();
}
async function exportData() {
  const journal = await loadJournal();
  const alerts  = await loadAlerts();
  const data = {
    exported_at: new Date().toISOString(),
    holdings: state.holdings,
    analyses: state.analyses,
    journal, alerts,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `portfolio_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================================
// MODALS
// ============================================================================
function openModal(html) {
  $("#modal").innerHTML = `<div class="modal-handle"></div>` + html;
  $("#modalBg").classList.add("show");
  $("#modal").classList.add("show");
}
function closeModal() {
  $("#modalBg").classList.remove("show");
  $("#modal").classList.remove("show");
}
$("#modalBg").addEventListener("click", closeModal);

// ----- ADD HOLDING (with proper cash + symbol search)
function openAddHolding() {
  openModal(`
    <div class="modal-head"><h3>Add Holding</h3></div>
    <div class="field">
      <label>Asset Class</label>
      <select id="ah_class" onchange="onAddClassChange()">
        ${ASSET_CLASSES.map(c => `<option value="${c.value}">${c.label}</option>`).join("")}
      </select>
    </div>
    <div id="ah_dynamic"></div>
    <button class="btn btn-block" onclick="submitAddHolding()" style="margin-top:8px;">Add</button>
  `);
  onAddClassChange();
}

function onAddClassChange() {
  const cls = $("#ah_class").value;
  const dyn = $("#ah_dynamic");
  if (cls === "cash") {
    dyn.innerHTML = `
      <div class="field">
        <label>Amount (USD)</label>
        <input id="ah_cash" type="number" step="any" placeholder="0.00" />
        <div class="field-hint">For cash positions, enter the dollar amount you hold.</div>
      </div>
    `;
  } else {
    dyn.innerHTML = `
      <div class="field" style="position:relative;">
        <label>Symbol</label>
        <input id="ah_symbol" placeholder="e.g. AAPL, BTC, SWRD" autocomplete="off" oninput="onSymbolInput()" />
        <div id="ah_search_results" class="search-results hidden"></div>
        <div class="field-hint">Type to search or enter ticker directly.</div>
      </div>
      <div class="field-row">
        <div class="field"><label>Quantity</label><input id="ah_qty" type="number" step="any" placeholder="0" /></div>
        <div class="field"><label>Total Cost (USD)</label><input id="ah_cost" type="number" step="any" placeholder="0" /></div>
      </div>
      <div class="field">
        <label>Display Name (optional)</label>
        <input id="ah_name" placeholder="e.g. Apple Inc." />
      </div>
    `;
  }
}

const debouncedSearch = debounce(async () => {
  const q = $("#ah_symbol")?.value.trim();
  const results = $("#ah_search_results");
  if (!q || q.length < 1) { results.classList.add("hidden"); return; }
  try {
    const r = await fetch(`${WORKER_URL}/search?q=${encodeURIComponent(q)}`);
    const j = await r.json();
    const items = (j.results || []).slice(0, 6);
    if (items.length === 0) { results.classList.add("hidden"); return; }
    results.innerHTML = items.map(item => `
      <div class="search-result" onclick="selectSearchResult('${item.symbol}', ${JSON.stringify(item.name).replace(/'/g, "\\'")})">
        <span class="ex">${item.exchange || ''}</span>
        <div class="sym">${item.symbol}</div>
        <div class="nm">${item.name || ''}</div>
      </div>
    `).join("");
    results.classList.remove("hidden");
  } catch (e) { results.classList.add("hidden"); }
}, 300);

function onSymbolInput() { debouncedSearch(); }

function selectSearchResult(symbol, name) {
  $("#ah_symbol").value = symbol;
  $("#ah_name").value = name || "";
  $("#ah_search_results").classList.add("hidden");
}

async function submitAddHolding() {
  const cls = $("#ah_class").value;
  if (cls === "cash") {
    const amount = parseFloat($("#ah_cash").value);
    if (!amount || amount <= 0) { toast("Enter a valid amount", 2400, "error"); return; }
    // Check if cash already exists
    const existing = state.holdings.find(h => h.symbol === "CASH");
    if (existing) {
      // Add to existing cash
      const newQty = existing.quantity + amount;
      await db.collection("users").doc(state.uid).collection("holdings").doc("CASH").update({
        quantity: newQty,
        avg_cost_total: newQty,
      });
      toast(`Cash updated to $${fmtUSD(newQty, 2)}`);
    } else {
      await db.collection("users").doc(state.uid).collection("holdings").doc("CASH").set({
        symbol: "CASH", asset_class: "cash",
        quantity: amount,
        avg_cost_total: amount,
        avg_cost_unit: 1,
        currency: "USD",
        name: "Cash (USD)",
        added_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
      toast("Cash added");
    }
    closeModal();
    await loadHoldingsFromFirestore();
    await refreshAllPrices();
    renderCurrentView();
    return;
  }

  const symbol = $("#ah_symbol").value.trim().toUpperCase();
  const qty    = parseFloat($("#ah_qty").value);
  const cost   = parseFloat($("#ah_cost").value);
  const name   = $("#ah_name").value.trim() || symbol;
  if (!symbol || !qty || !cost) { toast("Fill all fields", 2400, "error"); return; }

  // Verify the symbol fetches successfully
  try {
    const r = await fetch(`${WORKER_URL}/price/${encodeURIComponent(symbol)}`);
    const j = await r.json();
    if (!j.current_price && !r.ok) throw new Error("invalid");
  } catch (e) {
    toast(`Couldn't verify "${symbol}". Save anyway?`, 3000, "error");
    // Save anyway — user might know better
  }

  await db.collection("users").doc(state.uid).collection("holdings").doc(symbol).set({
    symbol, asset_class: cls,
    quantity: qty,
    avg_cost_total: cost,
    avg_cost_unit: cost / qty,
    currency: "USD",
    name,
    added_at: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true });
  toast("Holding added");
  closeModal();
  await loadHoldingsFromFirestore();
  await refreshAllPrices();
  renderCurrentView();
}

// ----- EDIT HOLDING
function openEditHolding(symbol) {
  const h = state.holdings.find(x => x.symbol === symbol);
  if (!h) return;
  const isCash = h.asset_class === "cash";
  openModal(`
    <div class="modal-head"><h3>Edit ${symbol}</h3></div>
    ${isCash ? `
      <div class="field">
        <label>Amount (USD)</label>
        <input id="eh_cash" type="number" step="any" value="${h.quantity}" />
      </div>
    ` : `
      <div class="field-row">
        <div class="field"><label>Quantity</label><input id="eh_qty" type="number" step="any" value="${h.quantity}" /></div>
        <div class="field"><label>Total Cost (USD)</label><input id="eh_cost" type="number" step="any" value="${h.avg_cost_total}" /></div>
      </div>
      <div class="field"><label>Display Name</label><input id="eh_name" value="${h.name || ''}" /></div>
    `}
    <button class="btn btn-block" onclick="submitEditHolding('${symbol}')">Save Changes</button>
  `);
}
async function submitEditHolding(symbol) {
  const h = state.holdings.find(x => x.symbol === symbol);
  if (!h) return;
  if (h.asset_class === "cash") {
    const amount = parseFloat($("#eh_cash").value);
    if (!amount || amount <= 0) { toast("Enter a valid amount", 2400, "error"); return; }
    await db.collection("users").doc(state.uid).collection("holdings").doc(symbol).update({
      quantity: amount,
      avg_cost_total: amount,
    });
  } else {
    const qty = parseFloat($("#eh_qty").value);
    const cost = parseFloat($("#eh_cost").value);
    const name = $("#eh_name").value.trim();
    if (!qty || !cost) { toast("Fill all fields", 2400, "error"); return; }
    await db.collection("users").doc(state.uid).collection("holdings").doc(symbol).update({
      quantity: qty,
      avg_cost_total: cost,
      avg_cost_unit: cost / qty,
      name,
    });
  }
  toast("Updated");
  closeModal();
  await loadHoldingsFromFirestore();
  renderAssetDetail(symbol);
}

// ----- DELETE HOLDING
function confirmDeleteHolding(symbol) {
  if (confirm(`Remove ${symbol} from your portfolio? This won't delete past analyses or journal entries.`)) {
    deleteHolding(symbol);
  }
}
async function deleteHolding(symbol) {
  await db.collection("users").doc(state.uid).collection("holdings").doc(symbol).delete();
  toast(`${symbol} removed`);
  await loadHoldingsFromFirestore();
  state.selectedSymbol = null;
  setView("portfolio");
}

// ----- LOG TRADE
function openLogTrade(symbol) {
  const sigSnapshot = symbol && state.analyses[symbol] ? state.analyses[symbol] : null;
  openModal(`
    <div class="modal-head"><h3>Log Trade</h3></div>
    <div class="field-row">
      <div class="field"><label>Symbol</label><input id="lt_symbol" value="${symbol || ''}" /></div>
      <div class="field"><label>Action</label>
        <select id="lt_action">
          <option value="buy">Buy</option>
          <option value="sell">Sell</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Quantity</label><input id="lt_qty" type="number" step="any" /></div>
      <div class="field"><label>Price (USD)</label><input id="lt_price" type="number" step="any" /></div>
    </div>
    <div class="field">
      <label>Reason / Thesis</label>
      <textarea id="lt_reason" rows="3" placeholder="Why did you make this trade?" style="font-family:var(--sans);"></textarea>
    </div>
    ${sigSnapshot ? `<div style="font-family:var(--mono);font-size:10.5px;color:var(--ink-muted);margin-bottom:14px;padding:10px;background:var(--bg-elev);border-radius:6px;">Snapshot: signal "${sigSnapshot.signal}" · ${sigSnapshot.confidence} confidence</div>` : ""}
    <button class="btn btn-block" onclick="submitTrade(${sigSnapshot ? `'${sigSnapshot.signal}','${sigSnapshot.confidence}'` : 'null,null'})">Save</button>
  `);
}
async function submitTrade(sig, conf) {
  const symbol = $("#lt_symbol").value.trim().toUpperCase();
  const action = $("#lt_action").value;
  const qty    = parseFloat($("#lt_qty").value);
  const price  = parseFloat($("#lt_price").value);
  const reason = $("#lt_reason").value.trim();
  if (!symbol || !qty || !price) { toast("Fill all fields", 2400, "error"); return; }
  await db.collection("users").doc(state.uid).collection("journal").add({
    symbol, action, quantity: qty, price, reason,
    date: new Date().toISOString().slice(0, 10),
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    signal_at_time: sig === "null" ? null : sig,
    confidence_at_time: conf === "null" ? null : conf,
  });
  toast("Trade logged");
  closeModal();
  if (state.currentView === "journal") renderJournal();
}

// ----- ADD ALERT
function openAddAlert() {
  const opts = state.holdings.filter(h => h.asset_class !== "cash").map(h => `<option value="${h.symbol}">${h.symbol}</option>`).join("");
  openModal(`
    <div class="modal-head"><h3>New Alert</h3></div>
    <div class="field"><label>Symbol</label><select id="al_symbol">${opts}</select></div>
    <div class="field"><label>Trigger</label>
      <select id="al_type">
        <option value="price_above">Price above</option>
        <option value="price_below">Price below</option>
      </select>
    </div>
    <div class="field"><label>Threshold (USD)</label><input id="al_threshold" type="number" step="any" /></div>
    <button class="btn btn-block" onclick="submitAlert()">Create Alert</button>
  `);
}
async function submitAlert() {
  const symbol = $("#al_symbol").value;
  const type   = $("#al_type").value;
  const threshold = parseFloat($("#al_threshold").value);
  if (!symbol || !threshold) { toast("Fill all fields", 2400, "error"); return; }
  await db.collection("users").doc(state.uid).collection("alerts").add({
    symbol, type, threshold,
    active: true,
    created_at: firebase.firestore.FieldValue.serverTimestamp(),
  });
  toast("Alert created");
  closeModal();
  if (state.currentView === "alerts") renderAlerts();
}

  openLogTrade, submitTrade,
  openAddAlert, submitAlert, deleteAlert,
  runAnalysis, setRange,
  toggleTheme, resetPin, manualRefresh, exportData,
});
