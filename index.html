// PRE-SURGE CARD RENDERING (sits above Daily Scan on the Portfolio tab)
// Composite ≥ 70 from three leading indicators:
//   • Squeeze (BB bandwidth in lowest 10% of 6mo + days-in-squeeze + vol expansion)
//   • Accumulation (OBV slope positive while price flat, + up/down volume ratio)
//   • Relative Strength (RS line slope vs SPY rising while price flat, + RS pctile)
// ============================================================================
function renderPreSurgeCard() {
  const cached = state.preSurge;
  const loading = state.preSurgeLoading;
  const ranAt = state.preSurgeRanAt;

  // First-time empty state
  if (!cached && !loading) {
    return `
      <div class="presurge-card empty">
        <div class="presurge-head">
          <div>
            <h3>Pre-Surge Scanner</h3>
            <div class="presurge-sub">Squeeze · Accumulation · Relative Strength</div>
          </div>
          <button class="btn btn-sm" data-act="run-presurge">Scan</button>
        </div>
        <div class="presurge-empty-body">
          Scans watchlist, holdings, ETF universe, and ~90 large-cap US stocks for the three leading-indicator setups that usually precede surges: Bollinger squeeze, OBV accumulation divergence, and relative-strength rotation. Composite score ≥ 70 = flagged. First scan downloads OHLCV histories for ~165 symbols — takes 30-60 seconds. Subsequent scans are instant.
        </div>
      </div>
    `;
  }

  if (loading) {
    const p = state.preSurgeProgress || { fetched: 0, total: 0 };
    const pct = p.total > 0 ? Math.round((p.fetched / p.total) * 100) : 0;
    return `
      <div class="presurge-card loading">
        <div class="presurge-head">
          <div>
            <h3>Pre-Surge Scanner</h3>
            <div class="presurge-sub">${p.total > 0 ? `Fetching ${p.fetched}/${p.total} · ${pct}%` : "Computing scores…"}</div>
          </div>
          <button class="btn btn-sm" disabled><span class="spinner" style="width:12px;height:12px;border-width:1.5px;"></span> Scanning…</button>
        </div>
        <div class="presurge-progress"><div class="presurge-progress-bar" style="width:${pct}%;"></div></div>
      </div>
    `;
  }

  const flags = cached || [];
  const allScored = state.preSurgeAllScored || [];
  const debug = state.preSurgeDebug;
  const recentHistory = getRecentPreSurgeFlags(3, 30, 5);

  // Filter out dismissed entries (only applies to flagged view, not debug)
  const visibleFlags = flags.filter(f => {
    const key = recKeyFor(f.symbol, "presurge", "presurge");
    return getRecStatus(key) !== "dismissed";
  });

  // Debug mode: render top 10 by composite score regardless of threshold.
  // Use this to verify the math is working when zero flags shows up. If the
  // top 10 are all in the 30-50 range, scoring is fine — market just isn't
  // presenting strong setups today. If everything's <15, something's wrong.
  if (debug) {
    const top = allScored.slice(0, 10);
    const stats = {
      total: allScored.length,
      max: top[0]?.composite || 0,
      median: top.length ? top[Math.floor(top.length / 2)].composite : 0,
      with_squeeze: allScored.filter(s => s.squeeze > 0).length,
      with_accum: allScored.filter(s => s.accumulation > 0).length,
      with_rs: allScored.filter(s => s.rs > 0).length,
    };
    return `
      <div class="presurge-card debug">
        <div class="presurge-head">
          <div>
            <h3>Pre-Surge · Debug View</h3>
            <div class="presurge-sub">Top 10 by composite · threshold ignored · ${ranAt ? "scanned " + fmtRel(ranAt) : ""}</div>
          </div>
          <button class="btn btn-sm" data-act="toggle-presurge-debug">Exit Debug</button>
        </div>
        <div class="presurge-debug-stats">
          <div class="pds-cell"><span class="pds-lbl">Scored</span><span class="pds-val">${stats.total}</span></div>
          <div class="pds-cell"><span class="pds-lbl">Top</span><span class="pds-val">${stats.max}</span></div>
          <div class="pds-cell"><span class="pds-lbl">Median</span><span class="pds-val">${stats.median}</span></div>
          <div class="pds-cell"><span class="pds-lbl">w/ Squeeze</span><span class="pds-val">${stats.with_squeeze}</span></div>
          <div class="pds-cell"><span class="pds-lbl">w/ Accum</span><span class="pds-val">${stats.with_accum}</span></div>
          <div class="pds-cell"><span class="pds-lbl">w/ RS</span><span class="pds-val">${stats.with_rs}</span></div>
        </div>
        <div class="presurge-debug-hint">
          ${stats.total === 0 ? "⚠ No symbols scored — OHLCV data missing. Run Rescan." :
            stats.max < 20 ? "⚠ Top score very low — market may genuinely have no setups, or check your data freshness." :
            stats.max >= 40 ? "✓ Scoring is firing normally. Top names just below the 70 threshold are worth a manual look." :
            "Scoring works. The market just isn't presenting strong setups today — normal in trending markets."}
        </div>
        <div class="presurge-list">
          ${top.length === 0 ? `<div class="presurge-empty-body">No symbols produced a score. Data probably didn't load. Try Rescan.</div>` :
          top.map(f => {
            const held = state.holdings.some(h => h.symbol === f.symbol && h.asset_class !== "cash");
            const watched = state.watchlist.some(w => w.symbol === f.symbol);
            const aboveThresh = f.composite >= PRESURGE_THRESHOLD;
            return `
            <div class="presurge-row ${aboveThresh ? 'over-thresh' : ''}" data-act="open-asset" data-symbol="${escAttr(f.symbol)}">
              <div class="presurge-rank">${f.composite}</div>
              <div class="presurge-mid">
                <div class="presurge-sym-row">
                  <span class="presurge-sym">${escAttr(f.symbol)}</span>
                  ${aboveThresh ? `<span class="presurge-tag held" style="background:rgba(176,141,60,0.18);color:var(--gold);border-color:var(--gold);">FLAGGED</span>` : ""}
                  ${held ? `<span class="presurge-tag held">held</span>` : ""}
                  ${watched ? `<span class="presurge-tag watched">watched</span>` : ""}
                  ${renderShortInterestBadge(f.symbol)}
                  <span class="presurge-price">$${fmtUSD(f.current_price)}</span>
                </div>
                <div class="presurge-bars">
                  ${renderPresurgeBar("Squeeze", f.squeeze, 40, "var(--gold)")}
                  ${renderPresurgeBar("Accum",   f.accumulation, 30, "var(--green)")}
                  ${renderPresurgeBar("RS",      f.rs, 30, "var(--ink-soft)")}
                </div>
                <div class="presurge-details">
                  ${f.breakdown.map(b => `<span class="presurge-detail-chip">${escAttr(b.detail)}</span>`).join("")}
                </div>
              </div>
            </div>
          `;}).join("")}
        </div>
        <div class="presurge-footer">Debug mode · all scored symbols visible · normal threshold is composite ≥ 70</div>
      </div>
    `;
  }

  let body;
  if (visibleFlags.length === 0) {
    // Empty state — show a hint about debug mode and the median score
    const topUnflagged = allScored[0];
    const hint = topUnflagged
      ? ` Highest scoring today: ${topUnflagged.symbol} at ${topUnflagged.composite}.`
      : "";
    body = `<div class="presurge-empty-body">
      No setups above the threshold today.${hint} Tap <b>Debug</b> to see the top 10 scored symbols regardless of threshold — useful for verifying the scanner is working.
    </div>`;
  } else {
    body = `
      <div class="presurge-list">
        ${visibleFlags.slice(0, 8).map(f => {
          const recKey = recKeyFor(f.symbol, "presurge", "presurge");
          const status = getRecStatus(recKey);
          const isDone = status === "done";
          const held = state.holdings.some(h => h.symbol === f.symbol && h.asset_class !== "cash");
          const watched = state.watchlist.some(w => w.symbol === f.symbol);
          return `
          <div class="presurge-row ${isDone ? 'rec-done' : ''}" data-act="open-asset" data-symbol="${escAttr(f.symbol)}">
            <div class="presurge-rank">${f.composite}</div>
            <div class="presurge-mid">
              <div class="presurge-sym-row">
                <span class="presurge-sym">${escAttr(f.symbol)}</span>
                ${held ? `<span class="presurge-tag held">held</span>` : ""}
                ${watched ? `<span class="presurge-tag watched">watched</span>` : ""}
                ${renderShortInterestBadge(f.symbol)}
                <span class="presurge-price">$${fmtUSD(f.current_price)}</span>
              </div>
              <div class="presurge-bars">
                ${renderPresurgeBar("Squeeze", f.squeeze, 40, "var(--gold)")}
                ${renderPresurgeBar("Accum",   f.accumulation, 30, "var(--green)")}
                ${renderPresurgeBar("RS",      f.rs, 30, "var(--ink-soft)")}
              </div>
              <div class="presurge-details">
                ${f.breakdown.map(b => `<span class="presurge-detail-chip">${escAttr(b.detail)}</span>`).join("")}
              </div>
            </div>
            <div class="presurge-actions">
              <button class="presurge-del" data-act="dismiss-rec" data-rec-key="${escAttr(recKey)}" title="Hide">×</button>
            </div>
          </div>
        `;}).join("")}
      </div>
    `;
  }

  // Track record panel — flags from 3-30 days ago with their since-flag return.
  // This is the scanner's self-audit: are flagged names actually moving up?
  let trackRecord = "";
  if (recentHistory.length > 0) {
    const avg = recentHistory.reduce((s, h) => s + h.since_flag_pct, 0) / recentHistory.length;
    const wins = recentHistory.filter(h => h.since_flag_pct > 0).length;
    const avgCls = avg >= 0 ? "pos" : "neg";
    trackRecord = `
      <div class="presurge-track">
        <div class="presurge-track-head">
          <span>Recent Flags · Track Record</span>
          <span class="presurge-track-stats">
            ${wins}/${recentHistory.length} positive · avg <span class="${avgCls}">${avg >= 0 ? "+" : ""}${avg.toFixed(1)}%</span>
          </span>
        </div>
        <div class="presurge-track-list">
          ${recentHistory.map(h => {
            const cls = h.since_flag_pct >= 0 ? "pos" : "neg";
            const ageDisp = h.age_days < 1 ? "today" : `${Math.round(h.age_days)}d ago`;
            return `
              <div class="presurge-track-row" data-act="open-asset" data-symbol="${escAttr(h.symbol)}">
                <span class="ptr-sym">${escAttr(h.symbol)}</span>
                <span class="ptr-age">${ageDisp}</span>
                <span class="ptr-score">cs ${h.composite}</span>
                <span class="ptr-pnl ${cls}">${h.since_flag_pct >= 0 ? "+" : ""}${h.since_flag_pct.toFixed(1)}%</span>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }

  return `
    <div class="presurge-card">
      <div class="presurge-head">
        <div>
          <h3>Pre-Surge Scanner</h3>
          <div class="presurge-sub">${visibleFlags.length} flagged${allScored.length > 0 ? ` · ${allScored.length} scored` : ""} · ${ranAt ? "Updated " + fmtRel(ranAt) : "Just now"}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          ${allScored.length > 0 ? `<button class="btn btn-secondary btn-sm" data-act="toggle-presurge-debug">Debug</button>` : ""}
          <button class="btn btn-sm" data-act="run-presurge">Rescan</button>
        </div>
      </div>
      ${body}
      ${trackRecord}
      <div class="presurge-footer">Composite ≥ 70 of 100 · Squeeze 40 + Accumulation 30 + RS 30 · Leading indicators only</div>
    </div>
  `;
}

function renderPresurgeBar(label, value, max, color) {
  const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  return `
    <div class="presurge-bar-row">
      <span class="presurge-bar-lbl">${escAttr(label)}</span>
      <div class="presurge-bar-track">
        <div class="presurge-bar-fill" style="width:${pct}%;background:${color};"></div>
      </div>
      <span class="presurge-bar-val">${value}/${max}</span>
    </div>
  `;
}

// Renders a "SQUEEZE-PRONE" / "HIGH SHORT" badge if DTC data is known for this
// symbol AND DTC > 5. Empty string otherwise — including when data is missing
// (international tickers, low-volume, or Yahoo not returning it).
function renderShortInterestBadge(symbol) {
  const si = state.shortInterest;
  if (!si || !si[symbol]) return "";
  const dtc = si[symbol].dtc;
  const sp = si[symbol].shortPctFloat;
  if (dtc == null) return "";
  if (dtc < 5) return "";
  // Tooltip shows short pct of float when available
  const tip = sp != null
    ? `Days-to-cover ${dtc.toFixed(1)} · ${sp.toFixed(1)}% of float short`
    : `Days-to-cover ${dtc.toFixed(1)}`;
  const cls = dtc >= 10 ? "squeeze-prone" : "high-short";
  const label = dtc >= 10 ? `SQUEEZE-PRONE · DTC ${dtc.toFixed(1)}` : `HIGH SHORT · DTC ${dtc.toFixed(1)}`;
  return `<span class="presurge-tag short-${cls}" title="${escAttr(tip)}">${label}</span>`;
}

async function fetchShortInterestBackground() {
  // Fire-and-forget. Only fetches for the SCAN_UNIVERSE — international tickers,
  // ETFs, and crypto don't have meaningful short-interest data.
  // Skipped silently on failure since this is purely informational badging.
  try {
    const cached = loadShortInterestCache();
    if (cached) { state.shortInterest = cached; return; }
    const symbols = (typeof SCAN_UNIVERSE !== "undefined" ? SCAN_UNIVERSE : []);
    if (symbols.length === 0) return;
    const results = await fetchShortInterestForUniverse(symbols);
    state.shortInterest = results;
    // Re-render so badges appear on existing pre-surge rows
    if (state.currentView === "portfolio") renderCurrentView();
  } catch (e) { /* silent — badge is non-essential */ }
}

async function runPreSurge() {
  if (state.preSurgeLoading) return;
  state.preSurgeLoading = true;
  state.preSurgeProgress = { fetched: 0, total: 0 };
  renderCurrentView();
  try {
    await ensurePreSurgeData((fetched, total) => {
      state.preSurgeProgress = { fetched, total };
      // Only re-render every ~5 items to avoid flicker on slow networks
      if (fetched % 5 === 0 || fetched === total) renderCurrentView();
    });
    const { flagged, allScored } = computePreSurgeUniverse();
    state.preSurge = flagged;
    state.preSurgeAllScored = allScored;
    state.preSurgeRanAt = new Date().toISOString();
    const added = recordPreSurgeFlags(flagged);
    state.preSurgeLoading = false;
    state.preSurgeProgress = null;
    renderCurrentView();
    toast(`${flagged.length} pre-surge setup${flagged.length === 1 ? "" : "s"} flagged${added > 0 ? ` · ${added} new today` : ""} · ${allScored.length} scored`);
    // Kick off DTC fetch in background to enrich rows with short-interest badges
    fetchShortInterestBackground();
  } catch (e) {
    state.preSurgeLoading = false;
    state.preSurgeProgress = null;
    renderCurrentView();
    toast(`Pre-Surge scan failed: ${(e.message || e).slice(0, 80)}`, 3000, "error");
  }
}

function renderDailyScan() {
  let actions = computeDailyScan();
  if (actions.length === 0) {
    return `
      <div class="scan-card">
        <div class="scan-head">
          <h3>Today's Buys & Adds</h3>
          <span class="scan-pill" style="background:var(--bg-elev);color:var(--ink-muted);">No setups</span>
        </div>
        <div class="scan-empty">No actionable buy setups today. Hold positions, wait for weakness.</div>
      </div>
    `;
  }
  // Tag each action with NEW / STRONGER / CARRIED OVER based on history
  actions = tagActionsWithRecency(actions);
  const iconFor = k => k === "trim" ? "↓" : k === "add" ? "↑" : "+";
  const colorFor = k => k === "trim" ? "var(--red)" : k === "add" ? "var(--green)" : "var(--gold)";

  const summary = actions._summary;
  let summaryHeader = "";
  if (summary && summary.totalDeployment > 0) {
    const depPctDisplay = summary.deploymentPct.toFixed(0);
    let toneClass = "medium";
    if (summary.deploymentPct < 15) toneClass = "low";
    else if (summary.deploymentPct >= 40) toneClass = "high";
    summaryHeader = `
      <div class="scan-deployment-summary ${toneClass}">
        <div class="sds-row">
          <span class="sds-label">Total suggested deployment</span>
          <span class="sds-value">$${fmtUSD(summary.totalDeployment, 0)} of $${fmtUSD(summary.cashAvail, 0)} cash (${depPctDisplay}%)</span>
        </div>
        ${summary.scaledDown ? `<div class="sds-note">Scaled down to stay under 50% of available cash per scan</div>` : ""}
      </div>
    `;
  }

  // Recency badge HTML
  const recencyBadge = (r, days) => {
    if (r === "new") return `<span class="scan-recency new">NEW</span>`;
    if (r === "stronger") return `<span class="scan-recency stronger">↑ STRONGER · day ${days}</span>`;
    if (r === "carried" && days >= 5) return `<span class="scan-recency stale">DAY ${days} · ACT OR DISMISS</span>`;
    if (r === "carried") return `<span class="scan-recency carried">DAY ${days}</span>`;
    return "";
  };

  // Filter out dismissed recommendations from the visible list
  const visibleActions = actions.filter(a => {
    const key = recKeyFor(a.symbol, a.kind, "scan");
    return getRecStatus(key) !== "dismissed";
  });

  return `
    <div class="scan-card">
      <div class="scan-head">
        <h3>Today's Buys & Adds</h3>
        <span class="scan-pill">${visibleActions.length} idea${visibleActions.length === 1 ? "" : "s"}</span>
      </div>
      ${summaryHeader}
      <div class="scan-list">
        ${visibleActions.map(a => {
          const recKey = recKeyFor(a.symbol, a.kind, "scan");
          const status = getRecStatus(recKey);
          const isDone = status === "done";
          return `
          <div class="scan-item ${a.recency === "carried" && a.daysActive >= 5 ? "stale" : ""} ${isDone ? "rec-done" : ""}" data-act="open-asset" data-symbol="${escAttr(a.symbol)}">
            <div class="scan-icon" style="color:${colorFor(a.kind)};">${iconFor(a.kind)}</div>
            <div class="scan-body">
              <div class="scan-action">${escAttr(a.text)}</div>
              <div class="scan-why">${escAttr(a.why)}</div>
              <div class="scan-pills">
                <span class="scan-sym">${escAttr(a.symbol)}</span>
                <span class="scan-kind ${a.kind}">${a.kind.toUpperCase()}</span>
                <span class="scan-conf ${escAttr(a.confidence)}">${escAttr(a.confidence)} conf</span>
                ${isDone ? `<span class="scan-recency done">✓ DONE</span>` : recencyBadge(a.recency, a.daysActive || 1)}
              </div>
            </div>
            <div class="scan-actions-col">
              ${isDone
                ? `<button class="scan-log done" disabled title="Logged">✓</button>`
                : `<button class="scan-log" data-act="log-trade" data-symbol="${escAttr(a.symbol)}" data-rec-key="${escAttr(recKey)}" title="Log this trade">Log</button>`}
              <button class="scan-del" data-act="dismiss-rec" data-rec-key="${escAttr(recKey)}" title="Hide this recommendation">×</button>
            </div>
          </div>
        `;}).join("")}
      </div>
      <div class="scan-footer">Rule-based · NEW = first time seen · STRONGER = signal deepened · DAY N = same as N days ago</div>
    </div>
  `;
}

// ============================================================================
// DAILY WATCHOUTS — observational warnings on currently-held positions only.
// Mixes 3 signal sources:
//   1) Drawdown alerts:    position down > X% from cost basis
//   2) Take-profit candidates: position up > Y% from cost basis
//   3) Watchlist crossover: a position you OWN has a watchlist condition firing
// ============================================================================
const WATCHOUT_DRAWDOWN_PCT = -8;   // flag if position is down 8%+ from cost
const WATCHOUT_TAKEPROFIT_PCT = 15; // flag if position is up 15%+ from cost

function computeWatchouts() {
  const items = [];

  for (const h of state.holdings) {
    if (h.asset_class === "cash") continue;
    const hm = holdingMetrics(h);
    if (hm.pnlPct == null) continue;
    const cur = state.prices[h.symbol]?.current_price;
    if (!cur) continue;

    // Drawdown
    if (hm.pnlPct <= WATCHOUT_DRAWDOWN_PCT) {
      items.push({
        kind: "drawdown",
        symbol: h.symbol,
        severity: hm.pnlPct <= -15 ? "high" : "medium",
        title: `${h.symbol} ${hm.pnlPct.toFixed(1)}% from cost`,
        detail: `Held ${h.quantity} @ ~$${fmtUSD(h.avg_cost ?? h.cost_basis ?? cur)}, now $${fmtUSD(cur)}`,
        sortKey: hm.pnlPct, // most negative first
      });
    }
    // Take-profit
    else if (hm.pnlPct >= WATCHOUT_TAKEPROFIT_PCT) {
      items.push({
        kind: "takeprofit",
        symbol: h.symbol,
        severity: hm.pnlPct >= 30 ? "high" : "medium",
        title: `${h.symbol} +${hm.pnlPct.toFixed(1)}% from cost`,
        detail: `Position up — consider trimming. Cost ~$${fmtUSD(h.avg_cost ?? h.cost_basis ?? cur)}, now $${fmtUSD(cur)}`,
        sortKey: -hm.pnlPct, // biggest gains first
      });
    }
  }

  // Watchlist crossover: positions you OWN that have a watchlist condition firing
  const heldSymbols = new Set(state.holdings.filter(h => h.asset_class !== "cash").map(h => h.symbol));
  for (const t of (state.triggers || [])) {
    if (!heldSymbols.has(t.symbol)) continue;
    items.push({
      kind: "crossover",
      symbol: t.symbol,
      severity: "medium",
      title: `${t.symbol} · watchlist condition firing`,
      detail: `${describeTriggerCondition(t)} — you own this position`,
      sortKey: 1000, // group at top within their bucket
      triggerId: t.id,
    });
  }

  // Sort: drawdown first (most negative), then crossover, then take-profit
  const order = { drawdown: 0, crossover: 1, takeprofit: 2 };
  items.sort((a, b) => {
    const oa = order[a.kind], ob = order[b.kind];
    if (oa !== ob) return oa - ob;
    return a.sortKey - b.sortKey;
  });
  return items;
}

function describeTriggerCondition(trigger) {
  if (trigger.detail) return trigger.detail;
  if (trigger.condition_type) {
    return trigger.condition_type.replace(/_/g, " ");
  }
  return "condition fired";
}

function renderWatchouts() {
  if (!state.showWatchouts) return "";
  const items = computeWatchouts();
  if (items.length === 0) return "";

  const iconFor = (kind) => {
    if (kind === "drawdown") return "↓";
    if (kind === "takeprofit") return "↑";
    return "⚑";
  };
  const colorFor = (kind, severity) => {
    if (kind === "drawdown") return severity === "high" ? "var(--red)" : "#c25a3a";
    if (kind === "takeprofit") return "var(--green)";
    return "var(--gold)";
  };

  // Show top 4, collapsible if more
  const visibleCount = 4;
  const visible = items.slice(0, visibleCount);
  const hiddenCount = items.length - visibleCount;

  const itemsHtml = visible.map(it => `
    <div class="watchout-item" data-act="open-asset" data-symbol="${escAttr(it.symbol)}" style="border-left-color:${colorFor(it.kind, it.severity)};">
      <div class="watchout-icon" style="color:${colorFor(it.kind, it.severity)};">${iconFor(it.kind)}</div>
      <div class="watchout-body">
        <div class="watchout-title">${escAttr(it.title)}</div>
        <div class="watchout-detail">${escAttr(it.detail)}</div>
      </div>
    </div>
  `).join("");

  return `
    <div class="watchouts-card">
      <div class="watchouts-head">
        <h3>Today's Watchouts</h3>
        <span class="watchouts-count">${items.length}</span>
      </div>
      <div class="watchouts-list">${itemsHtml}</div>
      ${hiddenCount > 0 ? `<div class="watchouts-more">+${hiddenCount} more</div>` : ""}

function renderOpportunityPulse() {
  if (!state.triggers || state.triggers.length === 0) return "";

  // Build exclusion sets:
  //   1) symbols you already hold (Opp Pulse is for NEW ideas, not your existing book)
  //   2) symbols already surfaced in Today's Buys & Adds card (don't show same symbol twice)
  const heldSymbols = new Set(state.holdings.filter(h => h.asset_class !== "cash").map(h => h.symbol));
  const scanActions = computeDailyScan();
  const scanSymbols = new Set(scanActions.map(a => a.symbol));

  // Filter triggers:
  //   - drop anything we hold
  //   - drop anything already in the daily scan (it's there with sizing)
  //   - drop anything missing critical data (no price or no RSI — would render as "$—  RSI —")
  const filtered = state.triggers.filter(t => {
    if (heldSymbols.has(t.symbol)) return false;
    if (scanSymbols.has(t.symbol)) return false;
    if (t.current_price == null || t.rsi14 == null) return false;
    return true;
  });

  if (filtered.length === 0) return "";

  const list = filtered.slice(0, 6);
  const items = list.map(t => `
    <div class="opp-row" data-act="open-trigger" data-symbol="${escAttr(t.symbol)}" data-trigger-id="${escAttr(t.id)}">
      <div class="opp-main">
        <div class="opp-sym">${escAttr(t.symbol)}</div>
        <div class="opp-cond">${escAttr(t.label || t.type)}</div>
        <div class="opp-meta">$${fmtUSD(t.current_price)} · RSI ${t.rsi14} · ${t.trend === 'above_200ma' ? 'above 200MA' : 'below 200MA'}</div>
      </div>
      <div class="opp-arrow">›</div>
    </div>
  `).join("");
  return `
    <div class="opp-pulse">
      <div class="opp-pulse-head">
        <div>
          <div class="opp-pulse-eyebrow">Watchlist Triggers</div>
          <div class="ttl">Setups worth a look</div>
        </div>
        <span class="count">${filtered.length} new</span>
      </div>
      ${items}
    </div>
  `;
}

// ----- Watchlist
function renderWatchlist() {
  if (state.selectedSymbol) {
    renderWatchDetail(state.selectedSymbol);
    return;
  }
  $("#topbarTitle").textContent = "Watchlist";
  const view = $("#view");

  const lastScan = state.lastScanAt ? `Last scan: ${fmtRel(state.lastScanAt)}` : "Not scanned yet";

  if (state.watchlist.length === 0) {
    view.innerHTML = `
      <div class="empty-state">
        <span class="display">Watchlist is empty</span>
        <p>Add tickers you'd consider buying. The app watches them and surfaces setups when conditions trigger.</p>
        <button class="btn" data-act="add-watch">Add to Watchlist</button>
      </div>
      ${renderEtfLeaderboard()}
      ${renderDiscoverIdeas()}
    `;
    return;
  }

  const sorted = state.watchlist.slice().sort((a, b) => {
    const sa = state.watchlistSnapshot[a.symbol];
    const sb = state.watchlistSnapshot[b.symbol];
    const ta = sa?.triggers?.length || 0;
    const tb = sb?.triggers?.length || 0;
    if (ta !== tb) return tb - ta;
    return (sb?.setup_score || 0) - (sa?.setup_score || 0);
  });

  const rows = sorted.map(w => {
    const snap = state.watchlistSnapshot[w.symbol];
    const hasTrigger = snap?.triggers?.length > 0;
    const condPills = (w.conditions || []).map(c => {
      const fired = snap?.triggers?.some(t => t.condition_id === c.id);
      return `<span class="watch-cond-pill ${fired ? 'fired' : ''}">${escAttr(describeCondition(c))}</span>`;
    }).join("");

    const dayClass = (snap?.day_change_pct || 0) >= 0 ? "pos" : "neg";
    const rsiClass = snap?.rsi14 < 35 ? "warn" : snap?.rsi14 > 70 ? "over" : "";
    const trendClass = snap?.trend === "above_200ma" ? "above" : "below";

    // Suggested entry strip — only when a condition has actually fired
    // AND the symbol isn't already being handled by Today's Verdict / Today's
    // Opportunities on the Portfolio tab. We don't want THREE places telling
    // the user to buy the same name.
    let suggestStrip = "";
    const heldHere = state.holdings.some(h => h.symbol === w.symbol && h.asset_class !== "cash");
    // If held: decision is on the Portfolio tab via Today's Verdict — suppress.
    // If not held but has firing condition: decision is via Today's Opportunities — suppress.
    // We keep the strip ONLY when the symbol has NO trigger firing (just a tracking row).
    if (hasTrigger && snap?.current_price && !heldHere) {
      // Symbol has firing condition AND isn't held → handled by Today's Opportunities.
      // Show a soft pointer instead of duplicating the action.
      suggestStrip = `
        <div class="watch-suggest-strip pointer">
          <span class="wss-action">↑ Action on Portfolio → Today's Opportunities</span>
        </div>
      `;
    } else if (hasTrigger && snap?.current_price && heldHere) {
      // Held + firing condition → handled by Today's Verdict
      suggestStrip = `
        <div class="watch-suggest-strip pointer">
          <span class="wss-action">↑ Action on Portfolio → Today's Verdict</span>
        </div>
      `;
    }
    // Legacy: keep the "contradicts" override for the rare case where scan says trim
    // on the same symbol — preserves the safety check
    if (hasTrigger && snap?.current_price) {
      const scanContradicts = (computeDailyScan() || []).some(a => a.symbol === w.symbol && a.kind === "trim");
      if (scanContradicts) {
        suggestStrip = `
          <div class="watch-suggest-strip contradicts">
            <span class="wss-action">⚠ Daily scan suggests TRIM — review before buying</span>
          </div>
        `;
      }
    }

    return `
      <div class="watch-row ${hasTrigger ? 'has-trigger' : ''}" data-act="open-watch" data-symbol="${escAttr(w.symbol)}">
        <div class="watch-head">
          <span class="watch-sym">${escAttr(w.symbol)}</span>
          <span class="watch-cls">${escAttr(ALLOC_LABELS[w.asset_class] || w.asset_class)}</span>
          <span class="watch-name">${escAttr(w.name || '')}</span>
        </div>
        <div>
          <div class="watch-price">${snap?.current_price != null ? '$' + fmtUSD(snap.current_price) : '—'}</div>
          <div class="watch-day ${dayClass}">${snap?.day_change_pct != null ? fmtPct(snap.day_change_pct) : '—'}</div>
        </div>
        <div class="watch-stats">
          <span class="watch-stat-rsi ${rsiClass}">RSI ${snap?.rsi14 != null ? snap.rsi14 : '—'}</span>
          <span class="watch-trend ${trendClass}">${snap?.trend === 'above_200ma' ? '↑ 200MA' : '↓ 200MA'}</span>
          <span>${snap?.pct_from_52w_high != null ? snap.pct_from_52w_high.toFixed(1) + '% from 52w high' : ''}</span>
        </div>
        ${condPills ? `<div class="watch-cond-pills">${condPills}</div>` : ""}
        ${suggestStrip}
      </div>
    `;
  }).join("");

  view.innerHTML = `
    <div class="scan-bar">
      <span>${lastScan}</span>
      <button data-act="rescan">Scan now</button>
    </div>
    <div class="section-head" style="padding: 18px 20px 0;">
      <h2>Watchlist</h2>
      <button class="btn-ghost" data-act="add-watch" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;">+ Add</button>
    </div>
    <div class="holdings">${rows}</div>
    ${renderEtfLeaderboard()}
    ${renderDiscoverIdeas()}
  `;

  // Lazy snapshot fetch if missing
  const missingSnaps = state.watchlist.some(w => !state.watchlistSnapshot[w.symbol]);
  if (missingSnaps && !state._snapFetching) {
    state._snapFetching = true;
    fetchWatchlistSnapshot()
      .catch(() => {})
      .finally(() => {
        state._snapFetching = false;
        if (state.currentView === "watchlist" && !state.selectedSymbol) renderWatchlist();
      });
  }
}

// ============================================================================
// DISCOVER IDEAS — surface CURATED_PICKS, group by theme. Single-tap to add.
// Static picks + optional live-refreshed dynamic picks via worker.
// ============================================================================
function renderDiscoverIdeas() {
  const expanded = !!state.expandedAnalyses["discover"];
  const inWatchlist = new Set(state.watchlist.map(w => w.symbol));
  const held = new Set(state.holdings.filter(h => h.asset_class !== "cash").map(h => h.symbol));

  // Merge static + dynamic ideas, dedupe by symbol (dynamic wins — usually fresher)
  const merged = [];
  const seenSymbols = new Set();
  const dynamicPicks = state.discoverDynamic || [];
  for (const p of dynamicPicks) {
    if (seenSymbols.has(p.symbol)) continue;
    seenSymbols.add(p.symbol);
    merged.push({ ...p, _dynamic: true });
  }
  for (const p of CURATED_PICKS) {
    if (seenSymbols.has(p.symbol)) continue;
    seenSymbols.add(p.symbol);
    merged.push(p);
  }

  // Group by theme (BEFORE filter — themes list is the full universe of themes)
  const byThemeAll = {};
  for (const p of merged) {
    if (!byThemeAll[p.theme]) byThemeAll[p.theme] = [];
    byThemeAll[p.theme].push(p);
  }
  const allThemes = Object.keys(byThemeAll).sort((a, b) => byThemeAll[b].length - byThemeAll[a].length);

  // Apply search + theme filter
  const search = (state.discoverSearch || "").trim().toLowerCase();
  const themeFilter = state.discoverThemeFilter;
  const filtered = merged.filter(p => {
    if (themeFilter && p.theme !== themeFilter) return false;
    if (!search) return true;
    return (
      p.symbol.toLowerCase().includes(search) ||
      (p.name || "").toLowerCase().includes(search) ||
      (p.thesis || "").toLowerCase().includes(search) ||
      (p.theme || "").toLowerCase().includes(search) ||
      (p.source || "").toLowerCase().includes(search)
    );
  });

  // Group filtered results by theme for display
  const byTheme = {};
  for (const p of filtered) {
    if (!byTheme[p.theme]) byTheme[p.theme] = [];
    byTheme[p.theme].push(p);
  }
  const themes = Object.keys(byTheme).sort((a, b) => byTheme[b].length - byTheme[a].length);

  const freshLabel = state.discoverDynamicFetchedAt
    ? `Fresh: ${fmtRel(state.discoverDynamicFetchedAt)}`
    : "Static snapshot (Dec 2025 – May 2026)";

  // Summary shows filter context if any filter is active
  const filterActive = !!(search || themeFilter);
  const summary = filterActive
    ? `${filtered.length} of ${merged.length} ideas · ${freshLabel}`
    : `${merged.length} ideas · ${allThemes.length} themes · ${freshLabel}`;

  if (!expanded) {
    return `
      <div class="discover-card collapsed" data-act="toggle-analysis" data-key="discover">
        <div class="discover-head">
          <div>
            <h3>Discover Ideas</h3>
            <div class="discover-sub">${summary}</div>
          </div>
          <div class="collapsible-chev">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
      </div>
    `;
  }

  const refreshBtnLabel = state.discoverRefreshing ? "Refreshing..." : "Refresh ideas";

  const themeBlocks = themes.map(theme => {
    const picks = byTheme[theme];
    const items = picks.map(p => {
      const onList = inWatchlist.has(p.symbol);
      const owned = held.has(p.symbol);
      const dynamicBadge = p._dynamic ? `<span class="discover-fresh-badge">new</span>` : "";
      // Action buttons: always show Analyze + Chart; Watch only if not held/listed
      let actionButtons;
      if (owned) {
        actionButtons = `
          <div class="discover-actions-row">
            <span class="discover-tag held">Held</span>
            <button class="btn btn-secondary btn-sm" data-act="preview-chart" data-symbol="${escAttr(p.symbol)}" data-name="${escAttr(p.name)}">Chart</button>
            <button class="btn btn-secondary btn-sm" data-act="analyze-from-discover" data-symbol="${escAttr(p.symbol)}" data-name="${escAttr(p.name)}">Analyze</button>
          </div>`;
      } else if (onList) {
        actionButtons = `
          <div class="discover-actions-row">
            <span class="discover-tag onlist">On Watchlist</span>
            <button class="btn btn-secondary btn-sm" data-act="preview-chart" data-symbol="${escAttr(p.symbol)}" data-name="${escAttr(p.name)}">Chart</button>
            <button class="btn btn-secondary btn-sm" data-act="analyze-from-discover" data-symbol="${escAttr(p.symbol)}" data-name="${escAttr(p.name)}">Analyze</button>
          </div>`;
      } else {
        actionButtons = `
          <div class="discover-actions-row">
            <button class="btn btn-sm" data-act="add-curated" data-symbol="${escAttr(p.symbol)}" data-name="${escAttr(p.name)}">+ Watch</button>
            <button class="btn btn-secondary btn-sm" data-act="preview-chart" data-symbol="${escAttr(p.symbol)}" data-name="${escAttr(p.name)}">Chart</button>
            <button class="btn btn-secondary btn-sm" data-act="analyze-from-discover" data-symbol="${escAttr(p.symbol)}" data-name="${escAttr(p.name)}">Analyze</button>
          </div>`;
      }
      return `
        <div class="discover-item">
          <div class="discover-item-head">
            <div>
              <span class="discover-sym">${escAttr(p.symbol)}</span>
              <span class="discover-name">${escAttr(p.name)}</span>
              ${dynamicBadge}
            </div>
            ${actionButtons}
          </div>
          <div class="discover-thesis">${escAttr(p.thesis)}</div>
          <div class="discover-source">
            <span class="discover-src">${escAttr(p.source)}</span>
            <span class="discover-date">${escAttr(p.date)}</span>
          </div>
          ${renderPreviewChartFor(p.symbol)}
        </div>
      `;
    }).join("");
    return `
      <div class="discover-theme-block">
        <div class="discover-theme-head">${escAttr(theme)}</div>
        ${items}
      </div>
    `;
  }).join("");

  // Build theme filter pills (always show ALL themes, current selection highlighted)
  const themePills = allThemes.map(t => {
    const isActive = themeFilter === t;
    return `<button class="discover-theme-pill ${isActive ? 'active' : ''}" data-act="filter-theme" data-theme="${escAttr(t)}">${escAttr(t)} <span class="theme-pill-count">${byThemeAll[t].length}</span></button>`;
  }).join("");

  // Empty-state if filters return nothing
  const noResults = filtered.length === 0 && (search || themeFilter);

  return `
    <div class="discover-card expanded">
      <div class="discover-head" data-act="toggle-analysis" data-key="discover" style="cursor:pointer;">
        <div>
          <h3>Discover Ideas</h3>
          <div class="discover-sub">${summary}</div>
        </div>
        <div class="collapsible-chev" style="transform:rotate(180deg);">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="discover-actions">
        <button class="btn btn-sm" data-act="refresh-discover" ${state.discoverRefreshing ? "disabled" : ""}>${refreshBtnLabel}</button>
        ${state.discoverDynamicFetchedAt ? `<button class="btn btn-secondary btn-sm" data-act="clear-discover">Reset to static</button>` : ""}
      </div>
      <div class="discover-search-bar">
        <input type="text" id="discoverSearch" placeholder="Search symbol, name, thesis, source..." value="${escAttr(search)}" autocomplete="off" />

      </div>
      <div class="discover-theme-pills">
        ${themePills}
      </div>
      <div class="discover-disclaimer">Research from credible sources. Not advice — you decide. Tap Refresh to fetch fresh ideas via AI (requires worker support).</div>
      ${noResults
        ? `<div class="discover-no-results">No ideas match your search${themeFilter ? ` in <strong>${escAttr(themeFilter)}</strong>` : ""}. Try a different keyword or clear the filter.</div>`

  `;
}

async function refreshDiscover() {
  if (state.discoverRefreshing) return;
  state.discoverRefreshing = true;
  renderCurrentView();
  try {
    const res = await fetch(`${WORKER_URL}/discover-ideas`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        held_symbols: state.holdings.filter(h => h.asset_class !== "cash").map(h => h.symbol),
        watchlist_symbols: state.watchlist.map(w => w.symbol),
      }),
    });
    if (!res.ok) {
      if (res.status === 404) {
        toast("Worker doesn't support /discover-ideas yet — using static picks", 4000, "error");
      } else {
        toast(`Refresh failed: ${res.status}`, 3000, "error");
      }
      state.discoverRefreshing = false;
      renderCurrentView();
      return;
    }
    const j = await res.json();
    if (!Array.isArray(j.ideas)) {
      toast("Worker returned malformed response", 3000, "error");
      state.discoverRefreshing = false;
      renderCurrentView();
      return;
    }
    // Sanitize: ensure all entries have required fields
    const sanitized = j.ideas
      .filter(p => p && typeof p.symbol === "string")
      .map(p => ({
        symbol: String(p.symbol).toUpperCase().slice(0, 12),
        name: String(p.name || p.symbol),
        theme: String(p.theme || "Other"),
        source: String(p.source || "AI Refresh"),
        date: String(p.date || new Date().toISOString().slice(0, 10)),
        thesis: String(p.thesis || "").slice(0, 500),
      }));
    state.discoverDynamic = sanitized;
    state.discoverDynamicFetchedAt = new Date().toISOString();
    toast(`Refreshed ${sanitized.length} ideas`);
  } catch (e) {
    toast(`Refresh failed: ${e.message || e}`, 3000, "error");
  }
  state.discoverRefreshing = false;
  renderCurrentView();
}

function clearDiscoverDynamic() {
  state.discoverDynamic = null;
  state.discoverDynamicFetchedAt = null;
  renderCurrentView();
}

function toggleDiscoverThemeFilter(theme) {
  // Tap the active theme to clear it; tap a different theme to switch
  if (state.discoverThemeFilter === theme) {
    state.discoverThemeFilter = null;
  } else {
    state.discoverThemeFilter = theme;
  }
  renderCurrentView();
}

function clearDiscoverFilters() {
  state.discoverSearch = "";
  state.discoverThemeFilter = null;
  renderCurrentView();
}

// ============================================================================
// ETF LEADERBOARD
// Fetches batch performance metrics from worker, ranks ETFs by return over
// the selected timeframe. Renders alongside (not inside) Discover Ideas.
// CRITICAL FRAMING: this list shows what HAS done well, not what WILL. Past
// performance shows momentum; mean reversion is the dominant long-term force.
// We deliberately show drawdown next to return so risk is visible, and we
// keep the disclaimer prominent.
// ============================================================================
const LEADERBOARD_CACHE_MS = 1000 * 60 * 30; // 30-minute soft refresh

async function fetchEtfLeaderboard(forceRefresh) {
  // Cache check
  if (!forceRefresh && state.etfLeaderboard && state.etfLeaderboardFetchedAt) {
    const age = Date.now() - new Date(state.etfLeaderboardFetchedAt).getTime();
    if (age < LEADERBOARD_CACHE_MS) return; // use cached
  }
  if (state.etfLeaderboardLoading) return;
  state.etfLeaderboardLoading = true;
  renderCurrentView();
  try {
    const res = await fetch(`${WORKER_URL}/etf-leaderboard`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        symbols: ETF_UNIVERSE.map(e => e.symbol),
        timeframe: state.etfLeaderboardTimeframe,
      }),
    });
    if (!res.ok) {
      if (res.status === 404) {
        toast("Worker doesn't support /etf-leaderboard yet — deploy worker v1.4", 4000, "error");
      } else {
        toast(`Leaderboard fetch failed: ${res.status}`, 3000, "error");
      }
      state.etfLeaderboardLoading = false;
      renderCurrentView();
      return;
    }
    const j = await res.json();
    // Merge worker results with universe metadata
    const merged = (j.results || []).map(r => {
      const meta = ETF_UNIVERSE.find(e => e.symbol === r.symbol);
      return {
        symbol: r.symbol,
        name: meta?.name || r.symbol,
        category: meta?.category || "Other",
        return_pct: r.return_pct,
        max_drawdown_pct: r.max_drawdown_pct,
        trend_200ma: r.trend_200ma,
        current_price: r.current_price,
        error: r.error || null,
      };
    });
    state.etfLeaderboard = merged;
    state.etfLeaderboardFetchedAt = new Date().toISOString();
  } catch (e) {
    toast(`Leaderboard failed: ${(e.message || e).slice(0, 100)}`, 3000, "error");
  }
  state.etfLeaderboardLoading = false;
  renderCurrentView();
}

function setLeaderboardTimeframe(tf) {
  if (state.etfLeaderboardTimeframe === tf) return;
  state.etfLeaderboardTimeframe = tf;
  // Timeframe change invalidates the cached data
  state.etfLeaderboard = null;
  state.etfLeaderboardFetchedAt = null;
  fetchEtfLeaderboard(true);
}

function setLeaderboardSort(sort) {
  state.etfLeaderboardSort = sort;
  renderCurrentView();
}

function renderEtfLeaderboard() {
  const tf = state.etfLeaderboardTimeframe;
  const tfLabel = tf === "3m" ? "3-month" : tf === "1y" ? "1-year" : "3-year";

  if (state.etfLeaderboardLoading && !state.etfLeaderboard) {
    return `
      <div class="leaderboard-card">
        <div class="leaderboard-head">
          <h3>Top Performing ETFs</h3>
          <div class="leaderboard-sub">Fetching ${tfLabel} returns across ${ETF_UNIVERSE.length} ETFs…</div>
        </div>
        <div style="padding: 30px 20px; text-align: center; color: var(--ink-muted);">
          <span class="spinner"></span>
        </div>
      </div>
    `;
  }

  const data = state.etfLeaderboard || [];
  const valid = data.filter(d => !d.error && d.return_pct != null);

  // Sort
  let sorted;
  if (state.etfLeaderboardSort === "drawdown") {
    sorted = [...valid].sort((a, b) => (b.max_drawdown_pct || -999) - (a.max_drawdown_pct || -999)); // least negative first
  } else if (state.etfLeaderboardSort === "trend") {
    sorted = [...valid].sort((a, b) => {
      const aAbove = a.trend_200ma === "above_200ma" ? 1 : 0;
      const bAbove = b.trend_200ma === "above_200ma" ? 1 : 0;
      if (aAbove !== bAbove) return bAbove - aAbove;
      return b.return_pct - a.return_pct;
    });
  } else {
    sorted = [...valid].sort((a, b) => b.return_pct - a.return_pct);
  }
  const top10 = sorted.slice(0, 10);

  const held = new Set(state.holdings.filter(h => h.asset_class !== "cash").map(h => h.symbol));
  const watched = new Set(state.watchlist.map(w => w.symbol));

  const tfPill = (key, label) => `<button class="lb-tf-pill ${tf === key ? 'active' : ''}" data-act="lb-tf" data-tf="${key}">${label}</button>`;
  const sortPill = (key, label) => `<button class="lb-sort-pill ${state.etfLeaderboardSort === key ? 'active' : ''}" data-act="lb-sort" data-sort="${key}">${label}</button>`;

  const ageLabel = state.etfLeaderboardFetchedAt
    ? `Updated ${fmtRel(state.etfLeaderboardFetchedAt)}`
    : "";

  const rows = top10.length === 0
    ? `<div style="padding: 24px 18px; text-align: center; color: var(--ink-muted); font-family: var(--mono); font-size: 12px;">No data loaded yet. Tap "Refresh leaderboard" to fetch performance for ${ETF_UNIVERSE.length} ETFs.</div>`
    : top10.map((d, i) => {
        const owned = held.has(d.symbol);
        const onList = watched.has(d.symbol);
        const retClass = d.return_pct >= 0 ? "pos" : "neg";
        const ddClass = d.max_drawdown_pct <= -20 ? "warn" : d.max_drawdown_pct <= -10 ? "med" : "ok";
        return `
          <div class="lb-row-wrap">
            <div class="lb-row">
              <div class="lb-rank">${i + 1}</div>
              <div class="lb-main">
                <div class="lb-symline">
                  <span class="lb-sym">${escAttr(d.symbol)}</span>
                  <span class="lb-cat">${escAttr(d.category)}</span>
                  ${owned ? `<span class="lb-tag held">held</span>` : ""}
                  ${onList ? `<span class="lb-tag onlist">watched</span>` : ""}
                </div>
                <div class="lb-name">${escAttr(d.name)}</div>
                <div class="lb-stats">
                  <span class="lb-stat ${retClass}">${d.return_pct >= 0 ? "+" : ""}${d.return_pct.toFixed(1)}% ${tfLabel} return</span>
                  <span class="lb-stat ${ddClass}">${d.max_drawdown_pct != null ? d.max_drawdown_pct.toFixed(1) + "% max DD" : ""}</span>
                  ${d.trend_200ma ? `<span class="lb-stat ${d.trend_200ma === 'above_200ma' ? 'pos' : 'neg'}">${d.trend_200ma === 'above_200ma' ? '↑' : '↓'} 200MA</span>` : ""}
                </div>
              </div>
              <div class="lb-actions">
                <button class="btn btn-secondary btn-sm" data-act="preview-chart" data-symbol="${escAttr(d.symbol)}" data-name="${escAttr(d.name)}">Chart</button>
                <button class="btn btn-sm" data-act="analyze-from-discover" data-symbol="${escAttr(d.symbol)}" data-name="${escAttr(d.name)}">Analyze</button>
                ${!owned && !onList ? `<button class="btn btn-secondary btn-sm" data-act="add-curated" data-symbol="${escAttr(d.symbol)}" data-name="${escAttr(d.name)}">+ Watch</button>` : ""}
              </div>
            </div>
            ${renderPreviewChartFor(d.symbol)}
          </div>
        `;
      }).join("");

  return `
    <div class="leaderboard-card">
      <div class="leaderboard-head">
        <h3>Top Performing ETFs</h3>
        <div class="leaderboard-sub">Ranked by ${tfLabel} return · ${valid.length}/${ETF_UNIVERSE.length} ETFs · ${ageLabel}</div>
      </div>
      <div class="lb-controls">
        <div class="lb-control-row">
          <span class="lb-control-label">Timeframe</span>
          <div class="lb-pills">
            ${tfPill("3m", "3M")}
            ${tfPill("1y", "1Y")}
            ${tfPill("3y", "3Y")}
          </div>
        </div>
        <div class="lb-control-row">
          <span class="lb-control-label">Rank by</span>
          <div class="lb-pills">
            ${sortPill("return", "Return")}
            ${sortPill("drawdown", "Risk")}
            ${sortPill("trend", "Trend")}
          </div>
        </div>
        <div class="lb-actions-row">
          <button class="btn btn-sm" data-act="refresh-leaderboard" ${state.etfLeaderboardLoading ? "disabled" : ""}>
            ${state.etfLeaderboardLoading ? "Loading…" : (state.etfLeaderboard ? "Refresh leaderboard" : "Load leaderboard")}
          </button>
        </div>
      </div>
      <div class="lb-disclaimer">
        <strong>Past performance ≠ future returns.</strong> Top performers tend to revert. Last year's #1 is rarely next year's #1. Use this for awareness of what's moved, not as a buy list.
      </div>
      ${rows}
    </div>
  `;
}

async function addCuratedToWatchlist(symbol, name) {
  if (!symbol) return;
  // Default condition for curated ideas: drop-from-peak 10% (entry on weakness)
  const conditions = [
    { id: cryptoRandomId(), type: "drop_from_peak", threshold_pct: 10 },
  ];
  try {
    await db.collection("users").doc(state.uid).collection("watchlist").doc(symbol).set({
      symbol,
      name: name || symbol,
      conditions,
      asset_class: guessAssetClass(symbol),
      added_at: firebase.firestore.FieldValue.serverTimestamp(),
    });
    await loadWatchlist();
    toast(`${symbol} added to watchlist`);
    // Re-render whichever view we're on so the button state updates immediately
    // (was renderWatchlist() — broke when called from Today's Opportunities on Portfolio tab)
    renderCurrentView();
  } catch (e) {
    toast(`Failed to add: ${e.message || e}`, 3000, "error");

}

// Analyze a Discover Ideas pick directly without adding to watchlist.
// Navigates to the asset detail view and kicks off analysis.
async function analyzeFromDiscover(symbol, name) {
  if (!symbol) return;
  toast(`Loading ${symbol}…`, 1500);
  // Switch to markets view, then render asset detail (renderAssetDetail handles unknown symbols)
  state.currentView = "markets";
  state.selectedSymbol = symbol;
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === "markets"));

    });

function cryptoRandomId() {

}

// ============================================================================
// INLINE CHART PREVIEW (Ideas + ETF Leaderboard)
// Lets you peek at a chart without adding to watchlist or spending AI tokens.
// One preview at a time — re-tapping closes; tapping a different row swaps.
// ============================================================================
async function togglePreviewChart(symbol, name) {
  if (!symbol) return;
  if (state.previewChart.symbol === symbol) {
    // Same row tapped again — collapse
    state.previewChart = { symbol: null, name: null, range: "3M", loading: false, data: null };
    renderCurrentView();
    return;
  }
  state.previewChart = { symbol, name: name || symbol, range: "3M", loading: true, data: null };
  renderCurrentView();
  try {
    // Use cached price if we have it, else fetch
    let priceData = state.prices[symbol];
    if (!priceData || !priceData.ohlcv) {
      const r = await fetch(`${WORKER_URL}/price/${encodeURIComponent(symbol)}`);
      if (!r.ok) throw new Error(`fetch_${r.status}`);
      priceData = await r.json();
      state.prices[symbol] = priceData;
    }
    state.previewChart.data = priceData;
    state.previewChart.loading = false;
    renderCurrentView();
    // After DOM update, draw the chart
    setTimeout(() => drawPreviewChart(), 60);
  } catch (e) {
    state.previewChart.loading = false;
    toast(`Couldn't load chart: ${(e.message || e).slice(0, 80)}`, 3000, "error");
    renderCurrentView();
  }
}

function setPreviewRange(range) {
  state.previewChart.range = range;
  renderCurrentView();
  setTimeout(() => drawPreviewChart(), 60);
}

function drawPreviewChart() {
  const el = document.getElementById("previewChartEl");
  if (!el || !window.LightweightCharts) return;
  const pc = state.previewChart;
  if (!pc.data || !pc.data.ohlcv) return;
  const range = pc.range || "3M";
  const days = range === "1M" ? 22 : range === "3M" ? 66 : range === "6M" ? 130 : range === "1Y" ? 252 : pc.data.ohlcv.length;
  const slice = pc.data.ohlcv.slice(-days);
  const c = getThemeColors();
  el.innerHTML = "";
  const chart = LightweightCharts.createChart(el, {
    width: el.clientWidth || 320,
    height: 220,
    layout: { background: { color: "transparent" }, textColor: c.muted, fontFamily: "ui-monospace, monospace" },
    grid: { vertLines: { color: c.rule }, horzLines: { color: c.rule } },
    rightPriceScale: { borderColor: c.rule },
    timeScale: { borderColor: c.rule, timeVisible: false },
    crosshair: { mode: 1 },
  });
  const series = chart.addAreaSeries({
    lineColor: c.accent || c.gold,
    topColor: (c.accent || c.gold) + "33",
    bottomColor: (c.accent || c.gold) + "08",
    lineWidth: 2,
  });
  const data = slice
    .filter(d => d.c != null && d.t)
    .map(d => ({ time: Math.floor((d.t || 0) / 1000), value: d.c }));
  if (data.length > 0) series.setData(data);
  chart.timeScale().fitContent();
}

function renderPreviewChartFor(symbol) {
  // Returns the inline preview chart HTML if it's open for this symbol; else "".
  if (state.previewChart.symbol !== symbol) return "";
  const pc = state.previewChart;
  if (pc.loading) {
    return `<div class="preview-chart-wrap"><div class="empty-state" style="padding:30px;"><span class="spinner"></span></div></div>`;
  }
  if (!pc.data) return "";
  const cur = pc.data.current_price;
  const prev = pc.data.prev_close;
  const dayPct = (cur != null && prev) ? ((cur - prev) / prev) * 100 : null;
  const dayClass = dayPct != null && dayPct >= 0 ? "pos" : "neg";
  const ranges = ["1M","3M","6M","1Y","ALL"];
  return `
    <div class="preview-chart-wrap">
      <div class="preview-chart-head">
        <div>
          <span class="pc-sym">${escAttr(symbol)}</span>
          <span class="pc-price">$${fmtUSD(cur)}</span>
          ${dayPct != null ? `<span class="pc-day ${dayClass}">${fmtPct(dayPct)}</span>` : ""}
        </div>
        <button class="pc-close" data-act="preview-chart" data-symbol="${escAttr(symbol)}" title="Close chart">×</button>
      </div>
      <div class="preview-chart-controls">
        ${ranges.map(r => `<button class="pc-range ${pc.range === r ? 'active' : ''}" onclick="event.stopPropagation(); window._setPreviewRange('${r}');">${r}</button>`).join("")}
      </div>
      <div id="previewChartEl" class="preview-chart-el"></div>
    </div>
  `;
}

async function rescan() {

    view.innerHTML = `

// CHART
// ============================================================================
function getThemeColors() {
  const css = getComputedStyle(document.documentElement);
  return {
    bg: css.getPropertyValue("--bg-card").trim(),
    text: css.getPropertyValue("--ink").trim(),
    muted: css.getPropertyValue("--ink-muted").trim(),
    rule: css.getPropertyValue("--rule").trim(),
    green: css.getPropertyValue("--green").trim(),
    red:   css.getPropertyValue("--red").trim(),
    accent: css.getPropertyValue("--accent").trim(),
    gold: css.getPropertyValue("--gold").trim(),
  };
}
function renderChart(symbol, range) {
  const price = state.prices[symbol];
  if (!price || !price.ohlcv) return;
  const c = getThemeColors();
  const el = $("#chart");
  if (!el || !window.LightweightCharts) return;
  el.innerHTML = "";
  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: c.bg }, textColor: c.muted, fontFamily: "'IBM Plex Mono', monospace" },
    grid: { vertLines: { color: c.rule, style: 1 }, horzLines: { color: c.rule, style: 1 } },
    crosshair: { mode: 1, vertLine: { color: c.muted, width: 1, style: 2 }, horzLine: { color: c.muted, width: 1, style: 2 } },
    rightPriceScale: { borderColor: c.rule },
    timeScale: { borderColor: c.rule, timeVisible: false, secondsVisible: false },
    handleScroll: true, handleScale: true, height: 280,
  });
  const candle = chart.addCandlestickSeries({
    upColor: c.green, downColor: c.red,
    borderUpColor: c.green, borderDownColor: c.red,
    wickUpColor: c.green, wickDownColor: c.red,
  });
  const now = Date.now();
  const rangeMs = { "1M": 30*864e5, "3M": 90*864e5, "6M": 180*864e5, "1Y": 365*864e5, "ALL": Infinity }[range];
  const filtered = price.ohlcv.filter(d => (now - d.t) <= rangeMs);
  const data = filtered.map(d => ({ time: Math.floor(d.t / 1000), open: d.o, high: d.h, low: d.l, close: d.c }));
  candle.setData(data);
  const closes = filtered.map(d => d.c);
  const times  = filtered.map(d => Math.floor(d.t / 1000));
  function maSeries(period, color) {
    if (closes.length < period) return null;
    const series = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    const out = [];
    for (let i = period - 1; i < closes.length; i++) {
      const slice = closes.slice(i - period + 1, i + 1);
      const avg = slice.reduce((a,b) => a + b, 0) / period;
      out.push({ time: times[i], value: avg });
    }
    series.setData(out);
    return series;
  }
  maSeries(20, c.gold);
  maSeries(50, c.accent);
  maSeries(200, c.muted);
  chart.timeScale().fitContent();
  state.chart = chart;
}
function setRange(r, symbol) {
  state.selectedRange = r;
  try { renderChart(symbol, r); } catch (e) { console.warn(e); }
  $$(".range-btn").forEach(b => b.classList.toggle("active", b.textContent === r));
}

async function loadIndicators(symbol) {
  try {
    const r = await fetch(`${WORKER_URL}/indicators/${encodeURIComponent(symbol)}`);
    const j = await r.json();
    const ind = j.indicators || {};
    const macdCross = ind.macd?.crossover || "none";
    const rsiClass = ind.rsi14 > 70 ? "warn" : ind.rsi14 < 30 ? "warn" : "";
    const trendClass = ind.trend === "above_200ma" ? "pos" : "neg";
    const macdClass = macdCross.startsWith("bullish") ? "pos" : macdCross.startsWith("bearish") ? "neg" : "";
    const strip = $("#indStrip");
    if (!strip) return;
    strip.innerHTML = `
      <div class="ind-cell"><div class="label">RSI 14</div><div class="val ${rsiClass}">${ind.rsi14 ? ind.rsi14.toFixed(1) : '—'}</div></div>
      <div class="ind-cell"><div class="label">MACD</div><div class="val ${macdClass}">${macdCross.replace(/_/g, ' ')}</div></div>
      <div class="ind-cell"><div class="label">Trend</div><div class="val ${trendClass}">${ind.trend === 'above_200ma' ? 'Above 200' : 'Below 200'}</div></div>
      <div class="ind-cell"><div class="label">52W</div><div class="val">${ind.pct_from_52w_high ? ind.pct_from_52w_high.toFixed(1) + '%' : '—'}</div></div>
    `;
  } catch (e) { console.warn("indicators load failed", e); }
}

async function runAnalysis(symbol) {
  const btn = $(`[data-act="run-analysis"][data-symbol="${symbol}"]`);
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Analyzing…'; btn.disabled = true; }
  try {
    // === DATA SANITY PRE-CHECK ===
    // Fetch price data first to check for anomalies BEFORE sending to AI.
    // Catches: cross-listed/multi-currency tickers (.L, .AS, .MI, .TO, .PA), suspicious
    // overnight gaps, mismatched prev-close vs current-price representations.
    // Without this, the AI gets bad data → produces "data error, avoid" verdicts on
    // legitimate but data-flaky assets (e.g. URNU.L showing 114% phantom gap).
    let preCheck = null;
    try {
      const priceR = await fetch(`${WORKER_URL}/price/${encodeURIComponent(symbol)}`);
      if (priceR.ok) {
        const priceData = await priceR.json();
        preCheck = await runDataSanityCheck(symbol, priceData);
      }
    } catch (e) { /* sanity check is best-effort; if it fails we just proceed */ }

    if (preCheck && preCheck.severity === "critical") {
      // Critical issue — ask the user before spending tokens on a flawed analysis
      const proceed = await confirmDataAnomaly(symbol, preCheck);
      if (!proceed) {
        if (btn) { btn.innerHTML = "Re-analyze"; btn.disabled = false; }
        return;
      }
    }
    // === END SANITY ===

    const holding = state.holdings.find(h => h.symbol === symbol);
    const idToken = await auth.currentUser.getIdToken();
    const m = portfolioMetrics();
    const portfolioContext = {
      total_value: m.totalValue,
      total_cost: m.totalCost,
      total_pnl_pct: m.totalPnLPct,
      allocation_by_class: m.alloc,
    };
    const r = await fetch(`${WORKER_URL}/analyze`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        uid: state.uid, symbol,
        holding: holding ? { quantity: holding.quantity, avg_cost: holding.avg_cost_unit } : null,
        portfolio_context: portfolioContext,
        // Pass the sanity result so the AI prompt can include it
        data_sanity: preCheck,
        idToken,
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    if (j.analysis) {
      state.analyses[symbol] = {
        ...j.analysis, symbol,
        generated_at: new Date().toISOString(),
        current_price: j.current_price,
        // Record the sanity-check signal so the analysis card can show it
        data_sanity_note: preCheck && preCheck.severity !== "none"
          ? `Data sanity: ${preCheck.severity}. ${preCheck.issues.map(i => i.msg).join(" ")}`.slice(0, 240)
          : null,
      };
      toast("Analysis complete");
      renderAssetDetail(symbol);
    } else throw new Error("No analysis returned");
  } catch (e) {
    toast("Analysis failed: " + (e.message || "unknown error").slice(0, 80), 3000, "error");
    if (btn) { btn.innerHTML = "Try Again"; btn.disabled = false; }
  }
}

// ============================================================================
// DATA SANITY CHECK
// Detects anomalies that should be flagged to user BEFORE running AI analysis.
// Returns null if everything looks fine, or { severity, type, issues, recommendation }
// ============================================================================
const INTERNATIONAL_SUFFIXES = [".L", ".AS", ".MI", ".TO", ".PA", ".DE", ".SW", ".HK", ".T", ".AX"];

async function runDataSanityCheck(symbol, priceData) {
  const issues = [];
  let severity = "none"; // "none" | "warning" | "critical"

  // 1. International ticker — common source of currency-conversion issues
  const isInternational = INTERNATIONAL_SUFFIXES.some(suf => symbol.toUpperCase().endsWith(suf));
  if (isInternational) {
    issues.push({
      type: "international_ticker",
      msg: `${symbol} is a non-US listing. Cross-currency data feeds can produce phantom price gaps.`,
    });
    severity = "warning";
  }

  // 2. Extreme price gap — prev_close vs current_price
  const cur = priceData.current_price;
  const prev = priceData.prev_close;
  if (cur != null && prev != null && prev > 0) {
    const gapPct = ((cur - prev) / prev) * 100;
    if (Math.abs(gapPct) > 50) {
      issues.push({
        type: "extreme_gap",
        msg: `Price reports ${gapPct.toFixed(0)}% gap from previous close ($${fmtUSD(prev)} → $${fmtUSD(cur)}). This is exceptionally rare without a known corporate action.`,
      });
      severity = "critical";
    } else if (Math.abs(gapPct) > 25) {
      issues.push({
        type: "large_gap",
        msg: `Price gapped ${gapPct.toFixed(1)}% from previous close. Verify no corporate action explains this.`,
      });
      if (severity === "none") severity = "warning";
    }
  }

  // 3. Volume sanity — was the gap supported by volume?
  if (priceData.ohlcv && priceData.ohlcv.length >= 20) {
    const recent = priceData.ohlcv.slice(-20);
    const todayVol = recent[recent.length - 1]?.v || 0;
    const avgVol = recent.slice(0, -1).reduce((s, d) => s + (d.v || 0), 0) / Math.max(1, recent.length - 1);
    if (avgVol > 0 && todayVol < avgVol * 0.5 && Math.abs(((cur - prev) / prev) * 100) > 30) {
      issues.push({
        type: "volume_mismatch",
        msg: `Large price move on below-average volume (${(todayVol/avgVol).toFixed(2)}x avg). Real moves are typically accompanied by elevated volume.`,
      });
      severity = "critical";
    }
  }

  // 4. Currency mismatch hint — if symbol info reports currency != USD but prices look like USD or vice versa
  // (We can't fully detect this client-side without more data, but the international flag covers most cases)

  if (issues.length === 0) return null;

  let recommendation;
  if (severity === "critical") {
    recommendation = "Likely a data feed error or unconverted currency representation. Verify the price elsewhere (Yahoo Finance, IBKR) before running analysis. AI analysis on bad data produces 'avoid' verdicts that may not reflect the real asset.";
  } else {
    recommendation = "Proceed with caution. The AI will note the anomaly but the analysis remains useful.";
  }

  // Include price context so the modal can show actual values for verification
  const lastOhlcv = priceData.ohlcv && priceData.ohlcv.length > 0
    ? priceData.ohlcv[priceData.ohlcv.length - 1]?.c
    : null;
  const priceContext = {
    current: priceData.current_price,
    prev: priceData.prev_close,
    lastOhlcv,
  };

  return { severity, issues, recommendation, symbol, priceContext };
}

function confirmDataAnomaly(symbol, preCheck) {
  return new Promise(resolve => {
    const issuesHtml = preCheck.issues.map(i => `<li>${escAttr(i.msg)}</li>`).join("");
    // Show the actual prices so user can compare to broker
    const priceComparison = preCheck.priceContext ? `
      <div style="margin-bottom:14px;padding:10px 12px;background:var(--bg-elev);border:1px solid var(--rule);border-radius:6px;font-family:var(--mono);font-size:11px;line-height:1.6;">
        <div style="font-size:9.5px;letter-spacing:0.10em;color:var(--ink-muted);text-transform:uppercase;margin-bottom:6px;">What the worker sees</div>
        <div>Current price: <strong style="color:var(--ink);">$${fmtUSD(preCheck.priceContext.current)}</strong></div>
        <div>Previous close: <strong style="color:var(--ink);">$${fmtUSD(preCheck.priceContext.prev)}</strong></div>
        <div>Last OHLCV close: <strong style="color:var(--ink);">$${preCheck.priceContext.lastOhlcv != null ? fmtUSD(preCheck.priceContext.lastOhlcv) : "—"}</strong></div>
        <div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--rule-soft);font-size:10.5px;color:var(--ink-muted);">Open your broker (IBKR/Yahoo) and compare. If the worker's current price matches your broker, proceed. If it doesn't, cancel.</div>
      </div>
    ` : "";
    openModal(`
      <div class="modal-head"><h3>⚠ Data Sanity Check</h3></div>
      <div style="padding: 0 0 12px;">
        <div style="font-family:var(--mono);font-size:11px;color:var(--ink-muted);margin-bottom:10px;letter-spacing:0.04em;">${escAttr(symbol)} · severity: ${preCheck.severity.toUpperCase()}</div>
        ${priceComparison}
        <ul style="font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--ink);margin:0 0 14px 18px;">
          ${issuesHtml}
        </ul>
        <div style="font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);line-height:1.5;padding:10px 12px;background:var(--bg-elev);border-radius:6px;margin-bottom:14px;">
          ${escAttr(preCheck.recommendation)}
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" id="sanity-cancel" style="flex:1;">Cancel</button>
        <button class="btn" id="sanity-proceed" style="flex:1;">Proceed anyway</button>
      </div>
    `);
    setTimeout(() => {
      const cancel = document.getElementById("sanity-cancel");
      const proceed = document.getElementById("sanity-proceed");
      if (cancel) cancel.addEventListener("click", () => { closeModal(); resolve(false); });
      if (proceed) proceed.addEventListener("click", () => { closeModal(); resolve(true); });
    }, 30);
  });
}
